# Opt-in no-Canvas composition. Keep the default production worker unchanged
# until existing installations have a qualified pre-up migration path.
# Do not use this overlay to enable Canvas: selecting the canvas profile only
# starts its worker, while issuance remains deliberately disabled below.
services:
  canvas-sync-worker:
    profiles: ["canvas"]
  issuance:
    environment:
      CANVAS_PORTABLE_INTEGRATION_ENABLED: "false"
      CANVAS_LEGACY_EVENT_INGEST_ENABLED: "false"
      CANVAS_CREDENTIALS_SHARED_SECRET_FILE: ""
    secrets: !override
      - marty_db_password
      - openbao_service_token
      - issuance_api_key
      - signing_keys_issuer_sign_key
      - signing_keys_integration_secret_key
      - token_hmac_key
      - grpc_service_token
      - didcomm_issuance_openbao_token
      - openbao_tls_ca_cert
      - sign_grant_mint_issuance_credential_token
      - sign_grant_mint_issuance_canvas_token
      - sign_grant_mint_issuance_readiness_token
      - sign_grant_mint_issuance_passport_token
      - workload_identity_ca_cert
  issuance-native:
    environment:
      CANVAS_PORTABLE_INTEGRATION_ENABLED: "false"
      CANVAS_LEGACY_EVENT_INGEST_ENABLED: "false"
      CANVAS_MIRROR_WORKER_ENABLED: "false"
      CANVAS_CREDENTIALS_SHARED_SECRET_FILE: ""
    secrets: !override
      - marty_db_password
      - issuance_api_key
      - signing_keys_issuer_sign_key
      - signing_keys_integration_secret_key
      - token_hmac_key
      - grpc_service_token
      - didcomm_issuance_openbao_token
      - sign_grant_mint_issuance_credential_token
      - sign_grant_mint_issuance_canvas_token
      - sign_grant_mint_issuance_readiness_token
      - sign_grant_mint_issuance_passport_token
      - workload_identity_ca_cert
      - issuance_workload_server_cert
      - openbao_tls_ca_cert
      - issuance_tls_kms_token
