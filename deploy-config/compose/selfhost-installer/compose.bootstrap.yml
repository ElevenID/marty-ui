# Authenticated installer setup jobs. The host selects one job deliberately;
# completed jobs remain in the project and ordinary restart never selects them.
x-installer-job: &installer-job
  profiles: [setup]
  mem_limit: 1g
  init: true
  user: "0:0"
  read_only: true
  restart: "no"
  cap_drop: [ALL]
  cap_add: [DAC_OVERRIDE]
  security_opt: ["no-new-privileges:true"]
  networks: [default]
  labels:
    com.elevenid.installer.id: ${MARTY_INSTALLATION_ID:?installation identity required}
    com.elevenid.installer.phase: setup

x-installer-operator: &installer-operator
  type: bind
  source: ${MARTY_INSTALLATION_DIR:?private installation directory required}/marty-deploy
  target: /input/marty-deploy
  read_only: true
  bind: {create_host_path: false}

x-installer-bao-root: &installer-bao-root
  type: bind
  source: ${MARTY_INSTALLATION_DIR:?private installation directory required}/openbao-state/root.token
  target: /input/root.token
  read_only: true
  bind: {create_host_path: false}

x-installer-bao-ca: &installer-bao-ca
  type: bind
  source: ${MARTY_INSTALLATION_DIR:?private installation directory required}/openbao-state/tls/ca.crt
  target: /input/ca.crt
  read_only: true
  bind: {create_host_path: false}

services:
  installer-control-enroll:
    <<: *installer-job
    image: ${MARTY_OPENBAO_DIDCOMM_IMAGE:?approved OpenBao image required}
    entrypoint: [/usr/local/bin/selfhost-control-enroll]
    command: [--installation-id, "${MARTY_INSTALLATION_ID:?}", --attempt-id, "${MARTY_OPENBAO_CONTROL_ATTEMPT_ID:?bound control enrollment attempt required}"]
    tmpfs:
      - /openbao/file:rw,noexec,nosuid,nodev,size=1048576,mode=0700
      - /openbao/logs:rw,noexec,nosuid,nodev,size=1048576,mode=0700
    volumes:
      - type: bind
        source: ${SELFHOST_OPENBAO_STATE_DIR:?}
        target: /bao/data
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${MARTY_INSTALLATION_DIR:?}/openbao-control/socket
        target: /bao/control
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${MARTY_INSTALLATION_DIR:?}/openbao-control/identity
        target: /bao/control-identity
        bind: {create_host_path: false}

  installer-keycloak:
    <<: *installer-job
    image: ${MARTY_OPENBAO_DIDCOMM_IMAGE:?approved OpenBao image required}
    entrypoint: [/input/marty-deploy]
    command: [installer-keycloak-bridge, --nonce, "${MARTY_KEYCLOAK_NONCE:?private provisioning nonce required}"]
    tmpfs:
      - /openbao/file:rw,noexec,nosuid,nodev,size=1048576,mode=0700
      - /openbao/logs:rw,noexec,nosuid,nodev,size=1048576,mode=0700
    volumes:
      - *installer-operator
      - *installer-bao-root
      - *installer-bao-ca
      - type: bind
        source: ${MARTY_INSTALLATION_DIR:?}/keycloak-output
        target: /output
        bind: {create_host_path: false}

  installer-tls:
    <<: *installer-job
    image: ${MARTY_INSTALLER_SERVICES_IMAGE:?approved services image required}
    entrypoint: [/bin/sh]
    command: ["-ec", "/usr/local/bin/marty-passport-tls-bootstrap >/dev/null 2>&1 && exec /input/marty-deploy installer-tls-finalize"]
    environment:
      BAO_ADDR: https://openbao:8200
      BAO_CACERT: /input/ca.crt
      BAO_ROOT_TOKEN_FILE: /input/root.token
      MARTY_TLS_BOOTSTRAP_PROFILE: selfhost-disposable
      MARTY_SELFHOST_DISPOSABLE_OPENBAO: "1"
      MARTY_SELFHOST_PROJECT: ${MARTY_SELFHOST_PROJECT:?bound bootstrap project required}
      SELFHOST_TLS_OUTPUT_DIR: /output
    tmpfs: ["/tmp:rw,mode=1777"]
    volumes:
      - *installer-operator
      - *installer-bao-root
      - *installer-bao-ca
      - type: bind
        source: ${MARTY_INSTALLATION_DIR:?}/tls-output
        target: /output
        bind: {create_host_path: false}

  installer-ingress-provision:
    <<: *installer-job
    image: ${MARTY_INSTALLER_SERVICES_IMAGE:?approved services image required}
    entrypoint: [/input/marty-deploy]
    command: [installer-ingress-provision, --installation-id, "${MARTY_INSTALLATION_ID:?}"]
    environment:
      MARTY_INSTALLER_INGRESS_DNS_NAME: ${MARTY_INSTALLER_INGRESS_DNS_NAME-localhost}
      MARTY_INSTALLER_INGRESS_IP_ADDRESS: ${MARTY_INSTALLER_INGRESS_IP_ADDRESS-127.0.0.1}
    volumes:
      - *installer-operator
      - *installer-bao-root
      - *installer-bao-ca
      - type: bind
        source: ${MARTY_INSTALLATION_DIR:?}/ingress-output
        target: /output
        bind: {create_host_path: false}

  installer-renewal:
    <<: *installer-job
    image: ${MARTY_INSTALLER_SERVICES_IMAGE:?approved services image required}
    entrypoint: [/input/marty-deploy]
    command: [installer-renewal-bootstrap-transfer, --installation-id, "${MARTY_INSTALLATION_ID:?}"]
    environment:
      MARTY_INSTALLER_INGRESS_DNS_NAME: ${MARTY_INSTALLER_INGRESS_DNS_NAME-localhost}
      MARTY_INSTALLER_INGRESS_IP_ADDRESS: ${MARTY_INSTALLER_INGRESS_IP_ADDRESS-127.0.0.1}
    cap_add: [DAC_OVERRIDE, CHOWN]
    volumes:
      - *installer-operator
      - *installer-bao-root
      - *installer-bao-ca
      - type: bind
        source: ${MARTY_INSTALLATION_DIR:?}/renewal-transfer
        target: /transfer
        bind: {create_host_path: false}
      - type: bind
        source: ${MARTY_INSTALLATION_DIR:?}/renewal-inputs
        target: /input/current
        read_only: true
        bind: {create_host_path: false}

  installer-generation:
    <<: *installer-job
    image: ${MARTY_INSTALLER_SERVICES_IMAGE:?approved services image required}
    entrypoint: [/input/marty-deploy]
    command: [installer-generation-provision-transfer, --installation-id, "${MARTY_INSTALLATION_ID:?}"]
    environment:
      MARTY_INSTALLER_INGRESS_DNS_NAME: ${MARTY_INSTALLER_INGRESS_DNS_NAME-localhost}
      MARTY_INSTALLER_INGRESS_IP_ADDRESS: ${MARTY_INSTALLER_INGRESS_IP_ADDRESS-127.0.0.1}
    cap_add: [DAC_OVERRIDE, CHOWN]
    volumes:
      - *installer-operator
      - *installer-bao-ca
      - type: bind
        source: ${MARTY_INSTALLATION_DIR:?}/generation-transfer
        target: /transfer
        bind: {create_host_path: false}
      - type: bind
        source: ${MARTY_INSTALLATION_DIR:?}/generation-inputs
        target: /input/current
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${MARTY_INSTALLATION_DIR:?}/generation-identity
        target: /input/identity
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${MARTY_INSTALLATION_DIR:?}/evidence/keycloak-observation.json
        target: /input/keycloak-receipt.json
        read_only: true
        bind: {create_host_path: false}

  # The API can be listening while sealed. This probe is a single status check,
  # permitting the explicit initialization job to run; usable KMS readiness is
  # represented by openbao-unseal's strict healthy status below.
  openbao:
    # TLS custody is established by the preceding exclusive setup job.
    depends_on: !reset {}
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    logging: &bao-bounded-logs
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    security_opt: ["no-new-privileges:true"]
    environment:
      MARTY_OPENBAO_LOCAL_CONTROL: "1"
    tmpfs: &bao-scratch
      - /openbao/file:rw,noexec,nosuid,nodev,size=1048576,mode=0700
      - /openbao/logs:rw,noexec,nosuid,nodev,size=1048576,mode=0700
    volumes: !override
      - type: bind
        source: ${SELFHOST_OPENBAO_STATE_DIR:?}
        target: /bao/data
        bind: {create_host_path: false}
      - type: bind
        source: ./docker/openbao-selfhost-installer.hcl
        target: /bao/config/openbao.hcl
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${MARTY_INSTALLATION_DIR:?}/openbao-control/socket
        target: /bao/control
        bind: {create_host_path: false}
      - type: bind
        source: ${MARTY_INSTALLATION_DIR:?}/openbao-control/identity
        target: /bao/control-identity
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${MARTY_INSTALLATION_DIR:?}/openbao-seal/key
        target: /bao/seal
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, /usr/local/bin/selfhost-openbao-ready, --check-listener]

  openbao-tls-init:
    profiles: [setup]
    init: true
    security_opt: ["no-new-privileges:true"]
    tmpfs: *bao-scratch
    environment:
      MARTY_OPENBAO_LOCAL_CONTROL: "1"
    labels:
      com.elevenid.installer.id: ${MARTY_INSTALLATION_ID:?}
      com.elevenid.installer.phase: setup
    volumes: !override
      - type: bind
        source: ${SELFHOST_OPENBAO_STATE_DIR:?}
        target: /bao/data
        bind: {create_host_path: false}
      - type: bind
        source: ${MARTY_INSTALLATION_DIR:?}/openbao-control/socket
        target: /bao/control
        bind: {create_host_path: false}
      - type: bind
        source: ${MARTY_INSTALLATION_DIR:?}/openbao-control/identity
        target: /bao/control-identity
        bind: {create_host_path: false}

  openbao-unseal:
    # Historical service key; the static-seal installer uses only read-only
    # readiness observation here. OpenBao performs its own auto-unseal.
    entrypoint: [/usr/local/bin/selfhost-openbao-ready]
    command: [--watch]
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *bao-bounded-logs
    security_opt: ["no-new-privileges:true"]
    tmpfs: *bao-scratch
    environment: !override
      MARTY_OPENBAO_LOCAL_CONTROL: "1"
    volumes: !override
      - type: bind
        source: ${MARTY_INSTALLATION_DIR:?}/openbao-control/socket
        target: /bao/control
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      openbao:
        condition: service_healthy
    healthcheck:
      test: [CMD, /usr/local/bin/selfhost-openbao-ready, --check-ready]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s

  openbao-bootstrap:
    profiles: !override [setup]
    init: true
    security_opt: ["no-new-privileges:true"]
    tmpfs: *bao-scratch
    environment:
      MARTY_OPENBAO_STATIC_SEAL: "1"
      MARTY_OPENBAO_LOCAL_CONTROL: "1"
      MARTY_INSTALLATION_ID: ${MARTY_INSTALLATION_ID:?}
      MARTY_OPENBAO_STATIC_INIT_ATTEMPT_ID: ${MARTY_OPENBAO_STATIC_INIT_ATTEMPT_ID:?bound static initialization attempt required}
    labels:
      com.elevenid.installer.id: ${MARTY_INSTALLATION_ID:?}
      com.elevenid.installer.phase: setup
    depends_on:
      openbao:
        condition: service_healthy
    volumes: !override
      - type: bind
        source: ${SELFHOST_OPENBAO_STATE_DIR:?}
        target: /bao/data
        bind: {create_host_path: false}
      - type: bind
        source: ${MARTY_INSTALLATION_DIR:?}/secrets
        target: /bao/runtime
        bind: {create_host_path: false}
      - type: bind
        source: ${MARTY_INSTALLATION_DIR:?}/openbao-control/socket
        target: /bao/control
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${MARTY_INSTALLATION_DIR:?}/openbao-seal/initialization
        target: /bao/static-init
        bind: {create_host_path: false}
      - type: bind
        source: ./docker/openbao-init.sh
        target: /scripts/openbao-init.sh
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./docker/openbao-haip-workload-policy.hcl
        target: /scripts/openbao-haip-workload-policy.hcl
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./docker/openbao-selfhost-init.sh
        target: /scripts/openbao-selfhost-init.sh
        read_only: true
        bind: {create_host_path: false}
