      GRPC_WORKLOAD_TLS_CLIENT_KMS_KEY_ARN: ${MARTY_AWS_TLS_AUTH_CLIENT_KEY_ARN:?preprovisioned AWS foundation input required}
      GRPC_WORKLOAD_TLS_SERVER_KMS_PROVIDER: aws-kms
