# Fresh AWS foundation, applied after the canonical installer layer.
# Native Compose owns the model. Existing runtime owners validate AWS keys,
# certificates, external OIDC and the selected web-identity credential source.
# Each external identity directory is mounted into exactly its workload; its
# private parent is never mounted. External owners refresh token atomically.
# These structural bindings do not prove IAM or network isolation.
services:
  postgres:
    environment:
      AWS_EC2_METADATA_DISABLED: 'true'
      KEYCLOAK_DB_PASSWORD_FILE: !reset 'null'
      MARTY_INITIALIZE_KEYCLOAK_DATABASE: 'false'
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres && pg_isready -U marty -d marty]
    depends_on:
      keycloak-configurator: !reset 'null'
      keycloak: !reset 'null'
      kms-initialize: !reset 'null'
      openbao-unseal: !reset 'null'
    secrets: !override
    - postgres_password
    - marty_db_password
  redis:
    environment:
      AWS_EC2_METADATA_DISABLED: 'true'
    depends_on:
      keycloak-configurator: !reset 'null'
      keycloak: !reset 'null'
      kms-initialize: !reset 'null'
      openbao-unseal: !reset 'null'
  keycloak: !reset 'null'
  keycloak-configurator: !reset 'null'
  revocation-profile-migrate:
    environment:
      AWS_EC2_METADATA_DISABLED: 'true'
    depends_on:
      keycloak-configurator: !reset 'null'
      keycloak: !reset 'null'
      kms-initialize: !reset 'null'
      openbao-unseal: !reset 'null'
    secrets: !override
    - marty_db_password
  db-migrate:
    environment:
      AWS_EC2_METADATA_DISABLED: 'true'
      BAO_ADDR: !reset 'null'
      BAO_CACERT: !reset 'null'
      NOTIFICATION_OPENBAO_TOKEN_FILE: !reset 'null'
      NOTIFICATION_OPENBAO_CA_CERT_FILE: !reset 'null'
      NOTIFICATION_SECRET_KMS_PROVIDER: aws-kms
      NOTIFICATION_SECRET_AWS_REGION: ${MARTY_NOTIFICATION_SECRET_AWS_REGION:?preprovisioned AWS foundation input required}
      NOTIFICATION_SECRET_AWS_KEY_ARN: ${MARTY_NOTIFICATION_SECRET_AWS_KEY_ARN:?preprovisioned AWS foundation input required}
      AWS_ROLE_ARN: ${MARTY_AWS_DB_MIGRATE_ROLE_ARN:?preprovisioned AWS foundation input required}
      AWS_WEB_IDENTITY_TOKEN_FILE: /run/aws-identity/token
    depends_on:
      keycloak-configurator: !reset 'null'
      keycloak: !reset 'null'
      kms-initialize: !reset 'null'
      openbao-unseal: !reset 'null'
    secrets: !override
    - marty_db_password
    volumes:
    - type: bind
      source: ${MARTY_AWS_DB_MIGRATE_IDENTITY_DIR:?preprovisioned AWS foundation input required}
      target: /run/aws-identity
      read_only: true
      bind:
        create_host_path: false
  kms-initialize: !reset 'null'
  issuance-migrations:
    environment:
      AWS_EC2_METADATA_DISABLED: 'true'
    depends_on:
      keycloak-configurator: !reset 'null'
      keycloak: !reset 'null'
      kms-initialize: !reset 'null'
      openbao-unseal: !reset 'null'
    secrets: !override
    - marty_db_password
  gateway:
    environment:
      AWS_EC2_METADATA_DISABLED: 'true'
      GRPC_WORKLOAD_TLS_CLIENT_KMS_ADDR: !reset 'null'
      GRPC_WORKLOAD_TLS_CLIENT_KMS_CA_CERT: !reset 'null'
      GRPC_WORKLOAD_TLS_CLIENT_KMS_TOKEN_FILE: !reset 'null'
      GRPC_WORKLOAD_TLS_CLIENT_KMS_KEY_NAME: !reset 'null'
      GRPC_WORKLOAD_TLS_CLIENT_KMS_KEY_VERSION: !reset 'null'
      BAO_ADDR: !reset 'null'
      BAO_CACERT: !reset 'null'
      GATEWAY_SIGN_GRANT_MINT_TOKEN_FILE: !reset 'null'
      GATEWAY_ISSUER_CSR_GRANT_MINT_TOKEN_FILE: !reset 'null'
      GRPC_WORKLOAD_TLS_CLIENT_KMS_PROVIDER: aws-kms
      GRPC_WORKLOAD_TLS_CLIENT_KMS_REGION: ${MARTY_AWS_TLS_GATEWAY_CLIENT_REGION:?preprovisioned AWS foundation input required}
      GRPC_WORKLOAD_TLS_CLIENT_KMS_KEY_ARN: ${MARTY_AWS_TLS_GATEWAY_CLIENT_KEY_ARN:?preprovisioned AWS foundation input required}
      MARTY_SIGNING_GRANT_PROVIDER: aws-kms
