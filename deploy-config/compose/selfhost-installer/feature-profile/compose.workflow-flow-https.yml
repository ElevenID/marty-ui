# Selected only by the typed native feature profile. Reuse Flow's own
# nonexportable workload server identity; no private key or published port.
services:
  flow:
    environment:
      MANAGED_AUTHORITY_HTTPS_ADDR: 0.0.0.0:8443
      MANAGED_AUTHORITY_TLS_CERT_FILE: /run/secrets/flow_workload_server_cert
      MANAGED_AUTHORITY_TLS_KMS_PROVIDER: openbao-transit
      MANAGED_AUTHORITY_TLS_KMS_ADDR: ${FLOW_SERVER_TLS_KMS_ADDR:?managed Flow TLS identity required}
      MANAGED_AUTHORITY_TLS_KMS_CA_CERT_FILE: /run/secrets/openbao_tls_ca_cert
      MANAGED_AUTHORITY_TLS_KMS_TOKEN_FILE: /run/secrets/flow_server_tls_kms_token
      MANAGED_AUTHORITY_TLS_KMS_KEY_NAME: ${FLOW_SERVER_TLS_KMS_KEY_NAME:?managed Flow TLS identity required}
      MANAGED_AUTHORITY_TLS_KMS_KEY_VERSION: ${FLOW_SERVER_TLS_KMS_KEY_VERSION:?managed Flow TLS identity required}
