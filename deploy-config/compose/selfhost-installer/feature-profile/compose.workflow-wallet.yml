# Owner projection remains behind its existing workload token and verified TLS.
# This does not create or enable a governed issuer/verifier trust profile.
services:
  trust-profile:
    environment:
      MANAGED_AUTHORITY_HTTPS_ADDR: 0.0.0.0:8443
      MANAGED_AUTHORITY_TLS_CERT_FILE: /run/feature-profile/feature_trust_profile_server_cert
      MANAGED_AUTHORITY_TLS_KMS_PROVIDER: openbao-transit
      MANAGED_AUTHORITY_TLS_KMS_ADDR: https://openbao:8200
      MANAGED_AUTHORITY_TLS_KMS_CA_CERT_FILE: /run/secrets/openbao_tls_ca_cert
      MANAGED_AUTHORITY_TLS_KMS_TOKEN_FILE: /run/feature-profile/feature_trust_profile_tls_kms_token
      MANAGED_AUTHORITY_TLS_KMS_KEY_NAME: feature-workload-tls-trust-profile-server
      MANAGED_AUTHORITY_TLS_KMS_KEY_VERSION: '1'
      WALLET_FLOW_PRODUCER_ID: ${WALLET_FLOW_PRODUCER_ID:?typed Flow producer identity required}
      WALLET_FLOW_OWNER_URL: https://flow:8443
      WALLET_FLOW_OWNER_CA_FILE: /run/secrets/workload_identity_ca_cert
    secrets:
    - openbao_tls_ca_cert
    volumes:
    - type: bind
      source: ${FEATURE_PROFILE_SECRET_DIR:?private feature credential directory required}/feature_trust_profile_server_cert
      target: /run/feature-profile/feature_trust_profile_server_cert
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${FEATURE_PROFILE_SECRET_DIR:?private feature credential directory required}/feature_trust_profile_tls_kms_token
      target: /run/feature-profile/feature_trust_profile_tls_kms_token
      read_only: true
      bind:
        create_host_path: false
  device-registration:
    environment:
      WALLET_ISSUER_TRUST_OWNER_URL: https://trust-profile:8443
      WALLET_ISSUER_TRUST_OWNER_CA: /run/secrets/workload_identity_ca_cert
      WALLET_VERIFIER_TRUST_OWNER_URL: https://trust-profile:8443
      WALLET_VERIFIER_TRUST_OWNER_CA: /run/secrets/workload_identity_ca_cert
