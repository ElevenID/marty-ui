# Beta-only Rust revocation-profile cutover.
#
# This overlay is consumed by scripts/deploy-local-beta-release.ps1 after the
# base and tunnel profiles. Production and persistent self-host compose files
# intentionally continue to select the preceding Python image until a separate
# promotion decision is approved.

x-beta-grpc-service-auth: &beta-grpc-service-auth
  GRPC_SERVICE_TOKEN: ${GRPC_SERVICE_TOKEN:?GRPC_SERVICE_TOKEN must be set for beta Rust services}

services:
  auth:
    environment:
      <<: *beta-grpc-service-auth
  organization:
    environment:
      <<: *beta-grpc-service-auth
  credential-template:
    environment:
      <<: *beta-grpc-service-auth
  trust-profile:
    environment:
      <<: *beta-grpc-service-auth
  applicant:
    environment:
      <<: *beta-grpc-service-auth
  notification:
    environment:
      <<: *beta-grpc-service-auth
  compliance-profile:
    environment:
      <<: *beta-grpc-service-auth
  presentation-policy:
    environment:
      <<: *beta-grpc-service-auth
  deployment-profile:
    environment:
      <<: *beta-grpc-service-auth
  flow:
    environment:
      <<: *beta-grpc-service-auth
  verification:
    environment:
      <<: *beta-grpc-service-auth
  revocation-profile:
    build: !override
      context: .
      dockerfile: rust/services/revocation-profile/Dockerfile
      args:
        MARTY_RELEASE_VERSION: ${MARTY_RELEASE_VERSION:-development}
        MARTY_UI_SHA: ${MARTY_UI_SHA:-unknown}
    environment:
      <<: *beta-grpc-service-auth
      ENVIRONMENT: beta
      REVOCATION_PROFILE_SERVICE_PORT: "8013"
      RP_GRPC_ENABLED: "true"
      RP_GRPC_PORT: "9013"
      RUST_LOG: ${REVOCATION_PROFILE_RUST_LOG:-info}
  device-registration:
    environment:
      <<: *beta-grpc-service-auth
  event-stream:
    environment:
      <<: *beta-grpc-service-auth
  issuance:
    environment:
      <<: *beta-grpc-service-auth
  canvas-sync-worker:
    environment:
      <<: *beta-grpc-service-auth
  gateway:
    environment:
      <<: *beta-grpc-service-auth
