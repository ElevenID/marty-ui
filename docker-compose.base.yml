    restart: unless-stopped

  flow:
    mem_limit: ${MARTY_FLOW_MEMORY_LIMIT:-512m}
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: flow
    environment:
      <<: *native_issuance_grpc_auth
      ENVIRONMENT: development
      FLOW_SERVICE_PORT: "8011"
      DATABASE_URL: postgresql+asyncpg://marty:${MARTY_DB_PASSWORD:-marty_dev_password}@postgres:5432/marty
      PUBLIC_BASE_URL: ${PUBLIC_API_URL:-http://gateway:8000}
      ORG_GRPC_TARGET: organization:9002
      PP_GRPC_TARGET: presentation-policy:9009
      CT_GRPC_TARGET: credential-template:9003
      ISSUANCE_GRPC_TARGET: https://issuance-native:9005
      GRPC_WORKLOAD_TLS_CA_CERT: /run/secrets/workload_identity_ca_cert
      GRPC_WORKLOAD_TLS_CLIENT_CERT: /run/secrets/flow_workload_client_cert
      GRPC_WORKLOAD_TLS_CLIENT_KMS_ADDR: ${FLOW_CLIENT_TLS_KMS_ADDR:?FLOW_CLIENT_TLS_KMS_ADDR must be HTTPS OpenBao}
      GRPC_WORKLOAD_TLS_CLIENT_KMS_CA_CERT: /run/secrets/openbao_tls_ca_cert
      GRPC_WORKLOAD_TLS_CLIENT_KMS_TOKEN_FILE: /run/secrets/flow_client_tls_kms_token
      GRPC_WORKLOAD_TLS_CLIENT_KMS_KEY_NAME: ${FLOW_CLIENT_TLS_KMS_KEY_NAME:?FLOW_CLIENT_TLS_KMS_KEY_NAME must be set}
      GRPC_WORKLOAD_TLS_CLIENT_KMS_KEY_VERSION: ${FLOW_CLIENT_TLS_KMS_KEY_VERSION:?FLOW_CLIENT_TLS_KMS_KEY_VERSION must be set}
      ISSUANCE_SERVICE_URL: http://issuance:8005
      ISSUANCE_NATIVE_SERVICE_URL: http://issuance-native:8005
      PASSPORT_NATIVE_FLOW_ENABLED: ${PASSPORT_NATIVE_FLOW_ENABLED:-false}
      PASSPORT_INTERNAL_SERVICE_AUTH_ENABLED: ${PASSPORT_INTERNAL_SERVICE_AUTH_ENABLED:-false}
      PASSPORT_TENANT_API_KEYS: ${PASSPORT_TENANT_API_KEYS:-}
      PASSPORT_TENANT_API_KEYS_FILE: ${PASSPORT_TENANT_API_KEYS_FILE:-}
      CREDENTIAL_TEMPLATE_SERVICE_URL: http://credential-template:8003
      TRUST_PROFILE_SERVICE_URL: http://trust-profile:8004
      DEPLOYMENT_PROFILE_SERVICE_URL: http://deployment-profile:8010
      ISSUANCE_API_KEY: ${ISSUANCE_API_KEY:-dev-issuance-api-key}
      MARTY_ORG_ID: ${MARTY_ORG_ID:-00000000-0000-0000-0000-000000000001}
      MARTY_ORG_SLUG: ${MARTY_ORG_SLUG:-marty}
      MARTY_ISSUER_DID: ${MARTY_ISSUER_DID:-}
      OID4VP_ISSUER_DID: ${OID4VP_ISSUER_DID:-}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-}
      # Flow validates signing readiness before the gateway can start, so this
      # dependency must not traverse the gateway and create a startup cycle.
      SIGNING_KEYS_INTERNAL_URL: http://signing-keys:8017/internal
      SIGNING_KEYS_INTERNAL_API_KEY: ${SIGNING_KEYS_INTERNAL_API_KEY:-dev-signing-keys-internal-api-key}
      SIGNING_KEYS_ISSUER_SIGN_KEY: ${SIGNING_KEYS_ISSUER_SIGN_KEY:-dev-signing-keys-issuer-did-sign-key}
      BAO_ADDR: https://openbao:8200
      BAO_CACERT: /bao/public-ca/ca.crt
      FLOW_SIGN_GRANT_MINT_TOKEN_FILE: /bao/flow-grant/token
      PERSONALIZATION_BUREAU_URL: ${PERSONALIZATION_BUREAU_URL:-}
      REDIS_URL: redis://redis:6379
      REDIS_DB_FLOW: "3"
      FLOW_GRPC_PORT: "9011"
      FLOW_WEBHOOK_SECRET: ${FLOW_WEBHOOK_SECRET:-dev-flow-webhook-secret-change-me}
      FLOW_CALLBACK_DESTINATIONS: ${FLOW_CALLBACK_DESTINATIONS:-${MARTY_ORG_ID:-00000000-0000-0000-0000-000000000001}|http://auth:8001/internal/v1/auth/credential-verified?nonce=__MARTY_TOKEN__}
      FLOW_APPLICATION_EVENT_HMAC_KEY: ${FLOW_APPLICATION_EVENT_HMAC_KEY:-dev-flow-application-event-hmac-key-change-before-production}
    ports:
      - "127.0.0.1:8011:8011"
      - "127.0.0.1:9011:9011"
    volumes:
      - openbao_public_ca:/bao/public-ca:ro
      - openbao_flow_grant:/bao/flow-grant:ro
    secrets:
      - workload_identity_ca_cert
      - flow_workload_client_cert
      - openbao_tls_ca_cert
      - flow_client_tls_kms_token
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      organization:
        condition: service_healthy
      credential-template:
        condition: service_healthy
      presentation-policy:
        condition: service_healthy
      issuance:
        condition: service_healthy
      issuance-native:
        condition: service_healthy
      openbao-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - marty-network
    restart: unless-stopped

  issuance:
    mem_limit: ${MARTY_ISSUANCE_MEMORY_LIMIT:-512m}
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: issuance-native
    entrypoint: ["/usr/local/bin/marty-issuance-service"]
    command: []
    environment:
      <<: *native_issuance_grpc_auth
      SERVICE_NAME: issuance_native
      MARTY_SCHEMA_STARTUP_MODE: validate
      ISSUANCE_SERVICE_PORT: "8005"
      ISSUANCE_GRPC_ENABLED: "false"
      DIDCOMM_DELIVERY_OWNER: native
      ISSUANCE_NATIVE_SERVICE_URL: http://issuance-native:8005
      DATABASE_URL: postgresql://marty:${MARTY_DB_PASSWORD:-marty_dev_password}@postgres:5432/marty
      ISSUER_BASE_URL: ${PUBLIC_API_URL:-http://gateway:8000}
      ALLOWED_REDIRECT_URIS: ${ALLOWED_REDIRECT_URIS:-}
      UI_BASE_URL: ${UI_BASE_URL:-http://localhost:3000}
      CANVAS_LTI_EXPERIENCE_BASE_URL: ${CANVAS_LTI_EXPERIENCE_BASE_URL:-}
      CANVAS_OAUTH_COMPLETION_REDIRECT_URL: ${CANVAS_OAUTH_COMPLETION_REDIRECT_URL:-${CANVAS_LTI_EXPERIENCE_BASE_URL:-http://localhost:3000}/console/org/deploy/canvas}
      CANVAS_LTI_TOOL_SIGNING_ORGANIZATION_ID: ${CANVAS_LTI_TOOL_SIGNING_ORGANIZATION_ID:-}
      CANVAS_LTI_TOOL_ISSUER_DID: ${CANVAS_LTI_TOOL_ISSUER_DID:-}
      CANVAS_CREDENTIAL_ISSUER_PROFILE_IDS: ${CANVAS_CREDENTIAL_ISSUER_PROFILE_IDS:-}
      CANVAS_LTI_TOOL_ACTIVE_KID: ${CANVAS_LTI_TOOL_ACTIVE_KID:-}
      CANVAS_LTI_TOOL_PUBLIC_JWKS: ${CANVAS_LTI_TOOL_PUBLIC_JWKS:-}
      CANVAS_PORTABLE_INTEGRATION_ENABLED: ${CANVAS_PORTABLE_INTEGRATION_ENABLED:-false}
      CANVAS_PILOT_ORGANIZATION_IDS: ${CANVAS_PILOT_ORGANIZATION_IDS:-}
      CANVAS_LEGACY_EVENT_INGEST_ENABLED: ${CANVAS_LEGACY_EVENT_INGEST_ENABLED:-false}
      CANVAS_PRIVATE_ORIGIN_ALLOWLIST: ${CANVAS_PRIVATE_ORIGIN_ALLOWLIST:-}
      CANVAS_SELF_MANAGED_ORIGIN_ALLOWLIST: ${CANVAS_SELF_MANAGED_ORIGIN_ALLOWLIST:-}
      CANVAS_BINDING_READINESS_MAX_AGE_SECONDS: ${CANVAS_BINDING_READINESS_MAX_AGE_SECONDS:-900}
      CANVAS_ISSUANCE_EVIDENCE_MAX_AGE_SECONDS: ${CANVAS_ISSUANCE_EVIDENCE_MAX_AGE_SECONDS:-900}
      ISSUANCE_OFFER_TTL_MINUTES: ${ISSUANCE_OFFER_TTL_MINUTES:-10080}
      ISSUANCE_AUTH_SESSION_TTL_MINUTES: ${ISSUANCE_AUTH_SESSION_TTL_MINUTES:-60}
      ORG_GRPC_TARGET: organization:9002
      CT_GRPC_TARGET: credential-template:9003
      RP_GRPC_TARGET: revocation-profile:9013
      CREDENTIAL_TEMPLATE_SERVICE_URL: http://credential-template:8003
      REVOCATION_PROFILE_SERVICE_URL: http://revocation-profile:8013
      ISSUANCE_GRPC_PORT: "9005"
      # OpenBao KMS for credential signing
      BAO_ADDR: https://openbao:8200
      BAO_CACERT: /bao/public-ca/ca.crt
      BAO_TOKEN_FILE: /bao/service-token/token
      ISSUANCE_API_KEY: ${ISSUANCE_API_KEY:-dev-issuance-api-key}
      ISSUANCE_CREDENTIAL_SIGN_GRANT_MINT_TOKEN_FILE: /bao/issuance-credential-grant/token
      ISSUANCE_CANVAS_SIGN_GRANT_MINT_TOKEN_FILE: /bao/issuance-canvas-grant/token
      ISSUANCE_READINESS_SIGN_GRANT_MINT_TOKEN_FILE: /bao/issuance-readiness-grant/token
      ISSUANCE_PASSPORT_SIGN_GRANT_MINT_TOKEN_FILE: /bao/issuance-passport-grant/token
      TOKEN_HMAC_KEY: ${TOKEN_HMAC_KEY:-dev-only-token-hmac-key-change-me}
      # Exact HTTPS resources that VCDM credentials may reference by digest.
      # Empty remains fail-closed; conformance and production operators must
      # opt in to every trusted resource URL explicitly.
      VCDM_RELATED_RESOURCE_URLS: ${VCDM_RELATED_RESOURCE_URLS:-}
      # Preserve the issuance service's production default while allowing
      # disposable conformance deployments to exercise dense official suites.
      TOKEN_RATE_LIMIT: ${TOKEN_RATE_LIMIT:-30}
      PERSONALIZATION_BUREAU_URL: ${PERSONALIZATION_BUREAU_URL:-}
      PERSONALIZATION_BUREAU_API_KEY: ${PERSONALIZATION_BUREAU_API_KEY:-}
      PERSONALIZATION_BUREAU_PROVIDER_PROFILE_ID: ${PERSONALIZATION_BUREAU_PROVIDER_PROFILE_ID:-}
      SIGNING_KEYS_INTERNAL_URL: http://gateway:8000/internal/signing-keys
      SIGNING_KEYS_INTERNAL_API_KEY: ${SIGNING_KEYS_INTERNAL_API_KEY:-dev-signing-keys-internal-api-key}
      SIGNING_KEYS_INTEGRATION_SECRET_KEY: ${SIGNING_KEYS_INTEGRATION_SECRET_KEY:-dev-signing-keys-integration-secret-key}
      INTEGRATION_SECRET_KMS_URL: https://signing-keys:8018/internal
      INTEGRATION_SECRET_KMS_CA_FILE: /run/secrets/dev_integration_secret_ca
      SIGNING_KEYS_ISSUER_SIGN_KEY: ${SIGNING_KEYS_ISSUER_SIGN_KEY:-dev-signing-keys-issuer-did-sign-key}
      CANVAS_CREDENTIALS_SHARED_SECRET: ${CANVAS_CREDENTIALS_SHARED_SECRET:-}
      CANVAS_CREDENTIALS_SIGNATURE_TOLERANCE_SECONDS: ${CANVAS_CREDENTIALS_SIGNATURE_TOLERANCE_SECONDS:-300}
      CANVAS_CREDENTIALS_PROVIDER: ${CANVAS_CREDENTIALS_PROVIDER:-bridge}
      CANVAS_CREDENTIALS_PUBLISH_URL: ${CANVAS_CREDENTIALS_PUBLISH_URL:-}
      CANVAS_CREDENTIALS_STATUS_SYNC_URL: ${CANVAS_CREDENTIALS_STATUS_SYNC_URL:-}
      CANVAS_CREDENTIALS_API_BASE_URL: ${CANVAS_CREDENTIALS_API_BASE_URL:-https://api.badgr.io}
      CANVAS_CREDENTIALS_API_ORIGIN_ALLOWLIST: ${CANVAS_CREDENTIALS_API_ORIGIN_ALLOWLIST:-}
      CANVAS_CREDENTIALS_API_TOKEN: ${CANVAS_CREDENTIALS_API_TOKEN:-}
      CANVAS_CREDENTIALS_ISSUER_ID: ${CANVAS_CREDENTIALS_ISSUER_ID:-}
      CANVAS_CREDENTIALS_BADGECLASS_ID: ${CANVAS_CREDENTIALS_BADGECLASS_ID:-}
      CANVAS_CREDENTIALS_ASSERTION_SCOPE: ${CANVAS_CREDENTIALS_ASSERTION_SCOPE:-badgeclasses}
      CANVAS_CREDENTIALS_ASSERTION_URL_TEMPLATE: ${CANVAS_CREDENTIALS_ASSERTION_URL_TEMPLATE:-}
      CANVAS_CREDENTIALS_ASSERTION_NARRATIVE: ${CANVAS_CREDENTIALS_ASSERTION_NARRATIVE:-}
      CANVAS_CREDENTIALS_PROVENANCE_BASE_URL: ${CANVAS_CREDENTIALS_PROVENANCE_BASE_URL:-}
      CANVAS_CREDENTIALS_RECIPIENT_HASHED: ${CANVAS_CREDENTIALS_RECIPIENT_HASHED:-true}
      CANVAS_CREDENTIALS_ALLOW_DUPLICATE_AWARDS: ${CANVAS_CREDENTIALS_ALLOW_DUPLICATE_AWARDS:-false}
      CANVAS_MIRROR_WORKER_ENABLED: "false"
      CANVAS_MIRROR_WORKER_ORGANIZATION_ID: ${CANVAS_MIRROR_WORKER_ORGANIZATION_ID:-}
      CANVAS_MIRROR_PUBLISH_INTERVAL_SECONDS: ${CANVAS_MIRROR_PUBLISH_INTERVAL_SECONDS:-300}
      CANVAS_MIRROR_STATUS_SYNC_INTERVAL_SECONDS: ${CANVAS_MIRROR_STATUS_SYNC_INTERVAL_SECONDS:-900}
      CANVAS_MIRROR_WORKER_BATCH_LIMIT: ${CANVAS_MIRROR_WORKER_BATCH_LIMIT:-25}
      CANVAS_MIRROR_WORKER_RETRY_FAILED: ${CANVAS_MIRROR_WORKER_RETRY_FAILED:-true}
      CANVAS_MIRROR_WORKER_RUN_ON_STARTUP: ${CANVAS_MIRROR_WORKER_RUN_ON_STARTUP:-true}
      CANVAS_MIRROR_FAILURE_WARNING_ATTEMPTS: ${CANVAS_MIRROR_FAILURE_WARNING_ATTEMPTS:-3}
      CANVAS_MIRROR_FAILURE_CRITICAL_ATTEMPTS: ${CANVAS_MIRROR_FAILURE_CRITICAL_ATTEMPTS:-5}
      CANVAS_MIRROR_ALERT_WEBHOOK_URL: ${CANVAS_MIRROR_ALERT_WEBHOOK_URL:-}
      CANVAS_MIRROR_ALERT_WEBHOOK_TIMEOUT_SECONDS: ${CANVAS_MIRROR_ALERT_WEBHOOK_TIMEOUT_SECONDS:-5}
      CANVAS_LTI_STATE_TTL_MINUTES: ${CANVAS_LTI_STATE_TTL_MINUTES:-10}
      CANVAS_LTI_JWKS_TTL_MINUTES: ${CANVAS_LTI_JWKS_TTL_MINUTES:-1440}
      CANVAS_ALLOW_PRIVATE_BASE_URLS: ${CANVAS_ALLOW_PRIVATE_BASE_URLS:-false}
      CANVAS_ALLOW_HTTP_LOCALHOST_BASE_URLS: ${CANVAS_ALLOW_HTTP_LOCALHOST_BASE_URLS:-false}
      # DIDComm resolver infrastructure is deployment-managed and never caller-selected.
      UNIVERSAL_RESOLVER_URL: ${UNIVERSAL_RESOLVER_URL:-}
      DIDCOMM_ALLOW_PRIVATE_IPS: ${DIDCOMM_ALLOW_PRIVATE_IPS:-false}
      # Managed path-scoped did:web issuer documents are resolved through the
      # stack-owned gateway, never by caller-selected or public-network URLs.
      DIDCOMM_DID_WEB_INTERNAL_BASE_URL: ${DIDCOMM_DID_WEB_INTERNAL_BASE_URL:-http://gateway:8000}
    secrets:
      - dev_integration_secret_ca
    volumes:
      - openbao_public_ca:/bao/public-ca:ro
      - openbao_service_token:/bao/service-token:ro
      - openbao_issuance_credential_grant:/bao/issuance-credential-grant:ro
      - openbao_issuance_canvas_grant:/bao/issuance-canvas-grant:ro
      - openbao_issuance_readiness_grant:/bao/issuance-readiness-grant:ro
      - openbao_issuance_passport_grant:/bao/issuance-passport-grant:ro
    ports:
      - "127.0.0.1:8005:8005"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      issuance-migrations:
        condition: service_completed_successfully
      openbao-init:
        condition: service_completed_successfully
      issuance-native:
        condition: service_healthy
        required: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8005/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - marty-network
    restart: unless-stopped

  # Rust owner for native routes; the issuance alias runs the same binary.
  issuance-native:
    mem_limit: ${MARTY_ISSUANCE_NATIVE_MEMORY_LIMIT:-512m}
    extends:
      file: docker-compose.profile.issuance-native.yml
      service: issuance-native

  # Portable Canvas synchronization runs out-of-process. The worker leases
  # PostgreSQL jobs and records a database heartbeat consumed by readiness.
  canvas-sync-worker:
    mem_limit: ${MARTY_CANVAS_SYNC_WORKER_MEMORY_LIMIT:-512m}
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: canvas-sync-worker
    command: ["/usr/local/bin/marty-canvas-sync-worker"]
    environment:
      SERVICE_NAME: canvas_sync_worker
      DATABASE_URL: postgresql://marty:${MARTY_DB_PASSWORD:-marty_dev_password}@postgres:5432/marty
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Repository initialization verifies opaque OAuth/session material.
      # Keep this identical to issuance so the worker can process jobs.
      TOKEN_HMAC_KEY: ${TOKEN_HMAC_KEY:-dev-only-token-hmac-key-change-me}
      CREDENTIAL_TEMPLATE_SERVICE_URL: http://credential-template:8003
      REVOCATION_PROFILE_SERVICE_URL: http://revocation-profile:8013
      SIGNING_KEYS_INTERNAL_URL: http://gateway:8000/internal/signing-keys
      INTEGRATION_SECRET_KMS_URL: https://signing-keys:8018/internal
      INTEGRATION_SECRET_KMS_CA_FILE: /run/secrets/dev_integration_secret_ca
      SIGNING_KEYS_INTERNAL_API_KEY: ${SIGNING_KEYS_INTERNAL_API_KEY:-dev-signing-keys-internal-api-key}
      SIGNING_KEYS_INTEGRATION_SECRET_KEY: ${SIGNING_KEYS_INTEGRATION_SECRET_KEY:-dev-signing-keys-integration-secret-key}
      SIGNING_KEYS_ISSUER_SIGN_KEY: ${SIGNING_KEYS_ISSUER_SIGN_KEY:-dev-signing-keys-issuer-did-sign-key}
      BAO_ADDR: https://openbao:8200
      BAO_CACERT: /bao/public-ca/ca.crt
      ISSUANCE_CANVAS_SIGN_GRANT_MINT_TOKEN_FILE: /bao/issuance-canvas-grant/token
      CANVAS_LTI_TOOL_SIGNING_ORGANIZATION_ID: ${CANVAS_LTI_TOOL_SIGNING_ORGANIZATION_ID:-}
      CANVAS_LTI_TOOL_ISSUER_DID: ${CANVAS_LTI_TOOL_ISSUER_DID:-}
      CANVAS_CREDENTIAL_ISSUER_PROFILE_IDS: ${CANVAS_CREDENTIAL_ISSUER_PROFILE_IDS:-}
      CANVAS_LTI_TOOL_ACTIVE_KID: ${CANVAS_LTI_TOOL_ACTIVE_KID:-}
      CANVAS_LTI_TOOL_PUBLIC_JWKS: ${CANVAS_LTI_TOOL_PUBLIC_JWKS:-}
      CANVAS_PORTABLE_INTEGRATION_ENABLED: ${CANVAS_PORTABLE_INTEGRATION_ENABLED:-false}
      CANVAS_PILOT_ORGANIZATION_IDS: ${CANVAS_PILOT_ORGANIZATION_IDS:-}
      CANVAS_LEGACY_EVENT_INGEST_ENABLED: ${CANVAS_LEGACY_EVENT_INGEST_ENABLED:-false}
      CANVAS_PRIVATE_ORIGIN_ALLOWLIST: ${CANVAS_PRIVATE_ORIGIN_ALLOWLIST:-}
      CANVAS_SELF_MANAGED_ORIGIN_ALLOWLIST: ${CANVAS_SELF_MANAGED_ORIGIN_ALLOWLIST:-}
      CANVAS_BINDING_READINESS_MAX_AGE_SECONDS: ${CANVAS_BINDING_READINESS_MAX_AGE_SECONDS:-900}
      CANVAS_ALLOW_PRIVATE_BASE_URLS: ${CANVAS_ALLOW_PRIVATE_BASE_URLS:-false}
      CANVAS_ALLOW_HTTP_LOCALHOST_BASE_URLS: ${CANVAS_ALLOW_HTTP_LOCALHOST_BASE_URLS:-false}
      CANVAS_BACKGROUND_ROSTER_BATCH_SIZE: ${CANVAS_BACKGROUND_ROSTER_BATCH_SIZE:-500}
      CANVAS_BACKGROUND_ROSTER_MAX_SIZE: ${CANVAS_BACKGROUND_ROSTER_MAX_SIZE:-5000}
      CANVAS_SYNC_WORKER_BATCH_SIZE: ${CANVAS_SYNC_WORKER_BATCH_SIZE:-10}
      CANVAS_SYNC_WORKER_LEASE_SECONDS: ${CANVAS_SYNC_WORKER_LEASE_SECONDS:-120}
      CANVAS_SYNC_WORKER_JOB_TIMEOUT_SECONDS: ${CANVAS_SYNC_WORKER_JOB_TIMEOUT_SECONDS:-600}
      CANVAS_SYNC_SCHEDULE_LIMIT: ${CANVAS_SYNC_SCHEDULE_LIMIT:-100}
      CANVAS_OAUTH_REVOCATION_BATCH_SIZE: ${CANVAS_OAUTH_REVOCATION_BATCH_SIZE:-25}
      CANVAS_SYNC_WORKER_POLL_SECONDS: ${CANVAS_SYNC_WORKER_POLL_SECONDS:-5}
    secrets:
      - dev_integration_secret_ca
    volumes:
      - openbao_public_ca:/bao/public-ca:ro
      - openbao_issuance_canvas_grant:/bao/issuance-canvas-grant:ro
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      issuance-migrations:
        condition: service_completed_successfully
    # This process is deliberately headless: disable inherited image HTTP
    # health checks. Its database heartbeat is the health signal.
    healthcheck:
      disable: true
    networks:
      - marty-network
    restart: unless-stopped

  # ── Revocation Profile Service ────────────────────────────────────
  revocation-profile:
    mem_limit: ${MARTY_REVOCATION_PROFILE_MEMORY_LIMIT:-512m}
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: revocation-profile
    environment:
      <<: *native_issuance_grpc_auth
      SERVICE_NAME: revocation_profile
      ENVIRONMENT: development
      REVOCATION_PROFILE_SERVICE_PORT: "8013"
      DATABASE_URL: postgresql+asyncpg://marty:${MARTY_DB_PASSWORD:-marty_dev_password}@postgres:5432/marty
      REDIS_URL: redis://redis:6379/4
      ORG_GRPC_TARGET: organization:9002
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://gateway:8000}
      MARTY_ORG_ID: ${MARTY_ORG_ID:-00000000-0000-0000-0000-000000000001}
      RP_GRPC_ENABLED: "true"
      RP_GRPC_PORT: "9013"
      RUST_LOG: ${REVOCATION_PROFILE_RUST_LOG:-info}
    ports:
      - "127.0.0.1:8013:8013"
      - "127.0.0.1:9013:9013"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      # Native TLS startup eagerly connects to organization before binding HTTP.
      organization:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8013/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - marty-network
    restart: unless-stopped

  # ── Device Registration Service ─────────────────────────────────
  device-registration:
    mem_limit: ${MARTY_DEVICE_REGISTRATION_MEMORY_LIMIT:-512m}
    build:
      context: .
      dockerfile: rust/services/Dockerfile.ci
      target: device_registration
      args:
        MARTY_RELEASE_VERSION: ${MARTY_RELEASE_VERSION:-development}
        MARTY_UI_SHA: ${MARTY_UI_SHA:-unknown}
    environment:
      <<: *native_issuance_grpc_auth
      DEVICE_REGISTRATION_SERVICE_PORT: "8014"
      DEVICE_REGISTRATION_GATEWAY_KEY: ${DEVICE_REGISTRATION_GATEWAY_KEY:-dev-device-registration-gateway-key-change-me}
      DEVICE_REGISTRATION_SIGNING_KEYS_KEY: ${DEVICE_REGISTRATION_SIGNING_KEYS_KEY:-dev-device-registration-signing-keys-key-change-me}
      SIGNING_KEYS_HOLDER_ORIGIN: http://signing-keys:8017
      TRUST_PROFILE_SERVICE_URL: http://trust-profile:8004
      DATABASE_URL: postgresql+asyncpg://marty:${MARTY_DB_PASSWORD:-marty_dev_password}@postgres:5432/marty
      REDIS_URL: redis://redis:6379/5
      ORG_GRPC_TARGET: organization:9002
    ports:
      - "127.0.0.1:8014:8014"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8014/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - marty-network
    restart: unless-stopped

  # ── Event Stream Service (gRPC event bus) ─────────────────────────
  event-stream:
    mem_limit: ${MARTY_EVENT_STREAM_MEMORY_LIMIT:-512m}
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: event_stream
    environment:
      - EVENT_STREAM_SERVICE_PORT=8015
      - EVENT_STREAM_GRPC_ENABLED=true
      - EVENT_STREAM_GRPC_PORT=9015
      - RUST_LOG=${EVENT_STREAM_RUST_LOG:-info}
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
    ports:
      - "127.0.0.1:8015:8015"
      - "127.0.0.1:9015:9015"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8015/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - marty-network
    restart: unless-stopped

  # ── Verification Service ─────────────────────────────────────────
  verification:
    mem_limit: ${MARTY_VERIFICATION_MEMORY_LIMIT:-512m}
    build:
      context: .
      dockerfile: rust/services/Dockerfile.ci
      target: verification
      args:
        MARTY_RELEASE_VERSION: ${MARTY_RELEASE_VERSION:-development}
        MARTY_UI_SHA: ${MARTY_UI_SHA:-unknown}
    environment:
      <<: *native_issuance_grpc_auth
      ENVIRONMENT: development
      VERIFICATION_SERVICE_PORT: "8012"
      ORG_GRPC_TARGET: organization:9002
      CT_GRPC_TARGET: credential-template:9003
      PP_GRPC_TARGET: presentation-policy:9009
      VERIF_GRPC_PORT: "9017"
      VERIF_GRPC_ENABLED: "true"
      PUBLIC_BASE_URL: ${PUBLIC_API_URL:-http://gateway:8000}
      REDIS_URL: redis://redis:6379/3
      VERIFICATION_CREDENTIALS_COMPAT_ENABLED: ${VERIFICATION_CREDENTIALS_COMPAT_ENABLED:-false}
      VERIFICATION_GOVERNANCE_JSON: ${VERIFICATION_GOVERNANCE_JSON:-}
      VERIFICATION_PROCESSING_LEASE_SECONDS: ${VERIFICATION_PROCESSING_LEASE_SECONDS:-60}
      DATABASE_URL: postgresql://marty:${MARTY_DB_PASSWORD:-marty_dev_password}@postgres:5432/marty
      SIGNING_KEYS_INTERNAL_URL: http://gateway:8000/internal/signing-keys
      SIGNING_KEYS_INTERNAL_API_KEY: ${SIGNING_KEYS_INTERNAL_API_KEY:-dev-signing-keys-internal-api-key}
      DID_WEB_ALLOWED_HOSTS: ${DID_WEB_ALLOWED_HOSTS:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
    ports:
      - "127.0.0.1:8012:8012"
      - "127.0.0.1:9017:9017"
    depends_on:
      verification-migrations:
        condition: service_completed_successfully
      credential-template:
        condition: service_healthy
      presentation-policy:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8012/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - marty-network
    restart: unless-stopped

  # ── Envoy gRPC Proxy ─────────────────────────────────────────────
  envoy:
    mem_limit: ${MARTY_ENVOY_MEMORY_LIMIT:-512m}
    build:
      context: ./config/envoy
      dockerfile: Dockerfile
    image: marty-envoy:latest
    volumes:
      - ${MARTY_RUNTIME_CONFIG_ROOT:-.}/config/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ${MARTY_RUNTIME_CONFIG_ROOT:-.}/config/envoy/proto_descriptor.pb:/etc/envoy/proto_descriptor.pb:ro
    ports:
      - "127.0.0.1:${ENVOY_HOST_PORT:-9000}:9000"    # gRPC / gRPC-web unified endpoint
      - "127.0.0.1:${ENVOY_ADMIN_HOST_PORT:-9901}:9901"    # Envoy admin
    depends_on:
      auth:
        condition: service_healthy
      organization:
        condition: service_healthy
      credential-template:
        condition: service_healthy
      issuance:
        condition: service_healthy
      issuance-native:
        condition: service_healthy
      notification:
        condition: service_healthy
      presentation-policy:
        condition: service_healthy
      flow:
        condition: service_healthy
      revocation-profile:
        condition: service_healthy
      device-registration:
        condition: service_healthy
      event-stream:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9901/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - marty-network
    restart: unless-stopped

  # Shares Envoy's loopback namespace. Only this Rust process holds the scoped
  # OpenBao token; it presents a remote-held client key to Issuance mTLS.
  envoy-issuance-bridge:
    mem_limit: ${MARTY_ENVOY_ISSUANCE_BRIDGE_MEMORY_LIMIT:-512m}
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: envoy-issuance-bridge
    entrypoint: ["/usr/local/bin/marty-keyless-grpc-bridge"]
    environment:
      KEYLESS_BRIDGE_LISTEN: 127.0.0.1:19006
      KEYLESS_BRIDGE_UPSTREAM_HOST: issuance-native
      KEYLESS_BRIDGE_UPSTREAM_PORT: "9005"
      KEYLESS_BRIDGE_SERVER_CA_FILE: /run/secrets/workload_identity_ca_cert
      KEYLESS_BRIDGE_CLIENT_CERT_FILE: /run/secrets/envoy_issuance_client_cert
      KEYLESS_BRIDGE_KMS_ADDR: ${ENVOY_ISSUANCE_TLS_KMS_ADDR:?ENVOY_ISSUANCE_TLS_KMS_ADDR must be HTTPS OpenBao}
      KEYLESS_BRIDGE_KMS_CA_CERT_FILE: /run/secrets/openbao_tls_ca_cert
      KEYLESS_BRIDGE_KMS_TOKEN_FILE: /run/secrets/envoy_issuance_tls_kms_token
      KEYLESS_BRIDGE_KMS_KEY_NAME: ${ENVOY_ISSUANCE_TLS_KMS_KEY_NAME:?ENVOY_ISSUANCE_TLS_KMS_KEY_NAME must be set}
      KEYLESS_BRIDGE_KMS_KEY_VERSION: ${ENVOY_ISSUANCE_TLS_KMS_KEY_VERSION:?ENVOY_ISSUANCE_TLS_KMS_KEY_VERSION must be set}
    secrets:
      - workload_identity_ca_cert
      - envoy_issuance_client_cert
      - openbao_tls_ca_cert
      - envoy_issuance_tls_kms_token
    network_mode: service:envoy
    depends_on:
      envoy:
        condition: service_started
      issuance-native:
        condition: service_healthy
    restart: unless-stopped

secrets:
  keycloak_signing_kms_token:
