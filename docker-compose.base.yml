# Marty UI Unified Base Stack
# ===========================
# Single base compose file for infra + microservices.
# Mode-specific behavior is layered via profile compose files.
# Host publications are developer conveniences and must remain loopback-only.
# Public deployments reach edge services over the Compose network through a
# governed proxy/tunnel; internal service ports are never LAN/public listeners.

# One development-only value shared by the native issuance owner and its direct
# callers. Deployed overlays replace this with their existing secret source.
x-native-issuance-grpc-auth: &native_issuance_grpc_auth
  GRPC_SERVICE_TOKEN: ${GRPC_SERVICE_TOKEN:-dev-grpc-service-token-change-before-production}

x-openbao-plugin-image: &openbao_plugin_image
  image: ${MARTY_OPENBAO_DIDCOMM_IMAGE:-marty-openbao-didcomm:dev}
  build:
    context: .
    dockerfile: openbao/didcomm-authcrypt/Dockerfile

services:
  # ==========================================================================
  # Infrastructure
  # ==========================================================================
  postgres:
    mem_limit: ${MARTY_POSTGRES_MEMORY_LIMIT:-1g}
    image: postgres:15-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      MARTY_DB_PASSWORD: ${MARTY_DB_PASSWORD:-marty_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ${MARTY_RUNTIME_CONFIG_ROOT:-.}/docker/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && pg_isready -U keycloak -d keycloak && pg_isready -U marty -d marty"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - marty-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: ${MARTY_POSTGRES_MEMORY_LIMIT:-1g}
        reservations:
          cpus: '0.5'
          memory: 256M

  redis:
    mem_limit: ${MARTY_REDIS_MEMORY_LIMIT:-256m}
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - marty-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: ${MARTY_REDIS_MEMORY_LIMIT:-256m}
        reservations:
          cpus: '0.25'
          memory: 64M

  keycloak:
    mem_limit: ${MARTY_KEYCLOAK_MEMORY_LIMIT:-2g}
    image: ghcr.io/elevenid/marty-ui-oss/keycloak@${KEYCLOAK_KMS_IMAGE_DIGEST:?KEYCLOAK_KMS_IMAGE_DIGEST must pin the remote-key Keycloak image}
    command:
      - start-dev
      - --features=organization
      - --import-realm
    ports:
      - "127.0.0.1:8180:8080"
    environment:
      # Leave room for metaspace, native buffers, threads and the remote-key provider.
      JAVA_OPTS_KC_HEAP: "-XX:InitialRAMPercentage=20 -XX:MaxRAMPercentage=65"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HOSTNAME: ${KC_HOSTNAME:-localhost}
      KC_HOSTNAME_PORT: ${KC_HOSTNAME_PORT:-8180}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
      UI_BASE_URL: ${UI_BASE_URL:-http://localhost:3000}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-11id}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MARTY_API_CLIENT_SECRET: ${MARTY_API_CLIENT_SECRET:-marty-api-secret-change-in-production}
      BAO_ADDR: ${KEYCLOAK_KMS_ADDR:?KEYCLOAK_KMS_ADDR must identify HTTPS OpenBao}
      BAO_CACERT: /run/secrets/openbao_tls_ca_cert
      BAO_TOKEN_FILE: /run/secrets/keycloak_signing_kms_token
      MARTY_KEYCLOAK_RS256_CERT_DIR: /run/secrets
      MARTY_KEYCLOAK_JWE_TOKEN_DIR: /run/secrets
      MARTY_KEYCLOAK_JWE_MOUNT: didcomm
      MARTY_KEYCLOAK_KMS_KEY_PREFIX: keycloak
      MARTY_KEYCLOAK_KMS_KEY_VERSION: ${KEYCLOAK_KMS_KEY_VERSION:?KEYCLOAK_KMS_KEY_VERSION must pin a remote Keycloak version}
    secrets:
      - openbao_tls_ca_cert
      - keycloak_signing_kms_token
      - source: keycloak_master_rs256_cert
        target: /run/secrets/keycloak-master-rs256.crt
      - source: keycloak_11id_rs256_cert
        target: /run/secrets/keycloak-11id-rs256.crt
      - source: keycloak_master_cookie_token
        target: /run/secrets/master-cookie.token
      - source: keycloak_master_ciba_token
        target: /run/secrets/master-ciba.token
      - source: keycloak_11id_cookie_token
        target: /run/secrets/11id-cookie.token
      - source: keycloak_11id_ciba_token
        target: /run/secrets/11id-ciba.token
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${MARTY_RUNTIME_CONFIG_ROOT:-.}/config/keycloak:/opt/keycloak/data/import:ro
      - ${MARTY_RUNTIME_CONFIG_ROOT:-.}/config/keycloak/themes:/opt/keycloak/themes:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /realms/${KEYCLOAK_REALM:-11id}/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - marty-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: ${MARTY_KEYCLOAK_MEMORY_LIMIT:-2g}
        reservations:
          cpus: '0.5'
          memory: 512M

  # One-shot configurator: patches Keycloak after realm import.
  # Resolves env vars (Google credentials, public domain redirect URIs, etc.)
  # that cannot be embedded in the realm JSON. Idempotent — safe to run on
  # every 'docker compose up'.
  keycloak-configurator:
    mem_limit: ${MARTY_KEYCLOAK_CONFIGURATOR_MEMORY_LIMIT:-512m}
    image: ghcr.io/elevenid/marty-ui-oss/keycloak@${KEYCLOAK_KMS_IMAGE_DIGEST:?KEYCLOAK_KMS_IMAGE_DIGEST must pin the remote-key Keycloak image}
    entrypoint: ["/bin/bash", "/scripts/setup-keycloak.sh"]
    environment:
      KC_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-11id}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-}
      UI_BASE_URL: ${UI_BASE_URL:-}
      MARTY_API_CLIENT_SECRET: ${MARTY_API_CLIENT_SECRET:-}
      MARTY_ORG_NAME: ${MARTY_ORG_NAME:-Marty}
      MARTY_ORG_DOMAIN: ${MARTY_ORG_DOMAIN:-beta.elevenidllc.com}
      MARTY_ORG_ADMIN_EMAIL: ${MARTY_ORG_ADMIN_EMAIL:-}
      DEMO_REVIEWER_EMAIL: ${DEMO_REVIEWER_EMAIL:-reviewer@marty.demo}
      DEMO_REVIEWER_FIRST_NAME: ${DEMO_REVIEWER_FIRST_NAME:-Review}
      DEMO_REVIEWER_LAST_NAME: ${DEMO_REVIEWER_LAST_NAME:-User}
      DEMO_REVIEWER_PASSWORD: ${DEMO_REVIEWER_PASSWORD:-}
      KEYCLOAK_USER_REGISTRATION_ENABLED: ${KEYCLOAK_USER_REGISTRATION_ENABLED:-true}
      KEYCLOAK_VERIFY_EMAIL: ${KEYCLOAK_VERIFY_EMAIL:-false}
      KEYCLOAK_RESET_PASSWORD_ENABLED: ${KEYCLOAK_RESET_PASSWORD_ENABLED:-true}
      KEYCLOAK_SOCIAL_LOGIN_ENABLED: ${KEYCLOAK_SOCIAL_LOGIN_ENABLED:-true}
      KEYCLOAK_SMTP_HOST: ${KEYCLOAK_SMTP_HOST:-mailpit}
      KEYCLOAK_SMTP_PORT: ${KEYCLOAK_SMTP_PORT:-1025}
      KEYCLOAK_SMTP_FROM: ${KEYCLOAK_SMTP_FROM:-noreply@marty.demo}
      KEYCLOAK_SMTP_FROM_DISPLAY_NAME: ${KEYCLOAK_SMTP_FROM_DISPLAY_NAME:-Marty Trust Services}
      KEYCLOAK_SMTP_SSL: ${KEYCLOAK_SMTP_SSL:-false}
      KEYCLOAK_SMTP_STARTTLS: ${KEYCLOAK_SMTP_STARTTLS:-false}
    volumes:
      - ${MARTY_RUNTIME_CONFIG_ROOT:-.}/scripts/setup-keycloak.sh:/scripts/setup-keycloak.sh:ro
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"
    networks:
      - marty-network

  mailpit:
    mem_limit: ${MARTY_MAILPIT_MEMORY_LIMIT:-512m}
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:9025:8025"
      - "127.0.0.1:2025:1025"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8025/livez"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - marty-network

  openbao:
    mem_limit: ${MARTY_OPENBAO_MEMORY_LIMIT:-512m}
    <<: *openbao_plugin_image
    cap_add:
      - IPC_LOCK
    ports:
      - "127.0.0.1:8200:8200"
    command: ["server", "-config=/bao/config/openbao.hcl"]
    depends_on:
      openbao-tls-init:
        condition: service_completed_successfully
    volumes:
      - openbao_data:/bao/data
      - ${MARTY_RUNTIME_CONFIG_ROOT:-.}/docker/openbao-selfhost.hcl:/bao/config/openbao.hcl:ro
    healthcheck:
      test: ["CMD-SHELL", "bao status -address=https://127.0.0.1:8200 -ca-cert=/bao/data/tls/ca.crt >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - marty-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: ${MARTY_OPENBAO_MEMORY_LIMIT:-512m}
        reservations:
          cpus: '0.25'
          memory: 128M

  openbao-tls-init:
    mem_limit: ${MARTY_OPENBAO_TLS_INIT_MEMORY_LIMIT:-512m}
    <<: *openbao_plugin_image
    entrypoint: ["/usr/local/bin/selfhost-tls-init"]
    volumes:
      - openbao_data:/bao/data
    network_mode: none
    restart: "no"

  openbao-init:
    mem_limit: ${MARTY_OPENBAO_INIT_MEMORY_LIMIT:-512m}
    <<: *openbao_plugin_image
    user: "0:0"
    entrypoint: ["/bin/sh", "/scripts/openbao-selfhost-init.sh"]
    environment:
      BAO_ADDR: "https://openbao:8200"
      BAO_CACERT: /bao/data/tls/ca.crt
      BAO_PUBLIC_CA_FILE: /bao/public-ca/ca.crt
      BAO_SERVICE_TOKEN_FILE: /bao/service-token/token
      BAO_BOOTSTRAP_TOKEN_FILE: /bao/bootstrap-token/token
      BAO_SIGNING_KEYS_TOKEN_FILE: /bao/signing-keys-token/token
      BAO_DIDCOMM_ISSUANCE_TOKEN_FILE: /bao/didcomm-issuance-token/token
      BAO_HAIP_TOKEN_FILE: /bao/haip-token/token
      BAO_HAIP_POLICY_FILE: /scripts/openbao-haip-workload-policy.hcl
      BAO_GRANT_TOKEN_DIR: /bao/grant-tokens
      DIDCOMM_KMS_PLUGIN_REQUIRED: "true"
      BAO_FLOW_GRANT_TOKEN_FILE: /bao/flow-grant/token
      BAO_VERIFY_GRANT_TOKEN_FILE: /bao/verify-grant/token
      BAO_GATEWAY_GRANT_TOKEN_FILE: /bao/gateway-grant/token
      BAO_GATEWAY_ISSUER_GRANT_TOKEN_FILE: /bao/gateway-grant/issuer-csr-token
      BAO_ISSUANCE_CREDENTIAL_GRANT_TOKEN_FILE: /bao/issuance-credential-grant/token
      BAO_ISSUANCE_CANVAS_GRANT_TOKEN_FILE: /bao/issuance-canvas-grant/token
      BAO_ISSUANCE_READINESS_GRANT_TOKEN_FILE: /bao/issuance-readiness-grant/token
      BAO_ISSUANCE_PASSPORT_GRANT_TOKEN_FILE: /bao/issuance-passport-grant/token
      BAO_NOTIFICATION_TOKEN_FILE: /bao/notification/token
    depends_on:
      openbao:
        condition: service_started
    volumes:
      - openbao_data:/bao/data
      - openbao_public_ca:/bao/public-ca
      - openbao_service_token:/bao/service-token
      - openbao_bootstrap_token:/bao/bootstrap-token
      - openbao_signing_keys_token:/bao/signing-keys-token
      - openbao_didcomm_issuance_token:/bao/didcomm-issuance-token
      - openbao_haip_token:/bao/haip-token
      - openbao_grant_tokens:/bao/grant-tokens
      - type: bind
        source: ${MARTY_RUNTIME_CONFIG_ROOT:-.}/docker/openbao-init.sh
        target: /scripts/openbao-init.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MARTY_RUNTIME_CONFIG_ROOT:-.}/docker/openbao-selfhost-init.sh
        target: /scripts/openbao-selfhost-init.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MARTY_RUNTIME_CONFIG_ROOT:-.}/docker/openbao-haip-workload-policy.hcl
        target: /scripts/openbao-haip-workload-policy.hcl
        read_only: true
        bind:
          create_host_path: false
      - openbao_flow_grant:/bao/flow-grant
      - openbao_verify_grant:/bao/verify-grant
      - openbao_gateway_grant:/bao/gateway-grant
      - openbao_issuance_credential_grant:/bao/issuance-credential-grant
      - openbao_issuance_canvas_grant:/bao/issuance-canvas-grant
      - openbao_issuance_readiness_grant:/bao/issuance-readiness-grant
      - openbao_issuance_passport_grant:/bao/issuance-passport-grant
      - openbao_notification:/bao/notification
    restart: "no"
    networks:
      - marty-network

  # ==========================================================================
  # Database Migrations
  # ==========================================================================
  # The canonical Rust revocation-profile service owns its schema. Run its
  # idempotent migrator before the remaining shared Alembic graph because the
  # credential-template history reads the revocation profile table.
  revocation-profile-migrate:
    mem_limit: ${MARTY_REVOCATION_PROFILE_MIGRATE_MEMORY_LIMIT:-1g}
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: revocation-profile
    environment:
      SERVICE_NAME: revocation_profile
      RP_MIGRATE_ONLY: "true"
      ENVIRONMENT: development
      DATABASE_URL: postgresql://marty:${MARTY_DB_PASSWORD:-marty_dev_password}@postgres:5432/marty
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      MARTY_ORG_ID: ${MARTY_ORG_ID:-00000000-0000-0000-0000-000000000001}
      RUST_LOG: ${REVOCATION_PROFILE_RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"
    networks:
      - marty-network

  db-migrate:
    mem_limit: ${MARTY_DB_MIGRATE_MEMORY_LIMIT:-1g}
    build:
      context: .
      dockerfile: services/Dockerfile.migrations
    environment:
      MARTY_DB_PASSWORD: ${MARTY_DB_PASSWORD:-marty_dev_password}
      DATABASE_URL: postgresql://marty:${MARTY_DB_PASSWORD:-marty_dev_password}@postgres:5432/marty
      MARTY_ORG_ID: ${MARTY_ORG_ID:-00000000-0000-0000-0000-000000000001}
      MARTY_ORG_SLUG: ${MARTY_ORG_SLUG:-marty}
      MARTY_ISSUER_DID: ${MARTY_ISSUER_DID:-}
      MARTY_ORG_ADMIN_EMAIL: ${MARTY_ORG_ADMIN_EMAIL:-}
      MARTY_ORG_REVIEWER_EMAIL: ${MARTY_ORG_REVIEWER_EMAIL:-reviewer@marty.demo}
      MARTY_MIGRATION_PROFILE: ${MARTY_MIGRATION_PROFILE:-dev}
      MARTY_USE_EXPLICIT_DEMO_SEED_PACK: ${MARTY_USE_EXPLICIT_DEMO_SEED_PACK:-false}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      ISSUER_BASE_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      REDIS_URL: redis://redis:6379
      REDIS_DB_GATEWAY: "2"
      MARTY_KMS_BOOTSTRAP_ENABLED: ${MARTY_KMS_BOOTSTRAP_ENABLED:-true}
      BAO_ADDR: https://openbao:8200
      BAO_CACERT: /bao/public-ca/ca.crt
      BAO_TOKEN_FILE: /bao/bootstrap-token/token
      NOTIFICATION_OPENBAO_TOKEN_FILE: /bao/notification/token
      NOTIFICATION_OPENBAO_CA_CERT_FILE: /bao/public-ca/ca.crt
    volumes:
      - openbao_public_ca:/bao/public-ca:ro
      - openbao_bootstrap_token:/bao/bootstrap-token:ro
      - openbao_notification:/bao/notification:ro
    depends_on:
      revocation-profile-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      openbao:
        condition: service_healthy
      openbao-init:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - marty-network

  # Run the native issuance migrator from the same Rust build as the API.
  issuance-migrations:
    mem_limit: ${MARTY_ISSUANCE_MIGRATIONS_MEMORY_LIMIT:-1g}
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: issuance-native
    entrypoint: ["/usr/local/bin/marty-issuance-service"]
    command: ["migrate"]
    environment:
      SERVICE_NAME: issuance_native
      DATABASE_URL: postgresql://marty:${MARTY_DB_PASSWORD:-marty_dev_password}@postgres:5432/marty
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      organization:
        condition: service_healthy
      credential-template:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"
    networks:
      - marty-network

  # The canonical verification image owns the released compatibility schema.
  # Use the same Rust artifact for migration and runtime so they cannot drift.
  verification-migrations:
    mem_limit: ${MARTY_VERIFICATION_MIGRATIONS_MEMORY_LIMIT:-1g}
    build:
      context: .
      dockerfile: rust/services/Dockerfile.ci
      target: verification
      args:
        MARTY_RELEASE_VERSION: ${MARTY_RELEASE_VERSION:-development}
        MARTY_UI_SHA: ${MARTY_UI_SHA:-unknown}
    command: ["migrate"]
    environment:
      DATABASE_URL: postgresql://marty:${MARTY_DB_PASSWORD:-marty_dev_password}@postgres:5432/marty
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    restart: "no"
    networks:
      - marty-network

  # ==========================================================================
  # Application Services
  # ==========================================================================
  gateway:
    mem_limit: ${MARTY_GATEWAY_MEMORY_LIMIT:-512m}
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: gateway
    environment:
      <<: *native_issuance_grpc_auth
      GATEWAY_PORT: "8000"
      AUTH_SERVICE_URL: http://auth:8001
      ORGANIZATION_SERVICE_URL: http://organization:8002
      CREDENTIAL_TEMPLATE_SERVICE_URL: http://credential-template:8003
      TRUST_PROFILE_SERVICE_URL: http://trust-profile:8004
      APPLICANT_SERVICE_URL: http://applicant:8006
      NOTIFICATION_SERVICE_URL: http://notification:8007
      COMPLIANCE_PROFILE_SERVICE_URL: http://compliance-profile:8008
      PRESENTATION_POLICY_SERVICE_URL: http://presentation-policy:8009
      DEPLOYMENT_PROFILE_SERVICE_URL: http://deployment-profile:8010
      SIGNING_KEYS_SERVICE_URL: http://signing-keys:8017
      FLOW_SERVICE_URL: http://flow:8011
      VERIFICATION_SERVICE_URL: http://verification:8012
      DEVICE_REGISTRATION_SERVICE_URL: http://device-registration:8014
      DEVICE_REGISTRATION_GATEWAY_KEY: ${DEVICE_REGISTRATION_GATEWAY_KEY:-dev-device-registration-gateway-key-change-me}
      ISSUANCE_SERVICE_URL: http://issuance:8005
      ISSUANCE_NATIVE_SERVICE_URL: http://issuance-native:8005
      GATEWAY_REQUIRED_READY_SERVICES: auth,organizations,credential-templates,trust-profiles,presentation-policies,deployment-profiles,signing-keys,flows,issuance,issuance-native
      REVOCATION_PROFILE_SERVICE_URL: http://revocation-profile:8013
      ISSUER_BASE_URL: ${PUBLIC_API_URL:-http://gateway:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      AUTH_GRPC_TARGET: auth:9001
      ORG_GRPC_TARGET: organization:9002
      ES_GRPC_TARGET: event-stream:9015
      REDIS_URL: redis://redis:6379
      REDIS_DB_GATEWAY: "2"
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-0}
      MARTY_RELEASE_VERSION: ${MARTY_RELEASE_VERSION:-development}
      MARTY_UI_SHA: ${MARTY_UI_SHA:-unknown}
      ELEVENID_STACK_VERSION: ${ELEVENID_STACK_VERSION:-development}
      ELEVENID_COMPONENT_REVISIONS_JSON: ${ELEVENID_COMPONENT_REVISIONS_JSON:-}
      ELEVENID_IMAGE_DIGESTS_JSON: ${ELEVENID_IMAGE_DIGESTS_JSON:-}
      ISSUANCE_API_KEY: ${ISSUANCE_API_KEY:-dev-issuance-api-key}
      PASSPORT_NATIVE_GATEWAY_ENABLED: ${PASSPORT_NATIVE_GATEWAY_ENABLED:-false}
      PASSPORT_PROVIDER_INGRESS_GATEWAY_ENABLED: ${PASSPORT_PROVIDER_INGRESS_GATEWAY_ENABLED:-false}
      PASSPORT_INTERNAL_SERVICE_AUTH_ENABLED: ${PASSPORT_INTERNAL_SERVICE_AUTH_ENABLED:-false}
      PASSPORT_TENANT_API_KEYS: ${PASSPORT_TENANT_API_KEYS:-}
      PASSPORT_TENANT_API_KEYS_FILE: ${PASSPORT_TENANT_API_KEYS_FILE:-}
      SIGNING_KEYS_INTERNAL_API_KEY: ${SIGNING_KEYS_INTERNAL_API_KEY:-dev-signing-keys-internal-api-key}
      SIGNING_KEYS_SERVICE_SIGN_GATEWAY_KEY: ${SIGNING_KEYS_SERVICE_SIGN_GATEWAY_KEY:-dev-signing-keys-service-sign-gateway-key}
