  envoy_issuance_tls_kms_token:
    file: ${ENVOY_ISSUANCE_TLS_KMS_TOKEN_FILE:?ENVOY_ISSUANCE_TLS_KMS_TOKEN_FILE must be set}
  flow_workload_client_cert:
    file: ${FLOW_WORKLOAD_CLIENT_CERT_FILE:?FLOW_WORKLOAD_CLIENT_CERT_FILE must be set}
  flow_client_tls_kms_token:
