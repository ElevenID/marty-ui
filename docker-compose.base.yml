  signing_keys_tls_kms_token:
    file: ${SIGNING_KEYS_TLS_KMS_TOKEN_FILE:?SIGNING_KEYS_TLS_KMS_TOKEN_FILE must be set}
  workload_identity_ca_cert:
    file: ${MARTY_WORKLOAD_IDENTITY_CA_CERT_FILE:?MARTY_WORKLOAD_IDENTITY_CA_CERT_FILE must be set}
  issuance_workload_server_cert:
