# Mount only the reference-only authcrypt policy. The base HTTPS Raft graph
# provisions the scoped DIDComm token and public KMS CA for native Issuance.
x-native-issuance-policy: &native-issuance-policy
  environment:
    DIDCOMM_ENCRYPTION_POLICY_FILE: /run/secrets/didcomm-authcrypt/didcomm-encryption-policy.json
  volumes:
    - type: bind
      source: ${DIDCOMM_ENCRYPTION_POLICY_DIR:?set DIDCOMM_ENCRYPTION_POLICY_DIR to an exact policy directory}/didcomm-encryption-policy.json
      target: /run/secrets/didcomm-authcrypt/didcomm-encryption-policy.json
      read_only: true
      bind:
        create_host_path: false

services:
  issuance-native:
    <<: *native-issuance-policy
    depends_on:
      openbao-init:
        condition: service_completed_successfully
