---
# ========================================================
# Kubernetes self-host reference ConfigMap
# Non-sensitive environment config shared by the runtime and migration job.
# ========================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: marty-config
  namespace: marty-prod
  labels:
    app.kubernetes.io/part-of: marty-platform
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  # Internal traffic is confined to the cluster network and authenticated with
  # GRPC_SERVICE_TOKEN. Configure GRPC TLS certificates to remove this override.
  GRPC_INSECURE_ALLOWED: "true"

  PUBLIC_DOMAIN: "${PUBLIC_DOMAIN}"
  UI_BASE_URL: "${UI_BASE_URL}"
  UI_ADDITIONAL_BASE_URLS: "${UI_ADDITIONAL_BASE_URLS}"
  PUBLIC_API_URL: "${PUBLIC_API_URL}"
  MARTY_ORG_ID: "${MARTY_ORG_ID}"
  MARTY_ORG_SLUG: "${MARTY_ORG_SLUG}"
  MARTY_ISSUER_DID: "${MARTY_ISSUER_DID}"

  KEYCLOAK_REALM: "${KEYCLOAK_REALM}"
  KEYCLOAK_KMS_ADDR: "${KEYCLOAK_KMS_ADDR}"
  KEYCLOAK_KMS_KEY_VERSION: "${KEYCLOAK_KMS_KEY_VERSION}"
  KC_HOSTNAME: "${KC_HOSTNAME}"
  OIDC_CLIENT_ID: "${OIDC_CLIENT_ID}"
  OIDC_ISSUER_URL: "http://keycloak:8080/realms/${KEYCLOAK_REALM}"
  OIDC_EXTERNAL_ISSUER_URL: "${OIDC_ISSUER_URL_EXTERNAL}"
  OIDC_REDIRECT_URI: "${OIDC_REDIRECT_URI}"
  OIDC_POST_LOGOUT_REDIRECT_URI: "${OIDC_POST_LOGOUT_REDIRECT_URI}"
  KEYCLOAK_ADMIN_URL: "http://keycloak:8080"

  COOKIE_SECURE: "true"
  COOKIE_SAMESITE: "${COOKIE_SAMESITE}"
  SESSION_TTL_SECONDS: "86400"
  AUTH_SERVICE_INTERNAL_URL: "http://auth:8001"
  FLOW_CALLBACK_DESTINATIONS: "${MARTY_ORG_ID}|http://auth:8001/internal/v1/auth/credential-verified?nonce=__MARTY_TOKEN__"

  AUTH_SERVICE_URL: "http://auth:8001"
  ORGANIZATION_SERVICE_URL: "http://organization:8002"
  CREDENTIAL_TEMPLATE_SERVICE_URL: "http://credential-template:8003"
  TRUST_PROFILE_SERVICE_URL: "http://trust-profile:8004"
  ISSUANCE_SERVICE_URL: "http://issuance:8005"
  # Recovery-mode alias: selected rendering overrides this exact consumer key.
  ISSUANCE_NATIVE_SERVICE_URL: "http://issuance-native:8005"
  PERSONALIZATION_BUREAU_PROVIDER_PROFILE_ID: ""
  PASSPORT_PROVIDER_HMAC_KEY_VERSION: "1"
  PASSPORT_PROVIDER_INGRESS_GATEWAY_ENABLED: "false"
  PASSPORT_PROVIDER_INGRESS_SERVICE_URL: ""
  # Passport owner selection is opt-in after native image, provider and rollback acceptance.
  PASSPORT_NATIVE_GATEWAY_ENABLED: "false"
  PASSPORT_NATIVE_FLOW_ENABLED: "false"
  PASSPORT_NATIVE_HTTP_ENABLED: "false"
  PASSPORT_INTERNAL_SERVICE_AUTH_ENABLED: "false"
  PASSPORT_MANAGED_ISSUER_SIGNING_ENABLED: "false"
  PASSPORT_KMS_ARTIFACTS_ENABLED: "false"
  PASSPORT_KMS_CALLBACKS_ENABLED: "false"
  PERSONALIZATION_BUREAU_URL: ""
  APPLICANT_SERVICE_URL: "http://applicant:8006"
  NOTIFICATION_SERVICE_URL: "http://notification:8007"
  COMPLIANCE_PROFILE_SERVICE_URL: "http://compliance-profile:8008"
  PRESENTATION_POLICY_SERVICE_URL: "http://presentation-policy:8009"
  DEPLOYMENT_PROFILE_SERVICE_URL: "http://deployment-profile:8010"
  FLOW_SERVICE_URL: "http://flow:8011"
  VERIFICATION_SERVICE_URL: "http://verification:8012"
  REVOCATION_PROFILE_SERVICE_URL: "http://revocation-profile:8013"
  DEVICE_REGISTRATION_SERVICE_URL: "http://device-registration:8014"
  SIGNING_KEYS_SERVICE_URL: "http://signing-keys:8017"
  ES_GRPC_TARGET: "https://event-stream:9015"

  CORS_ORIGINS: "${CORS_ORIGINS}"

  POSTGRES_DB: "marty"
  POSTGRES_USER: "marty"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  KEYCLOAK_DB: "keycloak"
  KEYCLOAK_DB_USER: "keycloak"

  REDIS_URL: "redis://redis:6379/0"
  REDIS_DB_GATEWAY: "2"

  NOTIFICATION_WEBHOOK_OUTBOX_RETENTION_SECONDS: "86400"
  NOTIFICATION_WEBHOOK_OUTBOX_LEASE_SECONDS: "30"
  NOTIFICATION_WEBHOOK_OUTBOX_POLL_MILLISECONDS: "1000"
  NOTIFICATION_WEBHOOK_OUTBOX_BATCH_SIZE: "25"

  RABBITMQ_USER: "marty"
  RABBITMQ_VHOST: "/"

  SMTP_HOST: "${SMTP_HOST}"
  SMTP_PORT: "${SMTP_PORT}"

  CREDENTIAL_LOGIN_POLICY_ID: "${CREDENTIAL_LOGIN_POLICY_ID}"
  CREDENTIAL_LOGIN_TRUST_PROFILE_ID: "${CREDENTIAL_LOGIN_TRUST_PROFILE_ID}"
  CREDENTIAL_LOGIN_ISSUER_DID: "${MARTY_ISSUER_DID}"
  BAO_ADDR: "${BAO_ADDR}"
  SIGNING_KEYS_TLS_KMS_ADDR: "${SIGNING_KEYS_TLS_KMS_ADDR}"
  SIGNING_KEYS_TLS_KMS_KEY_NAME: "${SIGNING_KEYS_TLS_KMS_KEY_NAME}"
  SIGNING_KEYS_TLS_KMS_KEY_VERSION: "${SIGNING_KEYS_TLS_KMS_KEY_VERSION}"
  ORG_TLS_KMS_ADDR: "${ORG_TLS_KMS_ADDR}"
  ORG_TLS_KMS_KEY_NAME: "${ORG_TLS_KMS_KEY_NAME}"
  ORG_TLS_KMS_KEY_VERSION: "${ORG_TLS_KMS_KEY_VERSION}"
  ES_TLS_KMS_ADDR: "${ES_TLS_KMS_ADDR}"
  ES_TLS_KMS_KEY_NAME: "${ES_TLS_KMS_KEY_NAME}"
  ES_TLS_KMS_KEY_VERSION: "${ES_TLS_KMS_KEY_VERSION}"
  RP_TLS_KMS_ADDR: "${RP_TLS_KMS_ADDR}"
  RP_TLS_KMS_KEY_NAME: "${RP_TLS_KMS_KEY_NAME}"
  RP_TLS_KMS_KEY_VERSION: "${RP_TLS_KMS_KEY_VERSION}"
  CT_TLS_KMS_ADDR: "${CT_TLS_KMS_ADDR}"
  CT_TLS_KMS_KEY_NAME: "${CT_TLS_KMS_KEY_NAME}"
  CT_TLS_KMS_KEY_VERSION: "${CT_TLS_KMS_KEY_VERSION}"
  PP_TLS_KMS_ADDR: "${PP_TLS_KMS_ADDR}"
  PP_TLS_KMS_KEY_NAME: "${PP_TLS_KMS_KEY_NAME}"
  PP_TLS_KMS_KEY_VERSION: "${PP_TLS_KMS_KEY_VERSION}"
  AUTH_TLS_KMS_ADDR: "${AUTH_TLS_KMS_ADDR}"
  AUTH_TLS_KMS_KEY_NAME: "${AUTH_TLS_KMS_KEY_NAME}"
  AUTH_TLS_KMS_KEY_VERSION: "${AUTH_TLS_KMS_KEY_VERSION}"
  AUTH_SERVER_TLS_KMS_ADDR: "${AUTH_SERVER_TLS_KMS_ADDR}"
  AUTH_SERVER_TLS_KMS_KEY_NAME: "${AUTH_SERVER_TLS_KMS_KEY_NAME}"
  AUTH_SERVER_TLS_KMS_KEY_VERSION: "${AUTH_SERVER_TLS_KMS_KEY_VERSION}"
  GATEWAY_TLS_KMS_ADDR: "${GATEWAY_TLS_KMS_ADDR}"
  GATEWAY_TLS_KMS_KEY_NAME: "${GATEWAY_TLS_KMS_KEY_NAME}"
  GATEWAY_TLS_KMS_KEY_VERSION: "${GATEWAY_TLS_KMS_KEY_VERSION}"
  ISSUANCE_TLS_KMS_ADDR: "${ISSUANCE_TLS_KMS_ADDR}"
  ISSUANCE_TLS_KMS_KEY_NAME: "${ISSUANCE_TLS_KMS_KEY_NAME}"
  ISSUANCE_TLS_KMS_KEY_VERSION: "${ISSUANCE_TLS_KMS_KEY_VERSION}"
  VERIFICATION_TLS_KMS_ADDR: "${VERIFICATION_TLS_KMS_ADDR}"
  VERIFICATION_TLS_KMS_KEY_NAME: "${VERIFICATION_TLS_KMS_KEY_NAME}"
  VERIFICATION_TLS_KMS_KEY_VERSION: "${VERIFICATION_TLS_KMS_KEY_VERSION}"
  DEPLOYMENT_PROFILE_TLS_KMS_ADDR: "${DEPLOYMENT_PROFILE_TLS_KMS_ADDR}"
  DEPLOYMENT_PROFILE_TLS_KMS_KEY_NAME: "${DEPLOYMENT_PROFILE_TLS_KMS_KEY_NAME}"
  DEPLOYMENT_PROFILE_TLS_KMS_KEY_VERSION: "${DEPLOYMENT_PROFILE_TLS_KMS_KEY_VERSION}"
  COMPLIANCE_PROFILE_TLS_KMS_ADDR: "${COMPLIANCE_PROFILE_TLS_KMS_ADDR}"
  COMPLIANCE_PROFILE_TLS_KMS_KEY_NAME: "${COMPLIANCE_PROFILE_TLS_KMS_KEY_NAME}"
  COMPLIANCE_PROFILE_TLS_KMS_KEY_VERSION: "${COMPLIANCE_PROFILE_TLS_KMS_KEY_VERSION}"
  FLOW_CLIENT_TLS_KMS_ADDR: "${FLOW_CLIENT_TLS_KMS_ADDR}"
  FLOW_CLIENT_TLS_KMS_KEY_NAME: "${FLOW_CLIENT_TLS_KMS_KEY_NAME}"
  FLOW_CLIENT_TLS_KMS_KEY_VERSION: "${FLOW_CLIENT_TLS_KMS_KEY_VERSION}"
  FLOW_SERVER_TLS_KMS_ADDR: "${FLOW_SERVER_TLS_KMS_ADDR}"
  FLOW_SERVER_TLS_KMS_KEY_NAME: "${FLOW_SERVER_TLS_KMS_KEY_NAME}"
  FLOW_SERVER_TLS_KMS_KEY_VERSION: "${FLOW_SERVER_TLS_KMS_KEY_VERSION}"
  MARTY_KMS_BOOTSTRAP_ENABLED: "${MARTY_KMS_BOOTSTRAP_ENABLED}"
  UNIVERSAL_RESOLVER_URL: "${UNIVERSAL_RESOLVER_URL}"

  MARTY_MIGRATION_PROFILE: "${MARTY_MIGRATION_PROFILE}"
  MARTY_ORG_ADMIN_EMAIL: "${MARTY_ORG_ADMIN_EMAIL}"
  ORGANIZATION_CREATION_ENABLED: "${ORGANIZATION_CREATION_ENABLED}"
  KEYCLOAK_REMOVE_DEMO_USERS: "${KEYCLOAK_REMOVE_DEMO_USERS}"
  RATE_LIMIT_RPM: "${RATE_LIMIT_RPM}"
