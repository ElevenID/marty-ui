# ElevenID LLC Keycloak Theme
# Extends the default Keycloak theme with custom styling

parent=keycloak
import=common/keycloak

# Add custom CSS
styles=css/auth-layout.css css/marty.css

# Supported locales
locales=en,de,nl,ja,es,fr

# Optional navigation when the identity provider has a separate public origin.
# Empty homeUrl keeps the registered client base URL as the default.
homeUrl=${env.ELEVENID_AUTH_HOME_URL:}

# The credential option can remain hidden until its application endpoint is ready.
# Same-origin installations retain their existing default endpoint.
credentialLoginEnabled=${env.ELEVENID_CREDENTIAL_LOGIN_ENABLED:true}
credentialLoginUrl=${env.ELEVENID_CREDENTIAL_LOGIN_URL:/v1/auth/credential-login}
