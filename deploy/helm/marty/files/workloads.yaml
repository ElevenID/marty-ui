# Runtime env, Secret projections and probes adapted from k8s/oracle.
gateway:
  serviceName: gateway
  ports:
  - containerPort: 8000
  env:
  - name: GRPC_SERVICE_TOKEN
    valueFrom:
      secretKeyRef:
        name: marty-secrets
        key: GRPC_SERVICE_TOKEN
  - name: DEVICE_REGISTRATION_GATEWAY_KEY
    valueFrom:
      secretKeyRef:
        name: marty-secrets
        key: DEVICE_REGISTRATION_GATEWAY_KEY
  - name: GATEWAY_PORT
    value: '8000'
  - name: GATEWAY_SIGN_GRANT_MINT_TOKEN_FILE
    value: /var/run/secrets/marty/gateway-sign-grant/token
  - name: GATEWAY_ISSUER_CSR_GRANT_MINT_TOKEN_FILE
    value: /var/run/secrets/marty/gateway-issuer-csr-grant/token
  - name: AUTH_GRPC_TARGET
    value: https://auth:9001
  - name: GRPC_INSECURE_ALLOWED
    value: 'false'
  - name: GRPC_TLS_CA_CERT
    value: /var/run/secrets/marty/org-workload/ca.crt
  - name: GRPC_WORKLOAD_TLS_CLIENT_CERT
    value: /var/run/secrets/marty/gateway-auth-tls/tls.crt
  - name: GRPC_WORKLOAD_TLS_CA_CERT
    value: /var/run/secrets/marty/gateway-auth-tls/ca.crt
  - name: GRPC_WORKLOAD_TLS_CLIENT_KMS_ADDR
    valueFrom:
      configMapKeyRef:
        name: marty-config
        key: GATEWAY_TLS_KMS_ADDR
  - name: GRPC_WORKLOAD_TLS_CLIENT_KMS_CA_CERT
    value: /var/run/secrets/marty/gateway-auth-kms/ca.crt
  - name: GRPC_WORKLOAD_TLS_CLIENT_KMS_TOKEN_FILE
    value: /var/run/secrets/marty/gateway-auth-kms/token
  - name: GRPC_WORKLOAD_TLS_CLIENT_KMS_KEY_NAME
    valueFrom:
      configMapKeyRef:
        name: marty-config
        key: GATEWAY_TLS_KMS_KEY_NAME
  - name: GRPC_WORKLOAD_TLS_CLIENT_KMS_KEY_VERSION
    valueFrom:
      configMapKeyRef:
        name: marty-config
        key: GATEWAY_TLS_KMS_KEY_VERSION
  - name: ORG_GRPC_TARGET
    value: https://organization:9002
  - name: ORG_GRPC_CA_CERT
    value: /var/run/secrets/marty/org-workload/ca.crt
  - name: ES_GRPC_TARGET
    value: https://event-stream:9015
  - name: ES_GRPC_CA_CERT
    value: /var/run/secrets/marty/org-workload/ca.crt
  - name: ISSUANCE_API_KEY
    valueFrom:
      secretKeyRef:
        name: marty-secrets
        key: ISSUANCE_API_KEY
  - name: OID4VP_ISSUER_DID
    valueFrom:
      configMapKeyRef:
        name: marty-config
        key: MARTY_ISSUER_DID
  - name: SIGNING_KEYS_INTERNAL_URL
    value: http://gateway:8000/internal/signing-keys
  - name: SIGNING_KEYS_INTERNAL_API_KEY
    valueFrom:
      secretKeyRef:
        name: marty-secrets
        key: SIGNING_KEYS_INTERNAL_API_KEY
  - name: SIGNING_KEYS_SERVICE_SIGN_GATEWAY_KEY
    valueFrom:
      secretKeyRef:
        name: marty-secrets
        key: SIGNING_KEYS_SERVICE_SIGN_GATEWAY_KEY
  - name: SIGNING_KEYS_ISSUER_SIGN_KEY
    valueFrom:
      secretKeyRef:
        name: marty-secrets
        key: SIGNING_KEYS_ISSUER_SIGN_KEY
  - name: ISSUER_BASE_URL
    valueFrom:
      configMapKeyRef:
        name: marty-config
        key: PUBLIC_API_URL
  - name: BAO_CACERT
    value: /var/run/secrets/marty/gateway-auth-kms/ca.crt
  volumeMounts:
  - name: gateway-auth-tls
    mountPath: /var/run/secrets/marty/gateway-auth-tls
    readOnly: true
  - name: gateway-auth-kms
    mountPath: /var/run/secrets/marty/gateway-auth-kms
    readOnly: true
  - name: org-workload-tls
    mountPath: /var/run/secrets/marty/org-workload
    readOnly: true
  - name: gateway-sign-grant
    mountPath: /var/run/secrets/marty/gateway-sign-grant
    readOnly: true
  - name: gateway-issuer-csr-grant
    mountPath: /var/run/secrets/marty/gateway-issuer-csr-grant
    readOnly: true
  volumes:
  - name: gateway-auth-tls
    secret:
      secretName: gateway-auth-tls
  - name: gateway-auth-kms
    secret:
      secretName: gateway-auth-kms
  - name: org-workload-tls
    secret:
      secretName: org-workload-tls
  - name: gateway-sign-grant
    secret:
      secretName: marty-secrets
      items:
      - key: GATEWAY_SIGN_GRANT_MINT_TOKEN
        path: token
  - name: gateway-issuer-csr-grant
    secret:
      secretName: marty-secrets
      items:
      - key: GATEWAY_ISSUER_CSR_GRANT_MINT_TOKEN
        path: token
  readinessProbe:
    httpGet:
      path: /health/ready
      port: 8000
    periodSeconds: 10
    timeoutSeconds: 5
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    periodSeconds: 15
    timeoutSeconds: 5
