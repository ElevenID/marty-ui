        key: AUTH_SERVER_TLS_KMS_KEY_VERSION
  - name: GRPC_WORKLOAD_TLS_CA_CERT
    value: /var/run/secrets/marty/workload/ca.crt
  - name: AUTH_SERVICE_PORT
