{{- $development := .Values.ui.development | default dict -}}
{{- if $development.enabled -}}
{{- $checkout := required "ui.development.checkoutPath must name an existing dedicated source checkout on the node" .Values.ui.development.checkoutPath -}}
{{- if or (not (regexMatch "^/[a-zA-Z0-9._/-]+$" $checkout)) (regexMatch "/\\.\\.?(/|$)|//|/$" $checkout) -}}
{{- fail "ui.development.checkoutPath must be an absolute checkout path without traversal or trailing slash" -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-prod-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "marty.labels" . | nindent 4 }}
data:
  default.conf: |
    {{- include "marty.nginx" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "marty.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ui
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "marty.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: ui
      annotations:
        {{- include "marty.podAnnotations" . | nindent 8 }}
        checksum/nginx: {{ include "marty.nginx" . | sha256sum | quote }}
    spec:
      {{- include "marty.podSettings" . | nindent 6 }}
      {{- if $development.enabled }}
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: ui-dev-install
          {{- include "marty.uiDevelopmentContainer" . | nindent 10 }}
          command: [npm, ci, --include=dev, --no-audit, --no-fund]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
      {{- end }}
      containers:
        - name: ui
          image: {{ include "marty.image" (dict "root" . "role" "ui") | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: ORGANIZATION_CREATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: marty-config
                  key: ORGANIZATION_CREATION_ENABLED
          ports:
            - name: http
              containerPort: 80
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /edge-healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /edge-healthz
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
        {{- if $development.enabled }}
        - name: ui-dev
          {{- include "marty.uiDevelopmentContainer" . | nindent 10 }}
          command: [npm, run, dev, --, --host, 127.0.0.1, --port, '3000', --strictPort]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 2048Mi
          startupProbe:
            exec:
              command: [node, -e, "fetch('http://127.0.0.1:3000/@vite/client').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [node, -e, "fetch('http://127.0.0.1:3000/@vite/client').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
            periodSeconds: 10
            timeoutSeconds: 4
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: nginx-prod-config
        {{- if $development.enabled }}
        - name: ui-dev-source
          hostPath:
            path: {{ printf "%s/ui" .Values.ui.development.checkoutPath | quote }}
            type: Directory
        - name: ui-dev-contracts
          hostPath:
            path: {{ printf "%s/contracts" .Values.ui.development.checkoutPath | quote }}
            type: Directory
        - name: ui-dev-dependencies
          emptyDir:
            sizeLimit: 4Gi
        - name: ui-dev-tmp
          emptyDir:
            sizeLimit: 1Gi
        {{- end }}
