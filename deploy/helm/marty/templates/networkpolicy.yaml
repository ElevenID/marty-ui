{{- if .Values.networkPolicy.enabled }}
# Redis and PostgreSQL are private to this namespace. Application HTTP/gRPC
# peers retain their existing authentication; ingress reaches only the UI edge.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: marty-internal
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "marty.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: NotIn
        values: [ui]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: marty-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "marty.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: ui
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace | quote }}
      ports:
        - protocol: TCP
          port: 80
{{- end }}
