apiVersion: v1
kind: ServiceAccount
metadata:
  name: marty-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "marty.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: marty-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "marty.labels" . | nindent 4 }}
data:
  {{- include "marty.configData" . | nindent 2 }}
