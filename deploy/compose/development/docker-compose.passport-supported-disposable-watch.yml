# Local development override. Never use this file for protected evidence.
services:
  issuance-migrations:
    image: ${PASSPORT_WATCH_IMAGE:?prepare the local watcher image first}
    pull_policy: never
    build:
      context: .
      dockerfile: services/Dockerfile.passport-watch
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -eu
        python3 /workspace/scripts/passport_watch_prepare.py --check-seed
        . /workspace/scripts/load-secrets-env.sh
        cd /workspace/rust
        exec cargo run --locked --offline -p marty-issuance-service --bin marty-issuance-service -- migrate
    environment:
      CARGO_TARGET_DIR: /cargo-target
      CARGO_BUILD_JOBS: "1"
      CARGO_NET_OFFLINE: "true"
      PASSPORT_WATCH_SEED_ID: ${PASSPORT_WATCH_SEED_ID:?bind the prepared dependency seed}
      PASSPORT_WATCH_LOCK_SHA256: ${PASSPORT_WATCH_LOCK_SHA256:?bind the prepared Cargo lock}
      RUSTFLAGS: -C debuginfo=0
    cpus: 1.0
    mem_limit: 4g
    memswap_limit: 4g
    volumes:
      - .:/workspace:ro
      - passport_watch_target:/cargo-target
      - passport_watch_registry:/usr/local/cargo/registry
      - passport_watch_git:/usr/local/cargo/git

  issuance-native:
    image: ${PASSPORT_WATCH_IMAGE:?prepare the local watcher image first}
    pull_policy: never
    build:
      context: .
      dockerfile: services/Dockerfile.passport-watch
    entrypoint: ["/bin/bash", "/workspace/scripts/passport-rust-watch.sh"]
    command: []
    environment:
      CARGO_TARGET_DIR: /cargo-target
      CARGO_BUILD_JOBS: "1"
      CARGO_NET_OFFLINE: "true"
      PASSPORT_WATCH_SEED_ID: ${PASSPORT_WATCH_SEED_ID:?bind the prepared dependency seed}
      PASSPORT_WATCH_LOCK_SHA256: ${PASSPORT_WATCH_LOCK_SHA256:?bind the prepared Cargo lock}
      RUSTFLAGS: -C debuginfo=0
    cpus: 1.0
    mem_limit: 4g
    memswap_limit: 4g
    volumes:
      - .:/workspace:ro
      - passport_watch_target:/cargo-target
      - passport_watch_registry:/usr/local/cargo/registry
      - passport_watch_git:/usr/local/cargo/git
    networks: [private, ingress]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8005/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30m

volumes:
  passport_watch_target:
    labels:
      com.marty.passport.watch.seed: ${PASSPORT_WATCH_SEED_ID:?bind the prepared dependency seed}
  passport_watch_registry:
    labels:
      com.marty.passport.watch.seed: ${PASSPORT_WATCH_SEED_ID:?bind the prepared dependency seed}
  passport_watch_git:
    labels:
      com.marty.passport.watch.seed: ${PASSPORT_WATCH_SEED_ID:?bind the prepared dependency seed}
