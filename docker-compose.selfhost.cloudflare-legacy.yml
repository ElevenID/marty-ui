# Explicit compatibility overlay for the existing selfhost Cloudflare deployment.
# Merge after docker-compose.selfhost.prod.yml; --profile beta-tunnel enables beta.
services:
  cloudflared:
    mem_limit: ${MARTY_CLOUDFLARED_MEMORY_LIMIT:-512m}
    build:
      context: .
      dockerfile: docker/cloudflared-wrapper.Dockerfile
    entrypoint: ["/bin/sh", "/scripts/cloudflared-selfhost.sh"]
    environment:
      CLOUDFLARE_TUNNEL_TOKEN_FILE: /run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    volumes:
      - ./scripts/cloudflared-selfhost.sh:/scripts/cloudflared-selfhost.sh:ro
    depends_on:
      edge:
        condition: service_healthy
    restart: unless-stopped

  tunnel-nginx-proxy:
    mem_limit: ${MARTY_TUNNEL_NGINX_PROXY_MEMORY_LIMIT:-512m}
    profiles: ["beta-tunnel"]
    image: nginx:alpine
    volumes:
      - ./docker/tunnel-nginx-proxy.edge.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      edge:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  cloudflared-beta:
    mem_limit: ${MARTY_CLOUDFLARED_BETA_MEMORY_LIMIT:-512m}
    profiles: ["beta-tunnel"]
    build:
      context: .
      dockerfile: docker/cloudflared-wrapper.Dockerfile
    entrypoint: ["/bin/sh", "/scripts/cloudflared-selfhost.sh"]
    environment:
      CLOUDFLARE_TUNNEL_TOKEN_FILE: /run/secrets/cloudflare_beta_tunnel_token
    secrets:
      - cloudflare_beta_tunnel_token
    volumes:
      - ./scripts/cloudflared-selfhost.sh:/scripts/cloudflared-selfhost.sh:ro
    depends_on:
      tunnel-nginx-proxy:
        condition: service_healthy
    restart: unless-stopped

secrets:
  cloudflare_tunnel_token:
    file: ${SELFHOST_SECRET_DIR:?SELFHOST_SECRET_DIR must be set}/cloudflare_tunnel_token
  cloudflare_beta_tunnel_token:
    file: ${SELFHOST_SECRET_DIR:?SELFHOST_SECRET_DIR must be set}/cloudflare_beta_tunnel_token
