# Opt-in DIDComm authenticated-encryption policy for controlled deployments.
#
# The mounted directory belongs only to issuance. It may contain sender private
# key material and must never be mounted into the gateway or another service.
services:
  issuance:
    environment:
      DIDCOMM_ENCRYPTION_POLICY_FILE: /run/secrets/didcomm-authcrypt/didcomm-encryption-policy.json
    volumes:
      - type: bind
        source: ${DIDCOMM_ENCRYPTION_POLICY_DIR:?set DIDCOMM_ENCRYPTION_POLICY_DIR to an exact policy directory}
        target: /run/secrets/didcomm-authcrypt
        read_only: true
        bind:
          create_host_path: false
