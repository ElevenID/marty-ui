# Local-only probe of the exact downloaded self-host migration image.
# No production mounts, host ports, source builds, or release-gate use.
services:
  postgres:
    image: ${PROBE_POSTGRES_IMAGE:?exact bundle digest required}
    platform: linux/amd64
    environment:
      POSTGRES_DB: marty
      POSTGRES_USER: marty
      POSTGRES_PASSWORD_FILE: /run/secrets/marty_db_password
    secrets: [marty_db_password]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U marty -d marty"]
      interval: 2s
      retries: 30
    networks: [private]
  redis:
    image: ${PROBE_REDIS_IMAGE:?exact bundle digest required}
    platform: linux/amd64
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      retries: 30
    networks: [private]
  openbao:
    image: ${PROBE_OPENBAO_IMAGE:?reviewed disposable digest required}
    platform: linux/amd64
    entrypoint: [/bin/sh, /usr/local/bin/passport-supported-openbao-start]
    configs:
      - source: openbao_start
        target: /usr/local/bin/passport-supported-openbao-start
    secrets: [bao_root_token]
    healthcheck:
      test: [CMD, bao, status, -address=http://127.0.0.1:8200]
      interval: 2s
      retries: 30
    networks: [private]
  openbao-bootstrap:
    image: ${PROBE_OPENBAO_IMAGE:?reviewed disposable digest required}
    platform: linux/amd64
    entrypoint: [/bin/sh, /usr/local/bin/selfhost-migration-openbao-bootstrap]
    environment:
      BAO_ADDR: http://openbao:8200
    configs:
      - source: openbao_bootstrap
        target: /usr/local/bin/selfhost-migration-openbao-bootstrap
      - source: openbao_init
        target: /usr/local/bin/openbao-init
    secrets: [bao_root_token]
    volumes:
      - type: bind
        source: ${PROBE_SECRET_DIR:?disposable secret root required}
        target: /work/secrets
    depends_on:
      openbao: {condition: service_healthy}
    networks: [private]
    restart: "no"
  db-migrate:
    image: ${PROBE_MIGRATIONS_IMAGE:?exact bundle digest required}
    platform: linux/amd64
    environment:
      ENVIRONMENT: production
      MARTY_DB_PASSWORD_FILE: /run/secrets/marty_db_password
      DATABASE_URL_TEMPLATE: postgresql://marty:$${MARTY_DB_PASSWORD}@postgres:5432/marty
      MARTY_ORG_ADMIN_EMAIL: probe@migration.invalid
      MARTY_ORG_ID: 00000000-0000-0000-0000-000000000001
      MARTY_ORG_SLUG: marty
      MARTY_MIGRATION_PROFILE: selfhost-production
      MARTY_KMS_BOOTSTRAP_ENABLED: "true"
      REDIS_URL: redis://redis:6379
      REDIS_DB_GATEWAY: "2"
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN_FILE: /run/secrets/bao_service_token
      NOTIFICATION_OPENBAO_TOKEN_FILE: /run/secrets/notification_openbao_token
      PUBLIC_DOMAIN: migration.invalid
      PUBLIC_API_URL: https://migration.invalid
      ISSUER_BASE_URL: https://migration.invalid
    secrets: [marty_db_password, bao_service_token, notification_openbao_token]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      openbao: {condition: service_healthy}
    networks: [private]
    restart: "no"
  native-schema-migrate:
    image: ${PROBE_SERVICES_IMAGE:?exact bundle digest required}
    platform: linux/amd64
    entrypoint: [/bin/sh, -ec]
    command: [. /app/load-secrets-env.sh; /usr/local/bin/marty-organization migrate && /usr/local/bin/marty-credential-template migrate && /usr/local/bin/marty-device-registration migrate && exec /usr/local/bin/marty-issuance-service migrate]
    environment:
      MARTY_DB_PASSWORD_FILE: /run/secrets/marty_db_password
      DATABASE_URL_TEMPLATE: postgresql://marty:$${MARTY_DB_PASSWORD}@postgres:5432/marty
    secrets: [marty_db_password]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [private]
    restart: "no"
secrets:
  marty_db_password:
    file: ${PROBE_SECRET_DIR:?disposable secret root required}/marty_db_password
  bao_root_token:
    file: ${PROBE_SECRET_DIR:?disposable secret root required}/bao_root_token
  bao_service_token:
    file: ${PROBE_SECRET_DIR:?disposable secret root required}/bao_service_token
  notification_openbao_token:
    file: ${PROBE_SECRET_DIR:?disposable secret root required}/notification_openbao_token
configs:
  openbao_start:
    file: ${PROBE_OPENBAO_START:?reviewed fixture required}
  openbao_bootstrap:
    file: ${PROBE_OPENBAO_BOOTSTRAP:?reviewed fixture required}
  openbao_init:
    file: ${PROBE_OPENBAO_INIT:?exact bundle asset required}
networks:
  private:
    internal: true
