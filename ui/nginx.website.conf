# Independent static marketing origin. Its route ownership is generated from
# the same versioned contract used by the edge and browser handoff logic.
server {
    listen 80;
    server_name localhost;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/marty-website-routes.conf;
    include /etc/nginx/marty-website-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /_website/runtime-config.js {
        try_files $uri =404;
        include /etc/nginx/marty-website-headers.conf;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /_website/ {
        try_files $uri =404;
        include /etc/nginx/marty-website-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Resource failures must never become successful HTML responses.
    location ~* \.[a-z0-9]+$ {
        try_files $uri =404;
        expires -1;
    }
    location / {
        return 404;
    }
}
