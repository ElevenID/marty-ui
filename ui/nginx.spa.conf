# Static SPA server for Docker-hosted production UI
# API proxying is handled by the tunnel nginx-proxy, not here.

server {
    listen 80;
    server_name localhost;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml+rss;

    # Container liveness is independent of which webpages are enabled.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ /\.marty-ui- { return 404; }

    location = /runtime-config.js {
        if (-f $document_root/.marty-ui-disabled) { return 404; }
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /config.json {
        if (-f $document_root/.marty-ui-disabled) { return 404; }
        try_files $uri =404;
    }
    location = /manifest.json {
        if (-f $document_root/.marty-ui-disabled) { return 404; }
        try_files $uri =404;
    }
    location ^~ /assets/ {
        if (-f $document_root/.marty-ui-disabled) { return 404; }
        try_files $uri =404;
        expires 1y;
    }

    # Authentication is shared by the application and console entrypoints.
    location = /auth/callback {
        if (-f $document_root/.marty-ui-disabled) { return 404; }
        try_files /index.html /console/index.html =404;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Crawler files are file-only endpoints. They must never fall through to
    # the application shell when a build artifact is absent.
    location = /robots.txt {
        if (-f $document_root/.marty-ui-public-disabled) { return 404; }
        default_type text/plain;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        if (-f $document_root/.marty-ui-public-disabled) { return 404; }
        types { application/xml xml; }
        default_type application/xml;
        try_files $uri =404;
    }

    location = /sitemap-index.xml {
        if (-f $document_root/.marty-ui-public-disabled) { return 404; }
        types { application/xml xml; }
        default_type application/xml;
        try_files $uri =404;
    }

    location ~ ^/sitemap-[0-9]+\.xml$ {
        if (-f $document_root/.marty-ui-public-disabled) { return 404; }
        types { application/xml xml; }
        default_type application/xml;
        try_files $uri =404;
    }

    location = /console {
        if (-f $document_root/.marty-ui-console-disabled) { return 404; }
        try_files /console/index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location ^~ /console/ {
        if (-f $document_root/.marty-ui-console-disabled) { return 404; }
        try_files $uri $uri/ /console/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Exact UI aliases must not depend on the public entry document. The
    # /credentials/ protocol namespace remains owned by the deployment proxy.
    location = /catalog {
        if (-f $document_root/.marty-ui-console-disabled) { return 404; }
        return 308 /console/applicant/catalog$is_args$args;
    }
    location = /apply {
        if (-f $document_root/.marty-ui-public-disabled) { return 404; }
        if (-f $document_root/.marty-ui-console-disabled) { return 404; }
        try_files /index.html =404;
    }
    location ^~ /apply/ {
        if (-f $document_root/.marty-ui-public-disabled) { return 404; }
        if (-f $document_root/.marty-ui-console-disabled) { return 404; }
        try_files /index.html =404;
    }
    location = /credentials {
        if (-f $document_root/.marty-ui-console-disabled) { return 404; }
        return 308 /console/applicant/credentials$is_args$args;
    }
    location = /my-applications {
        if (-f $document_root/.marty-ui-console-disabled) { return 404; }
        return 308 /console/applicant/applications$is_args$args;
    }
    location = /my-documents {
        if (-f $document_root/.marty-ui-console-disabled) { return 404; }
        return 308 /console/applicant/devices$is_args$args;
    }
    location = /console-handoff/org/setup {
        if (-f $document_root/.marty-ui-console-disabled) { return 404; }
        return 308 /console/org/setup$is_args$args;
    }

    # Translation requests are files, never SPA routes. A missing namespace
    # must not return index.html with a misleading 200/text-html response.
    location ^~ /locales/ {
        if (-f $document_root/.marty-ui-disabled) { return 404; }
        try_files $uri =404;
    }

    # SPA fallback — all public routes return index.html
    # Prevent browser/CDN caching of index.html so new builds take effect immediately
    location = /openapi.yaml {
        absolute_redirect off;
        return 308 /openapi.json;
    }

    # The deployment proxy owns this endpoint. Direct static serving must not
    # present the SPA document as a successful machine-readable schema.
    location = /openapi.json {
        default_type application/json;
        return 503 '{"error":"openapi_gateway_proxy_required"}';
    }

    location = /ready {
        default_type application/json;
        return 503 '{"status":"not_ready","service":"ui","error":"readiness_not_proxied"}';
    }

    location = /health/ready {
        default_type application/json;
        return 503 '{"status":"not_ready","service":"ui","error":"readiness_not_proxied"}';
    }

    # `/demos` can coexist with the static `/demos/manifests` directory. Avoid
    # treating that directory as an indexable response when a variant does not
    # emit a prerendered catalog page; fall back to the SPA entry instead.
    location ~ ^/demos/?$ {
        if (-f $document_root/.marty-ui-public-disabled) { return 404; }
        try_files /demos/index.html /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location / {
        if (-f $document_root/.marty-ui-public-disabled) { return 404; }
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Cache hashed static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        if (-f $document_root/.marty-ui-disabled) { return 404; }
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
