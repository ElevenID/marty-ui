# Environment/network-neutral native executable build, readiness and dependencies.
# Deployment overlays own every environment value, secret, network and route.
services:
  issuance-native:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: issuance-native
    depends_on:
      issuance-migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      signing-keys:
        condition: service_healthy
      revocation-profile:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8005/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
