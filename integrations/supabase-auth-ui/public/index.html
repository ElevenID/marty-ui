<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="color-scheme" content="light">
    <title>Sign in · ElevenID</title>
    <link rel="stylesheet" href="/app.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div class="shell">
      <header class="brand" aria-label="Identity provider">
        <span class="brand-mark" aria-hidden="true">11</span>
        <span id="brand-name">ElevenID</span>
        <span class="brand-caption">Account access</span>
      </header>
      <main id="app" class="card" aria-busy="true">
        <p class="eyebrow">ACCOUNT ACCESS</p>
        <h1>Preparing your sign-in</h1>
        <p class="intro">Checking this authorization request…</p>
        <noscript><p class="notice">JavaScript is required for sign-in. Enable it and start again from your application.</p></noscript>
      </main>
      <footer class="footer">
        <span>One account. Your choice of access.</span>
        <span>This page does not save your session.</span>
      </footer>
    </div>
  </body>
</html>
