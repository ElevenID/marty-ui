# Project-only HTTPS edge for the disposable passport model. The callback
# endpoint is a synthetic Flow configuration sink, not passport evidence.
server {
    listen 8443 ssl;
    server_name localhost edge passport-https-edge;
    ssl_certificate /run/secrets/passport_edge_tls_cert;
    ssl_certificate_key /run/secrets/passport_edge_tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /__disposable/flow-callback {
        if ($request_method != POST) { return 405; }
        add_header X-Marty-Synthetic-Only true always;
        return 204;
    }

    location / {
        proxy_pass http://gateway:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }
}
