services:
  postgres:
    image: postgres:15.18-alpine@sha256:57e5b9f69e672385cdf630f42b1306b5ca934c9bf8278b5f8b1948533d75a20b
    environment:
      POSTGRES_DB: flow_idempotency_contract
      POSTGRES_USER: flow_contract
      POSTGRES_PASSWORD: flow_contract_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flow_contract -d flow_idempotency_contract"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    tmpfs:
      - /var/lib/postgresql/data:rw,noexec,nosuid,size=256m
    restart: "no"
    networks:
      - flow-idempotency-contract

  flow-idempotency-contract:
    build:
      context: .
      dockerfile: tests/flow-idempotency-contract/Dockerfile
      args:
        CONTRACT_SOURCE_REVISION: ${FLOW_IDEMPOTENCY_SOURCE_REVISION:-local-worktree}
    depends_on:
      postgres:
        condition: service_healthy
        restart: false
    environment:
      DATABASE_URL: postgresql://flow_contract:flow_contract_only@postgres:5432/flow_idempotency_contract
      CONTRACT_RESULT_PATH: /artifacts/contract-result.json
      CONTRACT_SOURCE_REVISION: ${FLOW_IDEMPOTENCY_SOURCE_REVISION:-local-worktree}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - type: bind
        source: ${FLOW_IDEMPOTENCY_ARTIFACT_DIR:-./tests/artifacts/flow-idempotency}
        target: /artifacts
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    networks:
      - flow-idempotency-contract

networks:
  flow-idempotency-contract:
    internal: true
