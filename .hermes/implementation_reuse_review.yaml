no_match_statement: >-
  No production caller or identity-bearing inbound contract exists for the
  standalone Verification gRPC API. The safe reuse decision is to close that
  dormant production ingress while retaining its local adapter, rather than
  create a parallel authorization protocol or invent an authorized workload.
decision: extend_existing
canonical_implementation:
  path: services/verification/main.py
  language: Python
rust_disposition: rust_not_applicable
non_rust_rationale: >-
  This change binds HTTP/gRPC transport ingress, gateway-authenticated identity,
  organization membership, and authoritative service-owned resource metadata.
  Those are service-boundary and deployment concerns. Existing OID4VP domain
  construction remains in the canonical Rust backend through the existing thin
  services/common/oid4vp_native.py binding; no protocol, cryptographic, or
  validation algorithm is duplicated in Python.
