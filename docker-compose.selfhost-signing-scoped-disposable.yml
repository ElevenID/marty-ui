# Opt-in local continuation of the exact-bundle migration fixture.
# This adds only one runtime service; no host ports, source builds, or gate use.
services:
  signing-keys:
    image: ${PROBE_SERVICES_IMAGE:?exact bundle services digest required}
    platform: linux/amd64
    environment:
      SERVICE_NAME: signing_keys
      ENVIRONMENT: production
      MARTY_RELEASE_VERSION: scoped-probe
      SIGNING_KEYS_SERVICE_PORT: "8017"
      SIGNING_KEYS_INTERNAL_API_KEY_FILE: /run/secrets/issuance_api_key
      SIGNING_KEYS_SERVICE_SIGN_GATEWAY_KEY_FILE: /run/secrets/signing_service_key
      SIGNING_KEYS_ISSUER_SIGN_KEY_FILE: /run/secrets/signing_issuer_key
      SIGNING_KEYS_GRANT_VERIFY_TOKEN_FILE: /run/secrets/sign_grant_verify_token
      SIGNING_KEYS_REDIS_URL: redis://redis:6379/2
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN_FILE: /run/secrets/signing_keys_openbao_token
      PUBLIC_DOMAIN: migration.invalid
    secrets: [issuance_api_key, signing_service_key, signing_issuer_key, sign_grant_verify_token, signing_keys_openbao_token]
    depends_on:
      redis: {condition: service_healthy}
      openbao: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8017/health]
      interval: 2s
      retries: 30
    networks: [private]
    restart: "no"
secrets:
  issuance_api_key:
    file: ${PROBE_SECRET_DIR:?disposable secret root required}/issuance_api_key
  signing_service_key:
    file: ${PROBE_SECRET_DIR:?disposable secret root required}/signing_service_key
  signing_issuer_key:
    file: ${PROBE_SECRET_DIR:?disposable secret root required}/signing_issuer_key
  sign_grant_verify_token:
    file: ${PROBE_SECRET_DIR:?disposable secret root required}/sign_grant_verify_token
  signing_keys_openbao_token:
    file: ${PROBE_SECRET_DIR:?disposable secret root required}/signing_keys_openbao_token
