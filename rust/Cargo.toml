[workspace]
members = ["services/applicant", "services/auth", "services/compliance-profile", "services/credential-template", "services/deployment-profile", "services/device-registration", "services/event-stream", "services/flow", "services/gateway", "services/issuance", "services/notification", "services/organization", "services/presentation-policy", "services/revocation-profile", "services/signing-keys", "services/trust-profile", "services/verification"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/ElevenID/marty-ui"
rust-version = "1.95"

[workspace.dependencies]
axum = "0.8"
async-trait = "0.1"
aws-config = { version = "1.10.1", default-features = false, features = ["credentials-process", "default-https-client", "rt-tokio", "sso"] }
aws-sdk-kms = { version = "1.114.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-smithy-http-client = "1.3.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
ed25519-dalek = { version = "2", features = ["pkcs8"] }
futures-core = "0.3"
hmac = "0.12"
hex = "0.4"
http = "1"
jsonwebtoken = { version = "10.3", features = ["rust_crypto"] }
marty-crypto = { version = "=0.1.61", git = "https://github.com/ElevenID/marty-core", rev = "1d3f134c3a585b6b671da1f474d1455453aa5b30", default-features = false, features = ["ecdsa", "jwk", "x509-parsing"] }
marty-didcomm = { version = "=0.1.61", git = "https://github.com/ElevenID/marty-core", rev = "1d3f134c3a585b6b671da1f474d1455453aa5b30", default-features = false }
marty-iso18013 = { version = "=0.1.61", git = "https://github.com/ElevenID/marty-core", rev = "1d3f134c3a585b6b671da1f474d1455453aa5b30", default-features = false }
marty-oid4vci = { version = "=0.1.61", git = "https://github.com/ElevenID/marty-core", rev = "1d3f134c3a585b6b671da1f474d1455453aa5b30", default-features = false }
marty-verification = { version = "=0.1.61", git = "https://github.com/ElevenID/marty-core", rev = "1d3f134c3a585b6b671da1f474d1455453aa5b30", default-features = false }
marty-status = { version = "=0.1.61", git = "https://github.com/ElevenID/marty-core", rev = "1d3f134c3a585b6b671da1f474d1455453aa5b30" }
mmf-config = { git = "https://github.com/ElevenID/marty-microservices-framework", rev = "020beffb4da1e0ef52b4330b55c3b4633022d529" }
mmf-platform = { git = "https://github.com/ElevenID/marty-microservices-framework", rev = "020beffb4da1e0ef52b4330b55c3b4633022d529" }
mmf-core = { git = "https://github.com/ElevenID/marty-microservices-framework", rev = "020beffb4da1e0ef52b4330b55c3b4633022d529" }
mmf-data = { git = "https://github.com/ElevenID/marty-microservices-framework", rev = "020beffb4da1e0ef52b4330b55c3b4633022d529" }
mmf-runtime = { git = "https://github.com/ElevenID/marty-microservices-framework", rev = "020beffb4da1e0ef52b4330b55c3b4633022d529" }
mmf-security = { git = "https://github.com/ElevenID/marty-microservices-framework", rev = "020beffb4da1e0ef52b4330b55c3b4633022d529" }
mmf-messaging = { git = "https://github.com/ElevenID/marty-microservices-framework", rev = "020beffb4da1e0ef52b4330b55c3b4633022d529", features = ["postgres"] }
mmf-push = { git = "https://github.com/ElevenID/marty-microservices-framework", rev = "020beffb4da1e0ef52b4330b55c3b4633022d529" }
mmf-workflow = { git = "https://github.com/ElevenID/marty-microservices-framework", rev = "020beffb4da1e0ef52b4330b55c3b4633022d529" }
prost = "0.14"
protoc-bin-vendored = "3"
rand = "0.9"
redis = { version = "1.5", default-features = false, features = ["connection-manager", "script", "tokio-comp"] }
regex = "1"
percent-encoding = "2"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["chrono", "json", "postgres", "runtime-tokio", "tls-rustls-ring-webpki", "uuid"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4", "v5"] }
url = "2"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[patch.crates-io]
isomdl = { git = "https://github.com/ElevenID/isomdl-elevenid", rev = "7a443cf6c37c8d7f11e9a767c1002684842ab5d0" }
ssi-jwt = { path = "third_party/ssi-jwt" }
