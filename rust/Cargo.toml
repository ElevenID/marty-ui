[workspace]
members = ["services/auth", "services/event-stream", "services/flow", "services/gateway", "services/notification", "services/organization", "services/revocation-profile", "services/signing-keys"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/ElevenID/marty-ui"
rust-version = "1.95"

[workspace.dependencies]
axum = "0.8"
async-trait = "0.1"
aws-config = { version = "1.10.1", default-features = false, features = ["credentials-process", "default-https-client", "rt-tokio", "sso"] }
aws-sdk-kms = { version = "1.114.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-smithy-http-client = "1.3.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
ed25519-dalek = { version = "2", features = ["pkcs8"] }
futures-core = "0.3"
hmac = "0.12"
hex = "0.4"
http = "1"
jsonwebtoken = { version = "10.3", features = ["rust_crypto"] }
marty-crypto = { version = "=0.1.57", git = "https://github.com/ElevenID/marty-core", rev = "54ff554906f5fa2791b7fcb6a5965d7e8db8b0e8", default-features = false, features = ["ecdsa", "jwk", "x509-parsing"] }
marty-didcomm = { version = "=0.1.57", git = "https://github.com/ElevenID/marty-core", rev = "54ff554906f5fa2791b7fcb6a5965d7e8db8b0e8", default-features = false }
marty-iso18013 = { version = "=0.1.57", git = "https://github.com/ElevenID/marty-core", rev = "54ff554906f5fa2791b7fcb6a5965d7e8db8b0e8", default-features = false }
marty-oid4vci = { version = "=0.1.57", git = "https://github.com/ElevenID/marty-core", rev = "54ff554906f5fa2791b7fcb6a5965d7e8db8b0e8", default-features = false }
marty-verification = { version = "=0.1.57", git = "https://github.com/ElevenID/marty-core", rev = "54ff554906f5fa2791b7fcb6a5965d7e8db8b0e8", default-features = false }
marty-status = { version = "=0.1.57", git = "https://github.com/ElevenID/marty-core", rev = "54ff554906f5fa2791b7fcb6a5965d7e8db8b0e8" }
mmf-platform = { path = "../../mmf-rust-gateway-wave25/crates/mmf-platform" }
mmf-core = { path = "../../mmf-rust-gateway-wave25/crates/mmf-core" }
mmf-data = { path = "../../mmf-rust-gateway-wave25/crates/mmf-data" }
mmf-runtime = { path = "../../mmf-rust-gateway-wave25/crates/mmf-runtime" }
mmf-security = { path = "../../mmf-rust-gateway-wave25/crates/mmf-security" }
mmf-messaging = { path = "../../mmf-rust-gateway-wave25/crates/mmf-messaging", features = ["postgres"] }
mmf-push = { path = "../../mmf-rust-gateway-wave25/crates/mmf-push" }
mmf-workflow = { path = "../../mmf-rust-gateway-wave25/crates/mmf-workflow" }
prost = "0.14"
protoc-bin-vendored = "3"
rand = "0.9"
redis = { version = "1.5", default-features = false, features = ["connection-manager", "script", "tokio-comp"] }
regex = "1"
percent-encoding = "2"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["chrono", "json", "postgres", "runtime-tokio", "tls-rustls-ring-webpki", "uuid"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4", "v5"] }
url = "2"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[patch.crates-io]
isomdl = { git = "https://github.com/ElevenID/isomdl-elevenid", rev = "7a443cf6c37c8d7f11e9a767c1002684842ab5d0" }
