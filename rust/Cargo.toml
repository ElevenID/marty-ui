[workspace]
members = ["crates/acme-client", "crates/mdoc-status-binding", "crates/api-key-policy", "crates/claim-collection", "crates/ci-execution", "crates/canvas-acceptance", "crates/canvas-demo-seed", "crates/canvas-sandbox", "crates/canvas-worker-acceptance", "crates/demo-vendor-seed", "crates/deployment-catalog", "crates/flow-acceptance", "crates/holder-key-reference", "crates/key-material-policy", "crates/managed-key-reference", "crates/issuer-key-resolution", "crates/keyless-grpc-bridge", "crates/oid4vp-contract", "crates/openbao-http", "crates/passport-auth", "crates/passport-keyless-edge", "crates/platform-clock", "crates/release-evidence", "crates/response-compat", "crates/schema-startup", "crates/service-contracts", "crates/service-runtime", "crates/service-acceptance", "crates/selfhost-acceptance", "crates/selfhost-bundle", "crates/selfhost-identity", "crates/signing-grant", "crates/spruce-metadata-probe", "services/applicant", "services/auth", "services/compliance-profile", "services/credential-template", "services/device-registration", "services/event-stream", "services/flow", "services/gateway", "services/issuance", "services/notification", "services/organization", "services/presentation-policy", "services/revocation-profile", "services/signing-keys", "services/trust-profile", "services/verification"]
exclude = ["vendor/instant-acme"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/ElevenID/marty-ui"
rust-version = "1.95"

[workspace.dependencies]
instant-acme = { version = "=0.8.5", path = "vendor/instant-acme", default-features = false, features = ["ring", "time"] }
webpki-roots = "1.0.10"
marty-claim-collection = { path = "crates/claim-collection" }
aes-gcm = "0.10"
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
affinidi-messaging-didcomm = "=0.15.11"
affinidi-crypto = { version = "0.2", features = ["jose"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
const-oid = "0.9.6"
coset = "0.3.8"
isomdl = { version = "0.4", default-features = false }
der = { version = "0.7.10", features = ["pem"] }
ed25519-dalek = { version = "2", features = ["pkcs8"] }
fancy-regex = "0.19.2"
flate2 = "1.1.9"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
hmac = "0.12"
hex = "0.4"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
httpdate = "1"
log = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
marty-crypto = { version = "=0.2.2", git = "https://github.com/ElevenID/marty-core", rev = "7fd9106032ab455ed9eb1708a584014a52af7249", default-features = false, features = ["kms-only", "ecdsa-verification", "jwk", "x509-parsing"] }
marty-didcomm = { version = "=0.2.2", git = "https://github.com/ElevenID/marty-core", rev = "7fd9106032ab455ed9eb1708a584014a52af7249", default-features = false, features = ["kms-only"] }
marty-iso18013 = { version = "=0.2.2", git = "https://github.com/ElevenID/marty-core", rev = "7fd9106032ab455ed9eb1708a584014a52af7249", default-features = false }
marty-oid4vci = { version = "=0.2.2", git = "https://github.com/ElevenID/marty-core", rev = "7fd9106032ab455ed9eb1708a584014a52af7249", default-features = false, features = ["kms-only"] }
marty-verification = { version = "=0.2.2", git = "https://github.com/ElevenID/marty-core", rev = "7fd9106032ab455ed9eb1708a584014a52af7249", default-features = false, features = ["kms-only"] }
marty-canonical-digest = { version = "=0.2.2", git = "https://github.com/ElevenID/marty-core", rev = "7fd9106032ab455ed9eb1708a584014a52af7249" }
marty-status = { version = "=0.2.2", git = "https://github.com/ElevenID/marty-core", rev = "7fd9106032ab455ed9eb1708a584014a52af7249" }
mmf-config = { git = "https://github.com/ElevenID/marty-microservices-framework", rev = "0d3b92b836591934c53875ecae337fb690271698" }
mmf-platform = { git = "https://github.com/ElevenID/marty-microservices-framework", rev = "0d3b92b836591934c53875ecae337fb690271698", features = ["aws-kms"] }
mmf-aws-kms = { git = "https://github.com/ElevenID/marty-microservices-framework", rev = "0d3b92b836591934c53875ecae337fb690271698", features = ["sdk"] }
mmf-core = { git = "https://github.com/ElevenID/marty-microservices-framework", rev = "0d3b92b836591934c53875ecae337fb690271698" }
mmf-data = { git = "https://github.com/ElevenID/marty-microservices-framework", rev = "0d3b92b836591934c53875ecae337fb690271698" }
mmf-runtime = { git = "https://github.com/ElevenID/marty-microservices-framework", rev = "0d3b92b836591934c53875ecae337fb690271698" }
mmf-security = { git = "https://github.com/ElevenID/marty-microservices-framework", rev = "0d3b92b836591934c53875ecae337fb690271698", default-features = false, features = ["cedar", "redis"] }
mmf-messaging = { git = "https://github.com/ElevenID/marty-microservices-framework", rev = "0d3b92b836591934c53875ecae337fb690271698", features = ["postgres"] }
mmf-push = { git = "https://github.com/ElevenID/marty-microservices-framework", rev = "0d3b92b836591934c53875ecae337fb690271698" }
mmf-workflow = { git = "https://github.com/ElevenID/marty-microservices-framework", rev = "0d3b92b836591934c53875ecae337fb690271698" }
prost = "0.14"
protoc-bin-vendored = "3"
rand = "0.9"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
# Keep the compatibility generation explicit for packages whose test APIs use rand 0.8.
rand08 = { package = "rand", version = "0.8" }
redis = { version = "1.5", default-features = false, features = ["connection-manager", "script", "tokio-comp"] }
regex = "1"
percent-encoding = "2"
p256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa-core", "sha256"] }
ecdsa-core = { package = "ecdsa", version = "0.17", default-features = false, features = ["verifying"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rsa = "0.9"
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
rustls-platform-verifier = "0.7"
rustls-webpki = { version = "0.103.16", default-features = false, features = ["std", "aws-lc-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9.34"
spki = "0.7.3"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["chrono", "json", "postgres", "runtime-tokio", "tls-rustls-ring-webpki", "uuid"] }
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.53.3", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tokio-rustls = "0.26"
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4", "v5"] }
x509-cert = { version = "0.2.5", features = ["builder", "pem"] }
url = "2"
zeroize = "1.9"
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2"] }

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.debugging]
inherits = "dev"
debug = "full"

