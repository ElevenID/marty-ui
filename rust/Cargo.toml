[workspace]
members = ["crates/oid4vp-contract", "crates/passport-auth", "crates/platform-clock", "crates/release-evidence", "crates/schema-startup", "crates/service-acceptance", "crates/selfhost-bundle", "services/applicant", "services/auth", "services/compliance-profile", "services/credential-template", "services/deployment-profile", "services/device-registration", "services/event-stream", "services/flow", "services/gateway", "services/issuance", "services/notification", "services/organization", "services/presentation-policy", "services/revocation-profile", "services/signing-keys", "services/trust-profile", "services/verification"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/ElevenID/marty-ui"
rust-version = "1.95"

[workspace.dependencies]
aes-gcm = "0.10"
axum = "0.8"
async-trait = "0.1"
aws-config = { version = "1.10.1", default-features = false, features = ["credentials-process", "default-https-client", "rt-tokio", "sso"] }
aws-sdk-kms = { version = "1.114.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-smithy-http-client = "1.3.0"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
const-oid = "0.9.6"
der = { version = "0.7.10", features = ["pem"] }
ed25519-dalek = { version = "2", features = ["pkcs8"] }
fancy-regex = "0.19.2"
fernet = { version = "0.2.2", default-features = false, features = ["rustcrypto"] }
flate2 = "1.1.9"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
hmac = "0.12"
hex = "0.4"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
httpdate = "1"
jsonwebtoken = { version = "10.3", features = ["rust_crypto"] }
log = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
marty-crypto = { version = "=0.1.62", git = "https://github.com/ElevenID/marty-core", rev = "bdbd1510ab6ad650e4d408a93dac22b57eb67e68", default-features = false, features = ["ecdsa", "jwk", "x509-parsing"] }
marty-didcomm = { version = "=0.1.62", git = "https://github.com/ElevenID/marty-core", rev = "bdbd1510ab6ad650e4d408a93dac22b57eb67e68", default-features = false }
marty-iso18013 = { version = "=0.1.62", git = "https://github.com/ElevenID/marty-core", rev = "bdbd1510ab6ad650e4d408a93dac22b57eb67e68", default-features = false }
marty-oid4vci = { version = "=0.1.62", git = "https://github.com/ElevenID/marty-core", rev = "bdbd1510ab6ad650e4d408a93dac22b57eb67e68", default-features = false }
marty-verification = { version = "=0.1.62", git = "https://github.com/ElevenID/marty-core", rev = "bdbd1510ab6ad650e4d408a93dac22b57eb67e68", default-features = false }
marty-status = { version = "=0.1.62", git = "https://github.com/ElevenID/marty-core", rev = "bdbd1510ab6ad650e4d408a93dac22b57eb67e68" }
mmf-config = { git = "https://github.com/ElevenID/marty-microservices-framework", rev = "c55d323e6aa64cad4f49308792f1d21eaab0ebc8" }
mmf-platform = { git = "https://github.com/ElevenID/marty-microservices-framework", rev = "c55d323e6aa64cad4f49308792f1d21eaab0ebc8" }
mmf-core = { git = "https://github.com/ElevenID/marty-microservices-framework", rev = "c55d323e6aa64cad4f49308792f1d21eaab0ebc8" }
mmf-data = { git = "https://github.com/ElevenID/marty-microservices-framework", rev = "c55d323e6aa64cad4f49308792f1d21eaab0ebc8" }
mmf-runtime = { git = "https://github.com/ElevenID/marty-microservices-framework", rev = "c55d323e6aa64cad4f49308792f1d21eaab0ebc8" }
mmf-security = { git = "https://github.com/ElevenID/marty-microservices-framework", rev = "c55d323e6aa64cad4f49308792f1d21eaab0ebc8", default-features = false, features = ["cedar", "redis"] }
mmf-messaging = { git = "https://github.com/ElevenID/marty-microservices-framework", rev = "c55d323e6aa64cad4f49308792f1d21eaab0ebc8", features = ["postgres"] }
mmf-push = { git = "https://github.com/ElevenID/marty-microservices-framework", rev = "c55d323e6aa64cad4f49308792f1d21eaab0ebc8" }
mmf-workflow = { git = "https://github.com/ElevenID/marty-microservices-framework", rev = "c55d323e6aa64cad4f49308792f1d21eaab0ebc8" }
prost = "0.14"
protoc-bin-vendored = "3"
rand = "0.9"
# Keep the compatibility generation explicit for packages whose test APIs use rand 0.8.
rand08 = { package = "rand", version = "0.8" }
redis = { version = "1.5", default-features = false, features = ["connection-manager", "script", "tokio-comp"] }
regex = "1"
percent-encoding = "2"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rsa = "0.9"
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9.34"
spki = "0.7.3"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["chrono", "json", "postgres", "runtime-tokio", "tls-rustls-ring-webpki", "uuid"] }
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tokio-rustls = "0.26"
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4", "v5"] }
x509-cert = { version = "0.2.5", features = ["builder", "pem"] }
url = "2"
zeroize = "1.9"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.debugging]
inherits = "dev"
debug = "full"

[patch.crates-io]
isomdl = { git = "https://github.com/ElevenID/isomdl-elevenid", rev = "671044c9495aec101bf0cd381669d5ed6f64dd11" }
ssi-jwt = { path = "third_party/ssi-jwt" }
