[package]
name = "marty-device-registration"
version = "0.1.0"
description = "Canonical Rust device registration and remote holder-key lifecycle service"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "marty-device-registration"
path = "src/main.rs"
test = false

[dependencies]
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
ed25519-dalek.workspace = true
marty-holder-key-reference = { path = "../../crates/holder-key-reference" }
marty-key-material-policy = { path = "../../crates/key-material-policy" }
prost.workspace = true
rand.workspace = true
redis.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[build-dependencies]
protoc-bin-vendored.workspace = true
tonic-prost-build.workspace = true

[dev-dependencies]
p256.workspace = true
marty-signing-keys = { path = "../signing-keys" }
tower.workspace = true

[lints.rust]
unsafe_code = "forbid"
