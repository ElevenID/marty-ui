[package]
name = "marty-issuance-service"
version = "0.1.0"
description = "Canonical native Rust issuance service candidate"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "marty-issuance-service"
path = "src/main.rs"
test = false

[[bin]]
name = "marty-canvas-sync-worker"
path = "src/bin/canvas_sync_worker.rs"
test = false

[dependencies]
aes-gcm.workspace = true
axum.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
futures-core.workspace = true
hex.workspace = true
hmac.workspace = true
httpdate.workspace = true
mmf-config.workspace = true
mmf-core.workspace = true
mmf-runtime.workspace = true
mmf-security.workspace = true
marty-oid4vci = { workspace = true, features = ["lti"] }
marty-didcomm = { workspace = true, features = ["did_web"] }
marty-verification.workspace = true
p256.workspace = true
percent-encoding.workspace = true
prost.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tonic-health.workspace = true
tonic-prost.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true
jsonwebtoken.workspace = true
rand08 = { package = "rand", version = "0.8" }
rsa = "0.9"
tower.workspace = true

[build-dependencies]
protoc-bin-vendored.workspace = true
tonic-prost-build.workspace = true

[lints.rust]
unsafe_code = "forbid"
