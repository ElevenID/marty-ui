[package]
name = "marty-issuance-service"
version = "0.1.0"
description = "Canonical native Rust issuance service candidate"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
autotests = false

[features]
default = []
feature-regression-observer = []

[[bin]]
name = "marty-issuance-service"
path = "src/main.rs"
test = false

[[bin]]
name = "marty-canvas-sync-worker"
path = "src/bin/canvas_sync_worker.rs"
test = true

[dependencies]
aes-gcm.workspace = true
axum.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
fancy-regex.workspace = true
futures-core.workspace = true
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
futures-util.workspace = true
hex.workspace = true
hmac.workspace = true
hostname = { version = "=0.4.2", default-features = false }
httpdate.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
log.workspace = true
mmf-config.workspace = true
mmf-core.workspace = true
mmf-runtime.workspace = true
mmf-security.workspace = true
marty-oid4vci = { workspace = true, features = ["lti"] }
marty-didcomm = { workspace = true, features = ["did_web"] }
marty-verification.workspace = true
marty-passport-auth = { path = "../../crates/passport-auth" }
marty-platform-clock = { path = "../../crates/platform-clock" }
num-bigint.workspace = true
num-traits.workspace = true
p256.workspace = true
percent-encoding.workspace = true
prost.workspace = true
rand.workspace = true
reqwest.workspace = true
regex.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value", "arbitrary_precision"] }
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-rustls.workspace = true
tonic.workspace = true
tonic-health.workspace = true
tonic-prost.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
marty-selfhost-bundle = { path = "../../crates/selfhost-bundle" }
tempfile = "3"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }
marty-release-evidence = { path = "../../crates/release-evidence" }
serde_yaml = "0.9.34"
ed25519-dalek.workspace = true
jsonwebtoken.workspace = true
marty-flow = { path = "../flow" }
marty-gateway = { path = "../gateway" }
mmf-platform.workspace = true
rand08 = { package = "rand", version = "0.8" }
rsa = "0.9"
tower.workspace = true

[build-dependencies]
protoc-bin-vendored.workspace = true
tonic-prost-build.workspace = true

[lints.rust]
unsafe_code = "forbid"

# Explicit targets let independent behavior modules share one link step.
# tests/test_ci_workflow_performance.py rejects unregistered test files.
