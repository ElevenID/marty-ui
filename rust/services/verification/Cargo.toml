[package]
name = "marty-verification-service"
version = "0.1.0"
description = "Canonical Rust standalone OID4VP and SIOPv2 verification service"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "marty-verification-service"
path = "src/main.rs"
test = false

[dependencies]
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
http.workspace = true
marty-flow = { path = "../flow" }
marty-didcomm = { workspace = true, features = ["did_jwk", "did_key", "did_web"] }
marty-oid4vci.workspace = true
marty-verification.workspace = true
mmf-core.workspace = true
mmf-platform.workspace = true
mmf-runtime.workspace = true
mmf-security.workspace = true
p256.workspace = true
prost.workspace = true
rand.workspace = true
redis.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tonic-health.workspace = true
tonic-prost.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
url.workspace = true

[build-dependencies]
protoc-bin-vendored.workspace = true
tonic-prost-build.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true
tower.workspace = true

[lints.rust]
unsafe_code = "forbid"
