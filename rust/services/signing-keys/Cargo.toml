[package]
name = "marty-signing-keys"
version = "0.1.0"
description = "Marty signing-key and KMS service"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "marty-signing-keys"
path = "src/main.rs"
test = false

[[bin]]
name = "marty-passport-callback-signer"
path = "src/bin/passport_callback_signer.rs"
test = false

[[bin]]
name = "marty-passport-callback-signer-supported"
path = "src/bin/passport_callback_signer_supported.rs"
test = false

[dependencies]
axum.workspace = true
axum-server.workspace = true
aws-config.workspace = true
aws-credential-types.workspace = true
aws-sdk-kms.workspace = true
aws-smithy-http-client.workspace = true
base64.workspace = true
bs58 = "0.4"
chrono.workspace = true
const-oid.workspace = true
der.workspace = true
hex.workspace = true
marty-crypto = { workspace = true, features = ["x509"] }
marty-key-material-policy = { path = "../../crates/key-material-policy" }
marty-holder-key-reference = { path = "../../crates/holder-key-reference" }
marty-oid4vci = { workspace = true, features = ["issuer"] }
marty-oid4vp-contract = { path = "../../crates/oid4vp-contract" }
marty-passport-auth = { path = "../../crates/passport-auth" }
p256.workspace = true
percent-encoding.workspace = true
regex.workspace = true
reqwest = { workspace = true, features = ["query"] }
rustls.workspace = true
redis.workspace = true
serde.workspace = true
serde_json.workspace = true
spki.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
x509-cert.workspace = true

[dev-dependencies]
http.workspace = true
marty-verification.workspace = true
tempfile.workspace = true
tower.workspace = true
