[package]
name = "marty-passport-keyless-edge"
version = "0.1.0"
description = "Disposable passport acceptance HTTPS edge with remote TLS signing"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "marty-passport-keyless-edge"
path = "src/main.rs"

[[bin]]
name = "marty-oidf-keyless-edge"
path = "src/bin/oidf_edge.rs"


[dependencies]
marty-selfhost-identity = { path = "../selfhost-identity" }
axum.workspace = true
axum-server.workspace = true
base64.workspace = true
futures-util.workspace = true
http.workspace = true
hyper.workspace = true
hyper-util.workspace = true
mmf-platform.workspace = true
marty-openbao-http = { path = "../openbao-http" }
reqwest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util"] }

[[bin]]
name = "marty-passport-tls-bootstrap"
path = "src/bin/bootstrap.rs"
test = false
