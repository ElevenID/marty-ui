[package]
name = "marty-selfhost-acceptance"
version = "0.1.0"
description = "Published self-host image and packager acceptance tests"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
autotests = false

[dev-dependencies]
axum.workspace = true
axum-server.workspace = true
futures-util.workspace = true
marty-auth = { path = "../../services/auth" }
marty-compliance-profile = { path = "../../services/compliance-profile" }
marty-delegated-authority = { path = "../../services/delegated-authority" }
marty-delegated-use = { path = "../../services/delegated-use" }
marty-deployment-profile = { path = "../../services/deployment-profile" }
marty-device-registration = { path = "../../services/device-registration" }
marty-flow = { path = "../../services/flow" }
marty-issuance-service = { path = "../../services/issuance" }
marty-machine-credential-source = { path = "../machine-credential-source" }
marty-notification = { path = "../../services/notification" }
marty-organization = { path = "../../services/organization" }
marty-credential-template = { path = "../../services/credential-template" }
marty-presentation-policy = { path = "../../services/presentation-policy" }
marty-revocation-profile = { path = "../../services/revocation-profile" }
marty-selfhost-bundle = { path = "../selfhost-bundle" }
marty-trust-profile = { path = "../../services/trust-profile" }
mmf-messaging.workspace = true
rcgen.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
