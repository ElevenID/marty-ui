[lints.rust]
unsafe_code = "forbid"

[[test]]
name = "native_kms_schema_contract"
path = "tests/native_kms_schema_contract.rs"

[[test]]
name = "managed_postgres_contract"
path = "tests/managed_postgres_contract.rs"
