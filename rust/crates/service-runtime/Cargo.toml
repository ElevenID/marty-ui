[package]
name = "marty-service-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
http = { workspace = true, optional = true }
marty-api-key-policy = { path = "../api-key-policy", optional = true }
marty-crypto = { workspace = true, optional = true }
mmf-security = { workspace = true, optional = true }
tonic.workspace = true
mmf-aws-kms.workspace = true
mmf-platform.workspace = true
mmf-runtime.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-rustls.workspace = true
url.workspace = true

[features]
forwarded-principal = ["dep:http", "dep:marty-api-key-policy", "dep:mmf-security"]
workload-identity = ["dep:marty-crypto", "dep:mmf-security"]
