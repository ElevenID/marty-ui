marty-issuance-service = { path = "../../services/issuance" }
marty-oid4vci = { workspace = true, features = ["lti"] }
marty-passport-auth = { path = "../passport-auth" }
marty-release-evidence = { path = "../release-evidence" }
marty-selfhost-bundle = { path = "../selfhost-bundle" }
