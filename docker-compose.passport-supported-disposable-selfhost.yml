# Selfhost-surface selectors in an isolated disposable project.
services:
  gateway:
    environment:
      ENVIRONMENT: production
      # This project has only private disposable gRPC peers and no TLS CA.
      GRPC_INSECURE_ALLOWED: "true"
      PASSPORT_ACCEPTANCE_SURFACE: selfhost
  flow:
    environment:
      ENVIRONMENT: production
      PASSPORT_ACCEPTANCE_SURFACE: selfhost
      FLOW_CALLBACK_DESTINATIONS: 00000000-0000-0000-0000-000000000001|https://edge:8443/__disposable/flow-callback?nonce=__MARTY_TOKEN__
      FLOW_WEBHOOK_SECRET_FILE: /run/secrets/flow_webhook_secret
      FLOW_CALLBACK_CA_CERT_FILE: /run/secrets/workload_identity_ca_cert
      GRPC_WORKLOAD_TLS_CLIENT_CERT: /run/secrets/flow_workload_client_cert
      GRPC_WORKLOAD_TLS_CLIENT_KEY: /run/secrets/flow_workload_client_key
      GRPC_WORKLOAD_TLS_SERVER_CERT: /run/secrets/flow_workload_server_cert
      GRPC_WORKLOAD_TLS_SERVER_KEY: /run/secrets/flow_workload_server_key
      GRPC_WORKLOAD_TLS_CA_CERT: /run/secrets/workload_identity_ca_cert
    secrets:
      - flow_webhook_secret
      - flow_workload_client_cert
      - flow_workload_client_key
      - flow_workload_server_cert
      - flow_workload_server_key
      - workload_identity_ca_cert
  presentation-policy:
    environment:
      ENVIRONMENT: production
      GRPC_WORKLOAD_TLS_SERVER_CERT: /run/secrets/pp_workload_server_cert
      GRPC_WORKLOAD_TLS_SERVER_KEY: /run/secrets/pp_workload_server_key
      GRPC_WORKLOAD_TLS_CA_CERT: /run/secrets/workload_identity_ca_cert
    secrets: [pp_workload_server_cert, pp_workload_server_key, workload_identity_ca_cert]
  issuance-native:
    environment:
      # The disposable Marty simulator is deliberately rejected in production mode.
      ENVIRONMENT: beta
      PASSPORT_ACCEPTANCE_SURFACE: selfhost
  passport-callback-signer:
    environment:
      PASSPORT_ACCEPTANCE_SURFACE: selfhost
  passport-beta-bureau:
    environment:
      PASSPORT_ACCEPTANCE_SURFACE: selfhost
