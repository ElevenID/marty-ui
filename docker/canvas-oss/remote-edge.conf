# Public TLS terminates on the same dedicated host; no cloud load balancer.
server {
    listen 8080;
    server_name canvas-test.elevenidllc.com;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://canvas-test.elevenidllc.com$request_uri; }
}
server {
    listen 3000;
    listen 443 ssl;
    server_name canvas-test.elevenidllc.com;
    ssl_certificate /etc/canvas-tls/fullchain.pem;
    ssl_certificate_key /etc/canvas-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100M;
    location / {
        proxy_pass http://canvas-web:80;
        proxy_http_version 1.1;
        proxy_set_header Host canvas-test.elevenidllc.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host canvas-test.elevenidllc.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }
}
