# Shared complete native issuance owner. No routing, public ports or project resources.
# Kept at repository root so build/context and relative paths retain beta semantics.
services:
  issuance-native:
    extends:
      file: docker-compose.service.issuance-native-runtime.yml
      service: issuance-native
    environment:
      GRPC_SERVICE_TOKEN: ${GRPC_SERVICE_TOKEN:?GRPC_SERVICE_TOKEN must be set for beta Rust services}
      ENVIRONMENT: beta
      ISSUANCE_SERVICE_PORT: "8005"
      ISSUANCE_GRPC_ENABLED: "true"
      ISSUANCE_GRPC_PORT: "9005"
      DATABASE_URL: postgresql://marty:${MARTY_DB_PASSWORD:?MARTY_DB_PASSWORD must be set for beta}@postgres:5432/marty
      ISSUER_BASE_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL must be set for beta}
      ALLOWED_REDIRECT_URIS: ${ALLOWED_REDIRECT_URIS:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set for beta}
      TOKEN_HMAC_KEY: ${TOKEN_HMAC_KEY:?TOKEN_HMAC_KEY must be set for beta}
      ISSUANCE_API_KEY: ${ISSUANCE_API_KEY:?ISSUANCE_API_KEY must be set for beta}
      SIGNING_KEYS_ISSUER_SIGN_KEY: ${SIGNING_KEYS_ISSUER_SIGN_KEY:?SIGNING_KEYS_ISSUER_SIGN_KEY must be set for beta}
      SIGNING_KEYS_INTEGRATION_SECRET_KEY: ${SIGNING_KEYS_INTEGRATION_SECRET_KEY:?SIGNING_KEYS_INTEGRATION_SECRET_KEY must be set for beta}
      INTEGRATION_SECRET_KMS_URL: https://signing-keys:8018/internal
      INTEGRATION_SECRET_KMS_CA_FILE: /run/secrets/dev_integration_secret_ca
      PASSPORT_NATIVE_HTTP_ENABLED: ${PASSPORT_NATIVE_HTTP_ENABLED:-false}
      PASSPORT_INTERNAL_SERVICE_AUTH_ENABLED: ${PASSPORT_INTERNAL_SERVICE_AUTH_ENABLED:-false}
      PASSPORT_MANAGED_ISSUER_SIGNING_ENABLED: ${PASSPORT_MANAGED_ISSUER_SIGNING_ENABLED:-false}
      PASSPORT_KMS_ARTIFACTS_ENABLED: ${PASSPORT_KMS_ARTIFACTS_ENABLED:-false}
      PASSPORT_KMS_CALLBACKS_ENABLED: ${PASSPORT_KMS_CALLBACKS_ENABLED:-false}
      PASSPORT_TENANT_API_KEYS: ${PASSPORT_TENANT_API_KEYS:-}
      PASSPORT_TENANT_API_KEYS_FILE: ${PASSPORT_TENANT_API_KEYS_FILE:-}
      PERSONALIZATION_BUREAU_URL: ${PERSONALIZATION_BUREAU_URL:-}
      PERSONALIZATION_BUREAU_API_KEY: ${PERSONALIZATION_BUREAU_API_KEY:-}
      PERSONALIZATION_BUREAU_PROVIDER_PROFILE_ID: ${PERSONALIZATION_BUREAU_PROVIDER_PROFILE_ID:-}
      SIGNING_KEYS_INTERNAL_URL: http://gateway:8000/internal/signing-keys
      SIGNING_KEYS_INTERNAL_API_KEY: ${SIGNING_KEYS_INTERNAL_API_KEY:?SIGNING_KEYS_INTERNAL_API_KEY must be set for beta}
      REVOCATION_PROFILE_SERVICE_URL: http://revocation-profile:8013
      # Keep initiation's control-plane ports equal to the legacy service.
      ORG_GRPC_TARGET: organization:9002
      CT_GRPC_TARGET: credential-template:9003
      RP_GRPC_TARGET: revocation-profile:9013
      CREDENTIAL_TEMPLATE_SERVICE_URL: http://credential-template:8003
      # Initiation also serves ordinary/VC-API callers. Preserve their exact
      # operator-authorized resources; an empty value remains fail-closed.
      VCDM_RELATED_RESOURCE_URLS: ${VCDM_RELATED_RESOURCE_URLS:-}
      # Match legacy issuance resolution without enabling private wallet endpoints.
      # Authcrypt policy and conformance CA mounts remain separate explicit overlays.
      ISSUANCE_OFFER_TTL_MINUTES: ${ISSUANCE_OFFER_TTL_MINUTES:-10080}
      ISSUANCE_AUTH_SESSION_TTL_MINUTES: ${ISSUANCE_AUTH_SESSION_TTL_MINUTES:-60}
      # Preserve the legacy Compose token limiter's operator-selected capacity.
      TOKEN_RATE_LIMIT: ${TOKEN_RATE_LIMIT:-30}
      UNIVERSAL_RESOLVER_URL: ${UNIVERSAL_RESOLVER_URL:-}
      DIDCOMM_DID_WEB_INTERNAL_BASE_URL: ${DIDCOMM_DID_WEB_INTERNAL_BASE_URL:-http://gateway:8000}
      DIDCOMM_ALLOW_PRIVATE_IPS: ${DIDCOMM_ALLOW_PRIVATE_IPS:-false}
      MARTY_RELEASE_VERSION: ${MARTY_RELEASE_VERSION:-development}
      MARTY_UI_SHA: ${MARTY_UI_SHA:-unknown}
      RUST_LOG: ${ISSUANCE_NATIVE_RUST_LOG:-info}
    secrets:
      - dev_integration_secret_ca
    networks:
      - marty-network
