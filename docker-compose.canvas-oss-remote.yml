# Dedicated remote host only. Bounded 8 GiB pilot; actual bootstrap/workload qualification required.
# Same published stock image/config/lifecycle, no Canvas source change or image build.
x-canvas-environment:
  RAILS_ENV: production
  CANVAS_LMS_ADMIN_EMAIL: ${CANVAS_OSS_ADMIN_EMAIL:?CANVAS_OSS_ADMIN_EMAIL is required}
  CANVAS_LMS_ACCOUNT_NAME: ElevenID Canvas OSS Portability
  CANVAS_LMS_STATS_COLLECTION: opt_out
  POSTGRES_PASSWORD_FILE: /run/secrets/canvas_postgres_password
  CANVAS_DOMAIN: canvas-test.elevenidllc.com
  RAILS_HOST_WITH_PORT: canvas-test.elevenidllc.com
  RAILS_SERVE_STATIC_FILES: 'true'
x-canvas-volumes: &id001
- ${CANVAS_OSS_CONFIG_DIR:?CANVAS_OSS_CONFIG_DIR is required}/database.yml:/usr/src/app/config/database.yml:ro
- ${CANVAS_OSS_CONFIG_DIR:?CANVAS_OSS_CONFIG_DIR is required}/redis.yml:/usr/src/app/config/redis.yml:ro
- ${CANVAS_OSS_CONFIG_DIR:?CANVAS_OSS_CONFIG_DIR is required}/cache_store.yml:/usr/src/app/config/cache_store.yml:ro
- ${CANVAS_OSS_CONFIG_DIR:?CANVAS_OSS_CONFIG_DIR is required}/domain.yml:/usr/src/app/config/domain.yml:ro
- ${CANVAS_OSS_CONFIG_DIR:?CANVAS_OSS_CONFIG_DIR is required}/outgoing_mail.yml:/usr/src/app/config/outgoing_mail.yml:ro
- ${CANVAS_OSS_CONFIG_DIR:?CANVAS_OSS_CONFIG_DIR is required}/security.yml:/usr/src/app/config/security.yml:ro
- ${CANVAS_OSS_CONFIG_DIR:?CANVAS_OSS_CONFIG_DIR is required}/session_store.yml:/usr/src/app/config/session_store.yml:ro
- ${CANVAS_OSS_CONFIG_DIR:?CANVAS_OSS_CONFIG_DIR is required}/delayed_jobs.yml:/usr/src/app/config/delayed_jobs.yml:ro
- ${CANVAS_OSS_CONFIG_DIR:?CANVAS_OSS_CONFIG_DIR is required}/dynamic_settings.yml:/usr/src/app/config/dynamic_settings.yml:ro
- canvas_oss_files:/usr/src/app/tmp/files
- canvas_oss_log:/usr/src/app/log
services:
  canvas-postgres:
    restart: unless-stopped
    image: ${CANVAS_OSS_POSTGRES_IMAGE:?CANVAS_OSS_POSTGRES_IMAGE must be an immutable
      digest reference}
    container_name: marty-canvas-oss-postgres
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/canvas_postgres_password
    secrets:
    - canvas_postgres_password
    volumes:
    - canvas_oss_postgres:/var/lib/postgresql/data
    networks:
    - canvas-oss-private
    mem_limit: 512m
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      interval: 5s
      timeout: 5s
      retries: 30
    platform: linux/amd64
    memswap_limit: 1g
    pids_limit: 256
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
  canvas-redis:
    restart: unless-stopped
    image: ${CANVAS_OSS_REDIS_IMAGE:?CANVAS_OSS_REDIS_IMAGE must be an immutable digest
      reference}
    container_name: marty-canvas-oss-redis
    # Explicit Mount API: bounded cache only; never an inherited anonymous disk volume.
    volumes:
    - type: tmpfs
      target: /data
      tmpfs:
        size: 67108864
        mode: 1023 # decimal 01777
    networks:
    - canvas-oss-private
    mem_limit: 128m
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 30
    platform: linux/amd64
    memswap_limit: 256m
    pids_limit: 256
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
  canvas-mail:
    restart: unless-stopped
    image: ${CANVAS_OSS_MAILPIT_IMAGE:?CANVAS_OSS_MAILPIT_IMAGE must be an immutable
      digest reference}
    container_name: marty-canvas-oss-mail
    networks:
    - canvas-oss-private
    mem_limit: 64m
    platform: linux/amd64
    memswap_limit: 128m
    pids_limit: 256
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
  canvas-lifecycle:
    profiles:
    - lifecycle
    image: ${CANVAS_OSS_IMAGE:?CANVAS_OSS_IMAGE must be an immutable digest reference}
    environment:
      RAILS_ENV: production
      CANVAS_LMS_ADMIN_EMAIL: ${CANVAS_OSS_ADMIN_EMAIL:?CANVAS_OSS_ADMIN_EMAIL is
        required}
      CANVAS_LMS_ACCOUNT_NAME: ElevenID Canvas OSS Portability
      CANVAS_LMS_STATS_COLLECTION: opt_out
      POSTGRES_PASSWORD_FILE: /run/secrets/canvas_postgres_password
      CANVAS_DOMAIN: canvas-test.elevenidllc.com
      RAILS_HOST_WITH_PORT: canvas-test.elevenidllc.com
      RAILS_SERVE_STATIC_FILES: 'true'
      PASSENGER_MAX_POOL_SIZE: '1'
      PASSENGER_MIN_INSTANCES: '1'
      NGINX_WORKER_COUNT: '1'
    secrets:
    - canvas_admin_password
    - canvas_postgres_password
    volumes: *id001
    networks:
    - canvas-oss-private
    mem_limit: 4g
    depends_on:
      canvas-postgres:
        condition: service_healthy
      canvas-redis:
        condition: service_healthy
    platform: linux/amd64
    memswap_limit: 6g
    pids_limit: 256
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
  canvas-web:
    restart: unless-stopped
    image: ${CANVAS_OSS_IMAGE:?CANVAS_OSS_IMAGE must be an immutable digest reference}
    container_name: marty-canvas-oss-web
    environment:
      RAILS_ENV: production
      CANVAS_LMS_ADMIN_EMAIL: ${CANVAS_OSS_ADMIN_EMAIL:?CANVAS_OSS_ADMIN_EMAIL is
        required}
      CANVAS_LMS_ACCOUNT_NAME: ElevenID Canvas OSS Portability
      CANVAS_LMS_STATS_COLLECTION: opt_out
      POSTGRES_PASSWORD_FILE: /run/secrets/canvas_postgres_password
      CANVAS_DOMAIN: canvas-test.elevenidllc.com
      RAILS_HOST_WITH_PORT: canvas-test.elevenidllc.com
      RAILS_SERVE_STATIC_FILES: 'true'
      PASSENGER_MAX_POOL_SIZE: '1'
      PASSENGER_MIN_INSTANCES: '1'
      NGINX_WORKER_COUNT: '1'
    secrets:
    - canvas_postgres_password
    volumes: *id001
    networks:
    - canvas-oss-private
    mem_limit: 3g
    depends_on:
      canvas-postgres:
        condition: service_healthy
      canvas-redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - curl --fail --silent --show-error http://127.0.0.1/health_check >/dev/null
      interval: 10s
      timeout: 10s
      retries: 42
      start_period: 120s
    platform: linux/amd64
    memswap_limit: 4g
    pids_limit: 256
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
  canvas-jobs:
    restart: unless-stopped
    image: ${CANVAS_OSS_IMAGE:?CANVAS_OSS_IMAGE must be an immutable digest reference}
    container_name: marty-canvas-oss-jobs
    command:
    - bundle
    - exec
    - script/delayed_job
    - run
    environment:
      RAILS_ENV: production
      CANVAS_LMS_ADMIN_EMAIL: ${CANVAS_OSS_ADMIN_EMAIL:?CANVAS_OSS_ADMIN_EMAIL is
        required}
      CANVAS_LMS_ACCOUNT_NAME: ElevenID Canvas OSS Portability
      CANVAS_LMS_STATS_COLLECTION: opt_out
      POSTGRES_PASSWORD_FILE: /run/secrets/canvas_postgres_password
      CANVAS_DOMAIN: canvas-test.elevenidllc.com
      RAILS_HOST_WITH_PORT: canvas-test.elevenidllc.com
      RAILS_SERVE_STATIC_FILES: 'true'
      PASSENGER_MAX_POOL_SIZE: '1'
      PASSENGER_MIN_INSTANCES: '1'
      NGINX_WORKER_COUNT: '1'
    secrets:
    - canvas_postgres_password
    volumes: *id001
    networks:
    - canvas-oss-private
    mem_limit: 1g
    depends_on:
      canvas-web:
        condition: service_healthy
    platform: linux/amd64
    memswap_limit: 2g
    pids_limit: 256
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
  canvas-edge:
    restart: unless-stopped
    image: ${CANVAS_OSS_EDGE_IMAGE:?CANVAS_OSS_EDGE_IMAGE must be an immutable digest
      reference}
    container_name: marty-canvas-oss-edge
    volumes:
    - ./docker/canvas-oss/remote-edge.conf:/etc/nginx/conf.d/default.conf:ro
    - ${CANVAS_OSS_TLS_DIR:?CANVAS_OSS_TLS_DIR is required}:/etc/canvas-tls:ro
    - ${CANVAS_OSS_ACME_DIR:?CANVAS_OSS_ACME_DIR is required}:/var/www/acme:ro
    networks:
    - canvas-oss-private
    mem_limit: 64m
    depends_on:
      canvas-web:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget --quiet --tries=1 --spider http://127.0.0.1:3000/health_check
      interval: 5s
      timeout: 5s
      retries: 30
    platform: linux/amd64
    memswap_limit: 128m
    pids_limit: 256
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    ports:
    - 80:8080
    - 443:443
networks:
  canvas-oss-private: {}
volumes:
  canvas_oss_postgres: null
  canvas_oss_files: null
  canvas_oss_log: null
secrets:
  canvas_admin_password:
    file: ${CANVAS_OSS_SECRET_DIR:?CANVAS_OSS_SECRET_DIR is required}/canvas-admin-password
  canvas_postgres_password:
    file: ${CANVAS_OSS_SECRET_DIR:?CANVAS_OSS_SECRET_DIR is required}/canvas-postgres-password
