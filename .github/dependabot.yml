version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "04:00"
      timezone: "America/Denver"
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
      day: sunday
      time: "05:00"
      timezone: "America/Denver"
    open-pull-requests-limit: 5
    groups:
      ui-development:
        dependency-type: development
        patterns: ["*"]
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3

  - package-ecosystem: npm
    directory: /tests
    schedule:
      interval: weekly
      day: sunday
      time: "06:00"
      timezone: "America/Denver"
    groups:
      browser-tests:
        patterns: ["*"]
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /tests/canvas-oss-contract
    schedule:
      interval: weekly
      day: sunday
      time: "07:00"
      timezone: "America/Denver"
    groups:
      canvas-contract:
        patterns: ["*"]
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 3

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "08:00"
      timezone: "America/Denver"
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns: ["*"]
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3

  - package-ecosystem: pip
    directory: /docker/canvas-sandbox
    schedule:
      interval: weekly
      day: sunday
      time: "09:00"
      timezone: "America/Denver"
    open-pull-requests-limit: 3
    groups:
      canvas-python-dependencies:
        patterns: ["*"]
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
