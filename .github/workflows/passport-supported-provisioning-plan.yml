name: Passport Supported Disposable Provisioning Plan

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Official stack release at this protected main commit.
        required: true
      surface:
        description: Disposable supported consumer surface.
        required: true
        type: choice
        options: [base, selfhost]

concurrency:
  group: passport-supported-provisioning-plan
  cancel-in-progress: false

jobs:
  plan:
    permissions:
      actions: read
      contents: read
      attestations: write
      id-token: write
      packages: read
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: beta-lifecycle
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      SURFACE: ${{ inputs.surface }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify official aggregate release and write blocked plan
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/passport-supported-plan-release-$GITHUB_RUN_ID"
          mkdir -p "$release_dir"
          gh release download "$RELEASE_TAG" --repo ElevenID/marty-ui \
            --pattern stack-manifest.json --pattern SHA256SUMS --dir "$release_dir"
          python3 scripts/passport_supported_provisioning_plan.py \
            --surface "$SURFACE" \
            --stack-manifest "$release_dir/stack-manifest.json" \
            --output "passport-supported-provisioning-plan-$GITHUB_RUN_ID.json"
          jq -e '.schema == "marty.passport-supported-provisioning-plan/v1"
            and .status == "blocked" and .run_id == env.GITHUB_RUN_ID
            and .source_commit == env.GITHUB_SHA' \
            "passport-supported-provisioning-plan-$GITHUB_RUN_ID.json"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: passport-supported-provisioning-plan-${{ github.run_id }}.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: passport-supported-provisioning-plan-${{ github.run_id }}
          path: passport-supported-provisioning-plan-${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 30
