name: Refresh UI Test Timings

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: refresh-ui-test-timings-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh UI Test Timings
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Download timing observations
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: ui-vitest-timing-*
          path: ${{ runner.temp }}/ui-vitest-timings
          merge-multiple: true
      - name: Check for timing observations
        id: observations
        if: steps.download.outcome == 'success'
        shell: bash
        env:
          TIMINGS_DIRECTORY: ${{ runner.temp }}/ui-vitest-timings
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readdirSync } from 'node:fs'

          let entries = []
          try {
            entries = readdirSync(process.env.TIMINGS_DIRECTORY, { recursive: true, withFileTypes: true })
          } catch (error) {
            if (error.code !== 'ENOENT') throw error
          }
          const available = entries.some(entry => entry.isFile() && entry.name.endsWith('.json'))
          appendFileSync(process.env.GITHUB_OUTPUT, `available=${available}\n`)
          if (!available) console.log('No UI timing reports were produced; skipping timing refresh.')
          NODE
      - name: Produce refreshed timing plan
        if: steps.observations.outputs.available == 'true'
        run: >-
          node ui/scripts/update-vitest-timings.mjs
          "${{ runner.temp }}/ui-vitest-timings"
          --output "${{ runner.temp }}/ui-vitest.json"
      - name: Upload refreshed timing plan
        if: steps.observations.outputs.available == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ui-vitest-timings-refreshed
          path: ${{ runner.temp }}/ui-vitest.json
          retention-days: 14
