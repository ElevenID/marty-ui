name: Release tag handoff

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect first; capability qualification must pass before a release claim
        required: true
        default: inspect
        type: choice
        options: [inspect, qualify-capability, create-qualified-tag]
      promotion_run_id:
        description: Original first-attempt Stack release currently waiting for its tag
        required: false
        type: string
      claim_run_id:
        description: Successful exact-source claim for that original candidate
        required: false
        type: string

# Do not share the waiting CD's stack-release-claim group: that would deadlock
# the operator behind the publisher that requires its successful receipt.
concurrency:
  group: release-tag-operator-${{ inputs.promotion_run_id || 'capability' }}
  cancel-in-progress: false

permissions: {}

jobs:
  handoff:
    if: github.repository == 'ElevenID/marty-ui' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: stack-release
    permissions:
      contents: write
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        if: inputs.mode == 'create-qualified-tag'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        if: inputs.mode == 'create-qualified-tag'
      - name: Prepare the existing installer-pinned publication verifier
        if: inputs.mode == 'create-qualified-tag'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          verifier="$RUNNER_TEMP/operator-gh"
          mkdir "$verifier"
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
            --connect-timeout 20 --max-time 120 --max-filesize 15031001 \
            https://github.com/cli/cli/releases/download/v2.103.2/gh_2.103.2_linux_amd64.tar.gz \
            --output "$verifier/gh.tar.gz"
          test "$(stat -c %s "$verifier/gh.tar.gz")" = 15031001
          printf '%s  %s\n' 62ccf747115ddc61237efffdde66a3c8f70ba249433dc64f70801089b59c59c8 "$verifier/gh.tar.gz" | sha256sum --check --strict
          tar -xzf "$verifier/gh.tar.gz" --no-same-owner --no-same-permissions -C "$verifier" gh_2.103.2_linux_amd64/bin/gh
          chmod 700 "$verifier/gh_2.103.2_linux_amd64/bin/gh"
      - name: Inspect or perform the exact bounded operator action
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          PROMOTION_RUN_ID: ${{ inputs.promotion_run_id }}
          CLAIM_RUN_ID: ${{ inputs.claim_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          args=(--mode "$MODE" --promotion-run-id "$PROMOTION_RUN_ID" --claim-run-id "$CLAIM_RUN_ID"
                --output "$RUNNER_TEMP/tag-handoff-result.json")
          if [[ "$MODE" == create-qualified-tag ]]; then
            args+=(--gh "$RUNNER_TEMP/operator-gh/gh_2.103.2_linux_amd64/bin/gh"
                   --cosign "$(command -v cosign)")
          fi
          python scripts/push_promoted_release_tag.py "${args[@]}"
      - name: Preserve the actual operator result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: stack-release-tag-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tag-handoff-result.json
          if-no-files-found: error
          retention-days: 90
      - name: Preserve public API outcomes and verification observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: stack-release-tag-operator-observations-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/operator-api-receipt.json
          if-no-files-found: error
          retention-days: 90
