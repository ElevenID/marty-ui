name: Warm CI Caches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/warm-ci-caches.yml
      - Cargo.lock
      - rust/**
      - proto/**
      - contracts/**
      - scripts/load-secrets-env.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-ci-caches-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Warm Rust cache
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_RW_MODE: READ_WRITE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: clippy
      - name: Use mold linker
        uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3
        with:
          mold-version: 2.41.0
      - name: Enable compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Compile Rust service tests
        working-directory: rust
        run: cargo test --locked --workspace --no-run
      - name: Warm clippy cache
        working-directory: rust
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Report compiler cache effectiveness
        if: always()
        run: sccache --show-stats

  images:
    name: Warm Rust service image cache
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Expose compiler cache credentials to BuildKit secrets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            const url = process.env.ACTIONS_RESULTS_URL;
            if (!token || !url) throw new Error('GitHub compiler cache credentials are unavailable');
            core.setSecret(token);
            core.exportVariable('SCCACHE_GHA_RUNTIME_TOKEN', token);
            core.exportVariable('SCCACHE_GHA_CACHE_URL', url);
            core.exportVariable('SCCACHE_GHA_RW_MODE', 'READ_WRITE');
      - name: Warm shared image layers
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: rust/services/Dockerfile.ci
          target: revocation_profile
          push: false
          build-args: |
            MARTY_RELEASE_VERSION=cache-warm
            MARTY_UI_SHA=${{ github.sha }}
          provenance: false
          cache-from: type=gha,scope=marty-ui-rust-service-images
          cache-to: type=gha,mode=max,scope=marty-ui-rust-service-images
          secret-envs: |
            sccache_token=SCCACHE_GHA_RUNTIME_TOKEN
            sccache_url=SCCACHE_GHA_CACHE_URL
            sccache_mode=SCCACHE_GHA_RW_MODE
