name: Warm CI Caches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/warm-ci-caches.yml
      - Cargo.lock
      - rust/**
      - proto/**
      - contracts/**
      - scripts/load-secrets-env.sh
      - scripts/ci/verify-release-cache.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-ci-caches-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Warm Rust cache
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_RW_MODE: READ_WRITE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.95.0
          components: clippy
      - name: Use mold linker
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621
        with:
          mold-version: 2.41.0
      - name: Enable compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Compile Rust service tests
        working-directory: rust
        run: cargo test --locked --workspace --no-run
      - name: Warm clippy cache
        working-directory: rust
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Report compiler cache effectiveness
        if: always()
        run: sccache --show-stats

  images:
    name: Warm Rust service image cache
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Expose compiler cache credentials to BuildKit secrets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            const url = process.env.ACTIONS_RESULTS_URL;
            if (!token || !url) throw new Error('GitHub compiler cache credentials are unavailable');
            core.setSecret(token);
            core.exportVariable('SCCACHE_GHA_RUNTIME_TOKEN', token);
            core.exportVariable('SCCACHE_GHA_CACHE_URL', url);
            core.exportVariable('SCCACHE_GHA_RW_MODE', 'READ_WRITE');
      - name: Verify release compiler cache storage across daemons
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: rust/services/Dockerfile.ci
          target: cache_probe
          push: false
          provenance: false
          build-args: |
            CACHE_PROBE_NONCE=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=marty-ui-rust-service-images
          secret-envs: |
            sccache_token=SCCACHE_GHA_RUNTIME_TOKEN
            sccache_url=SCCACHE_GHA_CACHE_URL
            sccache_mode=SCCACHE_GHA_RW_MODE
      - name: Warm shared image layers
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: rust/services/Dockerfile.ci
          target: revocation_profile
          push: false
          build-args: |
            MARTY_RELEASE_VERSION=cache-warm
            MARTY_UI_SHA=${{ github.sha }}
          provenance: false
          cache-from: type=gha,scope=marty-ui-rust-service-images
          cache-to: type=gha,mode=max,scope=marty-ui-rust-service-images
          secret-envs: |
            sccache_token=SCCACHE_GHA_RUNTIME_TOKEN
            sccache_url=SCCACHE_GHA_CACHE_URL
            sccache_mode=SCCACHE_GHA_RW_MODE
