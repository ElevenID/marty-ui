name: Warm CI Caches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/warm-ci-caches.yml
      - Cargo.lock
      - rust/**
      - proto/**
      - scripts/load-secrets-env.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-ci-caches-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Warm Rust cache
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_RW_MODE: READ_WRITE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.95.0
          components: clippy
      - name: Use mold linker
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444
        with:
          mold-version: 2.41.0
      - name: Enable compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Compile Rust service tests
        working-directory: rust
        run: cargo test --locked --workspace --no-run
      - name: Warm clippy cache
        working-directory: rust
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Report compiler cache effectiveness
        if: always()
        run: sccache --show-stats

  images:
    name: Warm Rust service image cache
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Warm shared image layers
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: rust/services/Dockerfile.ci
          target: revocation_profile
          push: false
          build-args: |
            MARTY_RELEASE_VERSION=cache-warm
            MARTY_UI_SHA=${{ github.sha }}
          provenance: false
          cache-from: type=gha,scope=marty-ui-rust-service-images
          cache-to: type=gha,mode=max,scope=marty-ui-rust-service-images
