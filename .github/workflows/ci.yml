              >"$RUNNER_TEMP/rust-gateway.log" 2>&1
            printf '%s\n' "$?" >"$RUNNER_TEMP/rust-gateway.status"
          ) &
          pids+=("$!")

          status=0
          for index in "${!names[@]}"; do
            wait "${pids[$index]}"
            name="${names[$index]}"
            printf '\n===== %s =====\n' "$name"
            cat "$RUNNER_TEMP/rust-$name.log"
            if [[ "$(cat "$RUNNER_TEMP/rust-$name.status")" != 0 ]]; then
