            printf '%s\n' "$?" >"$RUNNER_TEMP/rust-workspace.status"
          ) &
          pids+=("$!")
          (
            set +e
            VERIFICATION_SESSION_TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/marty_verification_contract \
              run_timed verification target/debug/verification-postgres-contract \
