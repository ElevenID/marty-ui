            --env POSTGRES_PASSWORD=marty-test \
            --env POSTGRES_DB=marty \
            postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f \
            >/dev/null
          for attempt in {1..60}; do
            if docker exec "$postgres" pg_isready --username marty --dbname marty >/dev/null; then
              break
            fi
            if [[ "$attempt" == 60 ]]; then
              docker logs "$postgres"
              exit 1
            fi
            sleep 0.5
          done
          docker run --detach \
            --name "$service" \
            --network "$network" \
            --env ENVIRONMENT=test \
            --env DATABASE_URL=postgresql://marty:marty-test@credential-template-postgres/marty \
            --env PUBLIC_API_URL=https://issuer.example \
            --env MARTY_MIGRATION_PROFILE=test \
            --env CREDENTIAL_TEMPLATE_DEPENDENCY_TIMEOUT_SECONDS=1 \
            --publish 127.0.0.1::8003 \
            marty-credential-template:ci \
            >/dev/null
          port="$(docker inspect \
            --format '{{(index (index .NetworkSettings.Ports "8003/tcp") 0).HostPort}}' \
            "$service")"
          for attempt in {1..60}; do
            if curl --fail --silent "http://127.0.0.1:${port}/health" \
                | grep --extended-regexp --quiet '"status":"(healthy|degraded)"' \
