  public-protocol-contract:
    name: Public Protocol Contract
    needs: changes
    if: >-
      needs.changes.outputs.ui == 'true' ||
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require immutable protocol revision
        shell: bash
        run: |
          if [[ ! "$MARTY_PROTOCOL_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "MARTY_PROTOCOL_REF must be a full 40-character commit SHA." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: Marty-Protocol/Marty-Protocol
          ref: ${{ env.MARTY_PROTOCOL_REF }}
          path: marty-protocol
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.11.3"
          enable-cache: true
          save-cache: false
          cache-dependency-glob: |
            requirements-services.txt
            release/stack-lock.json
          cache-suffix: python-services
      - name: Install contract-check dependencies
        run: uv pip install --system -r requirements-services.txt 'jsonschema[format]>=4.23'
      - name: Enforce public response contract
        run: python scripts/check_gateway_public_protocol_contract.py --protocol-root marty-protocol
      - name: Exercise console-free public edge routing
        run: |
          docker pull nginx@sha256:582c496ccf79d8aa6f8203a79d32aaf7ffd8b13362c60a701a2f9ac64886c93d
          python scripts/probe_selfhost_api_only_edge.py
      - name: Enforce pinned public OpenAPI schemas
        run: python scripts/generate_public_openapi_schemas.py --protocol-root marty-protocol --check
      - name: Test public schemas and executable examples
        run: python -m pytest tests/test_public_openapi_schemas.py tests/test_protocol_consumer_example.py -q

  test-release-contracts:
    name: Release Contract Tests
    needs: changes
    if: >-
      needs.changes.outputs.release == 'true' ||
      needs.changes.outputs.verification == 'true' ||
      needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      PYTHONPATH: packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.10"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.11.3"
          enable-cache: true
          save-cache: false
          cache-dependency-glob: |
            requirements-services.txt
            release/stack-lock.json
          cache-suffix: python-services
      - name: Install released test dependencies
        shell: bash
        run: |
          set -euo pipefail
          marty_rs_uri="$(jq -er '.components[] | select(.name == "marty-core-python") | .artifacts[] | select(.type == "python") | .uri' release/stack-lock.json)"
          marty_rs_digest="$(jq -er '.components[] | select(.name == "marty-core-python") | .artifacts[] | select(.type == "python") | .digest' release/stack-lock.json)"
          marty_rs_wheel="$RUNNER_TEMP/${marty_rs_uri##*/}"
          verification_uri="$(jq -er '.components[] | select(.name == "marty-verification-python") | .artifacts[] | select(.type == "python") | .uri' release/stack-lock.json)"
          verification_digest="$(jq -er '.components[] | select(.name == "marty-verification-python") | .artifacts[] | select(.type == "python") | .digest' release/stack-lock.json)"
          verification_wheel="$RUNNER_TEMP/${verification_uri##*/}"
          iso18013_uri="$(jq -er '.components[] | select(.name == "marty-iso18013-python") | .artifacts[] | select(.type == "python") | .uri' release/stack-lock.json)"
          iso18013_digest="$(jq -er '.components[] | select(.name == "marty-iso18013-python") | .artifacts[] | select(.type == "python") | .digest' release/stack-lock.json)"
          iso18013_wheel="$RUNNER_TEMP/${iso18013_uri##*/}"
          curl --fail --location --silent --show-error --connect-timeout 15 --max-time 60 --retry 5 --retry-delay 2 --retry-max-time 120 "$marty_rs_uri" --output "$marty_rs_wheel"
          curl --fail --location --silent --show-error --connect-timeout 15 --max-time 60 --retry 5 --retry-delay 2 --retry-max-time 120 "$verification_uri" --output "$verification_wheel"
          curl --fail --location --silent --show-error --connect-timeout 15 --max-time 60 --retry 5 --retry-delay 2 --retry-max-time 120 "$iso18013_uri" --output "$iso18013_wheel"
          echo "${marty_rs_digest#sha256:}  $marty_rs_wheel" | sha256sum --check --strict
          echo "${verification_digest#sha256:}  $verification_wheel" | sha256sum --check --strict
          echo "${iso18013_digest#sha256:}  $iso18013_wheel" | sha256sum --check --strict
          # Actual database execution remains in the isolated Rust/Docker gate.
          uv pip install --system pytest pytest-xdist==3.8.0 pytest-asyncio pyyaml 'jsonschema[format]>=4.23' cryptography playwright sqlalchemy httpx -r requirements-proto.txt "$marty_rs_wheel" "$verification_wheel" "$iso18013_wheel"
      - name: Install Python browser transport runtime
        if: needs.changes.outputs.rollback_test_only != 'true' && needs.changes.outputs.k8s_policy_test_only != 'true' && needs.changes.outputs.didcomm_release_test_only != 'true'
        run: python -m playwright install --with-deps --only-shell chromium
      - name: Verify released mdoc binding evidence contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import marty_iso18013
          import marty_verification
          from marty_rs import _marty_rs

          assert hasattr(marty_iso18013, "Session")
          assert hasattr(marty_verification, "ChainValidator")

          evidence_type = _marty_rs.MdocDocumentVerificationEvidence
          for attribute in (
              "document_type",
              "signature_algorithm",
              "digest_algorithm",
              "signed_at",
              "valid_from",
              "valid_until",
              "issuer_certificate_sha256",
              "validity_checked",
              "valid_at_verification_time",
              "revocation_checked",
              "not_revoked",
          ):
              assert hasattr(evidence_type, attribute), attribute

          result = _marty_rs.verify_mdoc_presentation(
              b"\xff",
              bytes([0x83, 0xF6, 0xF6, 0x82, 0x71]),
              [],
          )
          assert result.issuer_signature_valid is False
          assert result.issuer_trusted is False
          assert result.device_authentication_valid is False
          assert result.document_evidence == []
          assert result.revocation_checked is False
          assert result.not_revoked is None
          assert result.error
          PY
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.95.0
      - name: Prepare Rust KMS operator for release contracts
        if: needs.changes.outputs.rollback_test_only != 'true' && needs.changes.outputs.didcomm_release_test_only != 'true'
        run: bash scripts/ci/prepare-native-model-operator.sh
      - name: Prepare Rust execution policy for release contracts
        if: needs.changes.outputs.rollback_test_only != 'true' && needs.changes.outputs.k8s_policy_test_only != 'true' && needs.changes.outputs.didcomm_release_test_only != 'true'
        run: bash scripts/ci/prepare-native-ci-execution.sh
      - name: Enforce OSS commerce boundary
        run: python scripts/check_oss_boundary.py
      - name: Require workflow policy test collection
        run: python -m pytest --collect-only -q tests/test_ci_workflow_performance.py
      - name: Run exact DIDComm test-source PR checks
        if: needs.changes.outputs.didcomm_release_test_only == 'true'
        run: >-
          python -m pytest
          tests/test_didcomm_native_consumer_ownership.py
          tests/test_ci_workflow_performance.py::test_didcomm_policy_test_sources_have_exact_release_owner
          -v --tb=short
      - name: Run rollback-test-owned PR checks
        if: needs.changes.outputs.rollback_test_only == 'true'
        run: >-
          python -m pytest tests/test_beta_worker_launch_rollback.py
          tests/test_ci_workflow_performance.py -v --tb=short
      - name: Run Kubernetes policy test-source PR checks
        if: needs.changes.outputs.k8s_policy_test_only == 'true'
        run: >-
          python -m pytest
          tests/test_issuance_consumer_bindings.py
          tests/test_kubernetes_app_service_coverage.py
          tests/test_check_kubernetes_services_release.py
          tests/test_kubernetes_token_hmac_secret.py
          tests/test_passport_supported_k8s_deployment.py
          tests/test_passport_supported_consumer_routing.py
          tests/test_ci_workflow_performance.py -v --tb=short
      - name: Prepare source-only deployment registry renderer
        if: needs.changes.outputs.rollback_test_only != 'true' && needs.changes.outputs.k8s_policy_test_only != 'true' && needs.changes.outputs.didcomm_release_test_only != 'true'
        run: bash scripts/ci/install-compose-renderer.sh
      - name: Run repository release checks
        if: needs.changes.outputs.rollback_test_only != 'true' && needs.changes.outputs.k8s_policy_test_only != 'true' && needs.changes.outputs.didcomm_release_test_only != 'true'
        env:
          MARTY_COMPOSE_RENDERER: ${{ runner.temp }}/compose-render-v5.4.0
        shell: bash
        run: |
          set -euo pipefail
          printf 'release-contract memory counters before:\n'
          cat /sys/fs/cgroup/memory.events 2>/dev/null || true
          grep '^oom_kill ' /proc/vmstat 2>/dev/null || true
          trap 'status=$?; printf "release-contract memory counters after:\n"; cat /sys/fs/cgroup/memory.events 2>/dev/null || true; grep "^oom_kill " /proc/vmstat 2>/dev/null || true; exit "$status"' EXIT
          python -X faulthandler -m pytest tests -n 2 -v --tb=short --durations=20
      - name: Exercise root-owned disposable TLS staging contracts
        if: needs.changes.outputs.rollback_test_only != 'true' && needs.changes.outputs.k8s_policy_test_only != 'true' && needs.changes.outputs.didcomm_release_test_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python_bin="$(command -v python)"
          report="$RUNNER_TEMP/selfhost-root-tls-contracts.xml"
          sudo env PYTHONPATH=packages PYTHONDONTWRITEBYTECODE=1 "$python_bin" -m pytest -q \
            tests/test_provision_selfhost_disposable_tls.py::test_stages_only_public_tls_outputs_into_existing_private_root \
            tests/test_provision_selfhost_disposable_tls.py::test_ownership_failure_removes_all_staged_tls_inputs \
            tests/test_provision_selfhost_disposable_tls.py::test_metadata_cleanup_failure_still_rolls_back_all_secrets \
            tests/test_provision_selfhost_disposable_tls.py::test_timeout_cleanup_retains_id_only_if_removal_fails \
            -p no:cacheprovider --junitxml="$report"
          python - "$report" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          suite = ET.parse(sys.argv[1]).getroot()
          if suite.tag == "testsuites":
              suite = suite.find("testsuite")
          if suite is None or suite.tag != "testsuite":
              raise SystemExit("root-owned TLS test report is missing")
          cases = list(suite.iter("testcase"))
          if (len(cases) != 6 or any(
              int(suite.attrib.get(name, "-1")) != expected
              for name, expected in (("tests", 6), ("skipped", 0),
                                     ("failures", 0), ("errors", 0))
          )):
              raise SystemExit("root-owned TLS cases did not all execute and pass")
          PY
      - name: Exercise root-owned fresh VM creation contracts
        if: needs.changes.outputs.rollback_test_only != 'true' && needs.changes.outputs.k8s_policy_test_only != 'true' && needs.changes.outputs.didcomm_release_test_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-utils ubuntu-keyring cloud-image-utils openssh-client cloud-init
          stat -c 'Ubuntu cloud-image keyring: %F uid=%u mode=%a links=%h bytes=%s' /usr/share/keyrings/ubuntu-cloudimage-keyring.gpg
          dpkg-query -W -f='ubuntu-keyring version: ${Version}\n' ubuntu-keyring
          python_bin="$(command -v python)"
          report="$RUNNER_TEMP/installer-root-vm-creation.xml"
          sudo env PYTHONPATH=packages PYTHONDONTWRITEBYTECODE=1 "$python_bin" -m pytest -q \
            tests/test_installer_candidate_vm_create.py \
            tests/test_installer_candidate_vm_runtime.py \
            tests/test_installer_candidate_vm_seed.py \
            tests/test_installer_candidate_vm_launch.py \
            tests/test_installer_candidate_vm_live_observe.py -p no:cacheprovider --junitxml="$report"
          python - "$report" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          suite = ET.parse(sys.argv[1]).getroot()
          if suite.tag == "testsuites":
              suite = suite.find("testsuite")
          if suite is None or suite.tag != "testsuite":
              raise SystemExit("root-owned VM creation test report is missing")
          cases = list(suite.iter("testcase"))
          if len(cases) != 52 or any(
              int(suite.attrib.get(name, "-1")) != expected
              for name, expected in (("tests", 52), ("skipped", 0),
                                     ("failures", 0), ("errors", 0))
          ):
              raise SystemExit("root-owned VM creation cases did not all execute and pass")
          PY
      - name: Configure the pinned containerd image store
        if: needs.changes.outputs.rollback_test_only != 'true' && needs.changes.outputs.k8s_policy_test_only != 'true' && needs.changes.outputs.didcomm_release_test_only != 'true'
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          version: v29.7.2
          daemon-config: |
            {
              "registry-mirrors": ["https://mirror.gcr.io"],
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Configure the pinned OCI exporter
        if: needs.changes.outputs.rollback_test_only != 'true' && needs.changes.outputs.k8s_policy_test_only != 'true' && needs.changes.outputs.didcomm_release_test_only != 'true'
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v6.2.0
        with:
          version: v0.36.1
          driver: docker-container
          driver-opts: image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
          buildkitd-config: .github/buildkit-ci-mirror.toml
      - name: Require the exact supported OCI backend
        if: needs.changes.outputs.rollback_test_only != 'true' && needs.changes.outputs.k8s_policy_test_only != 'true' && needs.changes.outputs.didcomm_release_test_only != 'true'
        env:
          MARTY_BUILDX_DRIVER: ${{ steps.buildx.outputs.driver }}
          MARTY_BUILDX_NODES_JSON: ${{ steps.buildx.outputs.nodes }}
        run: python scripts/check_verification_candidate_backend.py
      - name: Prove the same OCI archive through the future consumer path
        if: needs.changes.outputs.rollback_test_only != 'true' && needs.changes.outputs.k8s_policy_test_only != 'true' && needs.changes.outputs.didcomm_release_test_only != 'true'
        env:
          MARTY_RUN_VERIFICATION_CANDIDATE_DOCKER_TESTS: "1"
        run: >-
          python -m pytest -q tests/test_verification_candidate_build.py
          tests/test_verification_candidate_backend.py
          tests/test_verification_candidate_workflow.py
  test-credential-lifecycle-browser:
    name: MIP 0.5 Credential Lifecycle Browser Gate
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install UI dependencies
        working-directory: ui
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/scripts/ci/download-verified-ui-release-assets.sh"
          bun pm pkg set "dependencies.@elevenid/marty-api-core=file:$RUNNER_TEMP/marty-api-core.tgz"
          bun pm pkg set "dependencies.@elevenid/marty-blog=file:$RUNNER_TEMP/marty-blog.tgz"
          bun install
      - name: Install Playwright dependencies
        working-directory: tests
        run: npm ci
      - name: Restore pinned Chromium headless shell
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-headless-${{ hashFiles('tests/package-lock.json') }}
      - name: Install pinned Chromium headless shell
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: tests
        run: npx playwright install --only-shell chromium
      - name: Verify pinned Chromium runtime dependencies
        timeout-minutes: 5
        working-directory: tests
        run: node scripts/verify-pinned-playwright-browser.js
      - name: Verify production CSP permits Rust WASM but blocks JavaScript eval
        working-directory: tests
        run: node --test scripts/ui-wasm-csp.test.js
      - name: Build and verify the public demo platform
        working-directory: tests
        run: npm run test:demo-platform
      - name: Run deterministic credential lifecycle gate
        working-directory: tests
        run: npx playwright test --config playwright.applicant-wallet.config.js
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mip-03-credential-lifecycle-browser
          path: |
            tests/test-results/
            tests/playwright-report-applicant-wallet/
            tests/artifacts/demo-platform-playwright/
            tests/artifacts/demo-platform-playwright-report/
          retention-days: 14

  security:
    name: Security Scanning
    needs: changes
    if: needs.changes.outputs.security == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.11.3"
          enable-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install scanners
        run: uv pip install --system bandit semgrep pip-audit
      - name: Run security scans concurrently
        shell: bash
        env:
          SEMGREP_ENABLE_VERSION_CHECK: "0"
        run: |
          set -uo pipefail
          timing_dir="$RUNNER_TEMP/security-scan-timings"
          mkdir -p "$timing_dir"
          timed() {
            local name="$1"
            shift
            local started ended status
            started="$(date +%s)"
            "$@"
            status=$?
            ended="$(date +%s)"
            printf '%s\t%s\t%s\n' "$name" "$((ended - started))" "$status" >"$timing_dir/$name.tsv"
            return "$status"
          }

          timed pip-audit pip-audit -r requirements-services.txt &
          pip_audit_pid=$!
          # GHSA-vfj7-8cjw-p6xm has no patched braces release. It enters only
          # through the prerenderer's optional build-time proxy; our prerender
          # routes are fixed in vite.config.ts. Bun still audits every package
          # except this one advisory. npm audits the non-optional graph, which
          # Bun also covers, until the upstream package can be replaced/patched.
          (cd ui && timed ui-audit bash -c 'bun install --frozen-lockfile --ignore-scripts && bun audit --ignore GHSA-vfj7-8cjw-p6xm && npm audit --omit=optional --package-lock-only --audit-level=low') &
          ui_audit_pid=$!
          (cd tests && npm ci --ignore-scripts && timed tests-audit npm audit --package-lock-only --audit-level=low) &
          tests_audit_pid=$!
          (timed bandit bandit -r services/ packages/ -f json -o bandit-report.json || true) &
          bandit_pid=$!
          (timed semgrep semgrep scan --config=auto --json --output semgrep-report.json services/ packages/ || true) &
          semgrep_pid=$!

          status=0
          wait "$pip_audit_pid" || status=1
          wait "$ui_audit_pid" || status=1
          wait "$tests_audit_pid" || status=1
          wait "$bandit_pid" || status=1
          wait "$semgrep_pid" || status=1

          {
            echo '### Security scan performance'
            echo
            echo '| Scanner | Seconds | Exit status |'
            echo '| --- | ---: | ---: |'
            sort "$timing_dir"/*.tsv | while IFS=$'\t' read -r name seconds scan_status; do
              echo "| $name | $seconds | $scan_status |"
            done
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: security-reports
          path: |
            bandit-report.json
            semgrep-report.json
            ${{ runner.temp }}/security-scan-timings/
          retention-days: 14

  rust-supply-chain:
    name: Rust Supply Chain
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.95.0
      - name: Audit Rust advisories, licenses, bans, and sources
        run: bash scripts/ci/run-cargo-deny.sh

  ci-gate:
    name: CI Gate
    if: always()
    needs: [changes, lint, fast-feedback, test-ui-crawler-artifacts, test-ui-crawler-nginx, test-ui, test-services, test-rust-feature-probe, test-openbao-didcomm-plugin, test-rust-services, test-native-operator, rust-lint-policy, test-rust-service-images, public-protocol-contract, test-release-contracts, test-credential-lifecycle-browser, security, rust-supply-chain]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      CI_LANE_RESULTS: ${{ join(needs.*.result, ' ') }}
      UI_SELECTED: ${{ needs.changes.outputs.ui }}
      PYTHON_SELECTED: ${{ needs.changes.outputs.python }}
      RUST_SELECTED: ${{ needs.changes.outputs.rust }}
      RUST_RUNTIME_SELECTED: ${{ needs.changes.outputs.rust_runtime }}
      RUST_MATRIX: ${{ needs.changes.outputs.rust_matrix }}
      OPENBAO_SELECTED: ${{ needs.changes.outputs.openbao }}
      RELEASE_SELECTED: ${{ needs.changes.outputs.release }}
      ROLLBACK_TEST_ONLY: ${{ needs.changes.outputs.rollback_test_only }}
      DIDCOMM_RELEASE_TEST_ONLY: ${{ needs.changes.outputs.didcomm_release_test_only }}
      VERIFICATION_SELECTED: ${{ needs.changes.outputs.verification }}
      SECURITY_SELECTED: ${{ needs.changes.outputs.security }}
      CHANGES_RESULT: ${{ needs.changes.result }}
      LINT_RESULT: ${{ needs.lint.result }}
      FAST_FEEDBACK_RESULT: ${{ needs.fast-feedback.result }}
      CRAWLER_ARTIFACTS_RESULT: ${{ needs.test-ui-crawler-artifacts.result }}
      CRAWLER_NGINX_RESULT: ${{ needs.test-ui-crawler-nginx.result }}
      UI_RESULT: ${{ needs.test-ui.result }}
      SERVICES_RESULT: ${{ needs.test-services.result }}
      RUST_FEATURE_RESULT: ${{ needs.test-rust-feature-probe.result }}
      RUST_SERVICES_RESULT: ${{ needs.test-rust-services.result }}
      OPENBAO_RESULT: ${{ needs.test-openbao-didcomm-plugin.result }}
      NATIVE_OPERATOR_RESULT: ${{ needs.test-native-operator.result }}
      RUST_LINT_RESULT: ${{ needs.rust-lint-policy.result }}
      RUST_IMAGES_RESULT: ${{ needs.test-rust-service-images.result }}
      PUBLIC_PROTOCOL_RESULT: ${{ needs.public-protocol-contract.result }}
      RELEASE_CONTRACTS_RESULT: ${{ needs.test-release-contracts.result }}
      LIFECYCLE_BROWSER_RESULT: ${{ needs.test-credential-lifecycle-browser.result }}
      SECURITY_RESULT: ${{ needs.security.result }}
      RUST_SUPPLY_RESULT: ${{ needs.rust-supply-chain.result }}
    steps:
      - name: Require every CI lane
        shell: bash
        run: |
          set -euo pipefail
          # Keep the explicit map in sync with ci-gate.needs. An added or
          # removed dependency must update the planned-result policy too.
          read -r -a results <<< "$CI_LANE_RESULTS"
          [[ "${#results[@]}" -eq 18 ]]
          require_result() {
            local name="$1" actual="$2" expected="$3"
            if [[ "$actual" != "$expected" ]]; then
              echo "Unexpected $name result: $actual (expected $expected)" >&2
              return 1
            fi
          }
          require_selected() {
            local name="$1" actual="$2" selected="$3"
            case "$selected" in
              true) require_result "$name" "$actual" success ;;
              false) require_result "$name" "$actual" skipped ;;
              *) echo "Missing or invalid selection for $name" >&2; return 1 ;;
            esac
          }
          for selected in "$UI_SELECTED" "$PYTHON_SELECTED" "$RUST_SELECTED" "$RUST_RUNTIME_SELECTED" "$OPENBAO_SELECTED" "$RELEASE_SELECTED" "$VERIFICATION_SELECTED" "$SECURITY_SELECTED" "$ROLLBACK_TEST_ONLY" "$DIDCOMM_RELEASE_TEST_ONLY"; do
            [[ "$selected" == true || "$selected" == false ]]
          done
          if [[ "$DIDCOMM_RELEASE_TEST_ONLY" == true ]]; then
            [[ "${{ github.event_name }}" == pull_request &&
               "$RELEASE_SELECTED" == true && "$ROLLBACK_TEST_ONLY" == false &&
               "$UI_SELECTED" == false && "$PYTHON_SELECTED" == false &&
               "$RUST_SELECTED" == false && "$RUST_RUNTIME_SELECTED" == false &&
               "$OPENBAO_SELECTED" == false &&
               "$VERIFICATION_SELECTED" == false && "$SECURITY_SELECTED" == false ]]
          fi
          if [[ "$ROLLBACK_TEST_ONLY" == true ]]; then
            [[ "${{ github.event_name }}" == pull_request &&
               "$RELEASE_SELECTED" == true && "$SECURITY_SELECTED" == true &&
               "$UI_SELECTED" == false && "$PYTHON_SELECTED" == false &&
               "$RUST_SELECTED" == false && "$RUST_RUNTIME_SELECTED" == false &&
               "$VERIFICATION_SELECTED" == false ]]
          fi
          # The aggregate matrix result alone cannot prove all required lanes ran.
          # Accept only these exact plans and require the full plan in queue.
          case "$RUST_SELECTED:$RUST_RUNTIME_SELECTED:$RUST_MATRIX" in
            'true:true:["canvas","contracts","selfhost"]'|'true:false:["contracts"]'|'false:false:["canvas","contracts","selfhost"]') ;;
            'true:false:["worker"]'|'true:false:["flow"]'|'true:false:["selfhost"]'|'true:false:["renewal-unit"]')
              [[ "${{ github.event_name }}" == pull_request ]] ;;
            *) echo 'Invalid Rust lane selection or matrix plan' >&2; exit 1 ;;
          esac
          if [[ "${{ github.event_name }}" == merge_group ]]; then
            [[ "$ROLLBACK_TEST_ONLY" == false && "$DIDCOMM_RELEASE_TEST_ONLY" == false ]]
            [[ "$RUST_SELECTED" == true && "$RUST_RUNTIME_SELECTED" == true &&
               "$RUST_MATRIX" == '["canvas","contracts","selfhost"]' ]]
            for result in "${results[@]}"; do
              [[ "$result" == success ]]
            done
          else
            require_result changes "$CHANGES_RESULT" success
            require_result lint "$LINT_RESULT" success
            require_selected fast-feedback "$FAST_FEEDBACK_RESULT" "$UI_SELECTED"
            require_selected test-ui-crawler-artifacts "$CRAWLER_ARTIFACTS_RESULT" "$UI_SELECTED"
            require_selected test-ui-crawler-nginx "$CRAWLER_NGINX_RESULT" "$UI_SELECTED"
            require_selected test-ui "$UI_RESULT" "$UI_SELECTED"
            require_selected test-credential-lifecycle-browser "$LIFECYCLE_BROWSER_RESULT" "$UI_SELECTED"
            require_selected test-services "$SERVICES_RESULT" "$PYTHON_SELECTED"
            require_selected test-rust-feature-probe "$RUST_FEATURE_RESULT" "$RUST_RUNTIME_SELECTED"
            require_selected test-rust-services "$RUST_SERVICES_RESULT" "$RUST_SELECTED"
            require_selected test-openbao-didcomm-plugin "$OPENBAO_RESULT" "$OPENBAO_SELECTED"
            require_selected test-native-operator "$NATIVE_OPERATOR_RESULT" "$RUST_SELECTED"
            require_selected rust-lint-policy "$RUST_LINT_RESULT" "$RUST_SELECTED"
            require_selected test-rust-service-images "$RUST_IMAGES_RESULT" "$RUST_RUNTIME_SELECTED"
            require_selected rust-supply-chain "$RUST_SUPPLY_RESULT" "$RUST_SELECTED"
            public_selected=false
            if [[ "$UI_SELECTED" == true || "$PYTHON_SELECTED" == true || "$RUST_SELECTED" == true || "$RELEASE_SELECTED" == true ]]; then
              public_selected=true
            fi
            require_selected public-protocol-contract "$PUBLIC_PROTOCOL_RESULT" "$public_selected"
            release_selected=false
            if [[ "$RELEASE_SELECTED" == true || "$VERIFICATION_SELECTED" == true || "$RUST_SELECTED" == true ]]; then
              release_selected=true
            fi
            require_selected test-release-contracts "$RELEASE_CONTRACTS_RESULT" "$release_selected"
            require_selected security "$SECURITY_RESULT" "$SECURITY_SELECTED"
          fi
      - name: Summarize CI performance
        # Telemetry must not fail a green required-lane gate during a GitHub API outage.
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const {owner, repo} = context.repo;
            const retryTransient = async (operation, request) => {
              for (let attempt = 1; attempt <= 3; attempt++) {
                try {
                  return await request();
                } catch (error) {
                  if (![502, 503, 504].includes(error.status) || attempt === 3) throw error;
                  core.warning(`${operation} returned HTTP ${error.status}; retrying (${attempt}/3).`);
                  await new Promise(resolve => setTimeout(resolve, 2000 * attempt));
                }
              }
            };
            const {data: run} = await retryTransient('getWorkflowRun', () =>
              github.rest.actions.getWorkflowRun({owner, repo, run_id: context.runId}));
            const {data} = await retryTransient('listJobsForWorkflowRun', () =>
              github.rest.actions.listJobsForWorkflowRun({
                owner, repo, run_id: context.runId, filter: 'latest', per_page: 100,
              }));
            const created = new Date(run.created_at);
            const rows = data.jobs.filter(job => job.started_at && job.completed_at).map(job => ({
              name: job.name,
              queue: Math.max(0, Math.round((new Date(job.started_at) - created) / 1000)),
              run: Math.max(0, Math.round((new Date(job.completed_at) - new Date(job.started_at)) / 1000)),
            })).sort((a, b) => b.run - a.run);
            const maxQueue = Math.max(0, ...rows.map(row => row.queue));
            core.summary.addHeading('CI performance').addTable([
              [{data: 'Longest jobs', header: true}, {data: 'Queue', header: true}, {data: 'Runtime', header: true}],
              ...rows.slice(0, 10).map(row => [row.name, `${row.queue}s`, `${row.run}s`]),
            ]).addRaw(`Longest observed queue delay: ${maxQueue}s.`);
            if (maxQueue > 300) core.warning(`Runner queue delay reached ${maxQueue}s.`);
            await core.summary.write();

  installer-trial-image:
    name: Installer trial image (nonpublishing)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/github-installer-release'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Bind this disposable build to its source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ElevenID/marty-ui'
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mkdir -p "$RUNNER_TEMP/installer-trial-image"
      - name: Configure pinned OCI exporter
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          version: v0.36.1
          driver: docker-container
          driver-opts: image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Build exact-head gateway image for an unqualified VM trial
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: services/Dockerfile
          push: false
          pull: true
          platforms: linux/amd64
          tags: docker.io/elevenid/marty-ui-installer-trial:pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          build-args: |
            SERVICE_NAME=gateway
            MARTY_RELEASE_VERSION=engineering-trial
            MARTY_UI_SHA=${{ github.event.pull_request.head.sha }}
          outputs: type=oci,dest=${{ runner.temp }}/installer-trial-image/services.oci.tar,compression=gzip,force-compression=true
          provenance: false
          sbom: false
      - name: Record archive identity without claiming release provenance
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          archive = Path(os.environ['RUNNER_TEMP']) / 'installer-trial-image/services.oci.tar'
          size = archive.stat().st_size
          if not 0 < size <= 4 * 1024**3:
              raise SystemExit('trial OCI archive size invalid')
          with archive.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          record = {
              'schema': 'elevenid.installer-engineering-image/v1',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'source_sha': os.environ['EXPECTED_SHA'],
              'pr': int(os.environ['PR_NUMBER']),
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'archive': 'services.oci.tar',
              'archive_sha256': digest,
              'archive_bytes': size,
              'qualified': False,
          }
          output = archive.with_name('trial-image.json')
          output.write_text(json.dumps(record, sort_keys=True, separators=(',', ':')) + '\n')
          PY
      - name: Upload short-lived engineering image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: installer-trial-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/installer-trial-image/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
