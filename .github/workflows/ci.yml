name: CI

env:
  MARTY_API_CORE_URI: https://github.com/ElevenID/marty-cli/releases/download/v0.2.3/elevenid-marty-api-core-0.2.3.tgz
  MARTY_API_CORE_DIGEST: sha256:d3fed82fbd58d9106ea198511d1facec2c5e4d9aa703868ee57d1a9a4a4d9fdd
  MARTY_BLOG_URI: https://github.com/ElevenID/marty-blog/releases/download/v0.1.5/elevenid-marty-blog-0.1.5.tgz
  MARTY_BLOG_DIGEST: sha256:37ef3b45e289198022c2ccc83dcb618959a68644ee72366a00d6a4a6f331aaca
  MARTY_COMMON_URI: https://github.com/ElevenID/Marty/releases/download/marty-common-v0.2.4/marty_common-0.2.4-py3-none-any.whl
  MARTY_COMMON_DIGEST: sha256:1163a215f53dad95b73a5f67be4c5cca2573e049396edd71156b517d7d43595b
  MARTY_PROTOCOL_REF: 6387a02fe4a6eaa08b4743cae97590adee11190c

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Check Python correctness
        run: ruff check services/ packages/ --select E9,F63,F7,F82

  test-ui:
    name: UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Bootstrap released UI dependencies
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$MARTY_API_CORE_URI" --output "$RUNNER_TEMP/marty-api-core.tgz"
          curl --fail --location --silent --show-error "$MARTY_BLOG_URI" --output "$RUNNER_TEMP/marty-blog.tgz"
          echo "${MARTY_API_CORE_DIGEST#sha256:}  $RUNNER_TEMP/marty-api-core.tgz" | sha256sum --check --strict
          echo "${MARTY_BLOG_DIGEST#sha256:}  $RUNNER_TEMP/marty-blog.tgz" | sha256sum --check --strict
          bun pm pkg set "dependencies.@elevenid/marty-api-core=file:$RUNNER_TEMP/marty-api-core.tgz"
          bun pm pkg set "dependencies.@elevenid/marty-blog=file:$RUNNER_TEMP/marty-blog.tgz"
      - run: bun install
      - name: Type check
        run: bunx tsc -p tsconfig.build.json --noEmit
      - name: Unit tests
        run: node ./node_modules/vitest/vitest.mjs run

  test-services:
    name: Service Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$MARTY_COMMON_URI" --output "$RUNNER_TEMP/marty_common-0.2.4-py3-none-any.whl"
          echo "${MARTY_COMMON_DIGEST#sha256:}  $RUNNER_TEMP/marty_common-0.2.4-py3-none-any.whl" | sha256sum --check --strict
          pip install -r requirements-services.txt
          pip install "$RUNNER_TEMP/marty_common-0.2.4-py3-none-any.whl"
      - name: Run tests
        working-directory: services
        run: python -m pytest -v --tb=short -x

  flow-idempotency-contract:
    name: Flow Idempotency PostgreSQL Contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      FLOW_IDEMPOTENCY_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      COMPOSE_PROJECT_NAME: flow-idempotency-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: marty-ui
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate disposable Flow idempotency topology
        working-directory: marty-ui
        run: docker compose --file docker-compose.flow-idempotency-contract.yml config --quiet

      - name: Build Flow idempotency contract image
        working-directory: marty-ui
        run: |
          mkdir -p tests/artifacts/flow-idempotency
          chmod 0777 tests/artifacts/flow-idempotency
          docker compose --file docker-compose.flow-idempotency-contract.yml build --pull flow-idempotency-contract

      - name: Race Flow reservations and durable artifacts in PostgreSQL
        working-directory: marty-ui
        run: >-
          docker compose --file docker-compose.flow-idempotency-contract.yml
          up --force-recreate --abort-on-container-exit
          --exit-code-from flow-idempotency-contract flow-idempotency-contract

      - name: Require sanitized Flow idempotency evidence
        working-directory: marty-ui
        run: |
          test "$(jq -r '.status' tests/artifacts/flow-idempotency/contract-result.json)" = passed
          test "$(jq -r '.migration_revision' tests/artifacts/flow-idempotency/contract-result.json)" = 20260809_0001
          test "$(jq -r '.production_repository_exercised' tests/artifacts/flow-idempotency/contract-result.json)" = true
          test "$(jq -r '.instance_created_count' tests/artifacts/flow-idempotency/contract-result.json)" = 1
          test "$(jq -r '.instance_recovered_count' tests/artifacts/flow-idempotency/contract-result.json)" = 1
          test "$(jq -r '.same_instance' tests/artifacts/flow-idempotency/contract-result.json)" = true
          test "$(jq -r '.event_receipt_count' tests/artifacts/flow-idempotency/contract-result.json)" = 1
          test "$(jq -r '.same_durable_plan' tests/artifacts/flow-idempotency/contract-result.json)" = true
          test "$(jq -r '.artifact_count' tests/artifacts/flow-idempotency/contract-result.json)" = 1
          test "$(jq -r '.same_artifact' tests/artifacts/flow-idempotency/contract-result.json)" = true
          test "$(jq -r '.cross_instance_rebind_rejected' tests/artifacts/flow-idempotency/contract-result.json)" = true
          test "$(jq -r '.semantic_conflict_rolled_back' tests/artifacts/flow-idempotency/contract-result.json)" = true
          test "$(jq -r '.changed_payload_rejected' tests/artifacts/flow-idempotency/contract-result.json)" = true
          test "$(jq -r '.source_revision' tests/artifacts/flow-idempotency/contract-result.json)" = "$FLOW_IDEMPOTENCY_SOURCE_REVISION"

      - name: Upload Flow idempotency evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flow-idempotency-${{ github.run_id }}-${{ github.run_attempt }}
          path: marty-ui/tests/artifacts/flow-idempotency/contract-result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Remove disposable Flow idempotency stack
        if: always()
        working-directory: marty-ui
        run: docker compose --file docker-compose.flow-idempotency-contract.yml down --volumes --remove-orphans

  public-protocol-contract:
    name: Public Protocol Contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Require immutable protocol revision
        shell: bash
        run: |
          if [[ ! "$MARTY_PROTOCOL_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "MARTY_PROTOCOL_REF must be a full 40-character commit SHA." >&2
            exit 1
          fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: Marty-Protocol/Marty-Protocol
          ref: ${{ env.MARTY_PROTOCOL_REF }}
          path: marty-protocol
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install contract-check dependencies
        run: pip install -r requirements-services.txt jsonschema
      - name: Enforce public response contract
        run: python scripts/check_public_protocol_contract.py --protocol-root marty-protocol

  test-release-contracts:
    name: Release Contract Tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: packages
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install released test dependencies
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$MARTY_COMMON_URI" --output "$RUNNER_TEMP/marty_common-0.2.4-py3-none-any.whl"
          echo "${MARTY_COMMON_DIGEST#sha256:}  $RUNNER_TEMP/marty_common-0.2.4-py3-none-any.whl" | sha256sum --check --strict
          pip install pytest pyyaml jsonschema cryptography playwright "$RUNNER_TEMP/marty_common-0.2.4-py3-none-any.whl"
      - name: Enforce OSS commerce boundary
        run: python scripts/check_oss_boundary.py
      - name: Run repository release checks
        run: python -m pytest tests -v --tb=short

  test-credential-lifecycle-browser:
    name: MIP 0.4 Credential Lifecycle Browser Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Install UI dependencies
        working-directory: ui
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$MARTY_API_CORE_URI" --output "$RUNNER_TEMP/marty-api-core.tgz"
          curl --fail --location --silent --show-error "$MARTY_BLOG_URI" --output "$RUNNER_TEMP/marty-blog.tgz"
          echo "${MARTY_API_CORE_DIGEST#sha256:}  $RUNNER_TEMP/marty-api-core.tgz" | sha256sum --check --strict
          echo "${MARTY_BLOG_DIGEST#sha256:}  $RUNNER_TEMP/marty-blog.tgz" | sha256sum --check --strict
          bun pm pkg set "dependencies.@elevenid/marty-api-core=file:$RUNNER_TEMP/marty-api-core.tgz"
          bun pm pkg set "dependencies.@elevenid/marty-blog=file:$RUNNER_TEMP/marty-blog.tgz"
          bun install
      - name: Install Playwright dependencies
        working-directory: tests
        run: npm ci
      - name: Install Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Run deterministic credential lifecycle gate
        working-directory: tests
        run: npx playwright test --config playwright.applicant-wallet.config.js
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mip-03-credential-lifecycle-browser
          path: |
            tests/test-results/
            tests/playwright-report-applicant-wallet/
          retention-days: 14

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install scanners
        run: pip install bandit semgrep pip-audit
      - name: Dependency vulnerability gates
        shell: bash
        run: |
          set -euo pipefail
          pip-audit -r requirements-services.txt
          (cd ui && bun audit && npm audit --package-lock-only --audit-level=low)
          (cd tests && npm audit --package-lock-only --audit-level=low)
      - name: Bandit SAST
        run: bandit -r services/ packages/ -f json -o bandit-report.json || true
      - name: Semgrep audit
        run: semgrep scan --config=auto --json --output semgrep-report.json services/ packages/ || true
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: security-reports
          path: |
            bandit-report.json
            semgrep-report.json
          retention-days: 14
