  test-ui:
    name: UI Tests (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Bootstrap released UI dependencies
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/scripts/ci/download-verified-ui-release-assets.sh"
          bun pm pkg set "dependencies.@elevenid/marty-api-core=file:$RUNNER_TEMP/marty-api-core.tgz"
          bun pm pkg set "dependencies.@elevenid/marty-blog=file:$RUNNER_TEMP/marty-blog.tgz"
      - run: PUPPETEER_SKIP_DOWNLOAD=true bun install
      - name: Unit tests
        env:
          VITEST_TIMING_OUTPUT: ${{ runner.temp }}/ui-vitest-timing-${{ matrix.shard }}.json
        run: node scripts/run-vitest-shard.mjs ${{ matrix.shard }} 4
      - name: Upload per-file test timings
        id: ui_timing_upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ui-vitest-timing-${{ matrix.shard }}
          path: ${{ runner.temp }}/ui-vitest-timing-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Retry per-file test timings upload
        id: ui_timing_retry
        if: always() && steps.ui_timing_upload.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ui-vitest-timing-${{ matrix.shard }}
          path: ${{ runner.temp }}/ui-vitest-timing-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Require per-file test timings upload
        if: always()
        shell: bash
        env:
          PRIMARY_OUTCOME: ${{ steps.ui_timing_upload.outcome }}
          RETRY_OUTCOME: ${{ steps.ui_timing_retry.outcome }}
        run: |
          set -euo pipefail
          if [[ "$PRIMARY_OUTCOME" != success && "$RETRY_OUTCOME" != success ]]; then
            echo "Both per-file timing artifact uploads failed" >&2
            exit 1
          fi

  test-services:
    name: Service Tests
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    # Retained Python tests use fake storage and their own loopback mTLS fixture.
    # Real PostgreSQL/Redis integration coverage remains in test-rust-services.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.11.3"
          enable-cache: true
          # PR/merge-queue runs may read the trusted main cache but never publish
          # one cache per ephemeral PR ref.
          save-cache: false
          cache-dependency-glob: |
            requirements-services.txt
            release/stack-lock.json
          cache-suffix: python-services
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          marty_rs_uri="$(jq -er '.components[] | select(.name == "marty-core-python") | .artifacts[] | select(.type == "python") | .uri' release/stack-lock.json)"
          marty_rs_digest="$(jq -er '.components[] | select(.name == "marty-core-python") | .artifacts[] | select(.type == "python") | .digest' release/stack-lock.json)"
          marty_rs_wheel="$RUNNER_TEMP/${marty_rs_uri##*/}"
          verification_uri="$(jq -er '.components[] | select(.name == "marty-verification-python") | .artifacts[] | select(.type == "python") | .uri' release/stack-lock.json)"
          verification_digest="$(jq -er '.components[] | select(.name == "marty-verification-python") | .artifacts[] | select(.type == "python") | .digest' release/stack-lock.json)"
          verification_wheel="$RUNNER_TEMP/${verification_uri##*/}"
          iso18013_uri="$(jq -er '.components[] | select(.name == "marty-iso18013-python") | .artifacts[] | select(.type == "python") | .uri' release/stack-lock.json)"
          iso18013_digest="$(jq -er '.components[] | select(.name == "marty-iso18013-python") | .artifacts[] | select(.type == "python") | .digest' release/stack-lock.json)"
          iso18013_wheel="$RUNNER_TEMP/${iso18013_uri##*/}"
          curl --fail --location --silent --show-error --connect-timeout 15 --max-time 60 --retry 5 --retry-delay 2 --retry-max-time 120 "$marty_rs_uri" --output "$marty_rs_wheel"
          curl --fail --location --silent --show-error --connect-timeout 15 --max-time 60 --retry 5 --retry-delay 2 --retry-max-time 120 "$verification_uri" --output "$verification_wheel"
          curl --fail --location --silent --show-error --connect-timeout 15 --max-time 60 --retry 5 --retry-delay 2 --retry-max-time 120 "$iso18013_uri" --output "$iso18013_wheel"
          echo "${marty_rs_digest#sha256:}  $marty_rs_wheel" | sha256sum --check --strict
          echo "${verification_digest#sha256:}  $verification_wheel" | sha256sum --check --strict
          echo "${iso18013_digest#sha256:}  $iso18013_wheel" | sha256sum --check --strict
          uv pip install --system -r requirements-services.txt
          uv pip install --system psycopg2-binary==2.9.10
          uv pip install --system "$marty_rs_wheel" "$verification_wheel" "$iso18013_wheel"
      - name: Verify released native trust-registry backend
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from marty_rs import _marty_rs

          diagnostics = json.loads(_marty_rs.native_backend_diagnostics())
          assert "trust_registry_sync" in diagnostics["capabilities"]
          PY
      - name: Run tests
        working-directory: services
        run: python -m pytest -v --tb=short -x

  test-rust-feature-probe:
    name: Rust Feature Regression Probe
    needs: changes
    if: needs.changes.outputs.rust_runtime == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.95.0
      - name: Verify frozen Rust feature-regression probe
        shell: bash
        run: |
          set -euo pipefail
          manifest=.github/feature-regression/rust-probe/Cargo.toml
          target="$RUNNER_TEMP/feature-regression-rust-probe-target"
          first_output="$RUNNER_TEMP/feature-regression-rust-probe-first.json"
          second_output="$RUNNER_TEMP/feature-regression-rust-probe-second.json"
          cargo fetch --locked --manifest-path "$manifest"
          CARGO_TARGET_DIR="$target" cargo run --frozen --offline --quiet \
            --manifest-path "$manifest" \
            --bin elevenid-feature-regression-probe > "$first_output"
          CARGO_TARGET_DIR="$target" cargo run --frozen --offline --quiet \
            --manifest-path "$manifest" \
            --bin elevenid-feature-regression-probe > "$second_output"
          cmp --silent "$first_output" "$second_output"
          python3 tests/test_feature_regression_rust_probe.py "$first_output"
          target_bytes=$(du -sb "$target" | cut -f1)
          target_budget_bytes=$(python3 -c 'import sys,tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["package"]["metadata"]["elevenid-feature-regression"]["target-budget-bytes"])' "$manifest")
          test "$target_bytes" -le "$target_budget_bytes"

  test-openbao-didcomm-plugin:
    name: Test OpenBao DIDComm plugin image
    needs: changes
    if: needs.changes.outputs.openbao == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prefer cached Docker Hub images without restarting the runner daemon
        run: bash scripts/ci/configure-dockerhub-mirror.sh
      - name: Select the exact BuildKit image with registry fallback
        shell: bash
        run: |
          set -euo pipefail
          image=$(bash scripts/ci/pull-pinned-dockerhub-image.sh "$MARTY_CI_BUILDKIT_PIN")
          echo "MARTY_CI_BUILDKIT_IMAGE=$image" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          driver-opts: image=${{ env.MARTY_CI_BUILDKIT_IMAGE }}
          buildkitd-config: .github/buildkit-ci-mirror.toml
      - name: Expose public image compiler cache credentials
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            const url = process.env.ACTIONS_RESULTS_URL;
            if (!token || !url) throw new Error('GitHub compiler cache credentials are unavailable');
            core.setSecret(token);
            core.exportVariable('SCCACHE_GHA_RUNTIME_TOKEN', token);
            core.exportVariable('SCCACHE_GHA_CACHE_URL', url);
            core.exportVariable('SCCACHE_GHA_RW_MODE', 'READ_ONLY');
      - name: Test and build the pinned OpenBao plugin image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: openbao/didcomm-authcrypt/Dockerfile
          load: true
          push: false
          tags: marty-openbao-didcomm:ci
          provenance: false
      - name: Verify packaged plugin and self-host helpers
        run: docker run --rm --entrypoint /bin/sh marty-openbao-didcomm:ci -ec 'test -x /plugins/openbao-didcomm-authcrypt && test -x /usr/local/bin/selfhost-tls-init && test -x /usr/local/bin/selfhost-unseal'
      - name: Build the pinned Keycloak remote-key image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: keycloak/openbao-provider/Dockerfile
          load: true
          push: false
          tags: marty-keycloak-openbao:ci
          provenance: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.95.0
      - name: Use mold linker for Rust recovery probe
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621
        with:
          mold-version: 2.41.0
      - name: Enable compiler cache for Rust recovery probe
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Keep Rust recovery independent of optional compiler cache
        shell: bash
        run: bash scripts/ci/optional-sccache-fallback.sh
      - name: Prepare Rust KMS operator before scoped provisioning probes
        run: cargo build --locked --manifest-path rust/Cargo.toml -p marty-deployment-catalog --bin marty-deploy
      - name: Qualify Keycloak browser, CIBA, KMS-loss, and PostgreSQL custody
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check cryptography==44.0.3
          python3 scripts/probe_keycloak_remote_rs256.py --require-browser \
            --keycloak-image marty-keycloak-openbao:ci \
            --openbao-image marty-openbao-didcomm:ci
      - name: Prove disposable self-host Keycloak secret closure and token scopes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/with_disposable_event_stream_kms.py \
            --image marty-openbao-didcomm:ci --profile selfhost-keycloak \
            -- python3 scripts/provision_selfhost_keycloak_kms.py
      - name: Qualify packaged plugin storage and self-host Raft behavior
        env:
          MARTY_OPENBAO_PROBE_IMAGE: marty-openbao-didcomm:ci
        run: |
          python3 scripts/probe_didcomm_issuance_token.py
          python3 scripts/probe_didcomm_openbao_file_storage.py
          python3 scripts/probe_selfhost_openbao_raft_bootstrap.py
          python3 scripts/probe_didcomm_openbao_ha.py
      - name: Qualify Rust integration-secret recovery with coordinated PostgreSQL and Raft restore
        env:
          MARTY_OPENBAO_PROBE_IMAGE: marty-openbao-didcomm:ci
          MARTY_RECOVERY_PREPARATION_TIMING_FILE: ${{ runner.temp }}/rust-recovery-preparation.jsonl
          MARTY_RECOVERY_PREPARATION_CACHE_FILE: ${{ runner.temp }}/rust-recovery-preparation-cache.jsonl
          CARGO_INCREMENTAL: 0
          CARGO_PROFILE_DEV_DEBUG: 0
          CARGO_PROFILE_TEST_DEBUG: 0
        run: python3 scripts/probe_integration_secret_coordinated_restore.py
      - name: Record optional recovery compiler cache outcomes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          timeout 10s sccache --show-stats 2>/dev/null |
            awk -v phase=recovery_probe -f scripts/ci/public-sccache-stats.awk |
            tee "$RUNNER_TEMP/rust-recovery-cache-counters.jsonl" || true
      - name: Retain recovery preparation evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-recovery-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rust-recovery-preparation.jsonl
            ${{ runner.temp }}/rust-recovery-preparation-cache.jsonl
            ${{ runner.temp }}/rust-recovery-cache-counters.jsonl
          if-no-files-found: warn
          retention-days: 7

  test-rust-services:
    name: Rust Service Tests (${{ matrix.lane }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A maintainer may label a PR before its next synchronize event for an
        # additive hosted worker or self-host rehearsal. Label changes do not trigger
        # this full workflow, avoiding extra runs for unrelated labels.
        # Its normal Canvas/contracts/selfhost lanes and every merge-group gate remain.
        lane: >-
          ${{ fromJSON(github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'ci-renewal-unit-diagnostic') &&
          contains(github.event.pull_request.labels.*.name, 'ci-worker-diagnostic') &&
          needs.changes.outputs.rust_runtime == 'true' &&
          '["canvas","contracts","worker","selfhost","renewal-unit"]' ||
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'ci-renewal-unit-diagnostic') &&
          needs.changes.outputs.rust_runtime == 'true' &&
          '["canvas","contracts","selfhost","renewal-unit"]' ||
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'ci-worker-diagnostic') &&
          contains(github.event.pull_request.labels.*.name, 'ci-selfhost-diagnostic') &&
          needs.changes.outputs.rust_runtime == 'true' &&
          '["canvas","contracts","worker","selfhost"]' ||
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'ci-worker-diagnostic') &&
          needs.changes.outputs.rust_runtime == 'true' &&
          '["canvas","contracts","worker","selfhost"]' ||
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'ci-selfhost-diagnostic') &&
          needs.changes.outputs.rust_runtime == 'true' &&
          '["canvas","contracts","selfhost"]' || needs.changes.outputs.rust_matrix) }}
    permissions:
      actions: read
      contents: read
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      FLOW_POSTGRES_TEST_URL: postgresql://postgres:postgres@localhost:5432/marty_atomic_test
      VERIFICATION_SESSION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marty_atomic_test
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prefer cached Docker Hub images without restarting the runner daemon
        if: matrix.lane != 'renewal-unit'
        run: bash scripts/ci/configure-dockerhub-mirror.sh
      - name: Select the exact BuildKit image with registry fallback
        if: matrix.lane != 'renewal-unit'
        shell: bash
        run: |
          set -euo pipefail
          image=$(bash scripts/ci/pull-pinned-dockerhub-image.sh "$MARTY_CI_BUILDKIT_PIN")
          echo "MARTY_CI_BUILDKIT_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Start digest-pinned Rust test services after registry setup
        # Self-host acceptance creates its own isolated PostgreSQL container;
        # it never uses the shared PostgreSQL/Redis/OpenBao fixture services.
        if: matrix.lane != 'selfhost' && matrix.lane != 'renewal-unit'
        shell: bash
        run: |
          set -euo pipefail
          MARTY_RUST_CI_POSTGRES_IMAGE=$(bash scripts/ci/pull-pinned-dockerhub-image.sh \
            postgres:15-alpine@sha256:fceb6f86328c36f2438fae3b851b0cc57c4a7e69a58c866d9ce24281f2cf0c9c)
          MARTY_RUST_CI_REDIS_IMAGE=$(bash scripts/ci/pull-pinned-dockerhub-image.sh \
            redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99)
          export MARTY_RUST_CI_POSTGRES_IMAGE MARTY_RUST_CI_REDIS_IMAGE
          bash scripts/ci/pull-pinned-quay-openbao.sh \
            quay.io/openbao/openbao@sha256:6c75c97223873807260352f269640935a07db0c26b3dbf12a98a36ec43ad9878
          docker compose -p marty-rust-ci -f .github/compose/rust-ci-fixtures.yml \
            up -d --wait --wait-timeout 90
          postgres_id=$(docker compose -p marty-rust-ci -f .github/compose/rust-ci-fixtures.yml ps -q postgres)
          redis_id=$(docker compose -p marty-rust-ci -f .github/compose/rust-ci-fixtures.yml ps -q redis)
          test -n "$postgres_id"
          test -n "$redis_id"
          echo "MARTY_RUST_CI_POSTGRES_ID=$postgres_id" >> "$GITHUB_ENV"
          echo "MARTY_RUST_CI_REDIS_ID=$redis_id" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        if: matrix.lane != 'renewal-unit'
        with:
          driver-opts: image=${{ env.MARTY_CI_BUILDKIT_IMAGE }}
          buildkitd-config: .github/buildkit-ci-mirror.toml
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Prepare isolated Canvas worker harness dependencies
        if: matrix.lane == 'canvas' || matrix.lane == 'worker'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/canvas-worker-harness"
          # These import-only harness dependencies are separate from production
          # services and the immutable published worker's own environment.
          "$RUNNER_TEMP/canvas-worker-harness/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: --no-deps \
            SQLAlchemy==2.0.52 greenlet==3.4.0 typing_extensions==4.15.0 PyYAML==6.0.3
          "$RUNNER_TEMP/canvas-worker-harness/bin/python" -I - "$GITHUB_WORKSPACE" <<'PY'
          from pathlib import Path
          import sys
          assert sys.version_info[:2] == (3, 12)
          # Rendered base/Flow fixtures use this same selected interpreter.
          import yaml
          assert yaml.__version__ == "6.0.3"
          assert yaml.safe_load("services: {issuance-native: {command: []}}") == {
              "services": {"issuance-native": {"command": []}}
          }
          root = Path(sys.argv[1])
          sys.path.insert(0, str(root / "scripts"))
          import test_canvas_worker_body_timeout_https as controller
          matrix, reports, responses = controller.load_inputs(root)
          assert len(matrix["cases"]) == len(reports) == len(responses) == 6
          import test_canvas_worker_lease_expiry_https as expiry_controller
          expiry_matrix, expiry_reports, expiry_response = expiry_controller.load_inputs(root)
          assert len(expiry_matrix["cases"]) == len(expiry_reports) == 2
          assert expiry_response["status"] == 200
          print("Native Canvas BODY and lease-expiry harness imports and frozen inputs verified")
          PY
          # Rust invokes python3 by name in preflights AND the full suite.
          # Publish this interpreter only after both installation and smoke pass.
          printf '%s\n' "$RUNNER_TEMP/canvas-worker-harness/bin" >> "$GITHUB_PATH"
      - name: Prepare isolated Flow renderer dependency
        if: matrix.lane == 'flow'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/flow-renderer"
          "$RUNNER_TEMP/flow-renderer/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: --no-deps PyYAML==6.0.3
          "$RUNNER_TEMP/flow-renderer/bin/python" -c \
            'import yaml; assert yaml.__version__ == "6.0.3"'
          printf '%s\n' "$RUNNER_TEMP/flow-renderer/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.95.0
      - name: Use mold linker
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621
        with:
          mold-version: 2.41.0
      - name: Enable compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Keep Rust service tests independent of optional compiler cache
        shell: bash
        run: bash scripts/ci/optional-sccache-fallback.sh
      - name: Prepare source-matched Rust execution policy
        run: bash scripts/ci/prepare-native-ci-execution.sh
      - name: Require Kubernetes deployment contract executables
        if: matrix.lane == 'canvas'
        shell: bash
        run: |
          set -euo pipefail
          command -v bash
          command -v envsubst
      - name: Compile reusable Rust test executables
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/rust-test-artifacts.json"
          if [[ "${{ matrix.lane }}" == renewal-unit ]]; then
            # Additive ordinary-library diagnostic; normal PR lanes remain required.
            # this package-scoped compile has no database, image or service fixture.
            cargo test --locked -p marty-issuance-service --lib --no-run \
              --timings --message-format=json > "$artifacts"
            python3 ../scripts/ci/verify-canvas-test-artifacts.py \
              --renewal-unit-only "$artifacts" target
          elif [[ "${{ matrix.lane }}" == worker || "${{ matrix.lane }}" == flow || "${{ matrix.lane }}" == selfhost ]]; then
            # Exact test-source owners compile in the same pinned Bookworm
            # environment as the full Canvas lane. The merge group stays full.
            cargo fetch --locked
            mapfile -t builder_images < <(awk '$1 == "FROM" && $3 == "AS" && $4 == "rust-service-base" { print $2 }' ../services/Dockerfile)
            [[ ${#builder_images[@]} == 1 ]]
            bookworm_builder="${builder_images[0]}"
            [[ "$bookworm_builder" =~ ^rust:1\.95-bookworm@sha256:[a-f0-9]{64}$ ]]
            bookworm_builder="$(bash ../scripts/ci/pull-pinned-dockerhub-image.sh "$bookworm_builder")"
            host_cargo_home="${CARGO_HOME:-$HOME/.cargo}"
            test -d "$host_cargo_home"
            mkdir -p target
            [[ ! -L target && "$(realpath target)" == "$GITHUB_WORKSPACE/rust/target" ]]
            [[ -z "$(find target -mindepth 1 -maxdepth 1 -print -quit)" ]]
            docker run --rm --network none --read-only \
              --user "$(id -u):$(id -g)" \
              --env HOME=/tmp \
              --env "CARGO_HOME=$host_cargo_home" \
              --env "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/rust/target" \
              --env CARGO_INCREMENTAL=0 \
              --env CARGO_PROFILE_TEST_DEBUG=0 \
              --env "MARTY_RUST_ACCEPTANCE_SCOPE=${{ matrix.lane }}" \
              --tmpfs /tmp:rw,nosuid,nodev,mode=1777 \
              --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
              --volume "$host_cargo_home:$host_cargo_home" \
              --volume "$GITHUB_WORKSPACE/rust/target:$GITHUB_WORKSPACE/rust/target:rw" \
              --workdir "$GITHUB_WORKSPACE/rust" \
              "$bookworm_builder" \
              sh -ceu '
                case "$MARTY_RUST_ACCEPTANCE_SCOPE" in
                  worker)
                    cargo test --locked --offline -p marty-canvas-worker-acceptance \
                      --test canvas_published_worker_contract --no-run \
                      --timings --message-format=json
                    cargo build --locked --offline -p marty-issuance-service \
                      --bin marty-canvas-sync-worker --message-format=json
                    ;;
                  flow)
                    cargo test --locked --offline -p marty-flow-acceptance \
                      --test flow_published_schema_contract --no-run \
                      --timings --message-format=json
                    cargo build --locked --offline -p marty-issuance-service \
                      --bin marty-issuance-service --message-format=json
                    cargo build --locked --offline -p marty-flow \
                      --bin marty-flow --message-format=json
                    ;;
                  selfhost)
                    cargo test --locked --offline -p marty-selfhost-acceptance \
                      --test selfhost_public_image_contract --no-run \
                      --timings --message-format=json
                    ;;
                  *) exit 2 ;;
                esac
              ' > "$artifacts"
            if [[ "${{ matrix.lane }}" == flow ]]; then
              python3 ../scripts/ci/verify-canvas-test-artifacts.py \
                --flow-only "$artifacts" target
            elif [[ "${{ matrix.lane }}" == selfhost ]]; then
              python3 ../scripts/ci/verify-canvas-test-artifacts.py \
                --selfhost-only "$artifacts" target
            else
              python3 ../scripts/ci/verify-canvas-test-artifacts.py \
                --worker-only "$artifacts" target
            fi
          elif [[ "${{ matrix.lane }}" == contracts ]]; then
            cargo test --locked --workspace --no-run --timings --message-format=json > "$artifacts"
            cargo build --locked -p marty-deployment-profile -p marty-compliance-profile -p marty-verification-service --bins --message-format=json >> "$artifacts"
          else
            mkdir -p "$RUNNER_TEMP/rust-build-evidence"
            host_metrics="$RUNNER_TEMP/rust-build-evidence/bookworm-host-phases.tsv"
            printf 'phase\telapsed_seconds\texit_code\n' > "$host_metrics"
            run_host_phase() {
              local phase="$1" started elapsed exit_code
              shift
              started="$(date +%s)"
              printf 'Bookworm host phase %s started\n' "$phase" >&2
              if "$@"; then
                exit_code=0
              else
                exit_code="$?"
              fi
              elapsed="$(( $(date +%s) - started ))"
              printf '%s\t%s\t%s\n' "$phase" "$elapsed" "$exit_code" >> "$host_metrics"
              printf 'Bookworm host phase %s: %ss, exit %s\n' \
                "$phase" "$elapsed" "$exit_code" >&2
              return "$exit_code"
            }
            # Fetch on the host before closing the builder's network. The
            # pinned Bookworm compiler writes to the normal host-visible target,
            # so both host and Bookworm checks consume these exact executables.
            run_host_phase cargo_fetch cargo fetch --locked
            mapfile -t builder_images < <(awk '$1 == "FROM" && $3 == "AS" && $4 == "rust-service-base" { print $2 }' ../services/Dockerfile)
            [[ ${#builder_images[@]} == 1 ]]
            bookworm_builder="${builder_images[0]}"
            [[ "$bookworm_builder" =~ ^rust:1\.95-bookworm@sha256:[a-f0-9]{64}$ ]]
            bookworm_builder="$(run_host_phase builder_pull bash \
              ../scripts/ci/pull-pinned-dockerhub-image.sh "$bookworm_builder")"
            # setup-mold installs this pinned host tool, but docker run does
            # not inherit it. Bind only the linker executable into Bookworm;
            # keep its filesystem and compiler network isolated.
            host_mold="$(command -v mold)"
            [[ "$(realpath "$host_mold")" == /usr/local/bin/mold ]]
            mold --version | grep -Eq '^mold 2[.]41[.]0 [(].*compatible with GNU ld[)]$'
            host_cargo_home="${CARGO_HOME:-$HOME/.cargo}"
            test -d "$host_cargo_home"
            mkdir -p target
            [[ ! -L target ]]
            [[ "$(realpath target)" == "$GITHUB_WORKSPACE/rust/target" ]]
            [[ -z "$(find target -mindepth 1 -maxdepth 1 -print -quit)" ]]
            run_host_phase container_compile docker run --rm --network none --read-only \
              --user "$(id -u):$(id -g)" \
              --env HOME=/tmp \
              --env "CARGO_HOME=$host_cargo_home" \
              --env "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/rust/target" \
              --env CARGO_INCREMENTAL=0 \
              --env CARGO_PROFILE_TEST_DEBUG=0 \
              --env CARGO_PROFILE_DEV_DEBUG=0 \
              --env 'RUSTFLAGS=-C link-arg=-fuse-ld=mold' \
              --tmpfs /tmp:rw,nosuid,nodev,mode=1777 \
              --volume "$host_mold:/usr/local/bin/ld.mold:ro" \
              --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
              --volume "$host_cargo_home:$host_cargo_home" \
              --volume "$GITHUB_WORKSPACE/rust/target:$GITHUB_WORKSPACE/rust/target:rw" \
              --workdir "$GITHUB_WORKSPACE/rust" \
              "$bookworm_builder" \
              sh -ceu '
                 ld.mold --version | grep -Eq "^mold 2[.]41[.]0 [(].*compatible with GNU ld[)]$"
                 probe="$CARGO_TARGET_DIR/.marty-mold-link-probe"
                 printf "int main(void){return 0;}\\n" | cc -x c - \
                   -fuse-ld=mold -o "$probe"
                 "$probe"
                 rm -- "$probe"
                 metrics="$CARGO_TARGET_DIR/bookworm-compile-phases.tsv"
                 printf "phase\telapsed_seconds\ttarget_bytes\texit_code\n" > "$metrics"
                 run_cargo_phase() {
                   phase="$1"
                   shift
                   started="$(date +%s)"
                   printf "Bookworm Cargo phase %s started\n" "$phase" >&2
                   if "$@"; then
                     exit_code=0
                   else
                     exit_code="$?"
                   fi
                   elapsed="$(( $(date +%s) - started ))"
                   target_bytes="$(du -sb "$CARGO_TARGET_DIR" | cut -f1)"
                   printf "%s\t%s\t%s\t%s\n" \
                     "$phase" "$elapsed" "$target_bytes" "$exit_code" >> "$metrics"
                   printf "Bookworm Cargo phase %s: %ss, %s target bytes, exit %s\n" \
                     "$phase" "$elapsed" "$target_bytes" "$exit_code" >&2
                   return "$exit_code"
                 }
                # Resolve shared test features once. Acceptance libraries are
                # empty ownership markers; the Issuance library harness is
                # executed by the renewal-unit lane, not this Canvas lane.
                 run_cargo_phase tests cargo test --locked --offline -p marty-canvas-acceptance -p marty-canvas-worker-acceptance -p marty-flow-acceptance -p marty-selfhost-acceptance -p marty-issuance-service \
                  --test canvas_published_worker_contract \
                  --test canvas_published_schema_contract \
                  --test flow_published_schema_contract \
                  --test selfhost_public_image_contract \
                  --test canvas_oauth_behavior --test issuance-behavior \
                  --no-run --timings --message-format=json
                # Retain package-specific feature resolution for each binary.
                 run_cargo_phase issuance_binaries cargo build --locked --offline \
                  -p marty-issuance-service -p marty-organization -p marty-credential-template \
                  --bin marty-issuance-service --bin marty-canvas-sync-worker \
                  --bin marty-organization --bin marty-credential-template \
                  --message-format=json
                 run_cargo_phase gateway_binary cargo build --locked --offline -p marty-gateway --bin marty-gateway \
                  --message-format=json
                 run_cargo_phase flow_binary cargo build --locked --offline -p marty-flow --bin marty-flow \
                  --message-format=json
              ' > "$artifacts"
            run_host_phase verify_artifacts python3 ../scripts/ci/verify-canvas-test-artifacts.py \
              --check-worker-inventory \
              "$artifacts" target
          fi
      - name: Capture host compiler cache counters after compile
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rust-build-evidence"
          if test -f rust/target/bookworm-compile-phases.tsv &&
             test ! -L rust/target/bookworm-compile-phases.tsv &&
             [[ "$(wc -c < rust/target/bookworm-compile-phases.tsv)" -le 4096 ]]; then
            cp rust/target/bookworm-compile-phases.tsv \
              "$RUNNER_TEMP/rust-build-evidence/bookworm-compile-phases.tsv"
          fi
          stats_file="$RUNNER_TEMP/rust-build-evidence/sccache-stats.json"
          if [[ "${RUSTC_WRAPPER:-}" != sccache ]]; then
            echo 'Optional compiler cache unavailable; no host counters captured.'
          elif sccache --show-stats 2>/dev/null |
              python3 scripts/ci/sanitize_sccache_stats.py > "$stats_file.tmp"; then
            mv "$stats_file.tmp" "$stats_file"
          else
            rm -f "$stats_file.tmp"
            echo 'Optional compiler cache stats unavailable; Rust validation remains authoritative.'
          fi
      - name: Execute ordinary Issuance library obligations
        if: matrix.lane == 'renewal-unit'
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t executables < <(jq -r '
            select(.reason == "compiler-artifact")
            | select(.package_id | contains("#marty-issuance-service@"))
            | select(.target.name == "marty_issuance_service")
            | select(.target.kind | index("lib"))
            | select(.profile.test == true)
            | select(.executable != null) | .executable
          ' "$RUNNER_TEMP/rust-test-artifacts.json" | sort -u)
          [[ ${#executables[@]} == 1 && -x "${executables[0]}" ]]
          python3 ../scripts/ci/rust_db_obligations.py \
            --name issuance_library_unit --owner renewal-unit -- \
            "${executables[0]}" --test-threads=4
      - name: Prepare pinned standalone Compose renderer for Rust contracts
        if: matrix.lane == 'contracts' || matrix.lane == 'flow' || matrix.lane == 'selfhost'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/install-compose-renderer.sh
          printf 'MARTY_BASE_COMPOSE_BINARY=%s\n' "$RUNNER_TEMP/compose-render-v5.4.0" >> "$GITHUB_ENV"
          printf 'MARTY_SELFHOST_BUNDLE_TEST_COMPOSE=%s\n' "$RUNNER_TEMP/compose-render-v5.4.0" >> "$GITHUB_ENV"
          if [[ "${{ matrix.lane }}" == flow ]]; then
            printf 'MARTY_DIDCOMM_TEST_PYTHON=%s\n' "$(command -v python3)" >> "$GITHUB_ENV"
          fi
      - name: Fail fast on image-free Canvas renewal configuration
        if: matrix.lane == 'canvas'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/install-compose-renderer.sh
          export MARTY_BASE_COMPOSE_BINARY="$RUNNER_TEMP/compose-render-v5.4.0"
          MARTY_DIDCOMM_TEST_PYTHON="$(command -v python3)"
          export MARTY_DIDCOMM_TEST_PYTHON
          export MARTY_CANVAS_PUBLISHED_SCHEMA_TEST=1
          printf 'MARTY_BASE_COMPOSE_BINARY=%s\n' "$MARTY_BASE_COMPOSE_BINARY" >> "$GITHUB_ENV"
          printf 'MARTY_SELFHOST_BUNDLE_TEST_COMPOSE=%s\n' "$MARTY_BASE_COMPOSE_BINARY" >> "$GITHUB_ENV"
          printf 'MARTY_DIDCOMM_TEST_PYTHON=%s\n' "$MARTY_DIDCOMM_TEST_PYTHON" >> "$GITHUB_ENV"
          python3 scripts/ci/run-canvas-config-proofs.py run "$RUNNER_TEMP/rust-test-artifacts.json"
      - name: Verify feature-regression observer isolation
        if: matrix.lane == 'contracts' || matrix.lane == 'renewal-unit'
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci/rust_contract_execution.sh
          run_timed feature_observer cargo test --frozen --offline --manifest-path rust/Cargo.toml \
            --package marty-issuance-service --lib \
            --features feature-regression-observer \
            internal_application_diagnostics::tests::feature_observer_is_task_scoped_non_nested_and_cleans_up \
            -- --exact
      - name: Compile Bookworm-compatible base runtime acceptance
        if: matrix.lane == 'canvas'
        shell: bash
        run: |
          set -euo pipefail
          compat_target="$GITHUB_WORKSPACE/rust/target"
          compat_artifacts="$RUNNER_TEMP/rust-test-artifacts.json"
          compat_executable="$(jq -sr '
            [.[] | select(.reason == "compiler-artifact")
            | select(.target.name == "canvas_published_schema_contract")
            | select(.package_id | contains("#marty-canvas-acceptance@"))
            | select(.executable != null) | .executable] | unique
            | if length == 1 then .[0] else error("Expected one Bookworm-compatible base runtime executable") end
          ' "$compat_artifacts")"
          [[ "$(dirname "$compat_executable")" == "$compat_target/debug/deps" ]]
          [[ "${compat_executable##*/}" =~ ^canvas_published_schema_contract-[a-f0-9]{16}$ ]]
          test -x "$compat_executable"
          test -x "$compat_target/debug/marty-issuance-service"
          test -x "$compat_target/debug/marty-gateway"
          # The shared test executable must be a Bookworm-compatible ELF, not
          # a host-built artifact accidentally selected from an old target.
          for executable in "$compat_executable" \
            "$compat_target/debug/marty-issuance-service" \
            "$compat_target/debug/marty-gateway"; do
            [[ ! -L "$executable" ]]
            [[ "$(realpath "$executable")" == "$compat_target"/* ]]
            program_headers="$(readelf -l "$executable")"
            [[ "$program_headers" == *'/lib64/ld-linux-x86-64.so.2'* ]]
            versions="$(readelf --version-info "$executable")"
            ! grep -Eq 'GLIBC_([3-9][0-9]*|2\.(3[7-9]|[4-9][0-9]|[0-9]{3,}))' <<< "$versions"
          done
          printf 'MARTY_BASE_RUNTIME_COMPAT_TEST_EXECUTABLE=%s\n' "$compat_executable" >> "$GITHUB_ENV"
      - name: Test native Canvas AGS/NRPS over real HTTPS
        if: matrix.lane == 'canvas'
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          openssl version
          https_executable="$(jq -sr '
            [.[] | select(.reason == "compiler-artifact")
            | select(.target.name == "canvas_oauth_behavior")
            | select(.package_id | contains("marty-issuance-service"))
            | select(.executable != null) | .executable] | unique
            | if length == 1 then .[0] else error("Expected one Canvas OAuth executable") end
          ' "$RUNNER_TEMP/rust-test-artifacts.json")"
          test -x "$https_executable"
          https_test='canvas_authoritative_https::actual_ags_nrps_https_uses_child_scoped_trust'
          test_list="$("$https_executable" --list)"
          [[ "$test_list" == *"$https_test: test"* ]]
          source ../scripts/ci/rust_contract_execution.sh
          run_timed canvas_native_https "$https_executable" "$https_test" --exact --nocapture --test-threads=1
      - name: Test Canvas publication adapter over real HTTPS
        if: matrix.lane == 'canvas'
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          publication_executable="$(jq -sr '
            [.[] | select(.reason == "compiler-artifact")
            | select(.target.name == "issuance-behavior")
            | select(.package_id | contains("marty-issuance-service"))
            | select(.executable != null) | .executable] | unique
            | if length == 1 then .[0] else error("Expected one issuance behavior executable") end
          ' "$RUNNER_TEMP/rust-test-artifacts.json")"
          test -x "$publication_executable"
          test_list="$("$publication_executable" --list)"
          [[ "$test_list" == *"canvas_publication_behavior::https_child: test"* ]]
          python3 ../scripts/test_canvas_publication_https.py "$publication_executable"
      - name: Prepare required rendered base executable acceptance
        if: matrix.lane == 'canvas'
        shell: bash
        run: |
          set -euo pipefail
          test -x "$MARTY_BASE_COMPOSE_BINARY"
          test -x rust/target/debug/marty-issuance-service
          test -x rust/target/debug/marty-gateway
          test -x rust/target/debug/marty-flow
          redis_image="$(bash scripts/ci/pull-pinned-dockerhub-image.sh \
            redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2)"
          docker tag "$redis_image" redis:7-alpine
          # Resolve the actual source Dockerfile build to a local immutable ID.
          # This is runtime identity evidence, not release provenance.
          docker build --tag marty-envoy:native-contract config/envoy
          envoy_image_id="$(docker image inspect --format '{{.Id}}' marty-envoy:native-contract)"
          printf 'MARTY_ENVOY_TEST_IMAGE=%s\n' "$envoy_image_id" >> "$GITHUB_ENV"
          test -x "$MARTY_SELFHOST_BUNDLE_TEST_COMPOSE"
          test -x "$MARTY_DIDCOMM_TEST_PYTHON"
      # These published worker cases use the verified Bookworm executables and
      # their own pinned fixtures, not the public selfhost image built below.
      - name: Preflight published worker parity in two isolated groups
        if: matrix.lane == 'canvas'
        working-directory: rust
        shell: bash
        run: python3 ../scripts/ci/run-db-contract-groups.py preflights
      - name: Expose public image compiler cache credentials
        if: matrix.lane == 'selfhost'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            const url = process.env.ACTIONS_RESULTS_URL;
            if (!token || !url) throw new Error('GitHub compiler cache credentials are unavailable');
            core.setSecret(token);
            core.exportVariable('SCCACHE_GHA_RUNTIME_TOKEN', token);
            core.exportVariable('SCCACHE_GHA_CACHE_URL', url);
            core.exportVariable('SCCACHE_GHA_RW_MODE', 'READ_ONLY');
      - name: Build public selfhost image
        if: matrix.lane == 'selfhost'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: services/Dockerfile
          load: true
          push: false
          tags: marty-selfhost-public:contract
          provenance: false
          build-args: |
            MARTY_RELEASE_VERSION=ci
            MARTY_UI_SHA=${{ github.event.pull_request.head.sha || github.sha }}
            SERVICE_NAME=issuance_native
          cache-from: type=gha,scope=marty-ui-public-services
          secret-envs: |
