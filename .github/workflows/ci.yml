      - name: Smoke-test gateway image
        shell: bash
        run: |
          set -euo pipefail
          token_dir="$(mktemp -d)"
          container=""
          trap 'if [ -n "$container" ]; then docker rm --force "$container" >/dev/null 2>&1 || true; fi; rm -rf "$token_dir"' EXIT
          printf '%s\n' 'synthetic-gateway-grant-mint-token' > "$token_dir/gateway-grant-mint-token"
          printf '%s\n' 'synthetic-issuer-csr-grant-mint-token' > "$token_dir/issuer-csr-grant-mint-token"
          chmod 755 "$token_dir"
          chmod 644 "$token_dir/gateway-grant-mint-token"
          chmod 644 "$token_dir/issuer-csr-grant-mint-token"
          container="$(docker run --detach \
            --env ENVIRONMENT=test \
            --env RATE_LIMIT_RPM=0 \
            --env BAO_ADDR=https://127.0.0.1:8200 \
            --env GATEWAY_SIGN_GRANT_MINT_TOKEN_FILE=/run/secrets/gateway-grant-mint-token \
            --env GATEWAY_ISSUER_CSR_GRANT_MINT_TOKEN_FILE=/run/secrets/issuer-csr-grant-mint-token \
            --volume "$token_dir:/run/secrets:ro" \
            --publish 127.0.0.1::8000 \
            marty-gateway:ci)"
          port="$(docker port "$container" 8000/tcp 2>/dev/null || true)"
          if [[ -z "$port" ]]; then
            docker logs "$container"
            exit 1
          fi
          port="${port##*:}"
          for _ in {1..40}; do
            if curl --fail --silent "http://127.0.0.1:${port}/health" \
              | grep --fixed-strings --quiet '"service":"api-gateway"'; then
