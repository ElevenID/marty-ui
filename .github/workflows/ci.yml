  public-protocol-contract:
    name: Public Protocol Contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require immutable protocol revision
        shell: bash
        run: |
          if [[ ! "$MARTY_PROTOCOL_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "MARTY_PROTOCOL_REF must be a full 40-character commit SHA." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: Marty-Protocol/Marty-Protocol
          ref: ${{ env.MARTY_PROTOCOL_REF }}
          path: marty-protocol
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.3"
          enable-cache: true
          cache-dependency-glob: requirements-services.txt
          cache-suffix: public-contract
      - name: Install contract-check dependencies
        run: uv pip install --system -r requirements-services.txt jsonschema
      - name: Enforce public response contract
        run: python scripts/check_gateway_public_protocol_contract.py --protocol-root marty-protocol

  test-release-contracts:
    name: Release Contract Tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.3"
          enable-cache: true
          cache-dependency-glob: |
            requirements-services.txt
            release/stack-lock.json
          cache-suffix: release-contracts
      - name: Install released test dependencies
        shell: bash
        run: |
          set -euo pipefail
          marty_rs_uri="$(jq -er '.components[] | select(.name == "marty-core-python") | .artifacts[] | select(.type == "python") | .uri' release/stack-lock.json)"
          marty_rs_digest="$(jq -er '.components[] | select(.name == "marty-core-python") | .artifacts[] | select(.type == "python") | .digest' release/stack-lock.json)"
          marty_rs_wheel="$RUNNER_TEMP/${marty_rs_uri##*/}"
          verification_uri="$(jq -er '.components[] | select(.name == "marty-verification-python") | .artifacts[] | select(.type == "python") | .uri' release/stack-lock.json)"
          verification_digest="$(jq -er '.components[] | select(.name == "marty-verification-python") | .artifacts[] | select(.type == "python") | .digest' release/stack-lock.json)"
          verification_wheel="$RUNNER_TEMP/${verification_uri##*/}"
          iso18013_uri="$(jq -er '.components[] | select(.name == "marty-iso18013-python") | .artifacts[] | select(.type == "python") | .uri' release/stack-lock.json)"
          iso18013_digest="$(jq -er '.components[] | select(.name == "marty-iso18013-python") | .artifacts[] | select(.type == "python") | .digest' release/stack-lock.json)"
          iso18013_wheel="$RUNNER_TEMP/${iso18013_uri##*/}"
          curl --fail --location --silent --show-error "$marty_rs_uri" --output "$marty_rs_wheel"
          curl --fail --location --silent --show-error "$verification_uri" --output "$verification_wheel"
          curl --fail --location --silent --show-error "$iso18013_uri" --output "$iso18013_wheel"
          echo "${marty_rs_digest#sha256:}  $marty_rs_wheel" | sha256sum --check --strict
          echo "${verification_digest#sha256:}  $verification_wheel" | sha256sum --check --strict
          echo "${iso18013_digest#sha256:}  $iso18013_wheel" | sha256sum --check --strict
          marty_common_wheel="$RUNNER_TEMP/${MARTY_COMMON_URI##*/}"
          curl --fail --location --silent --show-error "$MARTY_COMMON_URI" --output "$marty_common_wheel"
          echo "${MARTY_COMMON_DIGEST#sha256:}  $marty_common_wheel" | sha256sum --check --strict
          uv pip install --system pytest pyyaml jsonschema cryptography playwright "$marty_rs_wheel" "$verification_wheel" "$iso18013_wheel" "$marty_common_wheel"
      - name: Verify released mdoc binding evidence contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import marty_iso18013
          import marty_verification
          from marty_rs import _marty_rs

          assert hasattr(marty_iso18013, "Session")
          assert hasattr(marty_verification, "ChainValidator")

          evidence_type = _marty_rs.MdocDocumentVerificationEvidence
          for attribute in (
              "document_type",
              "signature_algorithm",
              "digest_algorithm",
              "signed_at",
              "valid_from",
              "valid_until",
              "issuer_certificate_sha256",
              "validity_checked",
              "valid_at_verification_time",
              "revocation_checked",
              "not_revoked",
          ):
              assert hasattr(evidence_type, attribute), attribute

          result = _marty_rs.verify_mdoc_presentation(
              b"\xff",
              bytes([0x83, 0xF6, 0xF6, 0x82, 0x71]),
              [],
          )
          assert result.issuer_signature_valid is False
          assert result.issuer_trusted is False
          assert result.device_authentication_valid is False
          assert result.document_evidence == []
          assert result.revocation_checked is False
          assert result.not_revoked is None
          assert result.error
          PY
      - name: Enforce OSS commerce boundary
        run: python scripts/check_oss_boundary.py
      - name: Run repository release checks
        run: python -m pytest tests -v --tb=short

  test-credential-lifecycle-browser:
    name: MIP 0.5 Credential Lifecycle Browser Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install UI dependencies
        working-directory: ui
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$MARTY_API_CORE_URI" --output "$RUNNER_TEMP/marty-api-core.tgz"
          curl --fail --location --silent --show-error "$MARTY_BLOG_URI" --output "$RUNNER_TEMP/marty-blog.tgz"
          echo "${MARTY_API_CORE_DIGEST#sha256:}  $RUNNER_TEMP/marty-api-core.tgz" | sha256sum --check --strict
          echo "${MARTY_BLOG_DIGEST#sha256:}  $RUNNER_TEMP/marty-blog.tgz" | sha256sum --check --strict
          bun pm pkg set "dependencies.@elevenid/marty-api-core=file:$RUNNER_TEMP/marty-api-core.tgz"
          bun pm pkg set "dependencies.@elevenid/marty-blog=file:$RUNNER_TEMP/marty-blog.tgz"
          bun install
      - name: Install Playwright dependencies
        working-directory: tests
        run: npm ci
      - name: Restore pinned Chromium headless shell
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-headless-${{ hashFiles('tests/package-lock.json') }}
      - name: Install pinned Chromium headless shell
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: tests
        run: npx playwright install --only-shell chromium
      - name: Install Chromium system dependencies
        working-directory: tests
        run: npx playwright install-deps chromium
      - name: Build and verify the public demo platform
        working-directory: tests
        run: npm run test:demo-platform
      - name: Run deterministic credential lifecycle gate
        working-directory: tests
        run: npx playwright test --config playwright.applicant-wallet.config.js
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mip-03-credential-lifecycle-browser
          path: |
            tests/test-results/
            tests/playwright-report-applicant-wallet/
            tests/artifacts/demo-platform-playwright/
            tests/artifacts/demo-platform-playwright-report/
          retention-days: 14

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.3"
          enable-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install scanners
        run: uv pip install --system bandit semgrep pip-audit
      - name: Run security scans concurrently
        shell: bash
        env:
          SEMGREP_ENABLE_VERSION_CHECK: "0"
        run: |
          set -uo pipefail
          timing_dir="$RUNNER_TEMP/security-scan-timings"
          mkdir -p "$timing_dir"
          timed() {
            local name="$1"
            shift
            local started ended status
            started="$(date +%s)"
            "$@"
            status=$?
            ended="$(date +%s)"
            printf '%s\t%s\t%s\n' "$name" "$((ended - started))" "$status" >"$timing_dir/$name.tsv"
            return "$status"
          }

          timed pip-audit pip-audit -r requirements-services.txt &
          pip_audit_pid=$!
          (cd ui && timed ui-audit bash -c 'bun install --frozen-lockfile --ignore-scripts && bun audit && npm audit --package-lock-only --audit-level=low') &
          ui_audit_pid=$!
          (cd tests && timed tests-audit npm audit --package-lock-only --audit-level=low) &
          tests_audit_pid=$!
          (timed bandit bandit -r services/ packages/ -f json -o bandit-report.json || true) &
          bandit_pid=$!
          (timed semgrep semgrep scan --config=auto --json --output semgrep-report.json services/ packages/ || true) &
          semgrep_pid=$!

          status=0
          wait "$pip_audit_pid" || status=1
          wait "$ui_audit_pid" || status=1
          wait "$tests_audit_pid" || status=1
          wait "$bandit_pid" || status=1
          wait "$semgrep_pid" || status=1

          {
            echo '### Security scan performance'
            echo
            echo '| Scanner | Seconds | Exit status |'
            echo '| --- | ---: | ---: |'
            sort "$timing_dir"/*.tsv | while IFS=$'\t' read -r name seconds scan_status; do
              echo "| $name | $seconds | $scan_status |"
            done
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: security-reports
          path: |
            bandit-report.json
            semgrep-report.json
            ${{ runner.temp }}/security-scan-timings/
          retention-days: 14

  rust-supply-chain:
    name: Rust Supply Chain
    runs-on: ubuntu-latest
