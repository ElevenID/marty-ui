      - name: Smoke-test organization image with PostgreSQL and Redis
        shell: bash
        run: |
          set -euo pipefail
          network="organization-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          postgres="organization-postgres-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          redis="organization-redis-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          organization="organization-service-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm --force "$organization" "$postgres" "$redis" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create "$network" >/dev/null
          docker run --detach \
            --name "$postgres" \
            --network "$network" \
            --network-alias organization-postgres \
            --env POSTGRES_USER=marty \
            --env POSTGRES_PASSWORD=marty-test \
            --env POSTGRES_DB=marty \
            postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f \
            >/dev/null
          docker run --detach \
            --name "$redis" \
            --network "$network" \
            --network-alias organization-redis \
            redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2 \
            >/dev/null
          for attempt in {1..60}; do
            if docker exec "$postgres" pg_isready --username marty --dbname marty >/dev/null \
              && docker exec "$redis" redis-cli ping | grep --fixed-strings --quiet PONG; then
              break
            fi
            if [[ "$attempt" == 60 ]]; then
              docker logs "$postgres"
              docker logs "$redis"
              exit 1
            fi
            sleep 0.5
          done
          docker run --detach \
            --name "$organization" \
            --network "$network" \
            --env ENVIRONMENT=test \
            --env DATABASE_URL=postgresql://marty:marty-test@organization-postgres/marty \
            --env REDIS_URL=redis://organization-redis:6379 \
            --env ES_GRPC_TARGET=event-stream:9015 \
            --env ES_GRPC_TIMEOUT_SECONDS=1 \
            --publish 127.0.0.1::8002 \
            marty-organization:ci \
            >/dev/null
          port="$(docker inspect \
            --format '{{(index (index .NetworkSettings.Ports "8002/tcp") 0).HostPort}}' \
            "$organization")"
          for attempt in {1..60}; do
            if curl --fail --silent "http://127.0.0.1:${port}/health" \
                | grep --extended-regexp --quiet '"status":"(healthy|degraded)"' \
              && curl --fail --silent "http://127.0.0.1:${port}/version" \
                | grep --fixed-strings --quiet '"service":"organization"'; then
              exit 0
            fi
            sleep 0.5
          done
          docker logs "$organization"
          exit 1
      - name: Smoke-test credential-template image with PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          network="credential-template-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          postgres="credential-template-postgres-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          service="credential-template-service-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
