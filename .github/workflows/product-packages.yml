name: Independent product packages

on:
  workflow_dispatch:
    inputs:
      product:
        description: Independent product to build as an unqualified candidate
        type: choice
        required: true
        options: [marty-server, marty-console]

permissions:
  contents: read

concurrency:
  group: product-packages-${{ inputs.product }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository == 'ElevenID/marty-ui'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      product: ${{ steps.plan.outputs.product }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Require protected main producer source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Freeze only the selected product's source inputs
        id: plan
        env:
          PRODUCT: ${{ inputs.product }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir product-plan
          python scripts/product_package_plan.py --product "$PRODUCT" \
            --source-sha "$GITHUB_SHA" --output product-plan/build-plan.json
          {
            echo "matrix=$(jq -c '{include: .images}' product-plan/build-plan.json)"
            echo "product=$(jq -r .product product-plan/build-plan.json)"
            echo "version=$(jq -r .version product-plan/build-plan.json)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: product-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: product-plan/build-plan.json
          if-no-files-found: error

  build:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PRIVATE_FORKS_ENABLED: ${{ vars.PRIVATE_FORKS_ENABLED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Authorize private fork access
        if: vars.PRIVATE_FORKS_ENABLED == 'true' && (matrix.role == 'services' || matrix.role == 'migrations')
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          python3 ".github/scripts/private-forks.py" check
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build only this product's verified image role
        id: image
        uses: ./.github/actions/build-product-image
        with:
          private-forks-enabled: ${{ vars.PRIVATE_FORKS_ENABLED == 'true' && (matrix.role == 'services' || matrix.role == 'migrations') && 'true' || 'false' }}
          private-forks-read-token: ${{ vars.PRIVATE_FORKS_ENABLED == 'true' && (matrix.role == 'services' || matrix.role == 'migrations') && secrets.PRIVATE_FORKS_READ_TOKEN || '' }}
          producer: product
          source-sha: ${{ github.sha }}
          product: ${{ needs.plan.outputs.product }}
          image-plan: ${{ toJSON(matrix) }}
      - name: Verify the console is a customer UI image
        if: matrix.role == 'ui'
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ needs.plan.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMAGE@$DIGEST"
          test "$(docker inspect --format '{{ index .Config.Labels "io.elevenid.ui.audience" }}' "$IMAGE@$DIGEST")" = customer
          docker run --rm --entrypoint cat "$IMAGE@$DIGEST" \
            /opt/marty-ui-static/marty-ui-release.json > "$RUNNER_TEMP/ui-metadata.json"
          python scripts/ui_release.py check-image --audience customer \
            --source-sha "$GITHUB_SHA" --version "$VERSION" \
            --image-metadata "$RUNNER_TEMP/ui-metadata.json"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Record this exact producer attempt's digest
        env:
          PRODUCT: ${{ needs.plan.outputs.product }}
          VERSION: ${{ needs.plan.outputs.version }}
          ROLE: ${{ matrix.role }}
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir image-receipt
          python - <<'PY'
          import json, os
          from pathlib import Path
          value = {key.lower(): os.environ[key] for key in ('PRODUCT', 'VERSION', 'ROLE', 'IMAGE', 'DIGEST')}
          value.update(source_sha=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'])
          Path('image-receipt', value['role'] + '.json').write_text(json.dumps(value) + '\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: product-image-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.role }}
          path: image-receipt/*.json
          if-no-files-found: error

  package:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: product-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: product-plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: product-image-${{ github.run_id }}-${{ github.run_attempt }}-*
          merge-multiple: true
          path: image-receipts
      - name: Assemble complete digest-bound package without a support claim
        env:
          PRODUCT: ${{ needs.plan.outputs.product }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/product_package_plan.py --product "$PRODUCT" --source-sha "$GITHUB_SHA" \
            --input-plan product-plan/build-plan.json --images-dir image-receipts \
            --build-run-id "$GITHUB_RUN_ID" --build-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output product-package/product-package.json --bundle-dir product-package \
            --archive-output product-package.tar.gz
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            product-package.tar.gz
            product-package.tar.gz.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ needs.plan.outputs.product }}-${{ needs.plan.outputs.version }}-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            product-package.tar.gz
            product-package.tar.gz.sha256
          if-no-files-found: error
