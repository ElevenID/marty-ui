name: MIP 0.4 Wallet Conformance And Release Attestation

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version published by the successful stack release
        required: true
      stack_release_run_id:
        description: Successful Stack release workflow run for the immutable release
        required: true
      beta_lifecycle_run_id:
        description: Successful beta lifecycle workflow run for the deployed source snapshot
        required: true
      beta_origin:
        description: Beta origin tested by both browser and device lanes
        required: true
        default: https://beta.elevenidllc.com
      wallet_evidence_url:
        description: HTTPS URL for the protected device-lab evidence JSON
        required: true
      wallet_evidence_sha256:
        description: SHA-256 of the exact device-lab evidence JSON
        required: true

concurrency:
  group: mip-03-wallet-conformance-${{ inputs.release_version }}
  cancel-in-progress: false

permissions:
  actions: read
  attestations: read
  contents: read

jobs:
  attest-release:
    name: Validate Device Evidence And Promote Release Manifest
    runs-on: ubuntu-latest
    environment: wallet-conformance
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.release_version }}
      STACK_RELEASE_RUN_ID: ${{ inputs.stack_release_run_id }}
      BETA_LIFECYCLE_RUN_ID: ${{ inputs.beta_lifecycle_run_id }}
      BETA_ORIGIN: ${{ inputs.beta_origin }}
      WALLET_EVIDENCE_URL: ${{ inputs.wallet_evidence_url }}
      WALLET_EVIDENCE_SHA256: ${{ inputs.wallet_evidence_sha256 }}
    steps:
      - name: Require successful immutable source runs
        id: source_runs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$WALLET_EVIDENCE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "wallet_evidence_sha256 must be a lowercase SHA-256." >&2
            exit 1
          fi
          if [[ ! "$STACK_RELEASE_RUN_ID" =~ ^[0-9]+$ || ! "$BETA_LIFECYCLE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Workflow run IDs must be numeric." >&2
            exit 1
          fi
          if [[ "$WALLET_EVIDENCE_URL" != https://* ]]; then
            echo "wallet_evidence_url must use HTTPS." >&2
            exit 1
          fi
          stack_run="$(gh run view "$STACK_RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion,event,headBranch,headSha,status,workflowName)"
          test "$(jq -r '.status' <<<"$stack_run")" = "completed"
          test "$(jq -r '.conclusion' <<<"$stack_run")" = "success"
          test "$(jq -r '.workflowName' <<<"$stack_run")" = "Stack release"
          test "$(jq -r '.headBranch' <<<"$stack_run")" = "v$RELEASE_VERSION"
          release_sha="$(jq -r '.headSha' <<<"$stack_run")"
          if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Stack release head SHA must be a full lowercase commit SHA." >&2
            exit 1
          fi

          lifecycle_run="$(gh run view "$BETA_LIFECYCLE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion,headSha,status,workflowName)"
          test "$(jq -r '.status' <<<"$lifecycle_run")" = "completed"
          test "$(jq -r '.conclusion' <<<"$lifecycle_run")" = "success"
          test "$(jq -r '.workflowName' <<<"$lifecycle_run")" = "MIP 0.4 Beta Credential Lifecycle"
          tooling_sha="$(jq -r '.headSha' <<<"$lifecycle_run")"
          if [[ ! "$tooling_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Beta lifecycle head SHA must be a full lowercase commit SHA." >&2
            exit 1
          fi
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "tooling_sha=$tooling_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.source_runs.outputs.tooling_sha }}

      - name: Require exact evidence tooling checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ steps.source_runs.outputs.tooling_sha }}"

      - name: Download and verify signed stack manifest
        id: stack_manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stack-evidence
          gh release download "v$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern stack-manifest.json \
            --pattern SHA256SUMS \
            --dir stack-evidence
          grep ' stack-manifest.json$' stack-evidence/SHA256SUMS > stack-evidence/stack-manifest.SHA256
          test "$(wc -l < stack-evidence/stack-manifest.SHA256)" -eq 1
          (
            cd stack-evidence
            sha256sum --check --strict stack-manifest.SHA256
          )
          gh attestation verify stack-evidence/stack-manifest.json \
            --repo "$GITHUB_REPOSITORY"
          manifest_sha256="$(sha256sum stack-evidence/stack-manifest.json | awk '{print $1}')"
          echo "sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"

      - name: Download beta lifecycle evidence
        shell: bash
        run: |
          mkdir -p beta-evidence
          gh run download "$BETA_LIFECYCLE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name mip-03-beta-credential-lifecycle \
            --dir beta-evidence

      - name: Download protected device-lab evidence
        shell: bash
        env:
          WALLET_EVIDENCE_BEARER_TOKEN: ${{ secrets.WALLET_EVIDENCE_BEARER_TOKEN }}
        run: |
          if [[ -n "$WALLET_EVIDENCE_BEARER_TOKEN" ]]; then
            curl --fail --silent --show-error --location \
              --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --header "Authorization: Bearer $WALLET_EVIDENCE_BEARER_TOKEN" \
              --output wallet-conformance-evidence.json \
              "$WALLET_EVIDENCE_URL"
          else
            curl --fail --silent --show-error --location \
              --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --output wallet-conformance-evidence.json \
              "$WALLET_EVIDENCE_URL"
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Verify protected attachment content
        env:
          WALLET_EVIDENCE_BEARER_TOKEN: ${{ secrets.WALLET_EVIDENCE_BEARER_TOKEN }}
        run: |
          python scripts/verify_wallet_attachments.py \
            --evidence wallet-conformance-evidence.json \
            --requirements deploy-config/catalog/wallet-conformance-requirements.json \
            --output-dir wallet-attachments \
            --report wallet-attachment-verification.json

      - name: Recheck live SpruceKit issuer metadata
        run: python scripts/check_spruceid_metadata.py --base "$BETA_ORIGIN"

      - name: Validate all gates and promote manifest
        shell: bash
        run: |
          python scripts/promote_release_evidence.py \
            --stack-manifest stack-evidence/stack-manifest.json \
            --stack-manifest-sha256 "${{ steps.stack_manifest.outputs.sha256 }}" \
            --beta-evidence beta-evidence \
            --wallet-evidence wallet-conformance-evidence.json \
            --wallet-evidence-sha256 "$WALLET_EVIDENCE_SHA256" \
            --attachment-verification wallet-attachment-verification.json \
            --requirements deploy-config/catalog/wallet-conformance-requirements.json \
            --release-version "$RELEASE_VERSION" \
            --stack-release-run-id "$STACK_RELEASE_RUN_ID" \
            --beta-run-id "$BETA_LIFECYCLE_RUN_ID" \
            --promotion-run-id "$GITHUB_RUN_ID" \
            --marty-ui-release-sha "${{ steps.source_runs.outputs.release_sha }}" \
            --beta-origin "$BETA_ORIGIN" \
            --output release-ready-manifest.json

      - name: Publish release-ready attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-ready-manifest-${{ inputs.release_version }}
          path: release-ready-manifest.json
          if-no-files-found: error
          retention-days: 365

      - name: Write attestation summary
        shell: bash
        run: |
          jq -r '
            "## Release-ready attestation\n" +
            "- Release: `" + .release + "`\n" +
            "- Marty UI release: `" + .release_attestation.stack_release.marty_ui_release_sha + "`\n" +
            "- Beta source: `" + .beta_evidence.beta_source_id + "`\n" +
            "- Stack manifest: `" + .release_attestation.stack_release.manifest_sha256 + "`\n" +
            "- Beta lifecycle run: `" + .release_attestation.beta_lifecycle.workflow_run_id + "`\n" +
            "- Wallet evidence: `" + .release_attestation.wallet_conformance.evidence_sha256 + "`\n" +
            "- Release ready: `" + (.release_ready | tostring) + "`"
          ' release-ready-manifest.json >> "$GITHUB_STEP_SUMMARY"
