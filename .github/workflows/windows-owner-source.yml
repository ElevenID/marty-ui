name: Windows owner source

on:
  pull_request:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  # A called workflow inherits github.workflow from its caller. Use a distinct
  # group so this job cannot cancel the required CI workflow that called it.
  group: windows-owner-source-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-custody:
    name: Synthetic source custody on NTFS
    if: github.event.repository.private == false
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Require Windows and the exact tested checkout
        run: |
          python -c "import os, subprocess, sys; assert os.name == 'nt'; assert sys.version_info[:2] == (3, 12); revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(); assert revision == os.environ['GITHUB_SHA']; print('Native Windows source checkout:', revision); print('Native Windows source tree:', tree); print(sys.version)"
          if ($LASTEXITCODE -ne 0) { throw 'Windows source checkout identity failed' }
      - name: Install public Python test dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest cryptography pyyaml
          if ($LASTEXITCODE -ne 0) { throw 'Public test dependency installation failed' }
      - name: Exercise exact source archive and portable installation contracts
        run: |
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          python -X faulthandler -m pytest -q `
            tests/test_windows_owner_source_bundle.py `
            tests/test_windows_source_install.py
          if ($LASTEXITCODE -ne 0) { throw 'Source archive or installation contracts failed' }
      - name: Require executed native NTFS placement and original-anchor replay
        run: |
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          $report = Join-Path $env:RUNNER_TEMP 'windows-owner-source-native.xml'
          python -X faulthandler scripts/ci/run_windows_source_tests.py --junitxml=$report
          if ($LASTEXITCODE -ne 0) { throw 'Native NTFS source contracts failed' }
          @'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = ET.parse(Path(os.environ['RUNNER_TEMP']) / 'windows-owner-source-native.xml').getroot()
          suites = list(report.iter('testsuite'))
          cases = list(report.iter('testcase'))
          required = {
              'test_native_install_publishes_private_source_and_refuses_overwrite',
              'test_native_source_inventory_refuses_unsafe_placement[broad-acl]',
              'test_native_source_inventory_refuses_unsafe_placement[hardlink]',
              'test_native_source_inventory_refuses_unsafe_placement[untracked-bytecode]',
              'test_native_source_inventory_refuses_unsafe_placement[junction]',
              'test_native_allocation_replacement_is_rejected_before_source_write',
              'test_native_late_source_acl_failure_preserves_pending_without_ready',
              'test_isolated_generated_runner_resolves_original_anchor_and_refuses_late_source_failure',
          }
          identities = [(case.get('classname'), case.get('name')) for case in cases]
          expected = {('tests.test_windows_source_install_ntfs', name) for name in required}
          if (not suites or len(cases) < len(required) or len(set(identities)) != len(cases)
                  or not expected <= set(identities)
                  or sum(int(suite.get('tests', '-1')) for suite in suites) != len(cases)
                  or any(int(suite.get(field, '-1')) != 0 for suite in suites
                         for field in ('failures', 'errors', 'skipped'))
                  or any(list(report.iter(tag)) for tag in ('failure', 'error', 'skipped'))):
              raise SystemExit('Native source qualification requires every retained case and zero skips or failures')
          print(f'Qualified {len(cases)} native NTFS cases, including all {len(required)} retained source contracts')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Native NTFS execution evidence is incomplete' }
