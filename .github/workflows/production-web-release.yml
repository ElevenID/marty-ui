name: Production website release

run-name: Build production website from ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-web-release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/elevenid/marty-ui-oss/ui-public

jobs:
  release:
    if: github.repository == 'ElevenID/marty-ui'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the exact protected-main source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse 'HEAD^{commit}')" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: Freeze the production target and locked dependencies
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ui_release.py plan --source-sha "$GITHUB_SHA" \
            --output production-web/build-plan.json
          test "$(jq -r .image production-web/build-plan.json)" = "$IMAGE"
          {
            echo "version=$(jq -r .version production-web/build-plan.json)"
            echo 'build_args<<WEBSITE_BUILD_ARGS'
            jq -r '.build_args | to_entries[] | "\(.key)=\(.value)"' production-web/build-plan.json
            echo WEBSITE_BUILD_ARGS
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build the separate production website image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: docker/ui.Dockerfile
          target: public
          platforms: linux/amd64
          build-args: ${{ steps.plan.outputs.build_args }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=production-web-ui
          cache-to: type=gha,mode=max,scope=production-web-ui
      - name: Verify the production image and prerendered homepage
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.plan.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull "$IMAGE@$DIGEST"
          test "$(docker inspect --format '{{ index .Config.Labels "io.elevenid.ui.audience" }}' "$IMAGE@$DIGEST")" = production
          docker run --rm -d --name production-web-smoke -p 127.0.0.1:18080:80 "$IMAGE@$DIGEST"
          trap 'docker rm -f production-web-smoke >/dev/null 2>&1 || true' EXIT
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:18080/ --output "$RUNNER_TEMP/production-homepage.html"
          grep --quiet 'ElevenID' "$RUNNER_TEMP/production-homepage.html"
          ! grep --quiet 'Welcome to nginx' "$RUNNER_TEMP/production-homepage.html"
          grep --fixed-strings --quiet 'name="prerender-status-code" content="200"' "$RUNNER_TEMP/production-homepage.html"
          grep --fixed-strings --quiet 'data-seo-jsonld="true"' "$RUNNER_TEMP/production-homepage.html"
          curl --fail --silent --show-error http://127.0.0.1:18080/product/ \
            --output "$RUNNER_TEMP/production-product.html"
          grep --fixed-strings --quiet 'name="prerender-status-code" content="200"' "$RUNNER_TEMP/production-product.html"
          grep --fixed-strings --quiet 'data-seo-jsonld="true"' "$RUNNER_TEMP/production-product.html"
          grep --extended-regexp --quiet '<h1[[:space:]>]' "$RUNNER_TEMP/production-product.html"
          grep --fixed-strings --quiet 'rel="canonical" href="https://elevenidllc.com/product"' "$RUNNER_TEMP/production-product.html"
          curl --fail --silent --show-error http://127.0.0.1:18080/marty-ui-release.json \
            --output production-web/image-metadata.json
          python scripts/ui_release.py check-image --audience production \
            --source-sha "$GITHUB_SHA" --version "$VERSION" \
            --image-metadata production-web/image-metadata.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Sign the image and its separate production manifest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE@$DIGEST"
          python scripts/ui_release.py record --source-sha "$GITHUB_SHA" \
            --input-plan production-web/build-plan.json --image-digest "$DIGEST" \
            --image-metadata production-web/image-metadata.json \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output production-web/production-web-release.json
          cosign sign-blob --yes --bundle production-web/production-web-release.json.sigstore.json \
            production-web/production-web-release.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: production-web/production-web-release.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-web-${{ steps.plan.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: production-web/
          if-no-files-found: error
          retention-days: 90
