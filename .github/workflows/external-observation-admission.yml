name: External observation admission
on:
  pull_request:
    paths:
      - 'rust/services/issuance/src/external_observation*.rs'
      - 'rust/services/issuance/migrations/0014_external_observation_authority.sql'
      - 'rust/services/issuance/migrations/0019_observation_materialization_locks.sql'
      - 'rust/services/issuance/schema/external_observation_catalog*'
      - 'rust/services/issuance/src/migration.rs'
      - 'rust/services/issuance/src/lib.rs'
      - 'rust/services/issuance/tests/customer_bootstrap_postgres.rs'
      - 'contracts/external-observation-v1.schema.json'
      - 'tests/rust/external-observation-journal/**'
      - 'scripts/run_external_observation_journal_contract.py'
      - 'rust/services/gateway/src/external_observation.rs'
      - 'rust/Cargo.toml'
      - 'rust/Cargo.lock'
      - 'rust/services/issuance/Cargo.toml'
      - '.github/workflows/external-observation-admission.yml'
  push:
    branches: [main]
    paths:
      - 'rust/services/issuance/src/external_observation*.rs'
      - 'rust/services/issuance/migrations/0014_external_observation_authority.sql'
      - 'rust/services/issuance/migrations/0019_observation_materialization_locks.sql'
      - 'rust/services/issuance/schema/external_observation_catalog*'
      - 'rust/services/issuance/src/migration.rs'
      - 'rust/services/issuance/src/lib.rs'
      - 'rust/services/issuance/tests/customer_bootstrap_postgres.rs'
      - 'contracts/external-observation-v1.schema.json'
      - 'tests/rust/external-observation-journal/**'
      - 'scripts/run_external_observation_journal_contract.py'
      - 'rust/services/gateway/src/external_observation.rs'
      - 'rust/Cargo.toml'
      - 'rust/Cargo.lock'
      - 'rust/services/issuance/Cargo.toml'
      - '.github/workflows/external-observation-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: external-observation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  admission:
    name: Core observation admission policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Compile and run exact policy source without workspace dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          rustc --edition=2021 --deny warnings --test \
            rust/services/issuance/src/external_observation_admission.rs \
            -o "$RUNNER_TEMP/external-observation-admission-tests"
          "$RUNNER_TEMP/external-observation-admission-tests"
      - name: Check candidate schema parses
        run: python3 -m json.tool contracts/external-observation-v1.schema.json > /dev/null
      - name: Require checked-in formatting
        run: rustfmt --edition 2021 --check rust/services/issuance/src/external_observation_admission.rs
  journal:
    name: Core observation PostgreSQL journal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16@sha256:dd2bf3ce2dc83a81674cf7f217fcfd8a5009a4b325dda5b843bfee82a06cff6f
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: observation-fixture-only
          POSTGRES_DB: external_observation_contract_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d external_observation_contract_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      EXTERNAL_OBSERVATION_CONTRACT_TEST: synthetic-local-only
      EXTERNAL_OBSERVATION_TEST_PORT: '5432'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Compile exact journal and run real PostgreSQL contract tests
        run: python3 scripts/run_external_observation_journal_contract.py --artifacts "$RUNNER_TEMP/journal-evidence"
      - name: Retain contract test evidence and formatting diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: external-observation-journal-evidence
          path: ${{ runner.temp }}/journal-evidence/
          retention-days: 3
          if-no-files-found: warn
