name: Rust Supply Chain

on:
  schedule:
    - cron: "21 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-supply-chain:
    name: Rust Supply Chain
    runs-on: ubuntu-latest
    steps:
      - name: Enforce private native build boundary
        if: vars.PRIVATE_FORKS_ENABLED == 'true'
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          echo "::error::Public native work is paused for the private fork cutover. See docs/private-native-builds.md."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.95.0
      - name: Audit Rust advisories, licenses, bans, and sources
        run: bash scripts/ci/run-cargo-deny.sh
