name: Rust Supply Chain

on:
  schedule:
    - cron: "21 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-supply-chain:
    name: Rust Supply Chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
      - name: Audit Rust advisories, licenses, bans, and sources
        run: bash scripts/ci/run-cargo-deny.sh
