name: Cleanup CI Caches

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: cleanup-ci-caches
  cancel-in-progress: false

jobs:
  cleanup:
    name: Remove caches for closed pull requests
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const {owner, repo} = context.repo;
            const closedNumber = context.eventName === 'pull_request'
              ? context.payload.pull_request.number
              : null;
            const listCaches = async (ref = null) => {
              const caches = [];
              for (let page = 1; ; page += 1) {
                const {data} = await github.request('GET /repos/{owner}/{repo}/actions/caches', {
                  owner,
                  repo,
                  per_page: 100,
                  page,
                  ...(ref ? {ref} : {}),
                });
                const pageCaches = (data.actions_caches || []).filter(Boolean);
                caches.push(...pageCaches);
                if (pageCaches.length < 100) break;
              }
              return caches;
            };
            // The PR ref filter misses caches written under its merge-queue ref.
            // Enumerate once, then select only this closed PR (or closed PRs on sweep).
            const caches = await listCaches();
            const candidates = caches.flatMap(cache => {
              const match = cache.ref.match(/^refs\/pull\/(\d+)\/merge$/)
                || cache.ref.match(/^refs\/heads\/gh-readonly-queue\/[^/]+\/pr-(\d+)-/);
              return match ? [{cache, number: Number(match[1])}] : [];
            });
            const pullStates = new Map();
            const seenCacheIds = new Set();
            const maxDeletions = 2000;
            const selected = [];
            for (const {cache, number} of candidates) {
              if (seenCacheIds.has(cache.id)) continue;
              seenCacheIds.add(cache.id);
              if (closedNumber !== null && number !== closedNumber) continue;
              // A queued closed event can run after the PR has reopened.
              if (!pullStates.has(number)) {
                const {data: pull} = await github.rest.pulls.get({owner, repo, pull_number: number});
                pullStates.set(number, pull.state);
              }
              if (pullStates.get(number) !== 'closed') continue;
              selected.push(cache);
              if (selected.length >= maxDeletions) break;
            }
            const delay = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
            const deleteCache = async cache => {
              const maxAttempts = 7;
              for (let attempt = 0; attempt < maxAttempts; attempt += 1) {
                try {
                  await github.rest.actions.deleteActionsCacheById({owner, repo, cache_id: cache.id});
                  return 'removed';
                } catch (error) {
                  if (error.status === 404) return 'missing';
                  const retryable = error.status === 429 || error.status === 403;
                  if (!retryable || attempt === maxAttempts - 1) throw error;
                  const retryAfter = Number(error.response?.headers?.['retry-after']);
                  const waitMilliseconds = Number.isFinite(retryAfter) && retryAfter > 0
                    ? retryAfter * 1000
                    : Math.min(60_000, 2_000 * (2 ** attempt));
                  core.warning(`Cache deletion was rate limited; retrying in ${waitMilliseconds}ms.`);
                  await delay(waitMilliseconds);
                }
              }
              throw new Error('Cache deletion retry loop exited unexpectedly.');
            };
            let removed = 0;
            let alreadyRemoved = 0;
            for (let index = 0; index < selected.length; index += 1) {
              const result = await deleteCache(selected[index]);
              if (result === 'removed') removed += 1;
              if (result === 'missing') alreadyRemoved += 1;
              if ((index + 1) % 25 === 0 || index + 1 === selected.length) {
                core.info(`Processed ${index + 1} of ${selected.length} cache entries.`);
              }
              if (index + 1 < selected.length) await delay(500);
            }
            core.summary
              .addHeading('CI cache cleanup')
              .addRaw(`Removed ${removed} cache entries for closed pull requests; ${alreadyRemoved} were already absent (limit ${maxDeletions} per run).`);
            await core.summary.write();
