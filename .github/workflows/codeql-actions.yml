name: CodeQL Actions

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "41 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze-actions:
    name: Analyze Actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CODEQL_ADVANCED_ENABLED: ${{ vars.CODEQL_ADVANCED_ENABLED }}
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: read
      security-events: write
    steps:
      - name: Require the completed advanced CodeQL cutover
        shell: bash
        run: |
          set -euo pipefail
          test "$CODEQL_ADVANCED_ENABLED" = "true"
      - name: Classify Actions analysis scope
        id: scope
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              core.setOutput('analyze', 'true');
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const analyze = files.some(({ filename }) =>
              filename.startsWith('.github/')
            );
            core.info(analyze
              ? 'GitHub Actions changes require CodeQL analysis.'
              : 'No GitHub Actions changes; satisfying the required check without analysis.');
            core.setOutput('analyze', String(analyze));
      - name: Record scoped analysis skip
        if: steps.scope.outputs.analyze != 'true'
        run: echo "Actions CodeQL is not affected by this pull request."
      - if: steps.scope.outputs.analyze == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize Actions analysis
        if: steps.scope.outputs.analyze == 'true'
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          languages: actions
      - name: Analyze Actions
        if: steps.scope.outputs.analyze == 'true'
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          category: /language:actions
