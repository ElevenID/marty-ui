# elevenid:required
name: Organization Quality

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "31 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  workflow-quality:
    uses: ElevenID/.github/.github/workflows/quality-workflows.yml@c6dd7de55112abb53284dd0254f3a5914301a3ed
    with:
      policy-ref: c6dd7de55112abb53284dd0254f3a5914301a3ed
  dependency-review:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    uses: ElevenID/.github/.github/workflows/dependency-review.yml@1cf3bd2234449617ef31347622615b48570a5ad9

  scorecard:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      security-events: write # Required to upload Scorecard SARIF.
      id-token: write # Required for keyless Scorecard result publishing.
      contents: read
    uses: ElevenID/.github/.github/workflows/scorecard.yml@1cf3bd2234449617ef31347622615b48570a5ad9
