name: Publish stable candidate

run-name: Publish stable candidate ${{ inputs.candidate_run_id || github.event.workflow_run.id }}

on:
  workflow_run:
    workflows: [Stack release]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Original successful Stack release run containing a sealed v2 candidate
        required: true
        type: string

permissions:
  contents: read

jobs:
  intake:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      eligible: ${{ steps.intake.outputs.eligible }}
      tag: ${{ steps.intake.outputs.tag }}
      candidate_run_id: ${{ steps.intake.outputs.candidate_run_id }}
    steps:
      # workflow_run uses the default-branch SHA. Never check out or execute
      # a ref, script, or action obtained from the candidate artifact/event.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - id: intake
        name: Authenticate original successful CD and bounded candidate identity
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: python scripts/stable_publication_intake.py --candidate-run-id "$CANDIDATE_RUN_ID"

  publish:
    needs: intake
    if: needs.intake.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: stack-release
    concurrency:
      # Shared with the original v1 publisher; no supported writer may race
      # a fresh v2 invocation for the same qualified release coordinate.
      group: stable-release-coordinate-${{ needs.intake.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532
      - name: Prepare the installer-pinned provenance verifier
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          verifier="$RUNNER_TEMP/installer-gh"
          mkdir "$verifier"
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
            --connect-timeout 20 --max-time 120 --max-filesize 15031001 \
            https://github.com/cli/cli/releases/download/v2.103.2/gh_2.103.2_linux_amd64.tar.gz \
            --output "$verifier/gh.tar.gz"
          test "$(stat -c %s "$verifier/gh.tar.gz")" = 15031001
          printf '%s  %s\n' 62ccf747115ddc61237efffdde66a3c8f70ba249433dc64f70801089b59c59c8 "$verifier/gh.tar.gz" | sha256sum --check --strict
          tar -xzf "$verifier/gh.tar.gz" --no-same-owner --no-same-permissions -C "$verifier" gh_2.103.2_linux_amd64/bin/gh
          chmod 700 "$verifier/gh_2.103.2_linux_amd64/bin/gh"
      - name: Reauthorize immutable candidate and publish only matching bytes
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ needs.intake.outputs.candidate_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python scripts/stable_publication.py \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --work "$RUNNER_TEMP/stable-candidate" \
            --output "$RUNNER_TEMP/stable-publication-result.json" \
            --gh "$RUNNER_TEMP/installer-gh/gh_2.103.2_linux_amd64/bin/gh" \
            --cosign "$(command -v cosign)"
      - name: Preserve publication result and mutation observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: stable-publication-result-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/stable-publication-result.json
            ${{ runner.temp }}/publication-observations.json
            ${{ runner.temp }}/published-release-transaction.json
          if-no-files-found: error
          retention-days: 90
      - name: Record remaining installer qualification
        run: |
          printf '%s\n' 'Stable version publication is complete. The existing staged installed journey, anonymous clean-host replay, installer admission, and signed channel promotion remain required before installer channel activation.' >> "$GITHUB_STEP_SUMMARY"
