name: Release environment preflight

on:
  workflow_call:
    inputs:
      environment:
        description: Environment declared in the release policy manifest
        required: true
        type: string
permissions:
  actions: read
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Require protected and complete release environment
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
        run: >-
          python scripts/check_github_release_environments.py
          --environment "$RELEASE_ENVIRONMENT"
          --protection-only
