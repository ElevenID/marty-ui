name: CodeQL Rust

on:
  pull_request:
    branches: [main]
    paths:
      - rust/**
      - proto/**
      - contracts/**
      - .github/codeql/**
      - .github/workflows/codeql-rust.yml
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze-rust:
    name: Analyze Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CODEQL_ADVANCED_ENABLED: ${{ vars.CODEQL_ADVANCED_ENABLED }}
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Require the completed advanced CodeQL cutover
        shell: bash
        run: |
          set -euo pipefail
          test "$CODEQL_ADVANCED_ENABLED" = "true"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize production-focused analysis
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          languages: rust
          build-mode: none
          config-file: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && './.github/codeql/codeql-full.yml' || './.github/codeql/codeql-production.yml' }}
      - name: Analyze Rust
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          category: /language:rust
