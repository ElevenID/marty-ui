# Archive-only admission gate: real staged and published installed reports are mandatory.
name: Installer admission gate
run-name: Verify installer admission for ${{ inputs.release_tag }}
'on':
  workflow_dispatch:
    inputs:
      operation:
        description: Admission gate or sign channel from published verified admission
        required: true
        type: choice
        default: admission
        options: [admission, channel]
      source_sha:
        description: Exact original installer source SHA
        required: true
        type: string
      release_tag:
        description: Exact published stable or nightly version
        required: true
        type: string
      build_run_id:
        description: Original successful installer build run
        required: false
        type: string
      build_run_attempt:
        description: Exact original build attempt
        required: false
        type: string
      staged_run_id:
        description: Successful real staged installer acceptance run
        required: false
        type: string
      staged_run_attempt:
        description: Exact staged acceptance attempt
        required: false
        type: string
      published_run_id:
        description: Successful anonymous public replay acceptance run
        required: false
        type: string
      published_run_attempt:
        description: Exact published acceptance attempt
        required: false
        type: string
permissions: {}
concurrency:
  group: installer-admission-${{ inputs.release_tag }}
  cancel-in-progress: false
jobs:
  admit-installer:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.repository == 'ElevenID/marty-ui' && inputs.operation != 'channel'
    runs-on: ubuntu-24.04
    environment: stack-release
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Authenticate exact successful build and installed acceptance runs
      id: context
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_SHA: ${{ inputs.source_sha }}
        RELEASE_TAG: ${{ inputs.release_tag }}
        BUILD_RUN_ID: ${{ inputs.build_run_id }}
        BUILD_RUN_ATTEMPT: ${{ inputs.build_run_attempt }}
        STAGED_RUN_ID: ${{ inputs.staged_run_id }}
        STAGED_RUN_ATTEMPT: ${{ inputs.staged_run_attempt }}
        PUBLISHED_RUN_ID: ${{ inputs.published_run_id }}
        PUBLISHED_RUN_ATTEMPT: ${{ inputs.published_run_attempt }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        python - <<'PY'
        import os, sys, json, urllib.request
        from pathlib import Path
        sys.path.insert(0, 'scripts')
        import installer_release as r
        import installer_promote as p
        class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, *args, **kwargs):
                raise ValueError('API redirect refused')
        opener=urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
        def api(path):
            request=urllib.request.Request('https://api.github.com/repos/ElevenID/marty-ui/'+path,
                headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json',
                         'X-GitHub-Api-Version':'2022-11-28'})
            with opener.open(request,timeout=30) as response:
                raw=response.read(1048577)
            r.require(len(raw)<=1048576,'API response exceeds bound')
            return json.loads(raw)
        def number(key):
            value=os.environ[key]
            r.require(value.isascii() and value.isdecimal(),'invalid run number')
            result=int(value); r.positive(result); return result
        def project(run):
            keys=('id','run_attempt','path','head_sha','head_branch','event','status','conclusion')
            return dict(repository={'full_name':run['repository']['full_name']},**{k:run[k] for k in keys})
        try:
            source,tag=os.environ['SOURCE_SHA'],os.environ['RELEASE_TAG']
            build,attempt=number('BUILD_RUN_ID'),number('BUILD_RUN_ATTEMPT')
            r.identity(source,tag,build,attempt)
            tier,_=r.classify_release_tag(tag)
            runs={'build':api('actions/runs/'+str(build)), 'promotion':api('actions/runs/'+os.environ['GITHUB_RUN_ID'])}
            p.check_run(runs['build'],run_id=build,attempt=attempt,workflow='.github/workflows/nightly-release.yml' if tier=='nightly' else '.github/workflows/cd.yml',source=source)
            p.check_run(runs['promotion'],run_id=number('GITHUB_RUN_ID'),attempt=number('GITHUB_RUN_ATTEMPT'),workflow=r.PROMOTION_WORKFLOW,source=os.environ['GITHUB_SHA'],active=True)
            artifacts={}
            for phase in ('staged','published'):
                run_id,run_attempt=number(phase.upper()+'_RUN_ID'),number(phase.upper()+'_RUN_ATTEMPT')
                runs[phase]=api('actions/runs/'+str(run_id))
                p.check_run(runs[phase],run_id=run_id,attempt=run_attempt,workflow=r.acceptance.WORKFLOW)
                listing=api('actions/runs/'+str(run_id)+'/artifacts?per_page=100')
                r.require(listing['total_count']<=100,'artifact listing exceeds bound')
                name=f'installer-acceptance-{phase}-{run_id}-{run_attempt}'
                found=[a for a in listing['artifacts'] if a['name']==name]
                r.require(len(found)==1 and found[0]['expired'] is False,'missing exact installed acceptance artifact')
                artifact=found[0]; r.positive(artifact['id'])
                r.require(artifact['workflow_run']['id']==run_id and artifact['workflow_run']['head_sha']==runs[phase]['head_sha'],'artifact producer differs')
                artifacts[phase]=artifact['id']
            base=Path(os.environ['RUNNER_TEMP'])/'installer-promotion'
            base.mkdir(mode=0o700)
            for name in ('assets','staged','published','context','tools','output'):
                (base/name).mkdir(mode=0o700)
            with (base/'context/runs.json').open('xb') as stream:
                stream.write(r.encode({k:project(v) for k,v in runs.items()}))
            with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
                for phase,value in artifacts.items(): stream.write(f'{phase}_artifact_id={value}\n')
        except (OSError,ValueError,KeyError,TypeError):
            raise SystemExit('Installer promotion API evidence refused') from None
        PY
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: ${{ steps.context.outputs.staged_artifact_id }}
        run-id: ${{ inputs.staged_run_id }}
        github-token: ${{ github.token }}
        merge-multiple: true
        path: ${{ runner.temp }}/installer-promotion/staged
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: ${{ steps.context.outputs.published_artifact_id }}
        run-id: ${{ inputs.published_run_id }}
        github-token: ${{ github.token }}
        merge-multiple: true
        path: ${{ runner.temp }}/installer-promotion/published
    - name: Prepare exact installer verifier binaries
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        tools="$RUNNER_TEMP/installer-promotion/tools"
        curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
          --connect-timeout 20 --max-time 180 --max-filesize 145688404 \
          https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64 --output "$tools/cosign"
        test "$(stat -c %s "$tools/cosign")" = 145688404
        printf '%s  %s\n' 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa "$tools/cosign" | sha256sum --check --strict
        curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
          --connect-timeout 20 --max-time 120 --max-filesize 15031001 \
          https://github.com/cli/cli/releases/download/v2.103.2/gh_2.103.2_linux_amd64.tar.gz --output "$tools/gh.tar.gz"
        test "$(stat -c %s "$tools/gh.tar.gz")" = 15031001
        printf '%s  %s\n' 62ccf747115ddc61237efffdde66a3c8f70ba249433dc64f70801089b59c59c8 "$tools/gh.tar.gz" | sha256sum --check --strict
        tar -xzf "$tools/gh.tar.gz" --no-same-owner --no-same-permissions -C "$tools" gh_2.103.2_linux_amd64/bin/gh
        chmod 700 "$tools/cosign" "$tools/gh_2.103.2_linux_amd64/bin/gh"
    - name: Acquire exact published installer payload and proof closure
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ inputs.release_tag }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        base="$RUNNER_TEMP/installer-promotion"
        gh="$base/tools/gh_2.103.2_linux_amd64/bin/gh"
        "$gh" api "repos/ElevenID/marty-ui/releases/tags/$RELEASE_TAG" > "$base/context/release.json"
        python - <<'PY'
        import json,os
        from pathlib import Path
        p=Path(os.environ['RUNNER_TEMP'])/'installer-promotion/context/release.json'
        if p.stat().st_size>1048576: raise SystemExit('Release response exceeds bound')
        r=json.loads(p.read_bytes())
        if r.get('draft') is not False or r.get('tag_name')!=os.environ['RELEASE_TAG']:
            raise SystemExit('Published release identity differs')
        PY
        patterns=()
        for subject in installer-inventory.json install.sh marty-deploy-linux-amd64 prepared-selfhost-bundle.zip prepared-selfhost-images.json; do
          patterns+=(--pattern "$subject" --pattern "$subject.sigstore.json" --pattern "$subject.provenance.jsonl")
        done
        "$gh" release download "$RELEASE_TAG" --repo ElevenID/marty-ui --dir "$base/assets" "${patterns[@]}"
        chmod 700 "$base/assets" "$base/staged" "$base/published"
    - name: Require both real installed journeys and sign admission
      env:
        SOURCE_SHA: ${{ inputs.source_sha }}
        RELEASE_TAG: ${{ inputs.release_tag }}
        BUILD_RUN_ID: ${{ inputs.build_run_id }}
        BUILD_RUN_ATTEMPT: ${{ inputs.build_run_attempt }}
        STAGED_RUN_ID: ${{ inputs.staged_run_id }}
        STAGED_RUN_ATTEMPT: ${{ inputs.staged_run_attempt }}
        PUBLISHED_RUN_ID: ${{ inputs.published_run_id }}
        PUBLISHED_RUN_ATTEMPT: ${{ inputs.published_run_attempt }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        base="$RUNNER_TEMP/installer-promotion"
        python scripts/installer_promote.py --assets "$base/assets" --staged "$base/staged" --published "$base/published" \
          --runs "$base/context/runs.json" --gh "$base/tools/gh_2.103.2_linux_amd64/bin/gh" --cosign "$base/tools/cosign" \
          --source-sha "$SOURCE_SHA" --release-tag "$RELEASE_TAG" --build-run-id "$BUILD_RUN_ID" --build-run-attempt "$BUILD_RUN_ATTEMPT" \
          --staged-run-id "$STAGED_RUN_ID" --staged-run-attempt "$STAGED_RUN_ATTEMPT" \
          --published-run-id "$PUBLISHED_RUN_ID" --published-run-attempt "$PUBLISHED_RUN_ATTEMPT" \
          --promotion-source-sha "$GITHUB_SHA" --promotion-run-id "$GITHUB_RUN_ID" --promotion-run-attempt "$GITHUB_RUN_ATTEMPT" \
          --output "$base/output/installer-admission.json"
        "$base/tools/cosign" sign-blob --yes --bundle "$base/output/installer-admission.json.sigstore.json" "$base/output/installer-admission.json" >/dev/null
    - id: admission_provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-path: ${{ runner.temp }}/installer-promotion/output/installer-admission.json
    - name: Verify and export exact promotion invocation proof
      env:
        PROVENANCE_BUNDLE: ${{ steps.admission_provenance.outputs.bundle-path }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        python - <<'PY'
        import os,sys
        from pathlib import Path
        sys.path.insert(0,'scripts')
        import installer_release as r
        import verify_installer_provenance as p
        from installer_candidate_authorize import write_exclusive
        base=Path(os.environ['RUNNER_TEMP'])/'installer-promotion'
        subject=base/'output/installer-admission.json'
        source=Path(os.environ['PROVENANCE_BUNDLE'])
        p.local_file(source,maximum=1048576)
        with source.open('rb') as stream: raw=stream.read(1048577)
        r.require(0<len(raw)<=1048576,'promotion provenance exceeds bound')
        proof=base/'output/installer-admission.json.provenance.jsonl'
        write_exclusive(proof,raw)
        p.verify_subject(subject,proof,gh=base/'tools/gh_2.103.2_linux_amd64/bin/gh',cosign=base/'tools/cosign',
            signature_bundle=base/'output/installer-admission.json.sigstore.json',workflow=r.PROMOTION_WORKFLOW,
            source_sha=os.environ['GITHUB_SHA'],run_id=int(os.environ['GITHUB_RUN_ID']),run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']))
        PY
    - name: Archive verified immutable admission triplet
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: installer-admission-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/installer-promotion/output/
        if-no-files-found: error
        retention-days: 90
    - name: Record archive-only promotion boundary
      shell: bash
      run: |
        printf '%s\n' 'Verified admission archived only. No version release was modified, no channel was published, and installer release lifecycle integration is not complete.' >> "$GITHUB_STEP_SUMMARY"

  sign-channel:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.repository == 'ElevenID/marty-ui' && inputs.operation == 'channel'
    runs-on: ubuntu-24.04
    environment: stack-release
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Create private channel workspace
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        base="$RUNNER_TEMP/installer-channel-signing"
        mkdir -m 700 "$base" "$base/work" "$base/output" "$base/tools"
    - name: Prepare exact installer verifier binaries
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        tools="$RUNNER_TEMP/installer-channel-signing/tools"
        curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
          --connect-timeout 20 --max-time 180 --max-filesize 145688404 \
          https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64 --output "$tools/cosign"
        test "$(stat -c %s "$tools/cosign")" = 145688404
        printf '%s  %s\n' 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa "$tools/cosign" | sha256sum --check --strict
        curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
          --connect-timeout 20 --max-time 120 --max-filesize 15031001 \
          https://github.com/cli/cli/releases/download/v2.103.2/gh_2.103.2_linux_amd64.tar.gz --output "$tools/gh.tar.gz"
        test "$(stat -c %s "$tools/gh.tar.gz")" = 15031001
        printf '%s  %s\n' 62ccf747115ddc61237efffdde66a3c8f70ba249433dc64f70801089b59c59c8 "$tools/gh.tar.gz" | sha256sum --check --strict
        tar -xzf "$tools/gh.tar.gz" --no-same-owner --no-same-permissions -C "$tools" gh_2.103.2_linux_amd64/bin/gh
        chmod 700 "$tools/cosign" "$tools/gh_2.103.2_linux_amd64/bin/gh"
    - name: Require published signed admission and sign exact channel plus CAS context
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_SHA: ${{ inputs.source_sha }}
        RELEASE_TAG: ${{ inputs.release_tag }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        base="$RUNNER_TEMP/installer-channel-signing"
        python scripts/installer_channel.py produce --work "$base/work" --output "$base/output" \
          --gh "$base/tools/gh_2.103.2_linux_amd64/bin/gh" --cosign "$base/tools/cosign" \
          --source-sha "$SOURCE_SHA" --release-tag "$RELEASE_TAG" --promotion-source-sha "$GITHUB_SHA" \
          --promotion-run-id "$GITHUB_RUN_ID" --promotion-run-attempt "$GITHUB_RUN_ATTEMPT"
        for subject in installer-channel.json installer-channel-context.json; do
          "$base/tools/cosign" sign-blob --yes --bundle "$base/output/$subject.sigstore.json" "$base/output/$subject" >/dev/null
        done
    - id: channel_provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-path: |-
          ${{ runner.temp }}/installer-channel-signing/output/installer-channel.json
          ${{ runner.temp }}/installer-channel-signing/output/installer-channel-context.json
    - name: Verify and export exact promotion invocation proof
      env:
        PROVENANCE_BUNDLE: ${{ steps.channel_provenance.outputs.bundle-path }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        python - <<'PY'
        import os,sys
        from pathlib import Path
        sys.path.insert(0,'scripts')
        import installer_release as r
        import verify_installer_provenance as p
        from installer_candidate_authorize import write_exclusive
        base=Path(os.environ['RUNNER_TEMP'])/'installer-channel-signing'
        source=Path(os.environ['PROVENANCE_BUNDLE'])
        p.local_file(source,maximum=1048576)
        with source.open('rb') as stream: raw=stream.read(1048577)
        r.require(0<len(raw)<=1048576,'promotion provenance exceeds bound')
        for name in ('installer-channel.json','installer-channel-context.json'):
            subject=base/'output'/name
            proof=base/'output'/(name+'.provenance.jsonl')
            write_exclusive(proof,raw)
            p.verify_subject(subject,proof,gh=base/'tools/gh_2.103.2_linux_amd64/bin/gh',cosign=base/'tools/cosign',
                signature_bundle=base/'output'/(name+'.sigstore.json'),workflow=r.PROMOTION_WORKFLOW,
                source_sha=os.environ['GITHUB_SHA'],run_id=int(os.environ['GITHUB_RUN_ID']),run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']))
        PY
    - name: Archive signed channel and signed expected-head context
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: installer-channel-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/installer-channel-signing/output/
        if-no-files-found: error
        retention-days: 90
