      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stack-release-promotion-complete-${{ github.run_id }}
          path: transaction/release-transaction.json
          if-no-files-found: error
          retention-days: 90
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
        with:
          image: ${{ env.IMAGE }}@${{ needs.build-ui.outputs.digest }}
          format: cyclonedx-json
          output-file: marty-ui-sbom.cdx.json
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
        with:
          image: ${{ env.SERVICES_IMAGE }}@${{ needs.build-services.outputs.services_digest }}
          format: cyclonedx-json
          output-file: marty-ui-services-sbom.cdx.json
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
        with:
          image: ${{ env.MIGRATIONS_IMAGE }}@${{ needs.build-services.outputs.migrations_digest }}
          format: cyclonedx-json
          output-file: marty-ui-migrations-sbom.cdx.json
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
        with:
          image: ${{ env.OPENBAO_DIDCOMM_IMAGE }}@${{ needs.build-openbao-didcomm.outputs.digest }}
          format: cyclonedx-json
          output-file: marty-ui-openbao-didcomm-sbom.cdx.json
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
        with:
          image: ${{ env.KEYCLOAK_IMAGE }}@${{ needs.build-keycloak.outputs.digest }}
          format: cyclonedx-json
          output-file: marty-ui-keycloak-sbom.cdx.json
      - name: Add immutable UI evidence
        env:
          LOCK_FILE: release/stack-lock.json
          UI_DIGEST: ${{ needs.build-ui.outputs.digest }}
          SERVICES_DIGEST: ${{ needs.build-services.outputs.services_digest }}
          MIGRATIONS_DIGEST: ${{ needs.build-services.outputs.migrations_digest }}
          OPENBAO_DIDCOMM_DIGEST: ${{ needs.build-openbao-didcomm.outputs.digest }}
          KEYCLOAK_DIGEST: ${{ needs.build-keycloak.outputs.digest }}
          SOURCE_SHA: ${{ needs.resolve-transaction.outputs.source_sha }}
          VERSION: ${{ needs.validate-stack.outputs.version }}
        shell: bash
        run: |
          jq \
            --arg sha "$SOURCE_SHA" \
            --arg version "$VERSION" \
            --arg ui_digest "$UI_DIGEST" \
            --arg services_digest "$SERVICES_DIGEST" \
            --arg migrations_digest "$MIGRATIONS_DIGEST" \
            --arg openbao_didcomm_digest "$OPENBAO_DIDCOMM_DIGEST" \
            --arg keycloak_digest "$KEYCLOAK_DIGEST" '
            .components += [{
              name: "marty-ui",
              repository: "ElevenID/marty-ui",
              version: $version,
              commit: $sha,
              artifacts: [
                {type: "oci", uri: "ghcr.io/elevenid/marty-ui-oss/ui", digest: $ui_digest,
                 sbom: ("https://github.com/ElevenID/marty-ui/releases/download/v" + $version + "/marty-ui-sbom.cdx.json"),
                 provenance: "https://github.com/ElevenID/marty-ui/attestations"},
                {type: "oci", uri: "ghcr.io/elevenid/marty-ui-oss/services", digest: $services_digest,
                 sbom: ("https://github.com/ElevenID/marty-ui/releases/download/v" + $version + "/marty-ui-services-sbom.cdx.json"),
                 provenance: "https://github.com/ElevenID/marty-ui/attestations"},
                {type: "oci", uri: "ghcr.io/elevenid/marty-ui-oss/migrations", digest: $migrations_digest,
                 sbom: ("https://github.com/ElevenID/marty-ui/releases/download/v" + $version + "/marty-ui-migrations-sbom.cdx.json"),
                 provenance: "https://github.com/ElevenID/marty-ui/attestations"},
                {type: "oci", uri: "ghcr.io/elevenid/marty-ui-oss/openbao-didcomm", digest: $openbao_didcomm_digest,
                 sbom: ("https://github.com/ElevenID/marty-ui/releases/download/v" + $version + "/marty-ui-openbao-didcomm-sbom.cdx.json"),
                 provenance: "https://github.com/ElevenID/marty-ui/attestations"},
                {type: "oci", uri: "ghcr.io/elevenid/marty-ui-oss/keycloak", digest: $keycloak_digest,
                 sbom: ("https://github.com/ElevenID/marty-ui/releases/download/v" + $version + "/marty-ui-keycloak-sbom.cdx.json"),
                 provenance: "https://github.com/ElevenID/marty-ui/attestations"}
              ]
            }]
          ' "$LOCK_FILE" > release/complete-stack-lock.json
          # A resume must reproduce the public manifest byte-for-byte. Anchor
          # its timestamp to the immutable source commit, not runner wall time.
          manifest_timestamp="$(git show -s --format=%cI "$SOURCE_SHA")"
          python scripts/build_stack_manifest.py \
            --lock release/complete-stack-lock.json \
            --generated-at "$manifest_timestamp" --output stack-manifest.json
          cp transaction/release-transaction.json release-transaction.json
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Sign and checksum manifest evidence
        shell: bash
        run: |
          set -euo pipefail
          source scripts/operator-release-assets.sh
          for file in "${OPERATOR_SIGNED_INPUTS[@]}"; do
            signed=false
            for attempt in 1 2 3 4; do
              rm -f "${file}.sigstore.json"
              if cosign sign-blob --yes --bundle "${file}.sigstore.json" "$file"; then
                signed=true
                break
              fi
              if [ "$attempt" -lt 4 ]; then
                sleep "$((attempt * 5))"
              fi
            done
            if [ "$signed" != true ]; then
              echo "Failed to sign $file after 4 attempts"
              exit 1
            fi
          done
          sha256sum "${OPERATOR_CHECKSUM_INPUTS[@]}" > SHA256SUMS
          operator_release_require_local_assets
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            stack-manifest.json
            release-transaction.json
            marty-ui-sbom.cdx.json
            marty-ui-services-sbom.cdx.json
            marty-ui-migrations-sbom.cdx.json
            marty-deploy-linux-amd64
            marty-deploy-linux-arm64
            marty-ui-openbao-didcomm-sbom.cdx.json
            marty-ui-keycloak-sbom.cdx.json
      - name: Create or verify the late annotated source tag
        env:
          CLAIM_RUN_ID: ${{ needs.resolve-transaction.outputs.claim_run_id }}
          SOURCE_SHA: ${{ needs.resolve-transaction.outputs.source_sha }}
          TAG: ${{ needs.resolve-transaction.outputs.tag }}
          TRANSACTION_ID: ${{ needs.resolve-transaction.outputs.transaction_id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          python scripts/check_stack_pre_promotion.py --transaction transaction/release-transaction.json
          existing="$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          if [ -n "$existing" ]; then
            git fetch --force --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
            test "$(git cat-file -t "refs/tags/$TAG")" = tag
            test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$SOURCE_SHA"
            git for-each-ref --format='%(contents)' "refs/tags/$TAG" > tag-message.txt
            grep -Fx "Release-Transaction: $TRANSACTION_ID" tag-message.txt
            grep -Fx "Claim-Run: $CLAIM_RUN_ID" tag-message.txt
            grep -Fx "Source-SHA: $SOURCE_SHA" tag-message.txt
          else
            echo "::error::Qualified images are promoted and checkpointed. Push the exact annotated tag locally with scripts/push_promoted_release_tag.py using this run ID, then dispatch a resume from stack-release-promotion-complete-$GITHUB_RUN_ID. No Actions secret is required."
            exit 1
          fi
      - name: Detect only an exact resumable immutable release
        id: existing_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-transaction.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output release-response.json \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          case "$status" in
            404)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              ;;
            200)
              test "$(jq -er .tag_name release-response.json)" = "$TAG"
              test "$(jq -er .draft release-response.json)" = false
              source scripts/operator-release-assets.sh
              operator_release_require_local_assets
              operator_release_require_remote_allowlist release-response.json
              mkdir existing-release
              gh release download "$TAG" --dir existing-release
              operator_release_verify_published_assets existing-release "$SOURCE_SHA" "$GITHUB_REPOSITORY"
              if ! cmp --silent stack-manifest.json existing-release/stack-manifest.json; then
                echo '::error::Existing release manifest differs from this exact-source resume'
                exit 1
              fi
              if ! cmp --silent release-transaction.json existing-release/release-transaction.json; then
                echo '::error::Existing release transaction differs from this exact-source resume'
                exit 1
              fi
              {
                echo "exists=true"
                echo "release_id=$(jq -er .id release-response.json)"
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::GitHub release lookup failed with HTTP $status"
              exit 1
              ;;
          esac
      - id: release
        name: Publish the qualified GitHub release and exact assets
        if: steps.existing_release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-transaction.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          python scripts/check_stack_pre_promotion.py --transaction transaction/release-transaction.json
          source scripts/operator-release-assets.sh
          operator_release_require_local_assets
          gh release create "$TAG" --verify-tag --generate-notes "${OPERATOR_RELEASE_ASSETS[@]}"
          release_id="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)"
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > published-release.json
          operator_release_require_remote_allowlist published-release.json
          echo "id=$release_id" >> "$GITHUB_OUTPUT"
      - name: Seal the published terminal transaction
        env:
          GH_TOKEN: ${{ github.token }}
          EXISTING_RELEASE_ID: ${{ steps.existing_release.outputs.release_id }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
          TAG: ${{ needs.resolve-transaction.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          release_id="${EXISTING_RELEASE_ID:-${RELEASE_ID:-$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)}}"
          manifest_digest="sha256:$(sha256sum stack-manifest.json | cut -d' ' -f1)"
          python scripts/release_transaction.py publish \
            --input release-transaction.json \
            --release-id "$release_id" \
            --manifest-sha256 "$manifest_digest" \
            --publication-run-id "$GITHUB_RUN_ID" \
            --output published-release-transaction.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stack-release-published-${{ github.run_id }}
          path: published-release-transaction.json
          if-no-files-found: error
          retention-days: 90
