name: Nightly installation release

run-name: Publish installation nightly from claim ${{ inputs.claim_run_id }}

on:
  workflow_dispatch:
    inputs:
      claim_run_id:
        description: Successful Prepare nightly claim run on this exact main source
        required: true
        type: string
      publish_cloudflare_addon:
        description: Publish the optional signed Cloudflare connector after the core release
        required: false
        type: boolean
        default: false

concurrency:
  group: nightly-installation-${{ inputs.claim_run_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-environment-preflight:
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-environment-preflight.yml
    with:
      environment: stack-release

  admit:
    needs: release-environment-preflight
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Require valid eligible nightly source before admission
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: python scripts/ci/check_release_preflight.py --source-sha "$SOURCE_SHA" --require-eligible
      - name: Authenticate nightly claim and current main
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CLAIM_RUN_ID: ${{ inputs.claim_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ElevenID/marty-ui
          test "$GITHUB_REF" = refs/heads/main
          [[ "$CLAIM_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA"
          root="$RUNNER_TEMP/nightly-claim"
          mkdir "$root"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CLAIM_RUN_ID" > "$root/run.json"
          gh run download "$CLAIM_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "nightly-claim-$CLAIM_RUN_ID" --dir "$root/claim"
          test "$(find "$root/claim" -mindepth 1 -maxdepth 1 -printf '%f:%y\n')" = nightly-claim.json:f
          test "$(wc -c < "$root/claim/nightly-claim.json")" -le 65536
          python scripts/nightly_release.py admit --claim "$root/claim/nightly-claim.json" \
            --run-json "$root/run.json" --source-sha "$GITHUB_SHA" --output "$root/plan.json"
          tag="$(jq -er .claim.tag "$root/plan.json")"
          python scripts/check_release_absent.py --repository "$GITHUB_REPOSITORY" --tag "$tag"
          {
            echo "matrix=$(jq -c '{include}' "$root/plan.json")"
            echo "tag=$tag"
            echo "version=$(jq -er .claim.version "$root/plan.json")"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nightly-admitted-${{ github.run_id }}
          path: ${{ runner.temp }}/nightly-claim/
          if-no-files-found: error
          retention-days: 30

  build-images:
    needs: admit
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.admit.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      PRIVATE_FORKS_ENABLED: ${{ vars.PRIVATE_FORKS_ENABLED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Authorize private fork access
        if: vars.PRIVATE_FORKS_ENABLED == 'true' && (matrix.role == 'services' || matrix.role == 'migrations')
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          python3 ".github/scripts/private-forks.py" check
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Expose existing read-only compiler cache
        if: vars.PRIVATE_FORKS_ENABLED != 'true' || (matrix.role != 'services' && matrix.role != 'migrations')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            const url = process.env.ACTIONS_RESULTS_URL;
            if (!token || !url) throw new Error('Compiler cache credentials unavailable');
            core.setSecret(token);
            core.exportVariable('SCCACHE_GHA_RUNTIME_TOKEN', token);
            core.exportVariable('SCCACHE_GHA_CACHE_URL', url);
            core.exportVariable('SCCACHE_GHA_RW_MODE', 'READ_ONLY');
      - name: Build existing production recipe by digest
        id: build
        uses: ./.github/actions/build-product-image
        with:
          private-forks-enabled: ${{ vars.PRIVATE_FORKS_ENABLED == 'true' && (matrix.role == 'services' || matrix.role == 'migrations') && 'true' || 'false' }}
          private-forks-read-token: ${{ vars.PRIVATE_FORKS_ENABLED == 'true' && (matrix.role == 'services' || matrix.role == 'migrations') && secrets.PRIVATE_FORKS_READ_TOKEN || '' }}
          producer: nightly
          source-sha: ${{ github.sha }}
          version: ${{ needs.admit.outputs.version }}
          image-plan: ${{ toJSON(matrix) }}
      - name: Reject production website images from the customer release
        if: matrix.role == 'ui' || matrix.role == 'ui_selfhost'
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.admit.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMAGE@$DIGEST"
          test "$(docker inspect --format '{{ index .Config.Labels "io.elevenid.ui.audience" }}' "$IMAGE@$DIGEST")" = customer
          docker run --rm --entrypoint cat "$IMAGE@$DIGEST" \
            /opt/marty-ui-static/marty-ui-release.json > "$RUNNER_TEMP/ui-metadata.json"
          python scripts/ui_release.py check-image --audience customer \
            --source-sha "$GITHUB_SHA" --version "$VERSION" \
            --image-metadata "$RUNNER_TEMP/ui-metadata.json"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532
      - name: Sign and record exact image identity
        env:
          ROLE: ${{ matrix.role }}
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.admit.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign sign --yes "$IMAGE@$DIGEST"
          mkdir "$RUNNER_TEMP/image-evidence"
          jq -n --arg role "$ROLE" --arg uri "$IMAGE" --arg digest "$DIGEST" \
            --arg source_sha "$GITHUB_SHA" --arg version "$VERSION" --arg run_id "$GITHUB_RUN_ID" \
            '{role:$role,uri:$uri,digest:$digest,source_sha:$source_sha,version:$version,run_id:$run_id}' \
            > "$RUNNER_TEMP/image-evidence/image.json"
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          image: ${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/image-evidence/${{ matrix.role }}.sbom.cdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nightly-image-${{ matrix.role }}-${{ github.run_id }}
          path: ${{ runner.temp }}/image-evidence/
          if-no-files-found: error
          retention-days: 30

  prepare-native:
    needs: admit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.native_artifact.outputs.artifact-id }}
      archive_sha256: ${{ steps.native_archive.outputs.sha256 }}
    env:
      PRIVATE_FORKS_ENABLED: ${{ vars.PRIVATE_FORKS_ENABLED }}
      CARGO_PROFILE_RELEASE_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Authorize private fork access
        if: vars.PRIVATE_FORKS_ENABLED == 'true'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          python3 ".github/scripts/private-forks.py" check
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
          targets: x86_64-unknown-linux-musl
      - name: Fetch locked private fork dependencies
        if: vars.PRIVATE_FORKS_ENABLED == 'true'
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          PRIVATE_FORKS_READ_TOKEN: ${{ secrets.PRIVATE_FORKS_READ_TOKEN }}
        run: python3 ".github/scripts/private-forks.py" fetch --manifest-path "rust/Cargo.toml"
      - name: Build existing Rust packager and Linux operator
        env:
          MARTY_DEPLOY_SOURCE_SHA: ${{ github.sha }}
          MARTY_DEPLOY_RELEASE_TAG: ${{ needs.admit.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools cmake
          cargo build --locked --release --manifest-path rust/Cargo.toml \
            --target-dir "$RUNNER_TEMP/tools" -p marty-selfhost-bundle --bin package-selfhost-bundle
          cargo test --locked --manifest-path rust/Cargo.toml \
            --target-dir "$RUNNER_TEMP/tools" -p marty-deployment-catalog
          CC_x86_64_unknown_linux_musl=musl-gcc cargo build --locked --release \
            --target x86_64-unknown-linux-musl --manifest-path rust/Cargo.toml \
            --target-dir "$RUNNER_TEMP/tools" -p marty-deployment-catalog --bin marty-deploy
      - name: Require real Compose installer model compatibility
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/qualify-installer-compose-model.sh "$RUNNER_TEMP/tools"
      - name: Seal qualified native tools for this source and attempt
        id: native_archive
        env:
          TAG: ${{ needs.admit.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          operator="$RUNNER_TEMP/tools/x86_64-unknown-linux-musl/release/marty-deploy"
          test "$("$operator" --build-identity)" = "$GITHUB_SHA:$TAG"
          if readelf -l "$operator" | grep -q INTERP; then exit 1; fi
          sha256="$(python scripts/nightly_native_artifact.py pack \
            --packager "$RUNNER_TEMP/tools/release/package-selfhost-bundle" \
            --operator "$operator" --source-sha "$GITHUB_SHA" --tag "$TAG" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/nightly-native.zip")"
          printf 'sha256=%s\n' "$sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: native_artifact
        with:
          name: nightly-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightly-native.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  prepare-installation:
    needs: [admit, build-images, prepare-native]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: read
      attestations: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: nightly-admitted-${{ github.run_id }}
          path: ${{ runner.temp }}/admitted
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: nightly-image-*-${{ github.run_id }}
          path: ${{ runner.temp }}/images
      - name: Verify image producers and prepare exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --requirement scripts/selfhost-preview-tools.requirements.txt
          python scripts/nightly_release.py record \
            --claim "$RUNNER_TEMP/admitted/claim/nightly-claim.json" \
            --run-json "$RUNNER_TEMP/admitted/run.json" --source-sha "$GITHUB_SHA" \
            --images-dir "$RUNNER_TEMP/images" --run-id "$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/nightly-candidate.json"
          jq -r '.images[] | .uri + "@" + .digest' "$RUNNER_TEMP/nightly-candidate.json" |
          while IFS= read -r image; do
            gh attestation verify "oci://$image" --repo "$GITHUB_REPOSITORY" \
              --source-digest "$GITHUB_SHA" --source-ref refs/heads/main \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/nightly-release.yml" \
              --deny-self-hosted-runners
          done
      - name: Download exact same-attempt native artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.prepare-native.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/native-download
      - name: Verify native artifact producer, bytes and original attempt
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.admit.outputs.tag }}
          NATIVE_ARTIFACT_ID: ${{ needs.prepare-native.outputs.artifact_id }}
          NATIVE_ARCHIVE_SHA256: ${{ needs.prepare-native.outputs.archive_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$NATIVE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          test "$(find "$RUNNER_TEMP/native-download" -mindepth 1 -maxdepth 1 -printf '%f:%y\n')" = nightly-native.zip:f
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$NATIVE_ARTIFACT_ID" \
            > "$RUNNER_TEMP/native-artifact.json"
          python scripts/nightly_native_artifact.py restore \
            --archive "$RUNNER_TEMP/native-download/nightly-native.zip" \
            --artifact-json "$RUNNER_TEMP/native-artifact.json" \
            --artifact-id "$NATIVE_ARTIFACT_ID" --archive-sha256 "$NATIVE_ARCHIVE_SHA256" \
            --source-sha "$GITHUB_SHA" --tag "$TAG" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/verified-native"
          test "$("$RUNNER_TEMP/verified-native/marty-deploy-linux-amd64" --build-identity)" = "$GITHUB_SHA:$TAG"
      - name: Package digest-locked installation assets
        env:
          TAG: ${{ needs.admit.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/package_nightly_installation.py --source "$GITHUB_WORKSPACE" \
            --candidate "$RUNNER_TEMP/nightly-candidate.json" \
            --packager "$RUNNER_TEMP/verified-native/package-selfhost-bundle" \
            --output "$RUNNER_TEMP/prepared"
          python scripts/nightly_release.py manifest --candidate "$RUNNER_TEMP/nightly-candidate.json" \
            --timestamp "$(git show -s --format=%cI HEAD)" --output "$RUNNER_TEMP/prepared/stack-manifest.json"
          asset="$RUNNER_TEMP/prepared/marty-deploy-linux-amd64"
          cp "$RUNNER_TEMP/verified-native/marty-deploy-linux-amd64" "$asset"
          chmod 755 "$asset"
          test "$("$asset" --build-identity)" = "$GITHUB_SHA:$TAG"
          if readelf -l "$asset" | grep -q INTERP; then exit 1; fi
          find "$RUNNER_TEMP/images" -name '*.sbom.cdx.json' -exec cp '{}' "$RUNNER_TEMP/prepared/" \;
          # The six-file staging inventory stays separate from release signatures.
          (cd "$RUNNER_TEMP/prepared" && sha256sum --check --strict SHA256SUMS)
          # The extracted copy is rebuildable; only the owned ZIP is uploaded.
      - name: Record exact installer inputs from the source Compose service inventory
        # Inventory binds this producer attempt. After a failed sign/publish job,
        # rerun all jobs to rebuild/requalify inputs; never relabel old artifacts
        # with the current attempt or rerun only the failed publication job.
        env:
          TAG: ${{ needs.admit.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          inputs="$RUNNER_TEMP/installer-inputs"
          mkdir "$inputs"
          cp install.sh "$RUNNER_TEMP/prepared/install.sh"
          for asset in install.sh marty-deploy-linux-amd64 prepared-selfhost-bundle.zip prepared-selfhost-images.json; do
            cp "$RUNNER_TEMP/prepared/$asset" "$inputs/$asset"
          done
          export SELFHOST_IMAGE_PREFIX=ghcr.io/elevenid/marty-ui
          export SELFHOST_IMAGE_TAG="${TAG#v}"
          export MARTY_KEYCLOAK_KMS_IMAGE
          MARTY_KEYCLOAK_KMS_IMAGE="$(jq -er '.services.keycloak' "$inputs/prepared-selfhost-images.json")"
          docker compose --profile '*' --env-file .env.selfhost.production.example \
            -f docker-compose.selfhost.prod.yml -f docker-compose.selfhost.bundle.override.yml \
            config --format json > "$RUNNER_TEMP/installer-source-compose.json"
          python scripts/installer_release.py inventory --artifacts "$inputs" \
            --compose-model "$RUNNER_TEMP/installer-source-compose.json" \
            --source-sha "$GITHUB_SHA" --release-tag "$TAG" \
            --build-run-id "$GITHUB_RUN_ID" --build-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/prepared/installer-inventory.json"
      - name: Require anonymously pullable Linux amd64 installation images
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker"
          mkdir "$DOCKER_CONFIG"
          python scripts/check_selfhost_locked_image_platform.py \
            --image-lock "$RUNNER_TEMP/prepared/prepared-selfhost-images.json" \
            --output "$RUNNER_TEMP/nightly-image-platforms.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nightly-installation-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/prepared/*.json
            ${{ runner.temp }}/prepared/*.zip
            ${{ runner.temp }}/prepared/*.md
            ${{ runner.temp }}/prepared/*.sh
            ${{ runner.temp }}/prepared/SHA256SUMS
            ${{ runner.temp }}/prepared/marty-deploy-linux-amd64
          if-no-files-found: error
          retention-days: 30

  runtime-happy-path:
    needs: [admit, prepare-installation]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: nightly-installation-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/assets
      - name: Verify and install the immutable public test interface
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --requirement scripts/selfhost-preview-tools.requirements.txt
          component="$(jq -c '.components[] | select(.name == "marty-integration-tests")' release/stack-lock.json)"
          version="$(jq -er .version <<< "$component")"
          revision="$(jq -er .commit <<< "$component")"
          uri="$(jq -er '.artifacts[0].uri' <<< "$component")"
          digest="$(jq -er '.artifacts[0].digest' <<< "$component")"
          curl --fail --location --silent --show-error "$uri" --output "$RUNNER_TEMP/harness.tar.gz"
          gh attestation verify "$RUNNER_TEMP/harness.tar.gz" --repo ElevenID/marty-integration-tests \
            --source-ref "refs/tags/v$version" --source-digest "$revision" --deny-self-hosted-runners
          python scripts/extract_verified_source.py --archive "$RUNNER_TEMP/harness.tar.gz" \
            --destination "$RUNNER_TEMP/harness" --expected-root "marty-integration-tests-$version" \
            --expected-sha256 "$digest"
          python -m pip install "$RUNNER_TEMP/harness"
          for name in marty-api-core marty-cli; do
            component="$(jq -c --arg name "$name" '.components[] | select(.name == $name)' release/stack-lock.json)"
            uri="$(jq -er '.artifacts[0].uri' <<< "$component")"
            digest="$(jq -er '.artifacts[0].digest' <<< "$component")"
            curl --fail --location --silent --show-error "$uri" --output "$RUNNER_TEMP/$name.tgz"
            echo "${digest#sha256:}  $RUNNER_TEMP/$name.tgz" | sha256sum --check --strict
            npm install --global "$RUNNER_TEMP/$name.tgz"
          done
      - name: Require all five runtime happy paths and owned cleanup
        shell: bash
        run: >-
          python scripts/run_nightly_runtime_smoke.py --harness "$RUNNER_TEMP/harness"
          --assets "$RUNNER_TEMP/assets" --source "$GITHUB_WORKSPACE"
          --report "$RUNNER_TEMP/nightly-runtime.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nightly-runtime-happy-path-${{ github.run_id }}
          path: ${{ runner.temp }}/nightly-runtime.json
          if-no-files-found: error
          retention-days: 30

  sign-release:
    needs: [admit, prepare-installation, runtime-happy-path]
    runs-on: ubuntu-24.04
    environment: stack-release
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: nightly-installation-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/publish
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: nightly-runtime-happy-path-${{ github.run_id }}
          path: ${{ runner.temp }}/publish
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532
      - name: Verify and sign the installation-test prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.admit.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --requirement scripts/selfhost-preview-tools.requirements.txt
          python scripts/publish_nightly_release.py --phase sign --assets "$RUNNER_TEMP/publish" \
            --source "$GITHUB_WORKSPACE" --tag "$TAG" --run-id "$GITHUB_RUN_ID"
      - id: installer_provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ runner.temp }}/publish/*
      - name: Prepare the installer-pinned provenance verifier
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          verifier="$RUNNER_TEMP/installer-gh"
          mkdir "$verifier"
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
            --connect-timeout 20 --max-time 120 --max-filesize 15031001 \
            https://github.com/cli/cli/releases/download/v2.103.2/gh_2.103.2_linux_amd64.tar.gz \
            --output "$verifier/gh.tar.gz"
          test "$(stat -c %s "$verifier/gh.tar.gz")" = 15031001
          printf '%s  %s\n' 62ccf747115ddc61237efffdde66a3c8f70ba249433dc64f70801089b59c59c8 "$verifier/gh.tar.gz" | sha256sum --check --strict
          tar -xzf "$verifier/gh.tar.gz" --no-same-owner --no-same-permissions -C "$verifier" gh_2.103.2_linux_amd64/bin/gh
          chmod 700 "$verifier/gh_2.103.2_linux_amd64/bin/gh"
      - name: Export verified offline installer provenance sidecars
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.admit.outputs.tag }}
          PROVENANCE_BUNDLE: ${{ steps.installer_provenance.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          chmod 700 "$RUNNER_TEMP/publish"
          python scripts/publish_nightly_release.py --phase export-provenance --assets "$RUNNER_TEMP/publish" \
            --source "$GITHUB_WORKSPACE" --tag "$TAG" --run-id "$GITHUB_RUN_ID" \
            --provenance-bundle "$PROVENANCE_BUNDLE" \
            --gh "$RUNNER_TEMP/installer-gh/gh_2.103.2_linux_amd64/bin/gh"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nightly-publication-assets-${{ github.run_id }}
          path: ${{ runner.temp }}/publish/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [admit, sign-release]
    runs-on: ubuntu-24.04
    environment: stack-release
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: nightly-publication-assets-${{ github.run_id }}
          path: ${{ runner.temp }}/publish
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532
      - name: Prepare the installer-pinned provenance verifier
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          verifier="$RUNNER_TEMP/installer-gh"
          mkdir "$verifier"
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
            --connect-timeout 20 --max-time 120 --max-filesize 15031001 \
            https://github.com/cli/cli/releases/download/v2.103.2/gh_2.103.2_linux_amd64.tar.gz \
            --output "$verifier/gh.tar.gz"
          test "$(stat -c %s "$verifier/gh.tar.gz")" = 15031001
          printf '%s  %s\n' 62ccf747115ddc61237efffdde66a3c8f70ba249433dc64f70801089b59c59c8 "$verifier/gh.tar.gz" | sha256sum --check --strict
          tar -xzf "$verifier/gh.tar.gz" --no-same-owner --no-same-permissions -C "$verifier" gh_2.103.2_linux_amd64/bin/gh
          chmod 700 "$verifier/gh_2.103.2_linux_amd64/bin/gh"
      - name: Publish and verify the immutable installation-test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.admit.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --requirement scripts/selfhost-preview-tools.requirements.txt
          chmod 700 "$RUNNER_TEMP/publish"
          python scripts/publish_nightly_release.py --phase publish --assets "$RUNNER_TEMP/publish" \
            --source "$GITHUB_WORKSPACE" --tag "$TAG" --run-id "$GITHUB_RUN_ID" \
            --gh "$RUNNER_TEMP/installer-gh/gh_2.103.2_linux_amd64/bin/gh"
      - name: Record required installer release qualification
        env:
          TAG: ${{ needs.admit.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '### Installer release qualification pending\n\n'
            printf 'Published candidate `%s` from `%s`, build run `%s` attempt `%s`.\n\n' \
              "$TAG" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'Before this version can become the nightly one-line installer channel, run the main-only staged installed-journey acceptance, replay the published version anonymously on a clean host, run the installer admission gate with both signed reports, publish its separate immutable admission metadata, and promote a signed nightly channel generation with a compare-and-swap pointer update.\n'
            printf 'This candidate release alone does not authorize installation or channel promotion.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-cloudflare-addon:
    # An explicit optional producer. Core publication never depends on this job.
    if: ${{ inputs.publish_cloudflare_addon }}
    needs: [admit, publish]
    env:
      TAG: ${{ needs.admit.outputs.tag }}
    runs-on: ubuntu-24.04
    environment: stack-release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Read the exact optional image recipe
        id: addon
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          python -m pip install --requirement scripts/selfhost-preview-tools.requirements.txt
          python - <<'PY_ADDON'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from hosting_addon import build_workflow, policy
          item = policy(Path.cwd())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('image=' + item['image'] + '\n')
              output.write('dockerfile=' + item['dockerfile'] + '\n')
              output.write('workflow=' + build_workflow(os.environ['TAG']) + '\n')
          PY_ADDON
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ${{ steps.addon.outputs.dockerfile }}
          platforms: linux/amd64
          outputs: type=image,name=${{ steps.addon.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ steps.addon.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          image: ${{ steps.addon.outputs.image }}@${{ steps.image.outputs.digest }}
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/cloudflared_wrapper.sbom.cdx.json
          upload-artifact: false
      - name: Authenticate image and package the selected connector
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.addon.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          WORKFLOW: ${{ steps.addon.outputs.workflow }}
          TAG: ${{ needs.admit.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/$WORKFLOW@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY" \
            --source-digest "$GITHUB_SHA" --source-ref refs/heads/main \
            --signer-workflow "$GITHUB_REPOSITORY/$WORKFLOW" \
            --deny-self-hosted-runners
          mkdir "$RUNNER_TEMP/addon-anonymous-docker"
          DOCKER_CONFIG="$RUNNER_TEMP/addon-anonymous-docker" python - <<'PY_PROBE'
          import os, sys
          sys.path.insert(0, 'scripts')
          from check_selfhost_locked_image_platform import probe_images
          probe_images({os.environ['IMAGE'] + '@' + os.environ['DIGEST']})
          PY_PROBE
          docker run --rm --network none --read-only --user 10001:10001 \
            --cap-drop ALL --security-opt no-new-privileges:true --entrypoint /bin/sh \
            "$IMAGE@$DIGEST" -ec 'command -v wget >/dev/null; wget --help >/dev/null 2>&1; cloudflared --version'
          python scripts/hosting_addon.py --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/cloudflare-addon" --source-sha "$GITHUB_SHA" \
            --release-tag "$TAG" --build-run-id "$GITHUB_RUN_ID" \
            --build-run-attempt "$GITHUB_RUN_ATTEMPT" --image "$IMAGE@$DIGEST" \
            --sbom "$RUNNER_TEMP/cloudflared_wrapper.sbom.cdx.json"
          python scripts/publish_hosting_addon.py --phase sign --assets "$RUNNER_TEMP/cloudflare-addon"
      - id: addon_provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ runner.temp }}/cloudflare-addon/*
      - name: Prepare the installer-pinned provenance verifier
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          verifier="$RUNNER_TEMP/installer-gh"
          mkdir "$verifier"
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
            --connect-timeout 20 --max-time 120 --max-filesize 15031001 \
            https://github.com/cli/cli/releases/download/v2.103.2/gh_2.103.2_linux_amd64.tar.gz \
            --output "$verifier/gh.tar.gz"
          test "$(stat -c %s "$verifier/gh.tar.gz")" = 15031001
          printf '%s  %s\n' 62ccf747115ddc61237efffdde66a3c8f70ba249433dc64f70801089b59c59c8 "$verifier/gh.tar.gz" | sha256sum --check --strict
          tar -xzf "$verifier/gh.tar.gz" --no-same-owner --no-same-permissions -C "$verifier" gh_2.103.2_linux_amd64/bin/gh
          chmod 700 "$verifier/gh_2.103.2_linux_amd64/bin/gh"
      - name: Export evidence and publish optional immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.addon_provenance.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/publish_hosting_addon.py --phase export-provenance \
            --assets "$RUNNER_TEMP/cloudflare-addon" --provenance-bundle "$PROVENANCE_BUNDLE" \
            --gh "$RUNNER_TEMP/installer-gh/gh_2.103.2_linux_amd64/bin/gh"
          python scripts/publish_hosting_addon.py --phase publish \
            --assets "$RUNNER_TEMP/cloudflare-addon" \
            --gh "$RUNNER_TEMP/installer-gh/gh_2.103.2_linux_amd64/bin/gh"
