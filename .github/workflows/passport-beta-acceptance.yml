name: Passport Beta Acceptance Evidence

on:
  workflow_dispatch:
    inputs:
      beta_artifact_dir:
        description: Absolute beta runner directory with aggregate-deployment.json, its plan and protected fence, maintenance, and native receipts, stack-manifest.json, and SHA256SUMS.
        required: true

concurrency:
  group: passport-beta-acceptance
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  attestations: read
  packages: read

jobs:
  beta-passport-evidence:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, passport-beta-wsl2]
    environment: beta-lifecycle
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      PASSPORT_ACCEPTANCE_API_KEY: ${{ secrets.PASSPORT_ACCEPTANCE_API_KEY }}
      PASSPORT_ACCEPTANCE_APPLICATION_JSON: ${{ secrets.PASSPORT_ACCEPTANCE_APPLICATION_JSON }}
      PASSPORT_ACCEPTANCE_CERTIFICATE_PLAN_JSON: ${{ secrets.PASSPORT_ACCEPTANCE_CERTIFICATE_PLAN_JSON }}
      PASSPORT_ACCEPTANCE_CSCA_OPERATOR_COOKIE: ${{ secrets.PASSPORT_ACCEPTANCE_CSCA_OPERATOR_COOKIE }}
      PASSPORT_ACCEPTANCE_DSC_OPERATOR_COOKIE: ${{ secrets.PASSPORT_ACCEPTANCE_DSC_OPERATOR_COOKIE }}
      PASSPORT_ACCEPTANCE_FLOW_OPERATOR_COOKIE: ${{ secrets.PASSPORT_ACCEPTANCE_FLOW_OPERATOR_COOKIE }}
      PASSPORT_ACCEPTANCE_FLOW_PLAN_JSON: ${{ secrets.PASSPORT_ACCEPTANCE_FLOW_PLAN_JSON }}
      PASSPORT_ACCEPTANCE_INTERNAL_SERVICE_TOKEN: ${{ secrets.PASSPORT_ACCEPTANCE_INTERNAL_SERVICE_TOKEN }}
      PASSPORT_ACCEPTANCE_RECONCILIATION_OPERATOR_TOKEN: ${{ secrets.PASSPORT_ACCEPTANCE_RECONCILIATION_OPERATOR_TOKEN }}
      BETA_ARTIFACT_DIR: ${{ inputs.beta_artifact_dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Probe the exact deployed beta candidate and production continuity
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_passport_beta_runner.py --output "$RUNNER_TEMP/passport-beta-runner-preflight.json"
          report_dir=tests/artifacts/passport-beta-acceptance
          report_file="$report_dir/passport-beta-acceptance-$GITHUB_RUN_ID.json"
          mkdir -p "$report_dir"
          rm -f "$report_file"
          application_file="$RUNNER_TEMP/passport-beta-application-$GITHUB_RUN_ID.json"
          certificate_plan_file="$RUNNER_TEMP/passport-beta-certificates-$GITHUB_RUN_ID.json"
          selected_flow_plan_file="$RUNNER_TEMP/passport-beta-flow-$GITHUB_RUN_ID.json"
          private_handoff_file="$HOME/.local/state/marty/passport-beta-demo-selected-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          trap 'rm -f "$application_file" "$certificate_plan_file" "$selected_flow_plan_file"' EXIT
          for required in PASSPORT_ACCEPTANCE_API_KEY PASSPORT_ACCEPTANCE_APPLICATION_JSON \
                          PASSPORT_ACCEPTANCE_CERTIFICATE_PLAN_JSON \
                          PASSPORT_ACCEPTANCE_CSCA_OPERATOR_COOKIE \
                          PASSPORT_ACCEPTANCE_DSC_OPERATOR_COOKIE \
                          PASSPORT_ACCEPTANCE_FLOW_OPERATOR_COOKIE \
                          PASSPORT_ACCEPTANCE_FLOW_PLAN_JSON \
                          PASSPORT_ACCEPTANCE_INTERNAL_SERVICE_TOKEN \
                          PASSPORT_ACCEPTANCE_RECONCILIATION_OPERATOR_TOKEN; do
            if [[ -z "${!required}" ]]; then
              echo "$required is unavailable for governed passport acceptance" >&2
              exit 1
            fi
          done
          printf '%s' "$PASSPORT_ACCEPTANCE_APPLICATION_JSON" > "$application_file"
          chmod 600 "$application_file"
          printf '%s' "$PASSPORT_ACCEPTANCE_CERTIFICATE_PLAN_JSON" > "$certificate_plan_file"
          chmod 600 "$certificate_plan_file"
          printf '%s' "$PASSPORT_ACCEPTANCE_FLOW_PLAN_JSON" > "$selected_flow_plan_file"
          chmod 600 "$selected_flow_plan_file"
          python3 scripts/run_passport_beta_acceptance.py \
            --artifact-dir "$BETA_ARTIFACT_DIR" \
            --application-file "$application_file" \
            --certificate-plan-file "$certificate_plan_file" \
            --selected-flow-plan-file "$selected_flow_plan_file" \
            --private-demo-handoff-file "$private_handoff_file" \
            --output "$report_file"
          # A protected success must mean the whole acceptance gate passed.
          # The report remains blocked until deployment-wide recovery, supported
          # consumers, and recorded-demo evidence satisfy the aggregate gate.
          python3 -c 'import json,sys; from pathlib import Path; report=json.loads(Path(sys.argv[1]).read_text()); sys.exit(0 if report.get("schema") == "marty.passport-beta-acceptance/v1" and report.get("status") == "accepted" else "Passport beta acceptance remains blocked")' "$report_file"
      - name: Upload sanitized beta evidence
        if: always() && (steps.probe.outcome == 'success' || steps.probe.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: passport-beta-acceptance-${{ github.run_id }}
          path: tests/artifacts/passport-beta-acceptance/passport-beta-acceptance-${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 90
