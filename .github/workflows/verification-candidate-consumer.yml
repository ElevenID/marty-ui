name: Verification candidate consumer

on:
  workflow_run:
    workflows: ["Verification candidate build"]
    types: [completed]

concurrency:
  group: verification-candidate-consumer-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Consume candidate against the immutable public oracle
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'ElevenID/marty-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    env:
      TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
      TRIGGER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out current protected default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Configure the pinned candidate runtime
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          version: v29.7.2
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Require the exact supported candidate runtime
        run: python scripts/check_verification_candidate_backend.py --runtime-only

      - name: Authenticate the triggering producer run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ElevenID/marty-ui"
          [[ "$TRIGGER_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$TRIGGER_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$TRIGGER_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TRIGGER_RUN_ID" > trigger-run.json
          test "$(jq -er '.id' trigger-run.json)" = "$TRIGGER_RUN_ID"
          test "$(jq -er '.run_attempt' trigger-run.json)" = "$TRIGGER_RUN_ATTEMPT"
          test "$(jq -er '.workflow_id' trigger-run.json)" = "346930832"
          test "$(jq -er '.name' trigger-run.json)" = "Verification candidate build"
          test "$(jq -er '.path' trigger-run.json)" = ".github/workflows/verification-candidate-build.yml"
          test "$(jq -er '.event' trigger-run.json)" = "workflow_dispatch"
          test "$(jq -er '.status' trigger-run.json)" = "completed"
          test "$(jq -er '.conclusion' trigger-run.json)" = "success"
          test "$(jq -er '.head_repository.full_name' trigger-run.json)" = "$GITHUB_REPOSITORY"
          test "$(jq -er '.head_branch' trigger-run.json)" = "main"
          test "$(jq -er '.head_sha' trigger-run.json)" = "$TRIGGER_SHA"
          git fetch --no-tags origin refs/heads/main
          git merge-base --is-ancestor "$TRIGGER_SHA" origin/main
          rm -f trigger-run.json

      - name: Download the exact triggering-run candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8
        with:
          name: verification-candidate-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: work/candidate
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Authenticate the exact candidate bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t candidate_entries < <(
            find work/candidate -mindepth 1 -maxdepth 1 -printf '%f:%y\n' | LC_ALL=C sort
          )
          expected_entries=(
            "marty-ui-services-build-metadata.json:f"
            "marty-ui-services-provenance.json:f"
            "marty-ui-services-sbom.cdx.json:f"
            "marty-ui-services.oci.tar:f"
            "verification-candidate.json:f"
          )
          test "${#candidate_entries[@]}" -eq "${#expected_entries[@]}"
          test "${candidate_entries[*]}" = "${expected_entries[*]}"
          pin=work/candidate/verification-candidate.json
          test "$(jq -er '.repository' "$pin")" = "$GITHUB_REPOSITORY"
          test "$(jq -er '.commit' "$pin")" = "$TRIGGER_SHA"
          test "$(jq -er '.source_ref' "$pin")" = "refs/heads/main"
          test "$(jq -er '.run.repository' "$pin")" = "$GITHUB_REPOSITORY"
          test "$(jq -er '.run.workflow' "$pin")" = ".github/workflows/verification-candidate-build.yml"
          test "$(jq -er '.run.id' "$pin")" = "$TRIGGER_RUN_ID"
          test "$(jq -er '.run.attempt' "$pin")" = "$TRIGGER_RUN_ATTEMPT"
          gh attestation verify "$pin" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow github.com/ElevenID/marty-ui/.github/workflows/verification-candidate-build.yml \
            --source-digest "$TRIGGER_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
          gh attestation verify work/candidate/marty-ui-services.oci.tar \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow github.com/ElevenID/marty-ui/.github/workflows/verification-candidate-build.yml \
            --source-digest "$TRIGGER_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners

      - name: Check out immutable public verification harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ElevenID/marty-integration-tests
          ref: bdd3b33b9268ca4c8c3d37126e7c253ec8fce710
          path: integration-harness
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: integration-harness/requirements/official-py312.lock

      - name: Install hash-locked harness dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          --requirement integration-harness/requirements/official-py312.lock

      - name: Resolve and verify the immutable public oracle
        working-directory: integration-harness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pin=config/credentials-verifier-oracle.json
          repository="$(jq -er '.repository' "$pin")"
          release_tag="$(jq -er '.release_tag' "$pin")"
          commit="$(jq -er '.commit' "$pin")"
          source_ref="$(jq -er '.source_ref' "$pin")"
          image_reference="$(jq -er '.image.uri + "@" + .image.digest' "$pin")"
          sbom_asset="$(jq -er '.sbom.asset' "$pin")"
          sbom_digest="$(jq -er '.sbom.digest' "$pin")"
          tag_object="$(gh api "repos/$repository/git/ref/tags/$release_tag" --jq '.object.sha')"
          test "$(gh api "repos/$repository/git/tags/$tag_object" --jq '.object.sha')" = "$commit"
          mkdir -p ../work/oracle ../work/evidence
          gh attestation verify "oci://$image_reference" --repo "$repository" \
            --source-digest "$commit" --source-ref "$source_ref" --deny-self-hosted-runners
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker pull "$image_reference"
          docker logout ghcr.io
          gh release download "$release_tag" --repo "$repository" --pattern "$sbom_asset" --dir ../work/oracle
          printf '%s  %s\n' "$sbom_digest" "../work/oracle/$sbom_asset" | sed 's/^sha256://' | sha256sum --check --strict
          gh attestation verify "../work/oracle/$sbom_asset" --repo "$repository" \
            --source-digest "$commit" --source-ref "$source_ref" --deny-self-hosted-runners
          python scripts/credentials_verifier_artifact.py validate-sbom \
            --pin "$pin" --state ready --sbom "../work/oracle/$sbom_asset"

      - name: Run candidate and oracle then compare fail-closed evidence
        working-directory: integration-harness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tool=scripts/credentials_verifier_artifact.py
          python "$tool" run-candidate \
            --pin ../work/candidate/verification-candidate.json \
            --archive ../work/candidate/marty-ui-services.oci.tar \
            --sbom ../work/candidate/marty-ui-services-sbom.cdx.json \
            --metadata ../work/candidate/marty-ui-services-build-metadata.json \
            --provenance ../work/candidate/marty-ui-services-provenance.json \
            --evidence ../work/evidence/candidate.json
          python "$tool" run --pin config/credentials-verifier-oracle.json \
            --provenance-verified --evidence ../work/evidence/oracle.json
          python "$tool" compare-candidate-evidence \
            --oracle ../work/evidence/oracle.json \
            --candidate ../work/evidence/candidate.json \
            --oracle-pin config/credentials-verifier-oracle.json \
            --candidate-pin ../work/candidate/verification-candidate.json \
            --evidence ../work/evidence/comparison.json
          test "$(jq -er '.release_clearance' ../work/evidence/comparison.json)" = blocked

      - name: Upload minimized fail-closed evidence
        if: always() && hashFiles('work/evidence/*.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verification-candidate-evidence-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: work/evidence/*.json
          if-no-files-found: error
          retention-days: 3
