name: Passport Supported Disposable Provisioning Producer

# This job produces a scoped partial Rust receipt and destroys its project.
on:
  workflow_dispatch:
    inputs:
      plan_run_id:
        description: Protected provisioning-plan workflow run ID.
        required: true
      release_tag:
        description: Official stack release bound by that plan.
        required: true

concurrency:
  group: passport-supported-disposable-producer
  cancel-in-progress: false

permissions:
  actions: read
  attestations: read
  contents: read
  packages: read

jobs:
  producer:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, passport-beta-wsl2]
    environment: beta-lifecycle
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PLAN_RUN_ID: ${{ inputs.plan_run_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify protected plan lineage and prepare disposable producer
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_passport_beta_runner.py --output "$RUNNER_TEMP/passport-beta-runner-preflight.json"
          [[ "$PLAN_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          plan_run="$(gh api "repos/ElevenID/marty-ui/actions/runs/$PLAN_RUN_ID")"
          jq -e --arg sha "$GITHUB_SHA" \
            '.status == "completed" and .conclusion == "success"
             and .event == "workflow_dispatch" and .head_branch == "main"
             and .head_sha == $sha and .repository.full_name == "ElevenID/marty-ui"' \
            <<< "$plan_run"
          plan_workflow_id="$(jq -er '.workflow_id' <<< "$plan_run")"
          plan_workflow="$(gh api "repos/ElevenID/marty-ui/actions/workflows/$plan_workflow_id")"
          jq -e '.path == ".github/workflows/passport-supported-provisioning-plan.yml"
                 and .state == "active"' <<< "$plan_workflow"
          case "$RELEASE_TAG" in
            *[!a-zA-Z0-9._-]*|'') echo 'Invalid release tag' >&2; exit 1 ;;
          esac
          work="$RUNNER_TEMP/passport-supported-producer-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$work"
          gh run download "$PLAN_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "passport-supported-provisioning-plan-$PLAN_RUN_ID" --dir "$work"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern stack-manifest.json --pattern SHA256SUMS --dir "$work"
          echo "PASSPORT_PRODUCER_WORK=$work" >> "$GITHUB_ENV"
      - name: Exercise disposable Rust routes within cleanup budget
        id: produce
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=INT --kill-after=30s 2400s \
            python3 scripts/passport_supported_protected_producer.py \
            --plan "$PASSPORT_PRODUCER_WORK/passport-supported-provisioning-plan-$PLAN_RUN_ID.json" \
            --manifest "$PASSPORT_PRODUCER_WORK/stack-manifest.json" \
            --plan-run-id "$PLAN_RUN_ID" --gateway-port 29877 \
            --output "$PASSPORT_PRODUCER_WORK/passport-supported-rust-producer-$GITHUB_RUN_ID.json"
          jq -e '.schema == "marty.passport-supported-rust-producer/v1"
                 and .status == "blocked" and .rust_routes_verified == true
                 and .certificate_setup_passed == true
                 and .signed_gateway_callback_verified == true
                 and .flow_start_verified == true
                 and .flow_execution_verified == true
                 and .rust_restart_resume_verified == true
                 and .source_commit == env.GITHUB_SHA
                 and .plan_run_id == env.PLAN_RUN_ID' \
            "$PASSPORT_PRODUCER_WORK/passport-supported-rust-producer-$GITHUB_RUN_ID.json"
      - name: Independently verify teardown and erase staged secrets
        id: recover
        if: always() && steps.prepare.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=INT --kill-after=10s 240s \
            python3 scripts/passport_supported_protected_producer.py \
            --plan "$PASSPORT_PRODUCER_WORK/passport-supported-provisioning-plan-$PLAN_RUN_ID.json" \
            --manifest "$PASSPORT_PRODUCER_WORK/stack-manifest.json" \
            --plan-run-id "$PLAN_RUN_ID" --gateway-port 29877 \
            --output "$PASSPORT_PRODUCER_WORK/passport-supported-rust-producer-$GITHUB_RUN_ID.json" \
            --recover-only
      - if: steps.produce.outcome == 'success' && steps.recover.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: passport-supported-rust-producer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/passport-supported-producer-${{ github.run_id }}-${{ github.run_attempt }}/passport-supported-rust-producer-${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 30
