[package]
name = "elevenid-feature-regression-probe"
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
publish = false

[package.metadata.elevenid-feature-regression]
# rust-cargo-v1 mounts /build as 2 GiB; reserve 128 MiB outside Cargo's target.
build-storage-cap-bytes = 2147483648
reserved-non-target-bytes = 134217728
target-budget-bytes = 2013265920

[[bin]]
name = "elevenid-feature-regression-probe"
path = "behavior_subject.rs"
test = false

[dependencies]
async-trait = "=0.1.92"
axum = "=0.8.9"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
http-body-util = "=0.1.5"
marty-issuance-service = { path = "../../../rust/services/issuance", features = ["feature-regression-observer"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.3", features = ["macros", "rt"] }
tower = { version = "=0.5.3", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = "z"
debug = 0
strip = "symbols"
incremental = false
codegen-units = 1

# Cargo applies patches only from the root manifest. Mirror the production
# workspace's source selections so this standalone governed probe compiles the
# exact candidate dependency graph.
[patch.crates-io]
bls12_381_plus = { git = "https://github.com/ElevenID/marty-core", rev = "4ddd60bc6872c6202b13abe52691429031760de1" }
elliptic-curve = { git = "https://github.com/ElevenID/marty-core", rev = "4ddd60bc6872c6202b13abe52691429031760de1" }
# Shared upstream arithmetic with verification-only module gates; see its patch notes.
ecdsa = { git = "https://github.com/ElevenID/ssi-elevenid", rev = "63a9bcce3daf6f45d1e38e43cf687738bb02cb53" }
# KMS-only SSI fork; keep all selected SSI and DID crates on one revision.
# https://github.com/ElevenID/ssi-elevenid/pull/10
ssi-bbs = { git = "https://github.com/ElevenID/ssi-elevenid", rev = "63a9bcce3daf6f45d1e38e43cf687738bb02cb53" }
ssi-claims-core = { git = "https://github.com/ElevenID/ssi-elevenid", rev = "63a9bcce3daf6f45d1e38e43cf687738bb02cb53" }
ssi-core = { git = "https://github.com/ElevenID/ssi-elevenid", rev = "63a9bcce3daf6f45d1e38e43cf687738bb02cb53" }
ssi-crypto = { git = "https://github.com/ElevenID/ssi-elevenid", rev = "63a9bcce3daf6f45d1e38e43cf687738bb02cb53" }
