[package]
name = "elevenid-feature-regression-probe"
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
publish = false

[package.metadata.elevenid-feature-regression]
# rust-cargo-v1 mounts /build as 2 GiB; reserve 128 MiB outside Cargo's target.
build-storage-cap-bytes = 2147483648
reserved-non-target-bytes = 134217728
target-budget-bytes = 2013265920

[[bin]]
name = "elevenid-feature-regression-probe"
path = "behavior_subject.rs"
test = false

[dependencies]
async-trait = "=0.1.92"
axum = "=0.8.9"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
http-body-util = "=0.1.5"
marty-issuance-service = { path = "../../../rust/services/issuance", features = ["feature-regression-observer"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["macros", "rt"] }
tower = { version = "=0.5.3", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = "z"
debug = 0
strip = "symbols"
incremental = false
codegen-units = 1

# Cargo applies patches only from the root manifest. Mirror the production
# workspace's source selections so this standalone governed probe compiles the
# exact candidate dependency graph.
[patch.crates-io]
isomdl = { git = "https://github.com/ElevenID/isomdl-elevenid", rev = "671044c9495aec101bf0cd381669d5ed6f64dd11" }
ssi-jwt = { path = "../../../rust/third_party/ssi-jwt" }
