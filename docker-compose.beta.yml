name: elevenid-beta

# Local production-like beta namespace. Persistent resources are intentionally
# isolated from developer, self-host production, and demo release candidates.
networks:
  marty-network:
    name: elevenid-beta-network

x-beta-grpc-service-auth: &beta-grpc-service-auth
  GRPC_SERVICE_TOKEN: ${GRPC_SERVICE_TOKEN:?GRPC_SERVICE_TOKEN must be set for beta Rust services}

services:
  redis:
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set for beta}
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]

  db-migrate:
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set for beta}@redis:6379
      MARTY_ISSUER_DID: ${MARTY_ISSUER_DID:?MARTY_ISSUER_DID must be set for beta}

  revocation-profile-migrate:
    environment:
      ENVIRONMENT: beta
      PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL must be set for beta}

  gateway:
    environment:
      <<: *beta-grpc-service-auth
      ENVIRONMENT: beta
      GRPC_INSECURE_ALLOWED: "true"
      ISSUANCE_API_KEY: ${ISSUANCE_API_KEY:?ISSUANCE_API_KEY must be set for beta}
      SIGNING_KEYS_INTERNAL_API_KEY: ${SIGNING_KEYS_INTERNAL_API_KEY:?SIGNING_KEYS_INTERNAL_API_KEY must be set for beta}
      ISSUANCE_NATIVE_SERVICE_URL: http://issuance-native:8005
      GATEWAY_REQUIRED_READY_SERVICES: auth,organizations,credential-templates,trust-profiles,presentation-policies,deployment-profiles,signing-keys,flows,issuance,issuance-native
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set for beta}@redis:6379
    depends_on:
      issuance-native:
        condition: service_healthy

  auth:
    environment:
      <<: *beta-grpc-service-auth
      ENVIRONMENT: beta
      ALLOW_PLAINTEXT_GRPC: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set for beta}@redis:6379/0
      CREDENTIAL_LOGIN_ORGANIZATION_ID: ${MARTY_ORG_ID:?MARTY_ORG_ID must be set for beta}
      CREDENTIAL_LOGIN_ISSUER_DID: ${MARTY_ISSUER_DID:?MARTY_ISSUER_DID must be set for beta}
      GRPC_WORKLOAD_TLS_CLIENT_CERT: /run/secrets/auth_workload_client_cert
      GRPC_WORKLOAD_TLS_CLIENT_KEY: /run/secrets/auth_workload_client_key
      GRPC_WORKLOAD_TLS_CA_CERT: /run/secrets/workload_identity_ca_cert
    secrets:
      - auth_workload_client_cert
      - auth_workload_client_key
      - workload_identity_ca_cert

  organization:
    environment:
      <<: *beta-grpc-service-auth
      ENVIRONMENT: beta
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set for beta}@redis:6379

  credential-template:
    environment:
      <<: *beta-grpc-service-auth
      ENVIRONMENT: beta
      PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL must be set for beta}
      MARTY_ORG_ID: ${MARTY_ORG_ID:?MARTY_ORG_ID must be set for beta}
      MARTY_MIGRATION_PROFILE: beta

  trust-profile:
    environment:
      <<: *beta-grpc-service-auth
      ENVIRONMENT: beta
      SIGNING_KEYS_INTERNAL_API_KEY: ${SIGNING_KEYS_INTERNAL_API_KEY:?SIGNING_KEYS_INTERNAL_API_KEY must be set for beta}
      MARTY_ORG_ID: ${MARTY_ORG_ID:?MARTY_ORG_ID must be set for beta}
      MARTY_ISSUER_DID: ${MARTY_ISSUER_DID:?MARTY_ISSUER_DID must be set for beta}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN must be set for beta}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL must be set for beta}

  applicant:
    environment:
      <<: *beta-grpc-service-auth
      GRPC_WORKLOAD_TLS_CLIENT_CERT: /run/secrets/applicant_workload_client_cert
      GRPC_WORKLOAD_TLS_CLIENT_KEY: /run/secrets/applicant_workload_client_key
      GRPC_WORKLOAD_TLS_CA_CERT: /run/secrets/workload_identity_ca_cert
    secrets:
      - applicant_workload_client_cert
      - applicant_workload_client_key
      - workload_identity_ca_cert

  notification:
    environment:
      <<: *beta-grpc-service-auth

  compliance-profile:
    environment:
      <<: *beta-grpc-service-auth
      ENVIRONMENT: beta
      GRPC_INSECURE_ALLOWED: "true"

  presentation-policy:
    environment:
      <<: *beta-grpc-service-auth
      GRPC_WORKLOAD_TLS_SERVER_CERT: /run/secrets/pp_workload_server_cert
      GRPC_WORKLOAD_TLS_SERVER_KEY: /run/secrets/pp_workload_server_key
      GRPC_WORKLOAD_TLS_CA_CERT: /run/secrets/workload_identity_ca_cert
    secrets:
      - pp_workload_server_cert
      - pp_workload_server_key
      - workload_identity_ca_cert

  deployment-profile:
    environment:
      <<: *beta-grpc-service-auth
      ENVIRONMENT: beta
      GRPC_INSECURE_ALLOWED: "true"

  signing-keys:
    environment:
      SIGNING_KEYS_REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set for beta}@redis:6379/2
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN must be set for beta}

  flow:
    environment:
      <<: *beta-grpc-service-auth
      ENVIRONMENT: beta
      GRPC_INSECURE_ALLOWED: "true"
      PUBLIC_BASE_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL must be set for beta}
      ISSUANCE_API_KEY: ${ISSUANCE_API_KEY:?ISSUANCE_API_KEY must be set for beta}
      SIGNING_KEYS_INTERNAL_API_KEY: ${SIGNING_KEYS_INTERNAL_API_KEY:?SIGNING_KEYS_INTERNAL_API_KEY must be set for beta}
      FLOW_WEBHOOK_SECRET: ${FLOW_WEBHOOK_SECRET:?FLOW_WEBHOOK_SECRET must be set for beta}
      FLOW_APPLICATION_EVENT_HMAC_KEY: ${FLOW_APPLICATION_EVENT_HMAC_KEY:?FLOW_APPLICATION_EVENT_HMAC_KEY must be set for beta}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set for beta}@redis:6379
      GRPC_WORKLOAD_TLS_CLIENT_CERT: /run/secrets/flow_workload_client_cert
      GRPC_WORKLOAD_TLS_CLIENT_KEY: /run/secrets/flow_workload_client_key
      GRPC_WORKLOAD_TLS_SERVER_CERT: /run/secrets/flow_workload_server_cert
      GRPC_WORKLOAD_TLS_SERVER_KEY: /run/secrets/flow_workload_server_key
      GRPC_WORKLOAD_TLS_CA_CERT: /run/secrets/workload_identity_ca_cert
    secrets:
      - flow_workload_client_cert
      - flow_workload_client_key
      - flow_workload_server_cert
      - flow_workload_server_key
      - workload_identity_ca_cert

  revocation-profile:
    environment:
      <<: *beta-grpc-service-auth
      ENVIRONMENT: beta
      PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL must be set for beta}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set for beta}@redis:6379/4
      RP_GRPC_ENABLED: "true"
      RUST_LOG: ${REVOCATION_PROFILE_RUST_LOG:-info}

  device-registration:
    environment:
      <<: *beta-grpc-service-auth
      ENVIRONMENT: beta
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set for beta}@redis:6379/5

  event-stream:
    environment:
      <<: *beta-grpc-service-auth

  issuance:
    environment:
      <<: *beta-grpc-service-auth

  # Only operations enumerated by contracts/issuance-native-coverage.json are
  # sent here. The Python issuance service remains the fail-closed fallback for
  # every unmigrated HTTP route and all gRPC methods.
  issuance-native:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: issuance-native
    environment:
      <<: *beta-grpc-service-auth
      ENVIRONMENT: beta
      ISSUANCE_SERVICE_PORT: "8005"
      DATABASE_URL: postgresql+asyncpg://marty:${MARTY_DB_PASSWORD:?MARTY_DB_PASSWORD must be set for beta}@postgres:5432/marty
      ISSUER_BASE_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL must be set for beta}
      CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set for beta}
      TOKEN_HMAC_KEY: ${TOKEN_HMAC_KEY:?TOKEN_HMAC_KEY must be set for beta}
      ISSUANCE_API_KEY: ${ISSUANCE_API_KEY:?ISSUANCE_API_KEY must be set for beta}
      SIGNING_KEYS_INTERNAL_URL: http://gateway:8000/internal/signing-keys
      SIGNING_KEYS_INTERNAL_API_KEY: ${SIGNING_KEYS_INTERNAL_API_KEY:?SIGNING_KEYS_INTERNAL_API_KEY must be set for beta}
      REVOCATION_PROFILE_SERVICE_URL: http://revocation-profile:8013
      CANVAS_PORTABLE_INTEGRATION_ENABLED: ${CANVAS_PORTABLE_INTEGRATION_ENABLED:-false}
      CANVAS_PILOT_ORGANIZATION_IDS: ${CANVAS_PILOT_ORGANIZATION_IDS:-}
      CANVAS_LTI_STATE_TTL_MINUTES: ${CANVAS_LTI_STATE_TTL_MINUTES:-10}
      CANVAS_LTI_JWKS_TTL_MINUTES: ${CANVAS_LTI_JWKS_TTL_MINUTES:-1440}
      CANVAS_LTI_DEEP_LINKING_ISSUER: ${CANVAS_LTI_DEEP_LINKING_ISSUER:-}
      CANVAS_LTI_EXPERIENCE_BASE_URL: ${CANVAS_LTI_EXPERIENCE_BASE_URL:-${UI_BASE_URL:-https://beta.elevenidllc.com}}
      CANVAS_LTI_EXPERIENCE_CODE_TTL_SECONDS: ${CANVAS_LTI_EXPERIENCE_CODE_TTL_SECONDS:-60}
      CANVAS_LTI_EXPERIENCE_SESSION_TTL_MINUTES: ${CANVAS_LTI_EXPERIENCE_SESSION_TTL_MINUTES:-30}
      CANVAS_OAUTH_COMPLETION_REDIRECT_URL: ${CANVAS_OAUTH_COMPLETION_REDIRECT_URL:-${CANVAS_LTI_EXPERIENCE_BASE_URL:-http://localhost:3000}/console/org/deploy/canvas}
      CANVAS_LTI_TOOL_SIGNING_ORGANIZATION_ID: ${CANVAS_LTI_TOOL_SIGNING_ORGANIZATION_ID:-}
      CANVAS_LTI_TOOL_ISSUER_DID: ${CANVAS_LTI_TOOL_ISSUER_DID:-}
      CANVAS_SELF_MANAGED_ORIGIN_ALLOWLIST: ${CANVAS_SELF_MANAGED_ORIGIN_ALLOWLIST:-}
      CANVAS_PRIVATE_ORIGIN_ALLOWLIST: ${CANVAS_PRIVATE_ORIGIN_ALLOWLIST:-}
      CANVAS_ALLOW_PRIVATE_BASE_URLS: ${CANVAS_ALLOW_PRIVATE_BASE_URLS:-false}
      CANVAS_ALLOW_HTTP_LOCALHOST_BASE_URLS: ${CANVAS_ALLOW_HTTP_LOCALHOST_BASE_URLS:-false}
      CANVAS_ISSUANCE_EVIDENCE_MAX_AGE_SECONDS: ${CANVAS_ISSUANCE_EVIDENCE_MAX_AGE_SECONDS:-900}
      CANVAS_BINDING_READINESS_MAX_AGE_SECONDS: ${CANVAS_BINDING_READINESS_MAX_AGE_SECONDS:-900}
      CANVAS_LEGACY_EVENT_INGEST_ENABLED: ${CANVAS_LEGACY_EVENT_INGEST_ENABLED:-false}
      CANVAS_CREDENTIALS_SHARED_SECRET: ${CANVAS_CREDENTIALS_SHARED_SECRET:-}
      CANVAS_CREDENTIALS_SIGNATURE_TOLERANCE_SECONDS: ${CANVAS_CREDENTIALS_SIGNATURE_TOLERANCE_SECONDS:-300}
      CANVAS_CREDENTIALS_PROVIDER: ${CANVAS_CREDENTIALS_PROVIDER:-bridge}
      CANVAS_CREDENTIALS_PUBLISH_URL: ${CANVAS_CREDENTIALS_PUBLISH_URL:-}
      CANVAS_CREDENTIALS_PUBLISH_TIMEOUT_SECONDS: ${CANVAS_CREDENTIALS_PUBLISH_TIMEOUT_SECONDS:-20}
      CANVAS_CREDENTIALS_API_BASE_URL: ${CANVAS_CREDENTIALS_API_BASE_URL:-https://api.badgr.io}
      CANVAS_CREDENTIALS_API_ORIGIN_ALLOWLIST: ${CANVAS_CREDENTIALS_API_ORIGIN_ALLOWLIST:-}
      CANVAS_CREDENTIALS_API_TOKEN: ${CANVAS_CREDENTIALS_API_TOKEN:-}
      CANVAS_CREDENTIALS_ISSUER_ID: ${CANVAS_CREDENTIALS_ISSUER_ID:-}
      CANVAS_CREDENTIALS_BADGECLASS_ID: ${CANVAS_CREDENTIALS_BADGECLASS_ID:-}
      CANVAS_CREDENTIALS_ASSERTION_SCOPE: ${CANVAS_CREDENTIALS_ASSERTION_SCOPE:-badgeclasses}
      CANVAS_CREDENTIALS_VALIDATE_URL_TEMPLATE: ${CANVAS_CREDENTIALS_VALIDATE_URL_TEMPLATE:-}
      CANVAS_CREDENTIALS_STATUS_SYNC_TIMEOUT_SECONDS: ${CANVAS_CREDENTIALS_STATUS_SYNC_TIMEOUT_SECONDS:-20}
      INTEGRATION_SECRET_MASTER_KEY: ${INTEGRATION_SECRET_MASTER_KEY:?INTEGRATION_SECRET_MASTER_KEY must be set for beta}
      MARTY_RELEASE_VERSION: ${MARTY_RELEASE_VERSION:-development}
      MARTY_UI_SHA: ${MARTY_UI_SHA:-unknown}
      RUST_LOG: ${ISSUANCE_NATIVE_RUST_LOG:-info}
    depends_on:
      issuance-migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      signing-keys:
        condition: service_healthy
      revocation-profile:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8005/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - marty-network
    restart: unless-stopped

  canvas-sync-worker:
    environment:
      <<: *beta-grpc-service-auth

  verification:
    environment:
      <<: *beta-grpc-service-auth
      ENVIRONMENT: beta
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set for beta}@redis:6379/3
      VERIFICATION_CREDENTIALS_COMPAT_ENABLED: "true"
      VERIFICATION_GOVERNANCE_JSON: ${VERIFICATION_GOVERNANCE_JSON:?VERIFICATION_GOVERNANCE_JSON must be set for beta verification compatibility}
      SIGNING_KEYS_INTERNAL_API_KEY: ${SIGNING_KEYS_INTERNAL_API_KEY:?SIGNING_KEYS_INTERNAL_API_KEY must be set for beta}
      DID_WEB_ALLOWED_HOSTS: ${DID_WEB_ALLOWED_HOSTS:-}
      VERIF_GRPC_ENABLED: "false"
      GRPC_WORKLOAD_TLS_CLIENT_CERT: /run/secrets/verification_workload_client_cert
      GRPC_WORKLOAD_TLS_CLIENT_KEY: /run/secrets/verification_workload_client_key
      GRPC_WORKLOAD_TLS_CA_CERT: /run/secrets/workload_identity_ca_cert
    secrets:
      - verification_workload_client_cert
      - verification_workload_client_key
      - workload_identity_ca_cert

secrets:
  workload_identity_ca_cert:
    file: ${MARTY_WORKLOAD_IDENTITY_CA_CERT_FILE:?MARTY_WORKLOAD_IDENTITY_CA_CERT_FILE must be set for beta}
  pp_workload_server_cert:
    file: ${PP_WORKLOAD_SERVER_CERT_FILE:?PP_WORKLOAD_SERVER_CERT_FILE must be set for beta}
  pp_workload_server_key:
    file: ${PP_WORKLOAD_SERVER_KEY_FILE:?PP_WORKLOAD_SERVER_KEY_FILE must be set for beta}
  flow_workload_client_cert:
    file: ${FLOW_WORKLOAD_CLIENT_CERT_FILE:?FLOW_WORKLOAD_CLIENT_CERT_FILE must be set for beta}
  flow_workload_client_key:
    file: ${FLOW_WORKLOAD_CLIENT_KEY_FILE:?FLOW_WORKLOAD_CLIENT_KEY_FILE must be set for beta}
  flow_workload_server_cert:
    file: ${FLOW_WORKLOAD_SERVER_CERT_FILE:?FLOW_WORKLOAD_SERVER_CERT_FILE must be set for beta}
  flow_workload_server_key:
    file: ${FLOW_WORKLOAD_SERVER_KEY_FILE:?FLOW_WORKLOAD_SERVER_KEY_FILE must be set for beta}
  auth_workload_client_cert:
    file: ${AUTH_WORKLOAD_CLIENT_CERT_FILE:?AUTH_WORKLOAD_CLIENT_CERT_FILE must be set for beta}
  auth_workload_client_key:
    file: ${AUTH_WORKLOAD_CLIENT_KEY_FILE:?AUTH_WORKLOAD_CLIENT_KEY_FILE must be set for beta}
  applicant_workload_client_cert:
    file: ${APPLICANT_WORKLOAD_CLIENT_CERT_FILE:?APPLICANT_WORKLOAD_CLIENT_CERT_FILE must be set for beta}
  applicant_workload_client_key:
    file: ${APPLICANT_WORKLOAD_CLIENT_KEY_FILE:?APPLICANT_WORKLOAD_CLIENT_KEY_FILE must be set for beta}
  verification_workload_client_cert:
    file: ${VERIFICATION_WORKLOAD_CLIENT_CERT_FILE:?VERIFICATION_WORKLOAD_CLIENT_CERT_FILE must be set for beta}
  verification_workload_client_key:
    file: ${VERIFICATION_WORKLOAD_CLIENT_KEY_FILE:?VERIFICATION_WORKLOAD_CLIENT_KEY_FILE must be set for beta}
  deployment_profile_workload_client_cert:
    file: ${DEPLOYMENT_PROFILE_WORKLOAD_CLIENT_CERT_FILE:?DEPLOYMENT_PROFILE_WORKLOAD_CLIENT_CERT_FILE must be set for beta}
  deployment_profile_workload_client_key:
    file: ${DEPLOYMENT_PROFILE_WORKLOAD_CLIENT_KEY_FILE:?DEPLOYMENT_PROFILE_WORKLOAD_CLIENT_KEY_FILE must be set for beta}
  compliance_profile_workload_client_cert:
    file: ${COMPLIANCE_PROFILE_WORKLOAD_CLIENT_CERT_FILE:?COMPLIANCE_PROFILE_WORKLOAD_CLIENT_CERT_FILE must be set for beta}
  compliance_profile_workload_client_key:
    file: ${COMPLIANCE_PROFILE_WORKLOAD_CLIENT_KEY_FILE:?COMPLIANCE_PROFILE_WORKLOAD_CLIENT_KEY_FILE must be set for beta}
