name: elevenid-beta

# Local production-like beta namespace. Persistent resources are intentionally
# isolated from developer, self-host production, and demo release candidates.
networks:
  marty-network:
    name: elevenid-beta-network

x-beta-grpc-service-auth: &beta-grpc-service-auth
  GRPC_SERVICE_TOKEN: ${GRPC_SERVICE_TOKEN:?GRPC_SERVICE_TOKEN must be set for beta Rust services}

services:
  keycloak:
    image: ghcr.io/elevenid/marty-ui-oss/keycloak@${KEYCLOAK_KMS_IMAGE_DIGEST:?KEYCLOAK_KMS_IMAGE_DIGEST must pin the remote-key Keycloak image for beta}
    environment:
      BAO_ADDR: ${KEYCLOAK_KMS_ADDR:?KEYCLOAK_KMS_ADDR must identify HTTPS OpenBao for beta}
      BAO_CACERT: /run/secrets/openbao_tls_ca_cert
      BAO_TOKEN_FILE: /run/secrets/keycloak_signing_kms_token
      MARTY_KEYCLOAK_RS256_CERT_DIR: /run/secrets
      MARTY_KEYCLOAK_JWE_TOKEN_DIR: /run/secrets
      MARTY_KEYCLOAK_JWE_MOUNT: didcomm
      MARTY_KEYCLOAK_KMS_KEY_PREFIX: keycloak
      MARTY_KEYCLOAK_KMS_KEY_VERSION: ${KEYCLOAK_KMS_KEY_VERSION:?KEYCLOAK_KMS_KEY_VERSION must pin a remote beta Keycloak version}
    secrets:
      - openbao_tls_ca_cert
      - keycloak_signing_kms_token
      - source: keycloak_master_rs256_cert
        target: /run/secrets/keycloak-master-rs256.crt
      - source: keycloak_11id_rs256_cert
        target: /run/secrets/keycloak-11id-rs256.crt
      - source: keycloak_master_cookie_token
        target: /run/secrets/master-cookie.token
      - source: keycloak_master_ciba_token
        target: /run/secrets/master-ciba.token
      - source: keycloak_11id_cookie_token
        target: /run/secrets/11id-cookie.token
      - source: keycloak_11id_ciba_token
        target: /run/secrets/11id-ciba.token

  keycloak-configurator:
    image: ghcr.io/elevenid/marty-ui-oss/keycloak@${KEYCLOAK_KMS_IMAGE_DIGEST:?KEYCLOAK_KMS_IMAGE_DIGEST must pin the remote-key Keycloak image for beta}

  redis:
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set for beta}
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]

  db-migrate:
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set for beta}@redis:6379
      MARTY_ISSUER_DID: ${MARTY_ISSUER_DID:?MARTY_ISSUER_DID must be set for beta}

  revocation-profile-migrate:
    environment:
      ENVIRONMENT: beta
      PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL must be set for beta}

  gateway:
    environment:
      <<: *beta-grpc-service-auth
      ENVIRONMENT: beta
      GRPC_INSECURE_ALLOWED: "false"
      GRPC_TLS_CA_CERT: /run/secrets/workload_identity_ca_cert
      ORG_GRPC_TARGET: https://organization:9002
      ORG_GRPC_CA_CERT: /run/secrets/workload_identity_ca_cert
      ES_GRPC_TARGET: https://event-stream:9015
      ES_GRPC_CA_CERT: /run/secrets/workload_identity_ca_cert
      AUTH_GRPC_TARGET: https://auth:9001
      GRPC_WORKLOAD_TLS_CLIENT_CERT: /run/secrets/gateway_workload_client_cert
      GRPC_WORKLOAD_TLS_CA_CERT: /run/secrets/workload_identity_ca_cert
      GRPC_WORKLOAD_TLS_CLIENT_KMS_ADDR: ${GATEWAY_TLS_KMS_ADDR:?GATEWAY_TLS_KMS_ADDR must be set for beta}
      GRPC_WORKLOAD_TLS_CLIENT_KMS_CA_CERT: /run/secrets/openbao_tls_ca_cert
      GRPC_WORKLOAD_TLS_CLIENT_KMS_TOKEN_FILE: /run/secrets/gateway_tls_kms_token
      GRPC_WORKLOAD_TLS_CLIENT_KMS_KEY_NAME: ${GATEWAY_TLS_KMS_KEY_NAME:?GATEWAY_TLS_KMS_KEY_NAME must be set for beta}
      GRPC_WORKLOAD_TLS_CLIENT_KMS_KEY_VERSION: ${GATEWAY_TLS_KMS_KEY_VERSION:?GATEWAY_TLS_KMS_KEY_VERSION must be set for beta}
      ISSUANCE_API_KEY: ${ISSUANCE_API_KEY:?ISSUANCE_API_KEY must be set for beta}
      SIGNING_KEYS_INTERNAL_API_KEY: ${SIGNING_KEYS_INTERNAL_API_KEY:?SIGNING_KEYS_INTERNAL_API_KEY must be set for beta}
      DEVICE_REGISTRATION_GATEWAY_KEY: ${DEVICE_REGISTRATION_GATEWAY_KEY:?DEVICE_REGISTRATION_GATEWAY_KEY must be set for beta}
      ISSUANCE_NATIVE_SERVICE_URL: http://issuance-native:8005
      GATEWAY_REQUIRED_READY_SERVICES: auth,organizations,credential-templates,trust-profiles,presentation-policies,deployment-profiles,signing-keys,flows,issuance,issuance-native
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set for beta}@redis:6379
    secrets:
      - workload_identity_ca_cert
      - gateway_workload_client_cert
      - openbao_tls_ca_cert
      - gateway_tls_kms_token
    depends_on:
      issuance-native:
        condition: service_healthy

  auth:
    environment:
      <<: *beta-grpc-service-auth
      ENVIRONMENT: beta
      ALLOW_PLAINTEXT_GRPC: "false"
      FLOW_GRPC_TARGET: https://flow:9011
      ORG_GRPC_TARGET: https://organization:9002
      ES_GRPC_TARGET: https://event-stream:9015
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set for beta}@redis:6379/0
      CREDENTIAL_LOGIN_ORGANIZATION_ID: ${MARTY_ORG_ID:?MARTY_ORG_ID must be set for beta}
      CREDENTIAL_LOGIN_ISSUER_DID: ${MARTY_ISSUER_DID:?MARTY_ISSUER_DID must be set for beta}
      GRPC_WORKLOAD_TLS_CLIENT_CERT: /run/secrets/auth_workload_client_cert
      GRPC_WORKLOAD_TLS_CLIENT_KMS_ADDR: ${AUTH_TLS_KMS_ADDR:?AUTH_TLS_KMS_ADDR must be set for beta}
      GRPC_WORKLOAD_TLS_CLIENT_KMS_CA_CERT: /run/secrets/openbao_tls_ca_cert
      GRPC_WORKLOAD_TLS_CLIENT_KMS_TOKEN_FILE: /run/secrets/auth_tls_kms_token
      GRPC_WORKLOAD_TLS_CLIENT_KMS_KEY_NAME: ${AUTH_TLS_KMS_KEY_NAME:?AUTH_TLS_KMS_KEY_NAME must be set for beta}
      GRPC_WORKLOAD_TLS_CLIENT_KMS_KEY_VERSION: ${AUTH_TLS_KMS_KEY_VERSION:?AUTH_TLS_KMS_KEY_VERSION must be set for beta}
      GRPC_WORKLOAD_TLS_SERVER_CERT: /run/secrets/auth_workload_server_cert
      GRPC_WORKLOAD_TLS_SERVER_KMS_ADDR: ${AUTH_SERVER_TLS_KMS_ADDR:?AUTH_SERVER_TLS_KMS_ADDR must be set for beta}
      GRPC_WORKLOAD_TLS_SERVER_KMS_CA_CERT: /run/secrets/openbao_tls_ca_cert
      GRPC_WORKLOAD_TLS_SERVER_KMS_TOKEN_FILE: /run/secrets/auth_server_tls_kms_token
      GRPC_WORKLOAD_TLS_SERVER_KMS_KEY_NAME: ${AUTH_SERVER_TLS_KMS_KEY_NAME:?AUTH_SERVER_TLS_KMS_KEY_NAME must be set for beta}
      GRPC_WORKLOAD_TLS_SERVER_KMS_KEY_VERSION: ${AUTH_SERVER_TLS_KMS_KEY_VERSION:?AUTH_SERVER_TLS_KMS_KEY_VERSION must be set for beta}
      GRPC_WORKLOAD_TLS_CA_CERT: /run/secrets/workload_identity_ca_cert
    secrets:
      - auth_workload_client_cert
      - openbao_tls_ca_cert
      - auth_tls_kms_token
      - auth_workload_server_cert
      - auth_server_tls_kms_token
      - workload_identity_ca_cert

  organization:
    environment:
      <<: *beta-grpc-service-auth
      ENVIRONMENT: beta
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set for beta}@redis:6379
      GRPC_WORKLOAD_TLS_SERVER_CERT: /run/secrets/org_workload_server_cert
      GRPC_WORKLOAD_TLS_SERVER_KMS_ADDR: ${ORG_TLS_KMS_ADDR:?ORG_TLS_KMS_ADDR must be set for beta}
      GRPC_WORKLOAD_TLS_SERVER_KMS_CA_CERT: /run/secrets/openbao_tls_ca_cert
      GRPC_WORKLOAD_TLS_SERVER_KMS_TOKEN_FILE: /run/secrets/org_tls_kms_token
      GRPC_WORKLOAD_TLS_SERVER_KMS_KEY_NAME: ${ORG_TLS_KMS_KEY_NAME:?ORG_TLS_KMS_KEY_NAME must be set for beta}
      GRPC_WORKLOAD_TLS_SERVER_KMS_KEY_VERSION: ${ORG_TLS_KMS_KEY_VERSION:?ORG_TLS_KMS_KEY_VERSION must be set for beta}
      ES_GRPC_TARGET: https://event-stream:9015
      ES_GRPC_CA_CERT: /run/secrets/workload_identity_ca_cert
    secrets:
      - workload_identity_ca_cert
      - org_workload_server_cert
      - openbao_tls_ca_cert
      - org_tls_kms_token

  credential-template:
    environment:
      <<: *beta-grpc-service-auth
      ENVIRONMENT: beta
      PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL must be set for beta}
      MARTY_ORG_ID: ${MARTY_ORG_ID:?MARTY_ORG_ID must be set for beta}
      MARTY_MIGRATION_PROFILE: beta
      ORG_GRPC_TARGET: https://organization:9002
      ORG_GRPC_CA_CERT: /run/secrets/workload_identity_ca_cert
      RP_GRPC_TARGET: https://revocation-profile:9013
      RP_GRPC_CA_CERT: /run/secrets/workload_identity_ca_cert
      GRPC_WORKLOAD_TLS_SERVER_CERT: /run/secrets/ct_workload_server_cert
      GRPC_WORKLOAD_TLS_SERVER_KMS_ADDR: ${CT_TLS_KMS_ADDR:?CT_TLS_KMS_ADDR must be set for beta}
      GRPC_WORKLOAD_TLS_SERVER_KMS_CA_CERT: /run/secrets/openbao_tls_ca_cert
      GRPC_WORKLOAD_TLS_SERVER_KMS_TOKEN_FILE: /run/secrets/ct_tls_kms_token
      GRPC_WORKLOAD_TLS_SERVER_KMS_KEY_NAME: ${CT_TLS_KMS_KEY_NAME:?CT_TLS_KMS_KEY_NAME must be set for beta}
      GRPC_WORKLOAD_TLS_SERVER_KMS_KEY_VERSION: ${CT_TLS_KMS_KEY_VERSION:?CT_TLS_KMS_KEY_VERSION must be set for beta}
    secrets:
      - workload_identity_ca_cert
      - ct_workload_server_cert
      - openbao_tls_ca_cert
      - ct_tls_kms_token

  trust-profile:
    environment:
      <<: *beta-grpc-service-auth
      ENVIRONMENT: beta
      ORG_GRPC_TARGET: https://organization:9002
      ORG_GRPC_CA_CERT: /run/secrets/workload_identity_ca_cert
      SIGNING_KEYS_INTERNAL_API_KEY: ${SIGNING_KEYS_INTERNAL_API_KEY:?SIGNING_KEYS_INTERNAL_API_KEY must be set for beta}
      MARTY_ORG_ID: ${MARTY_ORG_ID:?MARTY_ORG_ID must be set for beta}
      MARTY_ISSUER_DID: ${MARTY_ISSUER_DID:?MARTY_ISSUER_DID must be set for beta}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN must be set for beta}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL must be set for beta}
    secrets:
      - workload_identity_ca_cert

  applicant:
    environment:
      <<: *beta-grpc-service-auth
      ENVIRONMENT: beta
      ES_GRPC_TARGET: https://event-stream:9015
      ES_GRPC_CA_CERT: /run/secrets/workload_identity_ca_cert
    secrets:
      - workload_identity_ca_cert

  notification:
    environment:
      <<: *beta-grpc-service-auth
      NOTIFICATION_OPENBAO_CA_CERT_FILE: /run/secrets/openbao_tls_ca_cert
    secrets:
      - openbao_tls_ca_cert

  compliance-profile:
    environment:
      <<: *beta-grpc-service-auth
      ENVIRONMENT: beta
      GRPC_INSECURE_ALLOWED: "false"
      ORG_GRPC_TARGET: https://organization:9002
      GRPC_WORKLOAD_TLS_CLIENT_CERT: /run/secrets/compliance_profile_workload_client_cert
      GRPC_WORKLOAD_TLS_KMS_ADDR: ${COMPLIANCE_PROFILE_TLS_KMS_ADDR:?COMPLIANCE_PROFILE_TLS_KMS_ADDR must be set for beta}
      GRPC_WORKLOAD_TLS_KMS_CA_CERT: /run/secrets/openbao_tls_ca_cert
      GRPC_WORKLOAD_TLS_KMS_TOKEN_FILE: /run/secrets/compliance_profile_tls_kms_token
      GRPC_WORKLOAD_TLS_KMS_KEY_NAME: ${COMPLIANCE_PROFILE_TLS_KMS_KEY_NAME:?COMPLIANCE_PROFILE_TLS_KMS_KEY_NAME must be set for beta}
      GRPC_WORKLOAD_TLS_KMS_KEY_VERSION: ${COMPLIANCE_PROFILE_TLS_KMS_KEY_VERSION:?COMPLIANCE_PROFILE_TLS_KMS_KEY_VERSION must be set for beta}
      GRPC_WORKLOAD_TLS_CA_CERT: /run/secrets/workload_identity_ca_cert
    secrets:
      - compliance_profile_workload_client_cert
      - openbao_tls_ca_cert
      - compliance_profile_tls_kms_token
      - workload_identity_ca_cert

  presentation-policy:
    environment:
      <<: *beta-grpc-service-auth
      ORG_GRPC_TARGET: https://organization:9002
      ORG_GRPC_CA_CERT: /run/secrets/workload_identity_ca_cert
      # This is the five-field internal status contract. The public
      # /v1/issued-credentials lifecycle wrappers retain their full-record
      # response on the legacy service until that distinct DTO is native.
      MIP_CREDENTIAL_STATUS_URL_TEMPLATE: "http://issuance-native:8005/v1/issuance/credentials/{credential_id}/status"
      GRPC_WORKLOAD_TLS_SERVER_CERT: /run/secrets/pp_workload_server_cert
      GRPC_WORKLOAD_TLS_SERVER_KMS_ADDR: ${PP_TLS_KMS_ADDR:?PP_TLS_KMS_ADDR must be set for beta}
      GRPC_WORKLOAD_TLS_SERVER_KMS_CA_CERT: /run/secrets/openbao_tls_ca_cert
      GRPC_WORKLOAD_TLS_SERVER_KMS_TOKEN_FILE: /run/secrets/pp_tls_kms_token
      GRPC_WORKLOAD_TLS_SERVER_KMS_KEY_NAME: ${PP_TLS_KMS_KEY_NAME:?PP_TLS_KMS_KEY_NAME must be set for beta}
      GRPC_WORKLOAD_TLS_SERVER_KMS_KEY_VERSION: ${PP_TLS_KMS_KEY_VERSION:?PP_TLS_KMS_KEY_VERSION must be set for beta}
      GRPC_WORKLOAD_TLS_CA_CERT: /run/secrets/workload_identity_ca_cert
    depends_on:
      issuance-native:
        condition: service_healthy
    secrets:
      - pp_workload_server_cert
      - openbao_tls_ca_cert
      - pp_tls_kms_token
      - workload_identity_ca_cert

  deployment-profile:
    environment:
      <<: *beta-grpc-service-auth
      ENVIRONMENT: beta
      GRPC_INSECURE_ALLOWED: "false"
      ORG_GRPC_TARGET: https://organization:9002
      GRPC_WORKLOAD_TLS_CLIENT_CERT: /run/secrets/deployment_profile_workload_client_cert
      GRPC_WORKLOAD_TLS_KMS_ADDR: ${DEPLOYMENT_PROFILE_TLS_KMS_ADDR:?DEPLOYMENT_PROFILE_TLS_KMS_ADDR must be set for beta}
      GRPC_WORKLOAD_TLS_KMS_CA_CERT: /run/secrets/openbao_tls_ca_cert
      GRPC_WORKLOAD_TLS_KMS_TOKEN_FILE: /run/secrets/deployment_profile_tls_kms_token
      GRPC_WORKLOAD_TLS_KMS_KEY_NAME: ${DEPLOYMENT_PROFILE_TLS_KMS_KEY_NAME:?DEPLOYMENT_PROFILE_TLS_KMS_KEY_NAME must be set for beta}
      GRPC_WORKLOAD_TLS_KMS_KEY_VERSION: ${DEPLOYMENT_PROFILE_TLS_KMS_KEY_VERSION:?DEPLOYMENT_PROFILE_TLS_KMS_KEY_VERSION must be set for beta}
      GRPC_WORKLOAD_TLS_CA_CERT: /run/secrets/workload_identity_ca_cert
    secrets:
      - deployment_profile_workload_client_cert
      - openbao_tls_ca_cert
      - deployment_profile_tls_kms_token
      - workload_identity_ca_cert

  signing-keys:
    environment:
      BAO_CACERT: /run/secrets/openbao_tls_ca_cert
      DEVICE_REGISTRATION_SIGNING_KEYS_KEY: ${DEVICE_REGISTRATION_SIGNING_KEYS_KEY:?DEVICE_REGISTRATION_SIGNING_KEYS_KEY must be set for beta}
      SIGNING_KEYS_REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set for beta}@redis:6379/2
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN must be set for beta}
    secrets:
      - openbao_tls_ca_cert

  flow:
    environment:
      <<: *beta-grpc-service-auth
      ENVIRONMENT: beta
      GRPC_INSECURE_ALLOWED: "false"
      ORG_GRPC_TARGET: https://organization:9002
      CT_GRPC_TARGET: https://credential-template:9003
      PP_GRPC_TARGET: https://presentation-policy:9009
      # Only the qualified initiation RPC consumer moves; physical-document
      # HTTP operations retain the legacy ISSUANCE_SERVICE_URL from base.
      ISSUANCE_GRPC_TARGET: https://issuance-native:9005
      PUBLIC_BASE_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL must be set for beta}
      ISSUANCE_API_KEY: ${ISSUANCE_API_KEY:?ISSUANCE_API_KEY must be set for beta}
      SIGNING_KEYS_INTERNAL_API_KEY: ${SIGNING_KEYS_INTERNAL_API_KEY:?SIGNING_KEYS_INTERNAL_API_KEY must be set for beta}
      FLOW_WEBHOOK_SECRET: ${FLOW_WEBHOOK_SECRET:?FLOW_WEBHOOK_SECRET must be set for beta}
      FLOW_APPLICATION_EVENT_HMAC_KEY: ${FLOW_APPLICATION_EVENT_HMAC_KEY:?FLOW_APPLICATION_EVENT_HMAC_KEY must be set for beta}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set for beta}@redis:6379
      GRPC_WORKLOAD_TLS_CLIENT_CERT: /run/secrets/flow_workload_client_cert
      GRPC_WORKLOAD_TLS_CLIENT_KMS_ADDR: ${FLOW_CLIENT_TLS_KMS_ADDR:?FLOW_CLIENT_TLS_KMS_ADDR must be set for beta}
      GRPC_WORKLOAD_TLS_CLIENT_KMS_CA_CERT: /run/secrets/openbao_tls_ca_cert
      GRPC_WORKLOAD_TLS_CLIENT_KMS_TOKEN_FILE: /run/secrets/flow_client_tls_kms_token
      GRPC_WORKLOAD_TLS_CLIENT_KMS_KEY_NAME: ${FLOW_CLIENT_TLS_KMS_KEY_NAME:?FLOW_CLIENT_TLS_KMS_KEY_NAME must be set for beta}
      GRPC_WORKLOAD_TLS_CLIENT_KMS_KEY_VERSION: ${FLOW_CLIENT_TLS_KMS_KEY_VERSION:?FLOW_CLIENT_TLS_KMS_KEY_VERSION must be set for beta}
      GRPC_WORKLOAD_TLS_SERVER_CERT: /run/secrets/flow_workload_server_cert
      GRPC_WORKLOAD_TLS_SERVER_KMS_ADDR: ${FLOW_SERVER_TLS_KMS_ADDR:?FLOW_SERVER_TLS_KMS_ADDR must be set for beta}
      GRPC_WORKLOAD_TLS_SERVER_KMS_CA_CERT: /run/secrets/openbao_tls_ca_cert
      GRPC_WORKLOAD_TLS_SERVER_KMS_TOKEN_FILE: /run/secrets/flow_server_tls_kms_token
      GRPC_WORKLOAD_TLS_SERVER_KMS_KEY_NAME: ${FLOW_SERVER_TLS_KMS_KEY_NAME:?FLOW_SERVER_TLS_KMS_KEY_NAME must be set for beta}
      GRPC_WORKLOAD_TLS_SERVER_KMS_KEY_VERSION: ${FLOW_SERVER_TLS_KMS_KEY_VERSION:?FLOW_SERVER_TLS_KMS_KEY_VERSION must be set for beta}
      GRPC_WORKLOAD_TLS_CA_CERT: /run/secrets/workload_identity_ca_cert
    secrets:
      - flow_workload_client_cert
      - openbao_tls_ca_cert
      - flow_client_tls_kms_token
      - flow_workload_server_cert
      - flow_server_tls_kms_token
      - workload_identity_ca_cert

  revocation-profile:
    environment:
      <<: *beta-grpc-service-auth
      ENVIRONMENT: beta
      PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL must be set for beta}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set for beta}@redis:6379/4
      RP_GRPC_ENABLED: "true"
      RUST_LOG: ${REVOCATION_PROFILE_RUST_LOG:-info}
      ORG_GRPC_TARGET: https://organization:9002
      ORG_GRPC_CA_CERT: /run/secrets/workload_identity_ca_cert
      GRPC_WORKLOAD_TLS_SERVER_CERT: /run/secrets/rp_workload_server_cert
      GRPC_WORKLOAD_TLS_SERVER_KMS_ADDR: ${RP_TLS_KMS_ADDR:?RP_TLS_KMS_ADDR must be set for beta}
      GRPC_WORKLOAD_TLS_SERVER_KMS_CA_CERT: /run/secrets/openbao_tls_ca_cert
      GRPC_WORKLOAD_TLS_SERVER_KMS_TOKEN_FILE: /run/secrets/rp_tls_kms_token
      GRPC_WORKLOAD_TLS_SERVER_KMS_KEY_NAME: ${RP_TLS_KMS_KEY_NAME:?RP_TLS_KMS_KEY_NAME must be set for beta}
      GRPC_WORKLOAD_TLS_SERVER_KMS_KEY_VERSION: ${RP_TLS_KMS_KEY_VERSION:?RP_TLS_KMS_KEY_VERSION must be set for beta}
    secrets:
      - workload_identity_ca_cert
      - rp_workload_server_cert
      - openbao_tls_ca_cert
      - rp_tls_kms_token

  device-registration:
    environment:
      <<: *beta-grpc-service-auth
      ENVIRONMENT: beta
      ORG_GRPC_TARGET: https://organization:9002
      ORG_GRPC_CA_CERT: /run/secrets/workload_identity_ca_cert
      DEVICE_REGISTRATION_GATEWAY_KEY: ${DEVICE_REGISTRATION_GATEWAY_KEY:?DEVICE_REGISTRATION_GATEWAY_KEY must be set for beta}
      DEVICE_REGISTRATION_SIGNING_KEYS_KEY: ${DEVICE_REGISTRATION_SIGNING_KEYS_KEY:?DEVICE_REGISTRATION_SIGNING_KEYS_KEY must be set for beta}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set for beta}@redis:6379/5
    secrets:
      - workload_identity_ca_cert

  event-stream:
    environment:
      <<: *beta-grpc-service-auth
      ENVIRONMENT: beta
      GRPC_WORKLOAD_TLS_SERVER_CERT: /run/secrets/es_workload_server_cert
      GRPC_WORKLOAD_TLS_SERVER_KMS_ADDR: ${ES_TLS_KMS_ADDR:?ES_TLS_KMS_ADDR must be set for beta}
      GRPC_WORKLOAD_TLS_SERVER_KMS_CA_CERT: /run/secrets/openbao_tls_ca_cert
      GRPC_WORKLOAD_TLS_SERVER_KMS_TOKEN_FILE: /run/secrets/es_tls_kms_token
      GRPC_WORKLOAD_TLS_SERVER_KMS_KEY_NAME: ${ES_TLS_KMS_KEY_NAME:?ES_TLS_KMS_KEY_NAME must be set for beta}
      GRPC_WORKLOAD_TLS_SERVER_KMS_KEY_VERSION: ${ES_TLS_KMS_KEY_VERSION:?ES_TLS_KMS_KEY_VERSION must be set for beta}
    secrets:
      - es_workload_server_cert
      - openbao_tls_ca_cert
      - es_tls_kms_token

  issuance:
    environment:
      <<: *beta-grpc-service-auth
      DIDCOMM_DELIVERY_OWNER: native
      ISSUANCE_GRPC_ENABLED: "false"
      ORG_GRPC_TARGET: https://organization:9002
      CT_GRPC_TARGET: https://credential-template:9003
      RP_GRPC_TARGET: https://revocation-profile:9013
      GRPC_TLS_CA_CERT: /run/secrets/workload_identity_ca_cert
      ISSUANCE_NATIVE_SERVICE_URL: http://issuance-native:8005
    secrets:
      - workload_identity_ca_cert
    depends_on:
      issuance-native:
        condition: service_healthy
        required: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8005/ready"]

  # The issuance HTTP alias runs the native Rust binary with its gRPC listener
  # disabled. Issuance-native owns the KMS-backed gRPC endpoint used by Flow.
  issuance-native:
    extends:
      file: docker-compose.service.issuance-native.yml
      service: issuance-native
    environment:
      ORG_GRPC_TARGET: https://organization:9002
      CT_GRPC_TARGET: https://credential-template:9003
      RP_GRPC_TARGET: https://revocation-profile:9013
      GRPC_TLS_CA_CERT: /run/secrets/workload_identity_ca_cert
