# Base-surface selectors in an isolated disposable project.
services:
  gateway:
    environment:
      ENVIRONMENT: beta
      GRPC_INSECURE_ALLOWED: "true"
      SIGNING_KEYS_DSC_ISSUE_GATEWAY_KEY_FILE: /run/secrets/dsc_issue_gateway_key
      SIGNING_KEYS_CSCA_ISSUE_GATEWAY_KEY_FILE: /run/secrets/csca_issue_gateway_key
      PASSPORT_ACCEPTANCE_SURFACE: base
    secrets: [dsc_issue_gateway_key, csca_issue_gateway_key]
  signing-keys:
    environment:
      ENVIRONMENT: beta
      SIGNING_KEYS_BETA_CSCA_ISSUANCE_ENABLED: "true"
      SIGNING_KEYS_DSC_ISSUE_GATEWAY_KEY_FILE: /run/secrets/dsc_issue_gateway_key
      SIGNING_KEYS_CSCA_ISSUE_GATEWAY_KEY_FILE: /run/secrets/csca_issue_gateway_key
    secrets: [dsc_issue_gateway_key, csca_issue_gateway_key]
  flow:
    environment:
      ENVIRONMENT: development
      PASSPORT_ACCEPTANCE_SURFACE: base
  issuance-native:
    environment:
      ENVIRONMENT: development
      PASSPORT_ACCEPTANCE_SURFACE: base
  passport-callback-signer:
    environment:
      PASSPORT_ACCEPTANCE_SURFACE: base
  passport-beta-bureau:
    environment:
      PASSPORT_ACCEPTANCE_SURFACE: base
