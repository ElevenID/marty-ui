# Dedicated, unprovisioned passport rollback rehearsal model. Both surface
# overlays below select this topology; neither inherits production resources.
# Image references and secret files must come from one protected release/run.
x-acceptance-labels: &acceptance-labels
  com.marty.passport.acceptance.owner: supported-consumer
  com.marty.passport.acceptance.run-id: ${PASSPORT_ACCEPTANCE_PLAN_RUN_ID:?bind protected plan run}
  com.marty.passport.acceptance.source-commit: ${PASSPORT_ACCEPTANCE_SOURCE_COMMIT:?bind protected source}
  com.marty.passport.acceptance.services-image: ${MARTY_SERVICES_IMAGE:?bind released services image}

services:
  edge:
    labels: *acceptance-labels
    image: ${PASSPORT_ACCEPTANCE_EDGE_IMAGE:?pin disposable HTTPS edge image by digest}
    configs:
      - source: passport_supported_edge
        target: /etc/nginx/conf.d/default.conf
    secrets: [passport_edge_tls_cert, passport_edge_tls_key]
    depends_on:
      gateway:
        condition: service_started
    ports:
      - "127.0.0.1:${PASSPORT_ACCEPTANCE_GATEWAY_PORT:?reserve disposable loopback port}:8443"
    networks: [private]

  postgres:
    labels: *acceptance-labels
    image: ${PASSPORT_ACCEPTANCE_POSTGRES_IMAGE:?pin disposable PostgreSQL image by digest}
    environment:
      POSTGRES_DB: marty
      POSTGRES_USER: marty
      POSTGRES_PASSWORD_FILE: /run/secrets/marty_db_password
    secrets: [marty_db_password]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U marty -d marty"]
    networks: [private]

  redis:
    labels: *acceptance-labels
    image: ${PASSPORT_ACCEPTANCE_REDIS_IMAGE:?pin disposable Redis image by digest}
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
    networks: [private]

  openbao:
    labels: *acceptance-labels
    image: ${PASSPORT_ACCEPTANCE_OPENBAO_IMAGE:?pin disposable OpenBao image by digest}
    entrypoint: [/bin/sh, /usr/local/bin/passport-supported-openbao-start]
    configs:
      - source: passport_supported_openbao_start
        target: /usr/local/bin/passport-supported-openbao-start
    secrets: [bao_root_token]
    volumes:
      - openbao_data:/bao/data
      - openbao_file:/openbao/file
      - openbao_logs:/openbao/logs
    healthcheck:
      test: [CMD, bao, status, -address=http://127.0.0.1:8200]
    networks: [private, callback_signing]

  revocation-profile-migrate:
    labels: *acceptance-labels
    image: ${MARTY_SERVICES_IMAGE:?pin signed services image by digest}
    environment:
      SERVICE_NAME: revocation_profile
      RP_MIGRATE_ONLY: "true"
      ENVIRONMENT: development
      DATABASE_URL_TEMPLATE: postgresql://marty:$${MARTY_DB_PASSWORD}@postgres:5432/marty
      MARTY_DB_PASSWORD_FILE: /run/secrets/marty_db_password
      PUBLIC_API_URL: http://gateway:8000
      STATUS_LIST_BASE_URL: https://localhost:${PASSPORT_ACCEPTANCE_GATEWAY_PORT:?reserve disposable loopback port}
      MARTY_ORG_ID: 00000000-0000-0000-0000-000000000001
    secrets: [marty_db_password]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    networks: [private]
    restart: "no"

  db-migrate:
    labels: *acceptance-labels
    image: ${PASSPORT_ACCEPTANCE_MIGRATIONS_IMAGE:?pin signed migrations image by digest}
    environment:
      MARTY_DB_PASSWORD_FILE: /run/secrets/marty_db_password
      MARTY_ORG_ADMIN_EMAIL: ${PASSPORT_ACCEPTANCE_ADMIN_EMAIL:?supply disposable admin email}
      MARTY_ORG_ID: 00000000-0000-0000-0000-000000000001
      DATABASE_URL_TEMPLATE: postgresql+asyncpg://marty:$${MARTY_DB_PASSWORD}@postgres:5432/marty
      REDIS_URL: redis://redis:6379/2
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN_FILE: /run/secrets/bao_token
      MARTY_KMS_BOOTSTRAP_ENABLED: "true"
      PUBLIC_DOMAIN: localhost:${PASSPORT_ACCEPTANCE_GATEWAY_PORT:?reserve disposable loopback port}
      MARTY_ISSUER_BASE_URL: https://localhost:${PASSPORT_ACCEPTANCE_GATEWAY_PORT:?reserve disposable loopback port}
      MARTY_ISSUER_DID: did:web:localhost%3A${PASSPORT_ACCEPTANCE_GATEWAY_PORT:?reserve disposable loopback port}:orgs:marty
    secrets: [marty_db_password, bao_token]
    depends_on:
      revocation-profile-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      openbao:
        condition: service_healthy
    networks: [private]
    restart: "no"

  signing-keys:
    labels: *acceptance-labels
    image: ${MARTY_SERVICES_IMAGE:?pin signed services image by digest}
    environment:
      SERVICE_NAME: signing_keys
      SIGNING_KEYS_REDIS_URL: redis://redis:6379/2
      DATABASE_URL_TEMPLATE: postgresql+asyncpg://marty:$${MARTY_DB_PASSWORD}@postgres:5432/marty
      MARTY_DB_PASSWORD_FILE: /run/secrets/marty_db_password
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN_FILE: /run/secrets/bao_token
      PUBLIC_DOMAIN: localhost:${PASSPORT_ACCEPTANCE_GATEWAY_PORT:?reserve disposable loopback port}
      SIGNING_KEYS_INTERNAL_API_KEY_FILE: /run/secrets/signing_keys_internal_api_key
    secrets: [marty_db_password, bao_token, signing_keys_internal_api_key]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      openbao:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8017/health]
    networks: [private]

  event-stream:
    labels: *acceptance-labels
    image: ${MARTY_SERVICES_IMAGE:?pin signed services image by digest}
    environment:
      SERVICE_NAME: event_stream
      EVENT_STREAM_SERVICE_PORT: "8015"
      EVENT_STREAM_GRPC_ENABLED: "true"
      EVENT_STREAM_GRPC_PORT: "9015"
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8015/health]
    networks: [private]

  organization:
    labels: *acceptance-labels
    image: ${MARTY_SERVICES_IMAGE:?pin signed services image by digest}
    environment:
      SERVICE_NAME: organization
      ORGANIZATION_SERVICE_PORT: "8002"
      ORG_GRPC_PORT: "9002"
      DATABASE_URL_TEMPLATE: postgresql+asyncpg://marty:$${MARTY_DB_PASSWORD}@postgres:5432/marty
      MARTY_DB_PASSWORD_FILE: /run/secrets/marty_db_password
      GRPC_SERVICE_TOKEN_FILE: /run/secrets/grpc_service_token
      REDIS_URL: redis://redis:6379
      ES_GRPC_TARGET: event-stream:9015
      MARTY_ORG_ADMIN_EMAIL: ${PASSPORT_ACCEPTANCE_ADMIN_EMAIL:?supply disposable admin email}
      MARTY_ORG_ID: 00000000-0000-0000-0000-000000000001
      PASSPORT_ACCEPTANCE_PROJECT: ${PASSPORT_ACCEPTANCE_PROJECT:?bind disposable project}
      PASSPORT_ACCEPTANCE_RUN_ID: ${PASSPORT_ACCEPTANCE_PLAN_RUN_ID:?bind protected plan run}
      PASSPORT_ACCEPTANCE_SOURCE_COMMIT: ${PASSPORT_ACCEPTANCE_SOURCE_COMMIT:?bind protected source}
      PASSPORT_ACCEPTANCE_EXPIRES_AT: ${PASSPORT_ACCEPTANCE_EXPIRES_AT:?bind protected plan expiry}
    secrets: [marty_db_password, grpc_service_token]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      event-stream:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8002/health]
    networks: [private]

  revocation-profile:
    labels: *acceptance-labels
    image: ${MARTY_SERVICES_IMAGE:?pin signed services image by digest}
    environment:
      SERVICE_NAME: revocation_profile
      ENVIRONMENT: development
      REVOCATION_PROFILE_SERVICE_PORT: "8013"
      RP_GRPC_ENABLED: "true"
      RP_GRPC_PORT: "9013"
      DATABASE_URL_TEMPLATE: postgresql://marty:$${MARTY_DB_PASSWORD}@postgres:5432/marty
      MARTY_DB_PASSWORD_FILE: /run/secrets/marty_db_password
      GRPC_SERVICE_TOKEN_FILE: /run/secrets/grpc_service_token
      REDIS_URL: redis://redis:6379/4
      ORG_GRPC_TARGET: organization:9002
      PUBLIC_API_URL: http://gateway:8000
      STATUS_LIST_BASE_URL: https://localhost:${PASSPORT_ACCEPTANCE_GATEWAY_PORT:?reserve disposable loopback port}
      MARTY_ORG_ID: 00000000-0000-0000-0000-000000000001
    secrets: [marty_db_password, grpc_service_token]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      organization:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8013/health]
    networks: [private]

  trust-profile:
    labels: *acceptance-labels
    image: ${MARTY_SERVICES_IMAGE:?pin signed services image by digest}
    environment:
      SERVICE_NAME: trust_profile
      ENVIRONMENT: development
      TRUST_PROFILE_SERVICE_PORT: "8004"
      DATABASE_URL_TEMPLATE: postgresql+asyncpg://marty:$${MARTY_DB_PASSWORD}@postgres:5432/marty
      MARTY_DB_PASSWORD_FILE: /run/secrets/marty_db_password
      GRPC_SERVICE_TOKEN_FILE: /run/secrets/grpc_service_token
      SIGNING_KEYS_INTERNAL_API_KEY_FILE: /run/secrets/signing_keys_internal_api_key
      ORG_GRPC_TARGET: organization:9002
      MARTY_ORG_ID: 00000000-0000-0000-0000-000000000001
      MARTY_ORG_SLUG: marty
      MARTY_ISSUER_DID: did:web:localhost%3A${PASSPORT_ACCEPTANCE_GATEWAY_PORT:?reserve disposable loopback port}:orgs:marty
      MARTY_ISSUER_BASE_URL: https://localhost:${PASSPORT_ACCEPTANCE_GATEWAY_PORT:?reserve disposable loopback port}
      PUBLIC_DOMAIN: localhost:${PASSPORT_ACCEPTANCE_GATEWAY_PORT:?reserve disposable loopback port}
      DID_RESOLUTION_BASE_URL: http://gateway:8000
    secrets: [marty_db_password, grpc_service_token, signing_keys_internal_api_key]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      organization:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8004/health]
    networks: [private]

  credential-template:
    labels: *acceptance-labels
    image: ${MARTY_SERVICES_IMAGE:?pin signed services image by digest}
    environment:
      SERVICE_NAME: credential_template
      ENVIRONMENT: development
      CREDENTIAL_TEMPLATE_SERVICE_PORT: "8003"
      CT_GRPC_PORT: "9003"
      DATABASE_URL_TEMPLATE: postgresql+asyncpg://marty:$${MARTY_DB_PASSWORD}@postgres:5432/marty
      MARTY_DB_PASSWORD_FILE: /run/secrets/marty_db_password
      GRPC_SERVICE_TOKEN_FILE: /run/secrets/grpc_service_token
      SIGNING_KEYS_INTERNAL_API_KEY_FILE: /run/secrets/signing_keys_internal_api_key
      ORG_GRPC_TARGET: organization:9002
      RP_GRPC_TARGET: revocation-profile:9013
      SIGNING_KEYS_INTERNAL_URL: http://signing-keys:8017/internal
      TRUST_PROFILE_SERVICE_URL: http://trust-profile:8004
      PUBLIC_API_URL: https://localhost:${PASSPORT_ACCEPTANCE_GATEWAY_PORT:?reserve disposable loopback port}
      MARTY_ORG_ID: 00000000-0000-0000-0000-000000000001
      MARTY_MIGRATION_PROFILE: dev
    secrets: [marty_db_password, grpc_service_token, signing_keys_internal_api_key]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      organization:
        condition: service_healthy
      revocation-profile:
        condition: service_healthy
      trust-profile:
        condition: service_healthy
      signing-keys:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8003/health]
    networks: [private]

  issuance:
    labels: *acceptance-labels
    # Retained only for the bounded rollback rehearsal. Its digest and source
    # must be independently tied to the pre-retirement Marty Credentials release.
    image: ${PASSPORT_ACCEPTANCE_LEGACY_IMAGE:?pin legacy Python issuance image by digest}
    environment:
      DATABASE_URL: ${PASSPORT_ACCEPTANCE_DATABASE_URL:?bind disposable PostgreSQL URL}
      ISSUANCE_SERVICE_PORT: "8005"
      ISSUANCE_NATIVE_SERVICE_URL: http://issuance-native:8005
      DIDCOMM_DELIVERY_OWNER: native
      REDIS_URL: redis://redis:6379
      ISSUANCE_API_KEY_FILE: /run/secrets/issuance_api_key
      SIGNING_KEYS_INTERNAL_URL: http://signing-keys:8017/internal
      SIGNING_KEYS_INTERNAL_API_KEY_FILE: /run/secrets/signing_keys_internal_api_key
      PHYSICAL_DOCUMENT_ARTIFACT_KEY_FILE: /run/secrets/physical_document_artifact_key
      PERSONALIZATION_BUREAU_URL: http://passport-beta-bureau:8020
      PERSONALIZATION_BUREAU_API_KEY_FILE: /run/secrets/grpc_service_token
      PERSONALIZATION_BUREAU_PROVIDER_PROFILE_ID: passport-beta-bureau
    secrets: [issuance_api_key, signing_keys_internal_api_key, physical_document_artifact_key, grpc_service_token]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks: [private]

  issuance-native:
    labels: *acceptance-labels
    image: ${MARTY_SERVICES_IMAGE:?pin signed services image by digest}
    environment:
      SERVICE_NAME: issuance_native
      ISSUANCE_SERVICE_PORT: "8005"
      ISSUANCE_GRPC_ENABLED: "true"
      ISSUANCE_GRPC_PORT: "9005"
      ISSUER_BASE_URL: https://localhost:${PASSPORT_ACCEPTANCE_GATEWAY_PORT:?reserve disposable loopback port}
      PASSPORT_NATIVE_HTTP_ENABLED: "true"
      PASSPORT_INTERNAL_SERVICE_AUTH_ENABLED: "true"
      PASSPORT_MANAGED_ISSUER_SIGNING_ENABLED: "true"
      PASSPORT_KMS_ARTIFACTS_ENABLED: "true"
      PASSPORT_KMS_CALLBACKS_ENABLED: "true"
      GRPC_SERVICE_TOKEN_FILE: /run/secrets/grpc_service_token
      ISSUANCE_API_KEY_FILE: /run/secrets/issuance_api_key
      TOKEN_HMAC_KEY_FILE: /run/secrets/token_hmac_key
      INTEGRATION_SECRET_MASTER_KEY_FILE: /run/secrets/integration_secret_master_key
      DATABASE_URL_TEMPLATE: postgresql+asyncpg://marty:$${MARTY_DB_PASSWORD}@postgres:5432/marty
      MARTY_DB_PASSWORD_FILE: /run/secrets/marty_db_password
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN_FILE: /run/secrets/bao_token
      # Managed DSC resolution/signing and artifact encryption share the
      # Gateway compatibility routes, which authorize the organization scope.
      SIGNING_KEYS_INTERNAL_URL: http://gateway:8000/internal/signing-keys
      SIGNING_KEYS_INTERNAL_API_KEY_FILE: /run/secrets/signing_keys_internal_api_key
      PERSONALIZATION_BUREAU_URL: http://passport-beta-bureau:8020
      PERSONALIZATION_BUREAU_API_KEY_FILE: /run/secrets/grpc_service_token
      PERSONALIZATION_BUREAU_PROVIDER_PROFILE_ID: passport-beta-bureau
      REVOCATION_PROFILE_SERVICE_URL: http://revocation-profile:8013
      RP_GRPC_TARGET: revocation-profile:9013
      CT_GRPC_TARGET: credential-template:9003
      CREDENTIAL_TEMPLATE_SERVICE_URL: http://credential-template:8003
    secrets: [marty_db_password, bao_token, signing_keys_internal_api_key, issuance_api_key, grpc_service_token, token_hmac_key, integration_secret_master_key]
    depends_on:
      signing-keys:
        condition: service_started
      db-migrate:
        condition: service_completed_successfully
      revocation-profile:
        condition: service_healthy
      credential-template:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8005/health]
    networks: [private]

  presentation-policy:
    labels: *acceptance-labels
    image: ${MARTY_SERVICES_IMAGE:?pin signed services image by digest}
    environment:
      SERVICE_NAME: presentation_policy
      ENVIRONMENT: development
      PRESENTATION_POLICY_SERVICE_PORT: "8009"
      PP_GRPC_PORT: "9009"
      DATABASE_URL_TEMPLATE: postgresql+asyncpg://marty:$${MARTY_DB_PASSWORD}@postgres:5432/marty
      MARTY_DB_PASSWORD_FILE: /run/secrets/marty_db_password
      GRPC_SERVICE_TOKEN_FILE: /run/secrets/grpc_service_token
      ISSUANCE_API_KEY_FILE: /run/secrets/issuance_api_key
      ORG_GRPC_TARGET: organization:9002
      DID_RESOLUTION_BASE_URL: http://gateway:8000
      TRUST_PROFILE_SERVICE_URL: http://trust-profile:8004
      ISSUANCE_NATIVE_SERVICE_URL: http://issuance-native:8005
      PUBLIC_DOMAIN: localhost:${PASSPORT_ACCEPTANCE_GATEWAY_PORT:?reserve disposable loopback port}
      PUBLIC_BASE_URL: https://localhost:${PASSPORT_ACCEPTANCE_GATEWAY_PORT:?reserve disposable loopback port}
      ISSUER_BASE_URL: https://localhost:${PASSPORT_ACCEPTANCE_GATEWAY_PORT:?reserve disposable loopback port}
      MARTY_ORG_SLUG: marty
    secrets: [marty_db_password, grpc_service_token, issuance_api_key]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      organization:
        condition: service_healthy
      trust-profile:
        condition: service_healthy
      issuance-native:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8009/health]
    networks: [private]

  deployment-profile:
    labels: *acceptance-labels
    image: ${MARTY_SERVICES_IMAGE:?pin signed services image by digest}
    environment:
      SERVICE_NAME: deployment_profile
      ENVIRONMENT: development
      DEPLOYMENT_PROFILE_SERVICE_PORT: "8010"
      DATABASE_URL_TEMPLATE: postgresql+asyncpg://marty:$${MARTY_DB_PASSWORD}@postgres:5432/marty
      MARTY_DB_PASSWORD_FILE: /run/secrets/marty_db_password
      GRPC_SERVICE_TOKEN_FILE: /run/secrets/grpc_service_token
      ORG_GRPC_TARGET: organization:9002
    secrets: [marty_db_password, grpc_service_token]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      organization:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8010/health]
    networks: [private]

  flow:
    labels: *acceptance-labels
    image: ${MARTY_SERVICES_IMAGE:?pin signed services image by digest}
    environment:
      SERVICE_NAME: flow
      ENVIRONMENT: development
      FLOW_SERVICE_PORT: "8011"
      PASSPORT_NATIVE_FLOW_ENABLED: "true"
      PASSPORT_INTERNAL_SERVICE_AUTH_ENABLED: "true"
      MARTY_ISSUER_DID: did:web:localhost%3A${PASSPORT_ACCEPTANCE_GATEWAY_PORT:?reserve disposable loopback port}:orgs:marty
      PUBLIC_BASE_URL: https://localhost:${PASSPORT_ACCEPTANCE_GATEWAY_PORT:?reserve disposable loopback port}
      GRPC_SERVICE_TOKEN_FILE: /run/secrets/grpc_service_token
      ISSUANCE_API_KEY_FILE: /run/secrets/issuance_api_key
      DATABASE_URL_TEMPLATE: postgresql+asyncpg://marty:$${MARTY_DB_PASSWORD}@postgres:5432/marty
      MARTY_DB_PASSWORD_FILE: /run/secrets/marty_db_password
      REDIS_URL: redis://redis:6379
      ORG_GRPC_TARGET: organization:9002
      CT_GRPC_TARGET: credential-template:9003
      PP_GRPC_TARGET: presentation-policy:9009
      ISSUANCE_GRPC_TARGET: issuance-native:9005
      CREDENTIAL_TEMPLATE_SERVICE_URL: http://credential-template:8003
      TRUST_PROFILE_SERVICE_URL: http://trust-profile:8004
      DEPLOYMENT_PROFILE_SERVICE_URL: http://deployment-profile:8010
      ISSUANCE_NATIVE_SERVICE_URL: http://issuance-native:8005
      ISSUANCE_SERVICE_URL: http://issuance:8005
      SIGNING_KEYS_INTERNAL_URL: http://signing-keys:8017/internal
      SIGNING_KEYS_INTERNAL_API_KEY_FILE: /run/secrets/signing_keys_internal_api_key
    secrets: [marty_db_password, signing_keys_internal_api_key, issuance_api_key, grpc_service_token]
    depends_on:
      issuance-native:
        condition: service_healthy
      credential-template:
        condition: service_healthy
      trust-profile:
        condition: service_healthy
      presentation-policy:
        condition: service_healthy
      deployment-profile:
        condition: service_healthy
      signing-keys:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [private]

  passport-callback-signer:
    labels: *acceptance-labels
    image: ${MARTY_SERVICES_IMAGE:?pin signed services image by digest}
    environment:
      SERVICE_NAME: passport_callback_signer
      ENVIRONMENT: beta
      PASSPORT_CALLBACK_SIGNER_ENABLED: "true"
      SIGNING_KEYS_SERVICE_PORT: "8018"
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN_FILE: /run/secrets/callback_signer_bao_token
      SIGNING_KEYS_INTERNAL_API_KEY_FILE: /run/secrets/callback_signer_api_key
    secrets: [callback_signer_bao_token, callback_signer_api_key]
    depends_on:
      openbao:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8018/health]
    networks: [callback_signing]

  passport-beta-bureau:
    labels: *acceptance-labels
    image: ${MARTY_SERVICES_IMAGE:?pin signed services image by digest}
    environment:
      SERVICE_NAME: passport_beta_bureau
      ENVIRONMENT: beta
      PASSPORT_BETA_BUREAU_ENABLED: "true"
      DATABASE_URL_FILE: /run/secrets/bureau_database_url
      GRPC_SERVICE_TOKEN_FILE: /run/secrets/grpc_service_token
      SIGNING_KEYS_INTERNAL_API_KEY_FILE: /run/secrets/callback_signer_api_key
      SIGNING_KEYS_INTERNAL_URL: http://passport-callback-signer:8018/internal/documents
      PASSPORT_BUREAU_CALLBACK_URL: http://issuance-native:8005/v1/passport/webhooks/personalization
    secrets: [bureau_database_url, grpc_service_token, callback_signer_api_key]
    depends_on:
      postgres:
        condition: service_healthy
      passport-callback-signer:
        condition: service_healthy
      issuance-native:
        condition: service_started
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8020/health]
    networks: [private, callback_signing]

  gateway:
    labels: *acceptance-labels
    image: ${MARTY_SERVICES_IMAGE:?pin signed services image by digest}
    environment:
      SERVICE_NAME: gateway
      GATEWAY_PORT: "8000"
      PASSPORT_NATIVE_GATEWAY_ENABLED: "true"
      PASSPORT_PROVIDER_INGRESS_GATEWAY_ENABLED: "false"
      PASSPORT_INTERNAL_SERVICE_AUTH_ENABLED: "true"
      PUBLIC_DOMAIN: localhost:${PASSPORT_ACCEPTANCE_GATEWAY_PORT:?reserve disposable loopback port}
      ISSUER_BASE_URL: https://localhost:${PASSPORT_ACCEPTANCE_GATEWAY_PORT:?reserve disposable loopback port}
      GRPC_SERVICE_TOKEN_FILE: /run/secrets/grpc_service_token
      ISSUANCE_API_KEY_FILE: /run/secrets/issuance_api_key
      ORGANIZATION_SERVICE_URL: http://organization:8002
